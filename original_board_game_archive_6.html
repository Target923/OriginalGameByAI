<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏕️ ORIGINAL BOARD GAME ARCHIVE — 全6作総合ランチャー</title>
  <style>
    :root {
      --bg-void: #070a10;
      --bg-camp: #101724;
      --brass-light: #f6d88c;
      --brass-main: #d4a448;
      --brass-dark: #7c5816;
      --hunter-green: #22c55e;
      --crimson-edge: #e11d48;
      --parchment: #f8f4eb;
      --slate-muted: #94a3b8;
      --card-surface: rgba(20, 29, 47, 0.95);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 18%, rgba(212, 164, 72, 0.15) 0%, transparent 55%),
        radial-gradient(circle at 50% 80%, #152036 0%, #070a10 80%);
      color: var(--parchment);
      font-family: 'Noto Sans CJK JP', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Top Guild Header */
    header.guild-header {
      height: 62px;
      padding: 0 28px;
      background: linear-gradient(180deg, rgba(12, 17, 29, 0.96) 0%, rgba(12, 17, 29, 0.75) 100%);
      border-bottom: 1.5px solid rgba(212, 164, 72, 0.35);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
    }

    .guild-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .guild-crest {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--brass-light), var(--brass-dark));
      color: #0b101b;
      font-weight: 900;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px rgba(212, 164, 72, 0.45);
      border: 1.5px solid #fff3c4;
    }

    .guild-title-wrap h1 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0.08em;
      color: var(--brass-light);
      font-family: 'Noto Serif CJK JP', serif;
    }

    .guild-title-wrap p {
      margin: 1px 0 0 0;
      font-size: 11px;
      color: var(--slate-muted);
    }

    .guild-controls-hint {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: #cbd5e1;
    }

    .key-cap {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(212, 164, 72, 0.45);
      color: var(--brass-light);
      font-weight: 800;
      font-size: 11px;
    }

    .sfx-toggle-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(212, 164, 72, 0.4);
      color: var(--brass-light);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .sfx-toggle-btn:hover {
      background: rgba(212, 164, 72, 0.22);
    }

    /* Main Stage */
    main.launcher-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 22px 20px;
      position: relative;
    }

    /* Selected Item Detail Plate (Top-Center Preview Banner) */
    .selected-quest-banner {
      width: 100%;
      max-width: 820px;
      background: linear-gradient(90deg, transparent 0%, rgba(20, 29, 47, 0.92) 15%, rgba(20, 29, 47, 0.92) 85%, transparent 100%);
      border-top: 1px solid rgba(212, 164, 72, 0.4);
      border-bottom: 1px solid rgba(212, 164, 72, 0.4);
      padding: 12px 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .banner-inner {
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.24s ease;
    }

    .banner-inner.slide-from-right {
      animation: bannerSlideRight 0.34s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .banner-inner.slide-from-left {
      animation: bannerSlideLeft 0.34s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes bannerSlideRight {
      0% { opacity: 0.2; transform: translateX(36px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    @keyframes bannerSlideLeft {
      0% { opacity: 0.2; transform: translateX(-36px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    .quest-slot-counter {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: var(--brass-main);
      margin-bottom: 4px;
    }

    .quest-main-title {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    .quest-catchcopy {
      margin: 4px 0 0 0;
      font-size: 13px;
      color: var(--brass-light);
    }

    /* =====================================================================
       MONSTER HUNTER HOMAGE ITEM-POUCH CAROUSEL (Smooth Persistent DOM)
       ===================================================================== */
    .mh-carousel-viewport {
      width: 100%;
      max-width: 1320px;
      height: 365px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      margin: 4px 0;
      cursor: grab;
    }

    .mh-carousel-viewport:active {
      cursor: grabbing;
    }

    /* Ambient center spotlight behind active card */
    .center-aura {
      position: absolute;
      width: 390px;
      height: 350px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 164, 72, 0.22) 0%, transparent 70%);
      pointer-events: none;
      z-index: 2;
      animation: auraPulse 3s ease-in-out infinite;
    }

    @keyframes auraPulse {
      0%, 100% { transform: scale(0.96); opacity: 0.75; }
      50% { transform: scale(1.06); opacity: 1; }
    }

    /* Left / Right L-R Trigger Buttons */
    .carousel-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 56px;
      height: 114px;
      background: linear-gradient(180deg, rgba(28, 40, 64, 0.92), rgba(14, 21, 35, 0.92));
      border: 1.5px solid var(--brass-main);
      color: var(--brass-light);
      border-radius: 10px;
      cursor: pointer;
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-weight: 900;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.65);
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), background 0.18s ease, border-color 0.18s ease;
    }

    .carousel-nav-btn:hover {
      background: linear-gradient(180deg, rgba(212, 164, 72, 0.32), rgba(28, 40, 64, 0.95));
      border-color: #fff;
      transform: translateY(-50%) scale(1.07);
    }

    .carousel-nav-btn:active {
      transform: translateY(-50%) scale(0.95);
    }

    .carousel-nav-btn.left { left: 12px; }
    .carousel-nav-btn.right { right: 12px; }

    .nav-shoulder-label {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 3px;
      background: rgba(212, 164, 72, 0.25);
      border: 1px solid rgba(212, 164, 72, 0.55);
    }

    .nav-arrow-icon {
      font-size: 22px;
      line-height: 1;
    }

    /* Individual Item Card in the MH Slider (Persistent DOM Element!) */
    .mh-item-slot {
      position: absolute;
      width: 330px;
      height: 315px;
      background: var(--card-surface);
      border: 2px solid rgba(212, 164, 72, 0.35);
      border-radius: 14px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      will-change: transform, opacity, filter;
      transform-style: preserve-3d;
      transition:
        transform 0.48s cubic-bezier(0.19, 1, 0.22, 1),
        opacity 0.42s cubic-bezier(0.19, 1, 0.22, 1),
        filter 0.42s ease,
        border-color 0.3s ease,
        box-shadow 0.42s ease;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
    }

    .mh-item-slot.no-transition {
      transition: none !important;
    }

    /* Positional States (-3, -2, -1, 0, +1, +2, +3) */
    .mh-item-slot[data-offset="0"] {
      transform: translate3d(0px, 0px, 45px) scale(1.06) rotateY(0deg);
      opacity: 1;
      z-index: 12;
      filter: brightness(1.04);
      border: 2.5px solid var(--brass-light);
      box-shadow:
        0 14px 36px rgba(0, 0, 0, 0.8),
        0 0 30px rgba(212, 164, 72, 0.45),
        inset 0 0 24px rgba(212, 164, 72, 0.16);
    }

    .mh-item-slot[data-offset="-1"] {
      transform: translate3d(-308px, 6px, -20px) scale(0.80) rotateY(16deg);
      opacity: 0.82;
      z-index: 8;
      filter: brightness(0.76);
    }

    .mh-item-slot[data-offset="-1"]:hover {
      transform: translate3d(-300px, 2px, -5px) scale(0.83) rotateY(12deg);
      opacity: 0.95;
      filter: brightness(0.92);
      border-color: var(--brass-main);
    }

    .mh-item-slot[data-offset="1"] {
      transform: translate3d(308px, 6px, -20px) scale(0.80) rotateY(-16deg);
      opacity: 0.82;
      z-index: 8;
      filter: brightness(0.76);
    }

    .mh-item-slot[data-offset="1"]:hover {
      transform: translate3d(300px, 2px, -5px) scale(0.83) rotateY(-12deg);
      opacity: 0.95;
      filter: brightness(0.92);
      border-color: var(--brass-main);
    }

    .mh-item-slot[data-offset="-2"] {
      transform: translate3d(-542px, 14px, -90px) scale(0.60) rotateY(28deg);
      opacity: 0.44;
      z-index: 5;
      filter: brightness(0.55);
    }

    .mh-item-slot[data-offset="-2"]:hover {
      opacity: 0.68;
      filter: brightness(0.75);
    }

    .mh-item-slot[data-offset="2"] {
      transform: translate3d(542px, 14px, -90px) scale(0.60) rotateY(-28deg);
      opacity: 0.44;
      z-index: 5;
      filter: brightness(0.55);
    }

    .mh-item-slot[data-offset="2"]:hover {
      opacity: 0.68;
      filter: brightness(0.75);
    }

    /* Hidden outer staging offsets (-3 and +3) so entering/exiting cards glide smoothly from the edges! */
    .mh-item-slot[data-offset="-3"] {
      transform: translate3d(-710px, 22px, -160px) scale(0.42) rotateY(36deg);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      filter: brightness(0.35);
    }

    .mh-item-slot[data-offset="3"] {
      transform: translate3d(710px, 22px, -160px) scale(0.42) rotateY(-36deg);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      filter: brightness(0.35);
    }

    /* Monster Hunter Active Selector Corner Brackets on Center Card with Lock-On Animation */
    .mh-corner {
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: var(--brass-light);
      border-style: solid;
      pointer-events: none;
      opacity: 0;
      transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
    }

    .mh-corner.tl { top: -7px; left: -7px; border-width: 3.5px 0 0 3.5px; transform: translate(-10px, -10px); }
    .mh-corner.tr { top: -7px; right: -7px; border-width: 3.5px 3.5px 0 0; transform: translate(10px, -10px); }
    .mh-corner.bl { bottom: -7px; left: -7px; border-width: 0 0 3.5px 3.5px; transform: translate(-10px, 10px); }
    .mh-corner.br { bottom: -7px; right: -7px; border-width: 0 3.5px 3.5px 0; transform: translate(10px, 10px); }

    .mh-item-slot[data-offset="0"] .mh-corner {
      opacity: 1;
      transform: translate(0, 0);
    }

    /* Slot Internal Styling */
    .slot-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .slot-num-tag {
      font-size: 11px;
      font-weight: 800;
      color: var(--brass-light);
      background: rgba(212, 164, 72, 0.16);
      border: 1px solid rgba(212, 164, 72, 0.4);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .slot-status-pill {
      font-size: 10.5px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .slot-status-pill.ready {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid var(--hunter-green);
      color: #86efac;
    }

    .slot-status-pill.pending {
      background: rgba(148, 163, 184, 0.15);
      border: 1px solid rgba(148, 163, 184, 0.4);
      color: #cbd5e1;
    }

    /* Emblem Box inside Slot */
    .slot-icon-frame {
      width: 92px;
      height: 92px;
      margin: 6px auto;
      border-radius: 16px;
      background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.15), rgba(9, 13, 24, 0.92));
      border: 2px solid var(--brass-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.8), 0 4px 12px rgba(0, 0, 0, 0.5);
      position: relative;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .mh-item-slot[data-offset="0"] .slot-icon-frame {
      animation: iconFloat 2.8s ease-in-out infinite;
      border-color: var(--brass-light);
      box-shadow: inset 0 0 18px rgba(212, 164, 72, 0.25), 0 0 18px rgba(212, 164, 72, 0.35);
    }

    @keyframes iconFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .slot-title-box {
      text-align: center;
    }

    .slot-title-box h3 {
      margin: 0 0 4px 0;
      font-size: 17px;
      color: #fff;
      font-weight: 800;
    }

    .slot-title-box p {
      margin: 0;
      font-size: 11.5px;
      color: #cbd5e1;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .slot-meta-tags {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .meta-chip {
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--brass-light);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .slot-file-label {
      font-size: 10px;
      color: var(--slate-muted);
      text-align: center;
      font-family: monospace;
      margin-top: 4px;
    }

    /* Bottom Action Dock */
    .mh-bottom-dock {
      width: 100%;
      max-width: 920px;
      background: rgba(13, 19, 33, 0.92);
      border: 1.5px solid rgba(212, 164, 72, 0.45);
      border-radius: 14px;
      padding: 14px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
      z-index: 20;
    }

    .pouch-dots-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pouch-dot {
      width: 34px;
      height: 34px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(212, 164, 72, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .pouch-dot:hover {
      background: rgba(212, 164, 72, 0.18);
      transform: translateY(-2px);
    }

    .pouch-dot.active {
      transform: scale(1.22);
      background: rgba(212, 164, 72, 0.3);
      border: 2px solid var(--brass-light);
      box-shadow: 0 0 14px rgba(212, 164, 72, 0.55);
    }

    .dock-buttons-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      width: 100%;
    }

    .btn-launch {
      background: linear-gradient(135deg, var(--brass-light) 0%, var(--brass-main) 50%, #9a6c18 100%);
      color: #090d16;
      border: 1.5px solid #fff7d6;
      padding: 10px 26px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(212, 164, 72, 0.4);
      transition: all 0.16s ease;
    }

    .btn-launch:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }

    .btn-sub {
      background: rgba(255, 255, 255, 0.08);
      color: var(--parchment);
      border: 1px solid rgba(212, 164, 72, 0.4);
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.16s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-sub:hover {
      background: rgba(212, 164, 72, 0.2);
      border-color: var(--brass-light);
    }

    /* Fullscreen Embedded Game Iframe Overlay */
    .game-Runner-overlay {
      position: fixed;
      inset: 0;
      background: #070a10;
      z-index: 100;
      display: flex;
      flex-direction: column;
    }

    .runner-top-bar {
      height: 44px;
      background: #090d16;
      border-bottom: 1px solid rgba(212, 164, 72, 0.4);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-return-camp {
      background: linear-gradient(135deg, var(--brass-main), var(--brass-dark));
      color: #070a10;
      border: 1px solid var(--brass-light);
      padding: 5px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .runner-iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #0b101b;
    }

    /* Modal for Editing Slot Metadata */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      width: 100%;
      max-width: 520px;
      background: #141d2f;
      border: 2px solid var(--brass-main);
      border-radius: 14px;
      padding: 20px 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
    }

    .modal-box h3 {
      margin: 0 0 12px 0;
      color: var(--brass-light);
      font-size: 17px;
    }

    .form-row {
      margin-bottom: 10px;
    }

    .form-row label {
      display: block;
      font-size: 11.5px;
      color: var(--slate-muted);
      margin-bottom: 4px;
    }

    .form-row input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(7, 10, 16, 0.8);
      color: #fff;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="guild-header">
    <div class="guild-brand">
      <div class="guild-crest">⚔</div>
      <div class="guild-title-wrap">
        <h1>ORIGINAL BOARD GAME ARCHIVE — 全6作総合ランチャー</h1>
        <p>モンハン風アイテムポーチ循環セレクター（3Dスムーズスライド＆ドラッグ／ホイール回転対応）</p>
      </div>
    </div>
    <div class="guild-controls-hint">
      <span>操作：<span class="key-cap">◀ L</span> <span class="key-cap">R ▶</span> ・ <span class="key-cap">ホイール</span> ・ <span class="key-cap">左右ドラッグ</span></span>
      <button id="btnSfxToggle" class="sfx-toggle-btn" onclick="toggleSfx()">🔊 効果音: ON</button>
    </div>
  </header>

  <!-- Main Stage -->
  <main class="launcher-stage">
    <!-- Top Active Game Banner -->
    <div class="selected-quest-banner">
      <div id="bannerInner" class="banner-inner">
        <div id="activeSlotCounter" class="quest-slot-counter">SLOT 01 / 06 — PLAYABLE</div>
        <h2 id="activeQuestTitle" class="quest-main-title">♠ シフト＆シャフト (Shift &amp; Shaft)</h2>
        <p id="activeQuestCopy" class="quest-catchcopy">「運命を回し（シフト）、強者を刺す（シャフト）。」— 循環ドラフトと「1」の下剋上心理戦</p>
      </div>
    </div>

    <!-- Monster Hunter Item-Bar Homage Carousel -->
    <div id="carouselViewport" class="mh-carousel-viewport">
      <div class="center-aura"></div>

      <button class="carousel-nav-btn left" onclick="rotateCarousel(-1)" title="前のゲームへ (◀キー)">
        <span class="nav-shoulder-label">L / ◀</span>
        <span class="nav-arrow-icon">❮</span>
      </button>

      <div id="slotsContainer" style="position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center;"></div>

      <button class="carousel-nav-btn right" onclick="rotateCarousel(1)" title="次のゲームへ (▶キー)">
        <span class="nav-shoulder-label">R / ▶</span>
        <span class="nav-arrow-icon">❯</span>
      </button>
    </div>

    <!-- Bottom Pouch Bar & Launch Actions -->
    <div class="mh-bottom-dock">
      <div id="pouchDotsRow" class="pouch-dots-row"></div>

      <div class="dock-buttons-row">
        <button id="btnLaunchMain" class="btn-launch" onclick="launchSelectedGame(false)">
          ⚔️ このゲームをランチャー内で起動
        </button>
        <button class="btn-sub" onclick="launchSelectedGame(true)">
          🗗 別タブで開く
        </button>
        <a id="btnOpenPdf" class="btn-sub" href="shift_and_shaft_rulebook.pdf" target="_blank">
          📖 公式ルールブック (PDF)
        </a>
        <button class="btn-sub" onclick="openEditSlotModal()">
          ⚙️ スロット名・ファイル名を編集
        </button>
      </div>
    </div>
  </main>

  <!-- Fullscreen In-App Game Runner (Iframe) -->
  <div id="runnerOverlay" class="game-Runner-overlay hidden">
    <div class="runner-top-bar">
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="btn-return-camp" onclick="closeGameRunner()">🏕️ ランチャー（選択画面）へ戻る</button>
        <span id="runnerTitleText" style="font-size:13px; font-weight:800; color:var(--brass-light);"></span>
      </div>
      <a id="runnerNewTabLink" href="#" target="_blank" style="font-size:12px; color:#cbd5e1; text-decoration:none;">🗗 単体タブで開く</a>
    </div>
    <iframe id="runnerIframe" class="runner-iframe" src="about:blank"></iframe>
  </div>

  <!-- Edit Slot / Pending Slot Modal -->
  <div id="editModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <h3 id="modalHeading">⚙️ スロット情報のカスタマイズ</h3>
      <div id="modalNotice" style="font-size:12px; color:#cbd5e1; margin-bottom:12px; line-height:1.5;"></div>
      <div class="form-row">
        <label>ゲームタイトル</label>
        <input id="inputTitle" type="text">
      </div>
      <div class="form-row">
        <label>アイコン（絵文字 1文字）</label>
        <input id="inputIcon" type="text" maxlength="4">
      </div>
      <div class="form-row">
        <label>キャッチコピー・概要説明</label>
        <input id="inputCopy" type="text">
      </div>
      <div class="form-row">
        <label>タグ（カンマ区切り、例: 2〜4人用, 心理戦, 15分）</label>
        <input id="inputTags" type="text">
      </div>
      <div class="form-row">
        <label>参照するゲームHTMLファイル名（同じフォルダに置くファイル名）</label>
        <input id="inputHtmlFile" type="text">
      </div>
      <div class="form-row">
        <label>参照するルールブックPDFファイル名</label>
        <input id="inputPdfFile" type="text">
      </div>
      <div class="form-row">
        <label>ステータス（「ready」= 収録済 ／ 「pending」= 制作予定）</label>
        <input id="inputStatus" type="text">
      </div>
      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:14px;">
        <button class="btn-sub" onclick="closeEditSlotModal()">キャンセル</button>
        <button class="btn-launch" style="padding:8px 18px; font-size:13px;" onclick="saveSlotChanges()">保存する</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_GAMES = [
      {
        id: 1,
        icon: "♠",
        title: "シフト＆シャフト (Shift & Shaft)",
        copy: "「運命を回し（シフト）、強者を刺す（シャフト）。」循環ドラフトで階級と手札を決め、「1」の刃で下剋上を狙う心理戦カードゲーム。",
        tags: ["2〜4人用", "循環ドラフト", "下剋上心理戦", "AIシミュ搭載"],
        htmlFile: "shift_and_shaft_game.html",
        pdfFile: "shift_and_shaft_rulebook.pdf",
        status: "ready"
      },
      {
        id: 2,
        icon: "🛸",
        title: "イマジンタイル (Imagine Tile)",
        copy: "5台のホバーカーでデジタル神殿を疾走し、視覚デバフに覆われたタイル壁を砕いて真実を暴く協力型クイズ（NORMAL / HYPER / ENDLESS）。",
        tags: ["5台協力クイズ", "視覚デバフ解毒", "ENDLESS搭載", "3ワールド切替"],
        htmlFile: "game_02.html",
        pdfFile: "game_02_rulebook.pdf",
        status: "ready"
      },
      {
        id: 3,
        icon: "♦",
        title: "第3作：オリジナルゲーム（Slot 03）",
        copy: "3作目のルールから作成するゲームスロットです。同じフォルダに game_03.html を置くと即座に起動できます。",
        tags: ["Slot 03", "ルール解析待ち", "タイトル編集可"],
        htmlFile: "game_03.html",
        pdfFile: "game_03_rulebook.pdf",
        status: "pending"
      },
      {
        id: 4,
        icon: "♣",
        title: "第4作：オリジナルゲーム（Slot 04）",
        copy: "4作目のルールから作成するゲームスロットです。同じフォルダに game_04.html を置くと即座に起動できます。",
        tags: ["Slot 04", "ルール解析待ち", "タイトル編集可"],
        htmlFile: "game_04.html",
        pdfFile: "game_04_rulebook.pdf",
        status: "pending"
      },
      {
        id: 5,
        icon: "★",
        title: "第5作：オリジナルゲーム（Slot 05）",
        copy: "5作目のルールから作成するゲームスロットです。同じフォルダに game_05.html を置くと即座に起動できます。",
        tags: ["Slot 05", "ルール解析待ち", "タイトル編集可"],
        htmlFile: "game_05.html",
        pdfFile: "game_05_rulebook.pdf",
        status: "pending"
      },
      {
        id: 6,
        icon: "👑",
        title: "第6作：オリジナルゲーム（Slot 06）",
        copy: "全6作コンプリートを飾る最終スロットです。同じフォルダに game_06.html を置くと即座に起動できます。",
        tags: ["Slot 06", "ルール解析待ち", "タイトル編集可"],
        htmlFile: "game_06.html",
        pdfFile: "game_06_rulebook.pdf",
        status: "pending"
      }
    ];

    let gamesCatalog = [];
    let activeIdx = 0;
    let sfxEnabled = true;
    let audioCtx = null;

    // Web Audio API Synthesizer for crisp Monster Hunter-like item pouch click & lock-on chimes
    function playUiSound(type) {
      if (!sfxEnabled) return;
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          audioCtx = new AC();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;

        if (type === "slide") {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(780, now + 0.055);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.07);
        } else if (type === "launch") {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, now + i * 0.045);
            gain.gain.setValueAtTime(0.09, now + i * 0.045);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.045 + 0.28);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + i * 0.045);
            osc.stop(now + i * 0.045 + 0.3);
          });
        }
      } catch (e) {}
    }

    function toggleSfx() {
      sfxEnabled = !sfxEnabled;
      document.getElementById("btnSfxToggle").textContent = sfxEnabled ? "🔊 効果音: ON" : "🔇 効果音: OFF";
      if (sfxEnabled) playUiSound("slide");
    }

    function loadCatalog() {
      try {
        const saved = localStorage.getItem("boardgame_archive_catalog_v2");
        if (saved) {
          gamesCatalog = JSON.parse(saved);
          return;
        }
      } catch (e) {}
      gamesCatalog = JSON.parse(JSON.stringify(DEFAULT_GAMES));
    }

    function saveCatalog() {
      try {
        localStorage.setItem("boardgame_archive_catalog_v2", JSON.stringify(gamesCatalog));
      } catch (e) {}
    }

    // Signed circular offset in [-3, -2, -1, 0, +1, +2, +3]
    function getSignedOffset(idx, centerIdx, total, lastDirection = 1) {
      let diff = (idx - centerIdx) % total;
      if (diff < 0) diff += total;
      if (diff === 0) return 0;
      if (diff === 1) return 1;
      if (diff === 2) return 2;
      if (diff === total - 1) return -1;
      if (diff === total - 2) return -2;
      // For the 6th card (diff === 3), park it on the outgoing edge matching rotation direction
      return lastDirection >= 0 ? -3 : 3;
    }

    // Build DOM nodes ONCE so CSS transitions animate smoothly whenever data-offset changes!
    function buildSlotElements() {
      const container = document.getElementById("slotsContainer");
      const total = gamesCatalog.length;

      container.innerHTML = gamesCatalog.map((g, idx) => {
        const offset = getSignedOffset(idx, activeIdx, total, 1);
        const isReady = (g.status === "ready");
        const statusText = isReady ? "PLAYABLE" : "COMING SOON";
        const statusCls = isReady ? "ready" : "pending";
        const tagsHtml = (g.tags || []).map(t => `<span class="meta-chip">${t}</span>`).join("");

        return `
          <div id="slotCard_${idx}" class="mh-item-slot" data-offset="${offset}" onclick="onClickSlot(${idx})">
            <span class="mh-corner tl"></span>
            <span class="mh-corner tr"></span>
            <span class="mh-corner bl"></span>
            <span class="mh-corner br"></span>

            <div class="slot-top-bar">
              <span class="slot-num-tag">ITEM 0${g.id}</span>
              <span class="slot-status-pill ${statusCls}">${statusText}</span>
            </div>

            <div class="slot-icon-frame">
              <span>${g.icon}</span>
            </div>

            <div class="slot-title-box">
              <h3>${g.title}</h3>
              <p>${g.copy}</p>
            </div>

            <div>
              <div class="slot-meta-tags">${tagsHtml}</div>
              <div class="slot-file-label">📄 ${g.htmlFile}</div>
            </div>
          </div>
        `;
      }).join("");

      const dotsRow = document.getElementById("pouchDotsRow");
      dotsRow.innerHTML = gamesCatalog.map((g, idx) => `
        <div id="pouchDot_${idx}" class="pouch-dot ${idx === activeIdx ? 'active' : ''}" onclick="selectSlot(${idx})" title="${g.title}">
          ${g.icon}
        </div>
      `).join("");

      updateBannerAndControls(0);
    }

    // Smoothly transition existing DOM nodes to their new circular offsets!
    function updateCarouselPositions(direction = 1) {
      const total = gamesCatalog.length;

      for (let idx = 0; idx < total; idx++) {
        const el = document.getElementById(`slotCard_${idx}`);
        if (!el) continue;

        const prevOffset = parseInt(el.getAttribute("data-offset") || "0", 10);
        const nextOffset = getSignedOffset(idx, activeIdx, total, direction);

        // If a card is wrapping around the back of the carousel (e.g. jumping from -2/-3 to +2, or +2/+3 to -2),
        // pre-stage it invisibly on the entry side (+3 or -3) without transition, force reflow, then slide it into ±2!
        if (direction > 0 && nextOffset === 2 && prevOffset < 0) {
          el.classList.add("no-transition");
          el.setAttribute("data-offset", "3");
          void el.offsetWidth; // Force reflow
          el.classList.remove("no-transition");
        } else if (direction < 0 && nextOffset === -2 && prevOffset > 0) {
          el.classList.add("no-transition");
          el.setAttribute("data-offset", "-3");
          void el.offsetWidth; // Force reflow
          el.classList.remove("no-transition");
        }

        el.setAttribute("data-offset", String(nextOffset));

        const dot = document.getElementById(`pouchDot_${idx}`);
        if (dot) {
          dot.classList.toggle("active", idx === activeIdx);
        }
      }

      updateBannerAndControls(direction);
    }

    function updateBannerAndControls(direction) {
      const total = gamesCatalog.length;
      const current = gamesCatalog[activeIdx];
      const bannerInner = document.getElementById("bannerInner");

      if (direction !== 0 && bannerInner) {
        bannerInner.classList.remove("slide-from-right", "slide-from-left");
        void bannerInner.offsetWidth;
        bannerInner.classList.add(direction > 0 ? "slide-from-right" : "slide-from-left");
      }

      document.getElementById("activeSlotCounter").textContent =
        `ITEM POUCH [ 0${current.id} / 0${total} ] — ${current.status === "ready" ? "収録済み・起動可能" : "未収録スロット（ファイル追加で起動）"}`;
      document.getElementById("activeQuestTitle").textContent = `${current.icon} ${current.title}`;
      document.getElementById("activeQuestCopy").textContent = current.copy;

      const pdfBtn = document.getElementById("btnOpenPdf");
      pdfBtn.href = current.pdfFile;
      pdfBtn.textContent = `📖 ルールブック (${current.pdfFile})`;
    }

    function rotateCarousel(delta) {
      const total = gamesCatalog.length;
      activeIdx = (activeIdx + delta + total) % total;
      playUiSound("slide");
      updateCarouselPositions(delta);
    }

    function selectSlot(targetIdx) {
      if (targetIdx === activeIdx) return;
      const total = gamesCatalog.length;
      let forwardSteps = (targetIdx - activeIdx + total) % total;
      let backwardSteps = (activeIdx - targetIdx + total) % total;
      const dir = forwardSteps <= backwardSteps ? 1 : -1;
      activeIdx = targetIdx;
      playUiSound("slide");
      updateCarouselPositions(dir);
    }

    function onClickSlot(idx) {
      if (idx === activeIdx) {
        launchSelectedGame(false);
      } else {
        selectSlot(idx);
      }
    }

    function launchSelectedGame(openInNewTab) {
      playUiSound("launch");
      const current = gamesCatalog[activeIdx];
      if (openInNewTab) {
        window.open(current.htmlFile, "_blank");
        return;
      }
      const overlay = document.getElementById("runnerOverlay");
      const iframe = document.getElementById("runnerIframe");
      document.getElementById("runnerTitleText").textContent = `${current.icon} ${current.title} （${current.htmlFile}）`;
      document.getElementById("runnerNewTabLink").href = current.htmlFile;
      iframe.src = current.htmlFile;
      overlay.classList.remove("hidden");
    }

    function closeGameRunner() {
      const overlay = document.getElementById("runnerOverlay");
      const iframe = document.getElementById("runnerIframe");
      iframe.src = "about:blank";
      overlay.classList.add("hidden");
    }

    function openEditSlotModal() {
      const current = gamesCatalog[activeIdx];
      document.getElementById("modalHeading").textContent = `⚙️ スロット 0${current.id} の編集`;
      document.getElementById("modalNotice").textContent =
        `このスロットのタイトルや参照ファイル名（${current.htmlFile}）を自由に変更できます。設定はお使いのブラウザに自動保存されます。`;
      document.getElementById("inputTitle").value = current.title;
      document.getElementById("inputIcon").value = current.icon;
      document.getElementById("inputCopy").value = current.copy;
      document.getElementById("inputTags").value = (current.tags || []).join(", ");
      document.getElementById("inputHtmlFile").value = current.htmlFile;
      document.getElementById("inputPdfFile").value = current.pdfFile;
      document.getElementById("inputStatus").value = current.status;
      document.getElementById("editModal").classList.remove("hidden");
    }

    function closeEditSlotModal() {
      document.getElementById("editModal").classList.add("hidden");
    }

    function saveSlotChanges() {
      const current = gamesCatalog[activeIdx];
      current.title = document.getElementById("inputTitle").value.trim() || current.title;
      current.icon = document.getElementById("inputIcon").value.trim() || current.icon;
      current.copy = document.getElementById("inputCopy").value.trim() || current.copy;
      current.tags = document.getElementById("inputTags").value.split(",").map(s => s.trim()).filter(Boolean);
      current.htmlFile = document.getElementById("inputHtmlFile").value.trim() || current.htmlFile;
      current.pdfFile = document.getElementById("inputPdfFile").value.trim() || current.pdfFile;
      current.status = document.getElementById("inputStatus").value.trim() === "ready" ? "ready" : "pending";
      saveCatalog();
      closeEditSlotModal();
      buildSlotElements();
    }

    // Keyboard Controls
    window.addEventListener("keydown", (e) => {
      if (!document.getElementById("editModal").classList.contains("hidden")) return;
      if (!document.getElementById("runnerOverlay").classList.contains("hidden")) {
        if (e.key === "Escape") closeGameRunner();
        return;
      }
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
        rotateCarousel(-1);
      } else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
        rotateCarousel(1);
      } else if (e.key === "Enter") {
        launchSelectedGame(false);
      }
    });

    // Smooth Mouse Wheel Rotation
    let wheelLock = false;
    window.addEventListener("wheel", (e) => {
      if (!document.getElementById("editModal").classList.contains("hidden")) return;
      if (!document.getElementById("runnerOverlay").classList.contains("hidden")) return;
      if (wheelLock) return;
      if (Math.abs(e.deltaY) < 8 && Math.abs(e.deltaX) < 8) return;
      wheelLock = true;
      if (e.deltaY > 0 || e.deltaX > 0) {
        rotateCarousel(1);
      } else {
        rotateCarousel(-1);
      }
      setTimeout(() => { wheelLock = false; }, 220);
    });

    // Touch & Mouse Drag Swipe Support
    let dragStartX = null;
    const viewport = document.getElementById("carouselViewport");
    viewport.addEventListener("pointerdown", (e) => {
      if (e.target.closest("button")) return;
      dragStartX = e.clientX;
    });
    window.addEventListener("pointerup", (e) => {
      if (dragStartX === null) return;
      const diffX = e.clientX - dragStartX;
      dragStartX = null;
      if (Math.abs(diffX) > 42) {
        rotateCarousel(diffX < 0 ? 1 : -1);
      }
    });

    if (document.readyState === "loading") {
      window.addEventListener("DOMContentLoaded", () => {
        loadCatalog();
        buildSlotElements();
      });
    } else {
      loadCatalog();
      buildSlotElements();
    }
  </script>
</body>
</html>
