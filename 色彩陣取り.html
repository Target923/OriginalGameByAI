  // ------------------------------------------------------------------
  // 対戦の進行
  // ------------------------------------------------------------------
  function startGame() {
    const st = app.setup;
    const hot = st.mode === 'hotseat';
    app.humans = hot ? [true, true] : [true, false];
    const names = hot ? ['P1', 'P2'] : ['あなた', 'CPU'];
    let first;
    if (!hot && st.draftOrder === 'me') first = 1;
    if (!hot && st.draftOrder === 'cpu') first = 0;
    app.g = I.newGame({ sets: st.sets, komi: st.komi, gray: st.gray, names, first });
    Object.assign(app, { screen: 'game', sel: emptySel(), draft: {}, init: null, busy: false, last: [], fresh: new Set(), snap: null, msg: '', dialog: null, flip: false, made: [[], []], revealPause: false });
    proceed();
  }

  function proceed() {
    const g = app.g;
    if (g.phase === 'draft') {
      if (!app.humans[g.draftFirst]) { I.applyDraft(g, I.cpuDraft(g, app.rng)); return proceed(); }
      return render();
    }
    if (g.phase === 'initial') {
      if (!app.init) app.init = { picks: [null, null], order: [g.first, 1 - g.first], step: 0, blind: false, chosen: null };
      const ini = app.init;
      for (const p of [0, 1]) if (!app.humans[p] && ini.picks[p] === null) ini.picks[p] = I.cpuInitial(g, p, app.rng, I.AI_LEVELS[app.setup.level] || I.DEFAULT_AI);
      while (ini.step < 2 && ini.picks[ini.order[ini.step]] !== null) ini.step++;
      if (ini.picks[0] !== null && ini.picks[1] !== null) {
        const r = I.applyInitial(g, ini.picks);
        app.init = null;
        if (r.ok) { app.flip = true; app.last = [I.START[0], I.START[1]]; app.revealPause = true; }
        return proceed();
      }
      return render();
    }
    if (g.phase === 'play') {
      const p = I.currentPlayer(g);
      app.sel = emptySel();
      app.msg = '';
      if (app.humans[p]) {
        app.revealPause = false;
        app.snap = I.clone(g, true);
        app.noLegal = !I.hasLegalAction(g, p);
        render();
      } else {
        app.busy = true;
        render();
        setTimeout(runCpu, app.revealPause ? 1800 : 600);
        app.revealPause = false;
      }
      return;
    }
    render();
    if (g.phase === 'end') { app.dialog = 'result'; render(); }
  }

  function runCpu() {
    const g = app.g;
    if (!g || g.phase !== 'play') return;
    const p = I.currentPlayer(g);
    if (app.humans[p]) return;
    const plan = I.cpuPlan(g, p, app.rng, { ai: I.AI_LEVELS[app.setup.level] || I.DEFAULT_AI });
    const items = plan.items.slice();
    const step = () => {
      if (app.g !== g) return;
      if (items.length) {
        const it = items.shift();
        const before = I.clone(g);
        const r = I.useItem(g, p, it.type, it.params);
        if (r.ok) { app.last = changedCells(before, g); app.flip = false; }
        render();
        setTimeout(step, 700);
        return;
      }
      let act = plan.act, assigns = plan.assigns, r = null;
      if (act) r = I.commitTurn(g, p, act, assigns);
      if (!r || !r.ok) {
        const sb = I.searchBest(g, p, {});
        if (sb.best) { act = sb.best.act; assigns = sb.best.assigns; r = I.commitTurn(g, p, act, assigns); }
        else { act = null; r = I.passTurn(g, p); }
      }
      if (!r.ok) { console.error('CPU could not move:', r.error); app.busy = false; app.msg = 'CPUの手番でエラーが起きました: ' + r.error; return render(); }
      if (act && r.created) {
        app.made[p] = r.created.map(c => ({ color: c.color, cell: c.cell }));
        app.last = [act.to].concat(r.created.map(c => c.cell));
        app.fresh = new Set([act.cardId].concat(r.created.map(c => c.id)));
      } else app.last = [];
      app.flip = false;
      app.busy = false;
      proceed();
    };
    step();
  }

  // ------------------------------------------------------------------
  // 手番の操作
  // ------------------------------------------------------------------
  function onHand(p, id) {
    const g = app.g;
    if (g.phase === 'initial') {
      const ini = app.init;
      if (!ini || ini.blind || ini.order[ini.step] !== p || !app.humans[p]) return;
      if (!I.isBase(g.cards[id].color)) { app.msg = '初期配置には原色か白を出せます'; return render(); }
      ini.chosen = ini.chosen === id ? null : id;
      app.msg = '';
      return render();
    }
    if (!humanTurn() || p !== curP()) return;
    const sel = app.sel;
    if (sel.item) { app.msg = '先にアイテムを使うか、やめるを選んでください'; return render(); }
    if (sel.card === id) { app.sel = emptySel(); app.msg = ''; return render(); }
    const kinds = I.roundKinds(g.round);
    if (!kinds.place) { app.msg = 'R2 は盤上の自分のカードを動かすラウンドです'; return render(); }
    if (kinds.place === 'base' && !I.isBase(g.cards[id].color)) { app.msg = 'R1・R3 は手札の原色か白しか置けません'; return render(); }
    const legal = I.legalPlaceCells(g, p, id);
    app.sel = Object.assign(emptySel(), { card: id, legal });
    app.msg = legal.length ? '' : 'このカードで合成できるマスはありません';
    render();
  }

  function onBoard(i, info) {
    const g = app.g;
    if (!humanTurn()) return;
    const p = curP();
    const sel = app.sel;
    if (sel.item) return onItemBoard(i, info);
    if (info.tent !== undefined) { sel.assigns.splice(info.tent, 1); autoActive(); return render(); }
    if (info.main) { Object.assign(sel, { act: null, opts: [], assigns: [], active: null, need: 0 }); return render(); }
    if (sel.act) {
      const cands = [];
      sel.opts.forEach((o, k) => {
        if (!sel.assigns.some(a => a.opt === k) && I.freeCells(g, p, sel.act, sel.opts, sel.assigns, k).includes(i)) cands.push(k);
      });
      if (cands.length) {
        let k = cands.includes(sel.active) ? sel.active : null;
        if (k === null) {
          const cols = [...new Set(cands.map(c => sel.opts[c].color))];
          if (cols.length === 1) k = cands[0];
          else {
            sel.active = cands[0];
            app.msg = `${I.cellName(i)}には${cols.map(c => C[c].name).join('・')}を置けます。パレットで色を選んでから、もう一度マスを押してください`;
            return render();
          }
        }
        sel.assigns.push({ opt: k, cell: i });
        autoActive();
        app.msg = '';
        return render();
      }
    }
    if (sel.card !== null && sel.legal.includes(i) && !(sel.act && sel.act.to === i)) return setAct(i);
    if (info.cardId !== undefined) {
      const kinds = I.roundKinds(g.round);
      const c = g.cards[info.cardId];
      if (kinds.move && c.owner === p) {
        if (sel.card === info.cardId && !sel.act) { app.sel = emptySel(); return render(); }
        const legal = I.legalMoveCells(g, p, info.cardId);
        app.sel = Object.assign(emptySel(), { card: info.cardId, from: i, legal });
        app.msg = legal.length ? '' : 'このカードを動かして合成できるマスはありません';
        return render();
      }
      if (kinds.move && c.owner !== p) { app.msg = '相手のカードは動かせません（スピンで奪えば動かせます）'; return render(); }
    }
  }

  function setAct(i) {
    const sel = app.sel, g = app.g, p = curP();
    sel.act = sel.from === null ? { type: 'place', cardId: sel.card, to: i } : { type: 'move', cardId: sel.card, from: sel.from, to: i };
    sel.opts = I.optionsFor(g, p, sel.act);
    sel.assigns = [];
    sel.need = I.grayNeed(g, p, sel.act, sel.opts);
    app.msg = '';
    autoActive();
    render();
  }

  function autoActive() {
    const sel = app.sel, g = app.g, p = curP();
    sel.active = null;
    if (!sel.act) return;
    const order = sel.opts.map((o, k) => k).sort((a, b) => (sel.opts[b].color === 'gray') - (sel.opts[a].color === 'gray') || a - b);
    for (const k of order) {
      if (sel.assigns.some(a => a.opt === k)) continue;
      if (I.freeCells(g, p, sel.act, sel.opts, sel.assigns, k).length) { sel.active = k; return; }
    }
  }

  function onWell(k) {
    const sel = app.sel, g = app.g, p = curP();
    if (!humanTurn() || !sel.act) return;
    const ai = sel.assigns.findIndex(a => a.opt === k);
    if (ai >= 0) { sel.assigns.splice(ai, 1); sel.active = k; return render(); }
    if (!I.freeCells(g, p, sel.act, sel.opts, sel.assigns, k).length) return;
    sel.active = sel.active === k ? null : k;
    render();
  }

  function commit() {
    const sel = app.sel, g = app.g, p = curP();
    if (!humanTurn() || !sel.act) return;
    const r = I.commitTurn(g, p, sel.act, sel.assigns);
    if (!r.ok) { app.msg = r.error; return render(); }
    app.made[p] = r.created.map(c => ({ color: c.color, cell: c.cell }));
    app.last = [sel.act.to].concat(r.created.map(c => c.cell));
    app.fresh = new Set([sel.act.cardId].concat(r.created.map(c => c.id)));
    app.flip = false;
    proceed();
  }

  function undoTurn() {
    if (!app.snap || !humanTurn()) return;
    app.g = I.clone(app.snap, true);
    app.sel = emptySel();
    app.msg = '';
    app.noLegal = !I.hasLegalAction(app.g, curP());
    render();
  }

  // ------------------------------------------------------------------
  // アイテム
  // ------------------------------------------------------------------
  function boardCards(s) {
    const out = [];
    for (let i = 0; i < I.GN; i++) for (const id of s.cells[i].stack) out.push({ id, i });
    return out;
  }
  function changeColors(s, id) {
    const c = s.cards[id];
    return I.COLOR_ORDER.filter(k => k !== c.color && C[k].pts === C[c.color].pts && s.piles[k].length);
  }
  function slideCells(s, p, id) {
    const loc = I.findCard(s, id);
    const out = new Map();
    if (!loc || loc.where !== 'cell') return out;
    for (const dir of Object.keys(I.DIRS)) {
      const nx = I.X(loc.idx) + I.DIRS[dir][0], ny = I.Y(loc.idx) + I.DIRS[dir][1];
      if (!I.inGrid(nx, ny)) continue;
      const j = I.idx(nx, ny);
      if (I.canPutFor(s, j, p) && !s.cells[j].stack.length) out.set(j, dir);
    }
    return out;
  }
  function itemTargets() {
    const it = app.sel.item, g = app.g, p = curP(), opp = 1 - p;
    const cards = new Set(), cells = new Set();
    if (!it) return { cards, cells };
    // 相手がロックしたマスのカードは、リターン・スライド・チェンジ・スピンの対象にできない
    const bc = boardCards(g).filter(a => !I.isGuarded(g, p, a.id));
    switch (it.type) {
      case 'spin':
        if (it.step === 0) {
          for (const a of bc) if (g.cards[a.id].owner === p && bc.some(b => g.cards[b.id].owner === opp && C[g.cards[b.id].color].pts === C[g.cards[a.id].color].pts)) cards.add(a.id);
        } else {
          const m = g.cards[it.params.mine];
          cards.add(it.params.mine);
          for (const b of bc) if (g.cards[b.id].owner === opp && C[g.cards[b.id].color].pts === C[m.color].pts) cards.add(b.id);
        }
        break;
      case 'change': for (const a of bc) if (changeColors(g, a.id).length) cards.add(a.id); break;
      case 'reset': for (const a of bc) cards.add(a.id); break;
      case 'slide':
        for (const a of bc) if (slideCells(g, p, a.id).size) cards.add(a.id);
        if (it.step >= 1) for (const j of slideCells(g, p, it.params.cardId).keys()) cells.add(j);
        break;
      case 'lock':
        for (let i = 0; i < I.GN; i++) { const c = g.cells[i]; if (I.cellExists(g, i) && !c.stack.length && !c.obj && c.lock === null) cells.add(i); }
        break;
      case 'remote': case 'portal':
        for (let i = 0; i < I.GN; i++) if (I.canPutFor(g, i, p) && !g.cells[i].stack.length) cells.add(i);
        break;
      default: break;
    }
    return { cards, cells };
  }
  function changedCells(a, b) {
    const out = [];
    for (let i = 0; i < I.GN; i++) {
      const x = a.cells[i], y = b.cells[i];
      const ex = I.cellExists(a, i), ey = I.cellExists(b, i);
      let diff = ex !== ey || x.lock !== y.lock || (x.obj ? x.obj.type : '') !== (y.obj ? y.obj.type : '') || x.stack.join() !== y.stack.join();
      if (!diff) for (const id of y.stack) if (a.cards[id].owner !== b.cards[id].owner) diff = true;
      if (diff && ey) out.push(i);
    }
    return out;
  }
  function legalUnion(s, p) {
    const set = new Set();
    const kinds = I.roundKinds(s.round);
    if (kinds.place) {
      const seen = new Set();
      for (const id of s.hands[p]) {
        const c = s.cards[id];
        if (kinds.place === 'base' && !I.isBase(c.color)) continue;
        const key = c.color + c.chip;
        if (seen.has(key)) continue;
        seen.add(key);
        I.legalPlaceCells(s, p, id).forEach(x => set.add(x));
      }
    }
    if (kinds.move) for (const a of boardCards(s)) if (s.cards[a.id].owner === p) I.legalMoveCells(s, p, a.id).forEach(x => set.add(x));
    return set;
  }
  function buildPreview() {
    const it = app.sel.item, g = app.g, p = curP();
    const c = I.clone(g, false);
    const r = I.useItem(c, p, it.type, it.params);
    if (!r.ok) { it.error = r.error; it.preview = null; return; }
    it.error = '';
    it.preview = c;
    it.changed = changedCells(g, c);
    const before = legalUnion(g, p), after = legalUnion(c, p);
    it.newLegal = [...after].filter(x => !before.has(x));
    it.legalCount = after.size;
  }
  function onItem(type) {
    const g = app.g, p = curP();
    if (!humanTurn()) return;
    if (app.sel.item && app.sel.item.type === type) { app.sel = emptySel(); return render(); }
    if (!I.canUseItems(g, p)) { app.msg = 'R1〜R3 はアイテムを1手番に1つまでです'; return render(); }
    if (app.sel.act) { app.msg = 'アイテムは設置・移動の前に使います。置いたカードを戻してから選んでください'; return render(); }
    app.sel = emptySel();
    app.sel.item = { type, step: 0, params: {}, preview: null, error: '' };
    app.msg = '';
    if (type === 'all' || type === 'double') buildPreview();
    render();
  }
  function onItemBoard(i, info) {
    const it = app.sel.item, g = app.g, p = curP();
    const tg = itemTargets();
    const id = info.cardId;
    switch (it.type) {
      case 'spin':
        if (it.step === 0 && id !== undefined && tg.cards.has(id)) { it.params = { mine: id }; it.step = 1; }
        else if (it.step >= 1 && id === it.params.mine) { it.params = {}; it.step = 0; it.preview = null; }
        else if (it.step >= 1 && id !== undefined && tg.cards.has(id) && g.cards[id].owner !== p) { it.params.theirs = id; it.step = 2; buildPreview(); }
        break;
      case 'change':
        if (id !== undefined && tg.cards.has(id)) { it.params = { cardId: id }; it.step = 1; it.preview = null; }
        break;
      case 'reset':
        if (id !== undefined && tg.cards.has(id)) { it.params = { cardId: id }; it.step = 1; buildPreview(); }
        break;
      case 'slide':
        if (it.step >= 1 && tg.cells.has(i)) { it.params.dir = slideCells(g, p, it.params.cardId).get(i); it.step = 2; buildPreview(); }
        else if (id !== undefined && tg.cards.has(id)) { it.params = { cardId: id }; it.step = 1; it.preview = null; }
        break;
      case 'lock': case 'remote': case 'portal':
        if (tg.cells.has(i)) { it.params = { idx: i }; it.step = 1; buildPreview(); }
        break;
      default: break;
    }
    render();
  }
  function confirmItem() {
    const it = app.sel.item, g = app.g, p = curP();
    if (!it || !it.preview) return;
    const before = I.clone(g);
    const r = I.useItem(g, p, it.type, it.params);
    if (!r.ok) { app.msg = r.error; return render(); }
    app.last = changedCells(before, g);
    app.flip = false;
    app.sel = emptySel();
    app.noLegal = !I.hasLegalAction(g, p);
    render();
  }

  // ------------------------------------------------------------------
  // 対戦画面の描画
  // ------------------------------------------------------------------
  function viewState() {
    const it = app.sel && app.sel.item;
    return it && it.preview ? it.preview : app.g;
  }

  const SIDE_JA = { top: '上', bottom: '下', left: '左', right: '右' };
  // 盤のまわりの座標の枠。ワイドの辺を選んでいるときは、押すとその辺を選べる
  function ringHTML(x, y, pickWide) {
    const corner = (x === -1 || x === 6) && (y === -1 || y === 6);
    if (corner) return '<div class="cell"></div>';
    const lab = `<span class="lab">${y === -1 || y === 6 ? 'ABCDEF'[x] : y + 1}</span>`;
    if (!pickWide) return `<div class="cell">${lab}</div>`;
    const sd = y === -1 ? 'top' : y === 6 ? 'bottom' : x === -1 ? 'left' : 'right';
    const first = (sd === 'top' || sd === 'bottom') ? x === 0 : y === 0;
    return `<div class="cell side-pick" data-side="${sd}" role="button" tabindex="${first ? 0 : -1}" title="${SIDE_JA[sd]}側に列を足す" aria-label="${SIDE_JA[sd]}側に列を足す">${lab}</div>`;
  }

  function boardHTML() {
    const g = app.g, v = viewState(), sel = app.sel, p = curP();
    const hum = humanTurn();
    const it = sel.item;
    const legal = new Set(hum && !it ? sel.legal : []);
    const free = new Set(), freeAlt = new Set();
    if (hum && sel.act && !it) {
      sel.opts.forEach((o, k) => {
        if (sel.assigns.some(a => a.opt === k)) return;
        for (const c of I.freeCells(g, p, sel.act, sel.opts, sel.assigns, k)) (k === sel.active ? free : freeAlt).add(c);
      });
    }
    const tg = hum && it && !it.preview ? itemTargets() : { cards: new Set(), cells: new Set() };
    const changed = new Set(it && it.preview ? it.changed : []);
    const newLegal = new Set(it && it.preview ? it.newLegal : []);
    const last = new Set(it ? [] : app.last);
    const picked = new Set();
    if (it) { if (it.params.mine !== undefined) picked.add(it.params.mine); if (it.params.cardId !== undefined && !it.preview) picked.add(it.params.cardId); }
    // 仮置き
    const tent = {};
    const addT = (i, h) => { (tent[i] = tent[i] || []).push(h); };
    if (sel.act && !it) {
      addT(sel.act.to, cardHTML(g, sel.act.cardId, 'tent', 'data-main="1"'));
      const used = {};
      sel.assigns.forEach((a, k) => {
        const col = sel.opts[a.opt].color;
        const n = used[col] || 0;
        used[col] = n + 1;
        const id = g.piles[col][n];
        if (id === undefined) return;
        const fake = { cards: g.cards.map(c => (c.id === id ? Object.assign({}, c, { owner: p }) : c)), settings: g.settings };
        addT(a.cell, cardHTML(fake, id, 'tent', `data-tent="${k}"`));
      });
    }
    // 初期配置中の裏向きカード
    const backs = {};
    let spot = -1, spotP = null, spotChosen = false;
    if (g.phase === 'initial' && app.init) {
      const ini = app.init;
      [0, 1].forEach(pp => { if (ini.picks[pp] !== null) backs[I.START[pp]] = pp; });
      // 今選んでいるプレイヤーのカードが置かれるマスに目印を出す
      const cp = ini.order[ini.step];
      if (!ini.blind && cp !== undefined && app.humans[cp] && ini.picks[cp] === null) { spot = I.START[cp]; spotP = cp; spotChosen = ini.chosen !== null; }
    }
    const backHTML = (pp, cls) => `<div class="card back${pp === 1 ? ' rot' : ''}${cls ? ' ' + cls : ''}" title="${esc(nameOf(pp))}の裏向きのカード"><span class="who">${esc(nameOf(pp))}</span></div>`;
    const pickWide = hum && it && it.type === 'wide' && !g.wide;
    let html = '';
    for (let y = -1; y <= 6; y++) {
      for (let x = -1; x <= 6; x++) {
        const i = I.idx(x, y);
        if (!I.cellExists(v, i)) { html += ringHTML(x, y, pickWide); continue; }
        const c = v.cells[i];
        const cls = ['cell', I.inMain(x, y) ? 'main' : 'wide'];
        if (legal.has(i) && !(sel.act && sel.act.to === i) && !free.has(i) && !freeAlt.has(i)) cls.push('legal', 'click');
        if (free.has(i)) cls.push('free', 'click');
        else if (freeAlt.has(i)) cls.push('free', 'alt', 'click');
        if (tg.cells.has(i)) cls.push('legal', 'click');
        if (newLegal.has(i)) cls.push('legal');
        if (changed.has(i)) cls.push('changed');
        if (last.has(i)) cls.push('last');
        if (i === spot) cls.push('spot');
        const cards = [];
        for (const id of c.stack) {
          const extra = [];
          if (sel.act && !it && sel.act.type === 'move' && sel.act.cardId === id) extra.push('ghost');
          if (tg.cards.has(id)) extra.push('cand');
          if (picked.has(id) || (sel.card === id && !it)) extra.push('pick');
          if (app.fresh.has(id) && !it) extra.push('fresh');
          if (app.flip && (i === I.START[0] || i === I.START[1])) extra.push('flip');
          if (I.roundKinds(g.round).move && hum && !it && g.cards[id].owner === p) extra.push('cand');
          if (g.phase === 'play' && p !== null && v.cards[id].owner !== p) extra.push('away');
          cards.push(cardHTML(v, id, extra.join(' '), `data-card="${id}"`));
        }
        if (tent[i]) cards.push(...tent[i]);
        if (backs[i] !== undefined) cards.push(backHTML(backs[i], ''));
        if (i === spot && spotChosen) cards.push(backHTML(spotP, 'tent'));
        let inner = '';
        const visible = cards.filter(h => !h.includes('ghost'));
        const list = visible.length && cards.length > 2 ? visible : cards;
        if (list.length === 1) inner = list[0];
        else if (list.length >= 2) inner = `<div class="stack2">${list.slice(0, 2).join('')}</div>`;
        if (c.obj) inner += `<div class="obj${c.obj.owner === 1 ? ' rot' : ''}${c.obj.owner === p ? ' mine' : ''}" title="${esc(I.ITEM[c.obj.type].name + '（' + v.settings.names[c.obj.owner] + '）')}">${ICON[c.obj.type]}</div>`;
        // カードのあるロックマスは、カードを隠さないよう角の小さな印にする（カードは相手のアイテムの対象外）
        if (c.lock !== null) inner += `<div class="lockmark${c.lock === 1 ? ' rot' : ''}${list.length ? ' on-card' : ''}" title="${esc('ロック（' + v.settings.names[c.lock] + '）' + (list.length ? '：このマスのカードは相手のアイテムの対象外' : ''))}">${ICON.lock}</div>`;
        html += `<div class="${cls.join(' ')}" data-cell="${i}" title="${I.cellName(i)}">${inner}</div>`;
      }
    }
    const tag = it && it.preview ? '<span class="preview-tag">プレビュー</span>' : '';
    return `<div class="board-wrap"><div class="mat" role="grid" aria-label="盤面">${tag}${html}</div></div>`;
  }

  const sideOf = p => (p === 1 ? 'opp' : 'me');
  const sbtn = (doId, label, cls, dis) => `<button class="btn ${cls || ''}" data-do="${doId}" ${dis ? 'disabled' : ''}>${label}</button>`;

  function handHTML(p) {
    const g = app.g;
    const role = [];
    if (g.phase !== 'draft') role.push(p === g.first ? '先攻' : '後攻');
    let canPick = () => false;
    let selId = null;
    if (g.phase === 'initial' && app.init && !app.init.blind) {
      const ini = app.init;
      if (ini.order[ini.step] === p && app.humans[p]) { canPick = id => I.isBase(g.cards[id].color); selId = ini.chosen; }
    } else if (humanTurn() && curP() === p && !app.sel.item) {
      const kinds = I.roundKinds(g.round);
      canPick = id => !!kinds.place && (kinds.place === 'any' || I.isBase(g.cards[id].color));
      selId = app.sel.from === null ? app.sel.card : null;
    }
    const myTurn = g.phase === 'play' && humanTurn() && curP() === p;
    const cards = g.hands[p].map(id => {
      const cls = [];
      if (canPick(id)) cls.push('can');
      else if (myTurn) cls.push('dim');
      if (selId === id) cls.push('sel');
      return cardHTML(g, id, cls.join(' '), `data-hand="${p}:${id}" role="button" tabindex="0"`, true);
    }).join('');
    const total = g.hands[p].reduce((a, id) => a + C[g.cards[id].color].pts, 0);
    const active = (g.phase === 'play' && curP() === p) || (g.phase === 'initial' && app.init && !app.init.blind && app.init.order[app.init.step] === p);
    return `<div class="hblock ${sideOf(p)}${active ? ' active' : ''}">` +
      `<div class="head"><b>${esc(nameOf(p))}の手札</b><span class="tag">${role.join('・')}${role.length ? '・' : ''}${g.hands[p].length}枚 ${ptsText(total)}点</span></div>` +
      `<div class="hand">${cards || '<span class="empty">手札はありません</span>'}</div>` +
      `<div class="acts">${actionButtons(p)}</div></div>`;
  }

  // 手番の操作ボタン（その手番のプレイヤーの手札の下に出す）
  function actionButtons(p) {
    const g = app.g;
    if (g.phase === 'initial') {
      const ini = app.init;
      if (ini && !ini.blind && ini.order[ini.step] === p && app.humans[p]) return sbtn('init-ok', '裏向きで出す', 'primary', ini.chosen === null);
      return '';
    }
    if (g.phase !== 'play' || curP() !== p || !humanTurn()) return '';
    const sel = app.sel;
    const undo = app.snap && changedSinceSnap() ? sbtn('undo', '手番を戻す') : '';
    if (sel.item) {
      const it = sel.item, nm = I.ITEM[it.type].name;
      let out = '';
      if (it.type === 'change' && it.step >= 1) {
        out += changeColors(g, it.params.cardId).map(col => {
          const top = g.piles[col][0];
          const ch = g.cards[top].chip ? `・${C[g.cards[top].chip].name}` : '';
          return `<button class="btn" data-color="${col}" aria-pressed="${it.params.color === col}"><span class="sw p-${col}"></span>${C[col].name}${ch}</button>`;
        }).join('');
      }
      return out + sbtn('item-ok', `${nm}を使う`, 'primary', !it.preview) + sbtn('item-cancel', 'やめる');
    }
    if (app.noLegal) return sbtn('pass', 'パス', 'primary') + undo;
    if (!sel.act) return undo;
    const chk = I.checkAssigns(g, p, sel.act, sel.opts, sel.assigns);
    return sbtn('commit', '決定', 'primary', !chk.ok) + sbtn('auto', 'おまかせ') + sbtn('clear', '置き直す') + undo;
  }

  function itemsHTML(p) {
    const g = app.g;
    const list = g.items[p];
    let body;
    if (!g.settings.sets.length) body = '<span class="muted small">アイテムなし</span>';
    else if (!list.length) body = '<span class="muted small">ドラフト前です</span>';
    else {
      const can = humanTurn() && curP() === p && I.canUseItems(g, p) && !app.sel.act;
      body = '<div class="ilist">' + list.map(o => {
        const info = I.ITEM[o.type];
        const cls = ['item'];
        if (o.used) cls.push('used');
        else if (can) cls.push('can');
        if (app.sel.item && app.sel.item.type === o.type && curP() === p) cls.push('on');
        const attr = !o.used && curP() === p && humanTurn() ? `data-item="${o.type}"` : 'tabindex="-1" aria-disabled="true"';
        const tip = `${info.name}：${info.desc}${o.used ? `（R${o.round}で使用）` : ''}`;
        return `<button class="${cls.join(' ')}" ${attr} title="${esc(tip)}">${info.name}${o.used ? `<small>R${o.round}</small>` : ''}</button>`;
      }).join('') + '</div>';
    }
    const left = list.filter(o => !o.used).length;
    return `<div class="iblock ${sideOf(p)}"><div class="head"><b>アイテム</b><span class="tag">${list.length ? `残り${left}` : ''}</span></div>${body}</div>`;
  }

  function wellsHTML() {
    const sel = app.sel, g = app.g, p = curP();
    const wells = sel.opts.map((o, k) => {
      const ai = sel.assigns.findIndex(a => a.opt === k);
      const free = ai < 0 ? I.freeCells(g, p, sel.act, sel.opts, sel.assigns, k) : [];
      const cls = ['well', 'p-' + o.color];
      if (ai >= 0) cls.push('done');
      else if (!free.length) cls.push('off');
      if (sel.active === k) cls.push('active');
      if (o.color === 'gray') cls.push('must');
      const before = ai >= 0 ? sel.assigns.slice(0, ai) : sel.assigns;
      const nextId = g.piles[o.color][before.filter(a => sel.opts[a.opt].color === o.color).length];
      const chip = nextId !== undefined && g.cards[nextId].chip ? `・${C[g.cards[nextId].chip].name}チップ` : '';
      const reads = o.readings.map(r => C[r].name).join('＋');
      const dir = o.axis[1] === 0 ? 'よこ' : o.axis[0] === 0 ? 'たて' : 'ななめ';
      let state;
      if (ai >= 0) state = `${I.cellName(sel.assigns[ai].cell)}に置く`;
      else if (!g.piles[o.color].length) state = '在庫切れ';
      else if (!free.length) state = '置けるマスなし';
      else state = `${ptsText(C[o.color].pts)}点${chip}`;
      const tip = free.length ? `置けるマス：${free.map(I.cellName).join('、')}` : '';
      return `<button class="${cls.join(' ')}" data-well="${k}" ${!free.length && ai < 0 ? 'disabled' : ''} title="${esc(tip)}"><span class="blob"></span><span class="t"><b>${C[o.color].name}</b><small>${reads}・${dir}・${state}</small></span></button>`;
    }).join('');
    return wells || '<span class="muted">作れる色はありません</span>';
  }

  // 各プレイヤーのパレット：自分の手番は作れる色の候補、それ以外は前の手番で作った色
  function paletteHTML(p) {
    const g = app.g, sel = app.sel;
    const turn = g.phase === 'play' && curP() === p;
    let inner;
    if (turn && humanTurn() && sel.act && !sel.item) inner = wellsHTML();
    else if (turn && !app.humans[p]) inner = '<span class="muted">CPUが考えています…</span>';
    else if (turn && humanTurn()) inner = '<span class="muted">置くマスを決めると、作れる色がここに並びます</span>';
    else if (app.made[p] && app.made[p].length) {
      inner = `<span class="muted cap">${esc(nameOf(p))}が前の手番で作った色</span>` + app.made[p].map(m =>
        `<span class="well mini p-${m.color}"><span class="blob"></span><span class="t"><b>${C[m.color].name}</b><small>${I.cellName(m.cell)}</small></span></span>`).join('');
    } else inner = `<span class="muted">${esc(nameOf(p))}の手番に、作れる色がここに並びます</span>`;
    return `<div class="palette ${sideOf(p)}"><div class="tray" aria-label="${esc(nameOf(p))}のパレット">${inner}</div></div>`;
  }

  function roundsHTML() {
    const g = app.g;
    return `<div class="rounds" aria-label="ラウンド">${[1, 2, 3, 4].map(r => `<span class="${g.round === r && g.phase === 'play' ? 'on' : g.round > r || g.phase === 'end' ? 'done' : ''}">${I.ROUND_LABEL[r]}</span>`).join('')}</div>`;
  }

  function statusHTML() {
    const g = app.g;
    let who = '', say = '', acts = '';
    if (g.phase === 'draft') {
      who = 'アイテムのドラフト';
      say = `${esc(nameOf(g.draftFirst))}が選んでいます。`;
    } else if (g.phase === 'initial') {
      const ini = app.init;
      const p = ini ? ini.order[ini.step] : null;
      who = '初期配置';
      if (p !== null && p !== undefined) {
        say = `${esc(nameOf(p))}：手札から原色か白を1枚選び、手札の下の「裏向きで出す」を押してください。${I.cellName(I.START[p])}（${p === 0 ? '手前' : '奥'}側）に裏向きで置かれ、両者がそろってから公開します。`;
      }
    } else if (g.phase === 'end') {
      const r = g.result;
      who = r.winner === null ? '引き分け' : `${esc(nameOf(r.winner))}の勝ち`;
      say = `${r.scores[0].total} 対 ${r.scores[1].total}`;
      acts = sbtn('show-result', '結果を見る', 'primary') + sbtn('again', '同じ設定でもう一度') + sbtn('to-setup', '設定に戻る');
    } else {
      const p = curP();
      const role = p === g.first ? '先攻' : '後攻';
      who = `${esc(nameOf(p))}（${role}）の手番`;
      if (!app.humans[p] || app.busy) {
        say = 'CPUが考えています…';
      } else {
        const sel = app.sel;
        const left = I.unusedItems(g, p).length;
        const canItem = left && I.canUseItems(g, p);
        if (sel.item) {
          const it = sel.item, nm = I.ITEM[it.type].name;
          const guide = {
            all: '使うと、この手番は斜め方向でも合成できます。',
            double: '使うと、この手番は生成した色をカードのあるマスに重ねて置けます。',
            spin: it.step === 0 ? '自分のカードを選んでください（相手に同じ点数のカードがあるもの）。' : it.step === 1 ? '入れ替える相手のカードを選んでください。' : '所有者が入れ替わります。',
            change: it.step === 0 ? '交換する盤上のカードを選んでください。' : '手札の下で交換する色を選んでください（在庫の山の一番上と入れ替えます）。',
            reset: it.step === 0 ? '手札に戻すカードを選んでください。' : '選んだカードを持ち主の手札に戻します。',
            slide: it.step === 0 ? '動かすカードを選んでください。' : it.step === 1 ? '動かす先のマスを選んでください。' : '1マス動かします（合成は起きません）。',
            lock: it.step === 0 ? 'ロックする空きマスを選んでください。' : '相手はこのマスに設置・移動・生成できなくなります。',
            wide: it.step === 0 ? '盤のまわりの座標の枠を押して、列を足す辺（上下左右）を選んでください。' : `${SIDE_JA[it.params.side]}側に自分専用の列が増えます。ほかの辺の枠を押すと選び直せます。`,
            remote: it.step === 0 ? 'リモートを置く空きマスを選んでください。' : 'このマスを透過して合成できます。このマスに触れる並び（上下左右のカードを使う並びや、このマスを通る並び）で作った色は、周り8マスにも置けます。',
            portal: it.step === 0 ? 'ポータルを置く空きマスを選んでください。' : '生成した色をこのマスの上下左右にも置けるようになります。',
          }[it.type];
          say = `<b>${nm}</b>：${guide}`;
          if (it.preview) say += ` 使った後に合成できるマス：${it.legalCount}か所${it.newLegal.length ? `（新たに${it.newLegal.length}か所）` : ''}。`;
          if (it.error) say += `<br><span class="err">${esc(it.error)}</span>`;
        } else if (app.noLegal) {
          say = '合成できるマスがありません。アイテムで状況を変えるか、パスしてください。';
        } else if (!sel.act) {
          const what = { 1: '手札の原色か白を1枚選んでください', 2: '動かす自分のカードを盤上から選んでください', 3: '手札の原色か白を1枚選んでください', 4: '手札のカード、または盤上の自分のカードを選んでください' }[g.round];
          say = sel.card !== null ? `光っているマスに置けます（${sel.legal.length}か所）。` : `${what}。` + (canItem ? `アイテムはその前に使えます（残り${left}個${g.round < 4 ? '、この手番は1つまで' : '、R4は無制限'}）。` : '');
        } else {
          const placed = sel.assigns.length;
          const grays = sel.assigns.filter(a => sel.opts[a.opt].color === 'gray').length;
          say = `作れる色が${sel.opts.length}つあります。点線のマスを押すと、そこに作れる色を置きます（濃い点線はパレットで選んでいる色の置き場）。同じ色は置いた順に在庫の山の上から使うので、チップ付きのカードをどこに置くかも順番で決められます。置き終えたら「決定」を押してください（今は${placed}枚。置かない色があってもかまいません）。`;
          if (sel.need > grays) say += `<br><span class="err">灰色をあと${sel.need - grays}枚置く必要があります。</span>`;
          const chk = I.checkAssigns(g, p, sel.act, sel.opts, sel.assigns);
          const proj = chk.ok ? projected() : null;
          if (proj) say += `<br>決定後の得点：${esc(nameOf(0))} ${proj[0].total}・${esc(nameOf(1))} ${proj[1].total}`;
        }
      }
    }
    const err = app.msg ? `<div class="err">${esc(app.msg)}</div>` : '';
    return `<div class="status" aria-live="polite"><div class="who">${who}</div><div class="say">${say}</div>${err}${acts ? `<div class="acts">${acts}</div>` : ''}</div>`;
  }
  function changedSinceSnap() {
    const g = app.g, s = app.snap;
    return g.turn && s.turn && (g.turn.itemsUsed !== s.turn.itemsUsed);
  }
  function projected() {
    const sel = app.sel;
    const c = I.clone(app.g);
    const r = I.commitTurn(c, curP(), sel.act, sel.assigns);
    return r.ok ? I.score(c) : null;
  }

    const ov = $('overlay');
    const g = app.g;
    let html = '';

    else if (app.dialog === 'rules') html = rulesHTML();
    else if (app.screen === 'game' && g && g.phase === 'draft' && app.humans[g.draftFirst]) html = draftHTML();
    else if (app.screen === 'game' && g && g.phase === 'initial' && app.init && app.init.blind) {
      const p = app.init.order[app.init.step];
      html = `<div class="dialog" role="dialog" aria-modal="true"><h2>${esc(nameOf(p))}の番です</h2><p>${esc(nameOf(1 - p))}の選んだカードは裏向きで伏せてあります。${esc(nameOf(p))}に画面を渡してください。</p><div class="row"><button class="btn primary" data-do="blind-ok">${esc(nameOf(p))}が選ぶ</button></div></div>`;
    } else if (app.dialog === 'result' && g && g.phase === 'end') html = resultHTML();
    ov.innerHTML = html;
    ov.hidden = !html;

    return `<div class="dialog" role="dialog" aria-modal="true"><h2>ルール早見</h2><div class="rules">

      <h3>アイテム</h3>
      <ul>${I.ITEM_ORDER.map(t => `<li><b>${I.ITEM[t].name}</b>：${I.ITEM[t].desc}</li>`).join('')}</ul>

  // ------------------------------------------------------------------
  // シミュレーション
  // ------------------------------------------------------------------
  function startSim() {
    const st = app.setup;
    const settings = { sets: st.sets.slice(), komi: st.komi, gray: st.gray, names: ['先攻', '後攻'] };
    const level = I.AI_LEVELS[st.level] ? st.level : 'normal';
    app.sim = { settings, level, total: Number(st.games) || 200, done: 0, recs: [], running: true, agg: null, seed0: (Date.now() >>> 0) % 1000000000, t0: performance.now() };
    app.screen = 'sim';
    render();
    setTimeout(simStep, 30);
  }
  function simStep() {
    const sm = app.sim;
    if (!sm || !sm.running || app.screen !== 'sim') return;
    const t0 = performance.now();
    while (performance.now() - t0 < 45 && sm.done < sm.total) {
      try { const ai = I.AI_LEVELS[sm.level]; sm.recs.push(I.simulateGame(sm.settings, sm.seed0 + sm.done, [ai, ai])); } catch (e) { console.error(e); }
      sm.done++;
    }
    if (sm.done >= sm.total) { sm.running = false; sm.agg = I.aggregate(sm.recs, sm.settings); render(); return; }
    const bar = document.querySelector('#simprog i');
    const txt = $('simtxt');
    if (bar) bar.style.width = (sm.done / sm.total * 100) + '%';
    if (txt) txt.textContent = `${sm.done} / ${sm.total} 試合`;
    setTimeout(simStep, 0);
  }
  function stopSim() {
    const sm = app.sim;
    if (!sm || !sm.running) return;
    sm.running = false;
    sm.agg = sm.recs.length ? I.aggregate(sm.recs, sm.settings) : null;
    render();
  }

  function winBarHTML(a) {
    const parts = [
      { v: a.wins[0], key: 's1', label: '先攻の勝ち' },
      { v: a.draws, key: 's0', label: '引き分け' },
      { v: a.wins[1], key: 's2', label: '後攻の勝ち' },
    ].filter(x => x.v > 0);
    return `<div class="hbar" role="img" aria-label="勝敗の内訳">${parts.map(pt =>
      `<span style="flex:${pt.v} 1 0;background:var(--${pt.key});color:var(--on-${pt.key})" title="${pt.label}：${pt.v}試合（${pct(pt.v / a.n)}）">${pt.v / a.n >= 0.15 ? pct(pt.v / a.n) : ''}</span>`).join('')}</div>`;
  }

  function niceMax(v) {
    if (v <= 4) return 4;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) { const r = m * p; return r % 2 ? r + 1 : r; }
    return v;
  }
  function gridHTML(yMax) {
    return [0, yMax / 2, yMax].map(v => `<div class="gl" style="bottom:${v / yMax * 100}%"><span>${v}</span></div>`).join('');
  }

  function histogramHTML(diffs) {
    const step = 3;
    const bins = new Map();
    let lo = -1, hi = 1;
    for (const d of diffs) { const k = Math.round(d / step); bins.set(k, (bins.get(k) || 0) + 1); lo = Math.min(lo, k); hi = Math.max(hi, k); }
    const yMax = niceMax(Math.max(1, ...bins.values()));
    const nb = hi - lo + 1;
    const every = nb > 24 ? 4 : nb > 12 ? 2 : 1;
    let bars = '', labels = '';
    for (let k = lo; k <= hi; k++) {
      const c = bins.get(k) || 0;
      const key = k > 0 ? 's1' : k < 0 ? 's2' : 's0';
      const range = `${sgn(k * step - 1)}〜${sgn(k * step + 1)}`;
      bars += `<div class="bin">${c ? `<i style="height:${c / yMax * 100}%;background:var(--${key})" title="得点差 ${range}：${c}試合"></i>` : ''}</div>`;
      labels += `<span>${(k - lo) % every === 0 || k === 0 ? (k === 0 ? '0' : sgn(k * step)) : ''}</span>`;
    }
    return `<div class="vchart" role="img" aria-label="得点差の分布"><div class="plot">${gridHTML(yMax)}${bars}</div><div class="xl">${labels}</div></div>`;
  }

  function legalHTML(rows) {
    const yMax = niceMax(Math.max(1, ...rows.map(r => r.avg)));
    let bars = '', labels = '';
    for (let rd = 1; rd <= 4; rd++) {
      const f = rows.find(x => x.round === rd && x.seat === 0), s = rows.find(x => x.round === rd && x.seat === 1);
      bars += `<div class="bin grp"><i style="height:${f.avg / yMax * 100}%;background:var(--s1)" title="R${rd} 先攻：平均 ${f.avg.toFixed(1)}手"></i><i style="height:${s.avg / yMax * 100}%;background:var(--s2)" title="R${rd} 後攻：平均 ${s.avg.toFixed(1)}手"></i></div>`;
      labels += `<span>${I.ROUND_LABEL[rd]}</span>`;
    }
    return `<div class="vchart" role="img" aria-label="ラウンドごとの合法手の数"><div class="plot">${gridHTML(yMax)}${bars}</div><div class="xl">${labels}</div></div>`;
  }

  function renderSim() {
    const sm = app.sim;
    const st = sm.settings;
    const summary = `アイテム：${st.sets.length ? st.sets.map(s => 'セット' + s).join('・') : 'なし'}　コミ：${st.komi}　灰色ルール：${st.gray ? 'オン' : 'オフ'}　CPUの強さ：${I.AI_LABEL[sm.level] || 'ふつう'}`;
    const head = `<div class="sim-head"><h2>シミュレーション</h2>
      ${sm.running ? '<button class="btn" data-do="sim-stop">中止して集計</button>' : '<button class="btn primary" data-do="sim-again">もう一度</button>'}
      <button class="btn" data-do="to-setup">設定に戻る</button></div>
      <p class="muted" style="margin:0 0 10px">${summary}</p>`;
    if (sm.running || !sm.agg) {
      $('scr-sim').innerHTML = head + `<div class="panel"><div class="progress" id="simprog"><i style="width:${sm.done / sm.total * 100}%"></i></div><p class="muted" id="simtxt" style="margin:8px 0 0">${sm.done} / ${sm.total} 試合</p>${!sm.running && !sm.agg ? '<p>集計できる試合がありません。</p>' : ''}</div>`;
      return;
    }
    const a = sm.agg;
    const komiSuggest = Math.round((st.komi + a.avgDiff) * 2) / 2;
    const balanced = Math.abs(a.avgDiff) < 0.5;
    const tiles = `<div class="tiles">
      <div class="panel tile"><span class="lab">先攻の勝率</span><span class="val">${pct(a.wins[0] / a.n)}</span><span class="sub">${a.wins[0]}勝（ドラフト後手）</span></div>
      <div class="panel tile"><span class="lab">後攻の勝率</span><span class="val">${pct(a.wins[1] / a.n)}</span><span class="sub">${a.wins[1]}勝（ドラフト先手）</span></div>
      <div class="panel tile"><span class="lab">平均得点差（先攻−後攻）</span><span class="val">${sgn(a.avgDiff)}</span><span class="sub">先攻 ${a.avgScore[0].toFixed(1)}点・後攻 ${a.avgScore[1].toFixed(1)}点（コミ込み）</span></div>
      <div class="panel tile"><span class="lab">コミの目安</span><span class="val">${balanced ? st.komi : komiSuggest}</span><span class="sub">${balanced ? '今のコミでほぼ釣り合っています' : `平均得点差が0になる値（今は${st.komi}）`}</span></div>
    </div>`;
    const legalTable = `<div class="tbl"><table><thead><tr><th>ラウンド</th><th class="r">先攻の平均</th><th class="r">後攻の平均</th><th class="r">パス率</th></tr></thead><tbody>${[1, 2, 3, 4].map(rd => {
      const f = a.legal.find(x => x.round === rd && x.seat === 0), s = a.legal.find(x => x.round === rd && x.seat === 1);
      return `<tr><td>${I.ROUND_LABEL[rd]}</td><td class="r">${f.avg.toFixed(1)}</td><td class="r">${s.avg.toFixed(1)}</td><td class="r">${pct((f.passRate + s.passRate) / 2)}</td></tr>`;
    }).join('')}</tbody></table></div>`;
    const itemRows = a.items.map(it => {
      const rs = it.rounds;
      const tot = rs.reduce((x, y) => x + y, 0) || 1;
      const dist = rs.map((v, k) => `R${k + 1} ${pct(v / tot)}`).join('・');
      return `<tr><td>${I.ITEM[it.type].name}</td><td class="r">${it.held}</td><td><span class="wr" title="${pct(it.winRate)}"><span class="mid"></span><span class="dot" style="left:${it.winRate * 100}%"></span></span> <span class="num">${pct(it.winRate)}</span></td><td class="r">${pct(it.useRate)}</td><td class="muted">${dist}</td></tr>`;
    }).join('');
    const setRows = a.sets.map(s => {
      const flag = s.diff !== null && Math.abs(s.diff) >= 0.08;
      return `<tr><td>セット${s.id}</td><td>${I.ITEM[s.a].name} ${s.aRate === null ? '—' : pct(s.aRate)}</td><td>${I.ITEM[s.b].name} ${s.bRate === null ? '—' : pct(s.bRate)}</td><td class="r${flag ? ' flag' : ''}">${s.diff === null ? '—' : sgn(s.diff * 100) + 'pt'}</td></tr>`;
    }).join('');
    const stockRows = a.stockout.map(s => `<tr><td><span class="sw p-${s.color}"></span>${C[s.color].name}</td><td class="r">${pct(s.rate)}</td><td class="r">${s.avgRound === null ? '—' : 'R' + s.avgRound.toFixed(1)}</td></tr>`).join('');
    const g = a.gray;
    $('scr-sim').innerHTML = head + tiles + `<div class="simgrid">
      <div class="panel wide2"><h3>勝敗の内訳（${a.n}試合）</h3>
        <div class="legend"><span><i style="background:var(--s1)"></i>先攻の勝ち ${a.wins[0]}</span><span><i style="background:var(--s0)"></i>引き分け ${a.draws}</span><span><i style="background:var(--s2)"></i>後攻の勝ち ${a.wins[1]}</span></div>
        ${winBarHTML(a)}</div>
      <div class="panel"><h3>得点差の分布（先攻−後攻、3点刻み）</h3>
        <div class="legend"><span><i style="background:var(--s1)"></i>先攻が上回った</span><span><i style="background:var(--s0)"></i>ほぼ同点</span><span><i style="background:var(--s2)"></i>後攻が上回った</span></div>
        ${histogramHTML(a.diffs)}</div>
      <div class="panel"><h3>ラウンドごとの合法手の数（平均）</h3>
        <div class="legend"><span><i style="background:var(--s1)"></i>先攻</span><span><i style="background:var(--s2)"></i>後攻</span></div>
        ${legalHTML(a.legal)}${legalTable}</div>
      <div class="panel"><h3>灰色</h3><div class="tiles">
        <div class="tile"><span class="lab">発生した枚数</span><span class="val">${g.total}</span><span class="sub">${a.n}試合中 ${g.games}試合で発生</span></div>
        <div class="tile"><span class="lab">強制（避ける手がなかった）</span><span class="val">${g.forced}</span><span class="sub">選択（ほかの手もあった）${g.chosen}</span></div></div>
        <p class="note">強制が少なければ、灰色を相手に押し付ける展開は起きていません。</p></div>
      <div class="panel"><h3>在庫切れ</h3><div class="tbl"><table><thead><tr><th>色</th><th class="r">切れた試合</th><th class="r">平均ラウンド</th></tr></thead><tbody>${stockRows}</tbody></table></div></div>
      <div class="panel wide2"><h3>アイテム（所持していた側の勝率。中央の線が50%）</h3><div class="tbl"><table><thead><tr><th>アイテム</th><th class="r">所持</th><th>所持側の勝率</th><th class="r">使用率</th><th>使ったラウンド</th></tr></thead><tbody>${itemRows || '<tr><td colspan="5" class="muted">アイテムなし</td></tr>'}</tbody></table></div></div>
      <div class="panel wide2"><h3>セットの対の差（ドラフト後手が残り物を引く不利の大きさ）</h3><div class="tbl"><table><thead><tr><th>セット</th><th>1つ目の勝率</th><th>2つ目の勝率</th><th class="r">差</th></tr></thead><tbody>${setRows || '<tr><td colspan="4" class="muted">アイテムなし</td></tr>'}</tbody></table></div>
        <p class="note">差が8pt以上のセットは赤で示しています。CPUはドラフトをランダムに選び、1手先だけを読んで判断するので、人間同士の対戦とは傾向が違う可能性があります。</p></div>
    </div>`;
  }

  // ------------------------------------------------------------------
  // 描画とイベント
  // ------------------------------------------------------------------
  function render() {
    $('scr-setup').hidden = app.screen !== 'setup';
    $('scr-game').hidden = app.screen !== 'game';
    $('scr-sim').hidden = app.screen !== 'sim';
    if (app.screen === 'setup') renderSetup();
    else if (app.screen === 'game') renderGame();
    else renderSim();
    if (app.screen !== 'game') renderOverlay();
  }

  function leave() {
    if (app.sim) app.sim.running = false;
    app.dialog = null; app.busy = false; app.screen = 'setup'; app.g = null; app.sim = null;
    render();
    window.scrollTo(0, 0);
  }

  document.addEventListener('click', (e) => {
    const t = e.target;
    const pv = t.closest('[data-preview]');
    if (pv) {
      app.preview = pv.dataset.preview;
      renderSetup();
      const el = $('ipreview');
      if (el && window.innerWidth < 900) {
        const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
      }
      return;
    }
    const mode = t.closest('[data-mode]');
    if (mode) { app.setup.mode = mode.dataset.mode; app.setupMsg = ''; saveSetup(); return render(); }
    const seg = t.closest('[data-seg]');
    if (seg) {
      const key = seg.dataset.seg;
      let val = seg.dataset.val;
      if (key === 'gray') val = val === 'true';
      if (key === 'games') val = Number(val);
      app.setup[key] = val; app.setupMsg = ''; saveSetup(); return render();
    }
    const hand = t.closest('[data-hand]');
    if (hand) { const [p, id] = hand.dataset.hand.split(':').map(Number); return onHand(p, id); }
    const well = t.closest('[data-well]');
    if (well) return onWell(Number(well.dataset.well));
    const item = t.closest('[data-item]');
    if (item) return onItem(item.dataset.item);
    const col = t.closest('[data-color]');
    if (col && app.sel.item) { app.sel.item.params.color = col.dataset.color; buildPreview(); return render(); }
    const side = t.closest('[data-side]');
    if (side && app.sel.item) { app.sel.item.params = { side: side.dataset.side }; app.sel.item.step = 1; buildPreview(); return render(); }
    const dr = t.closest('[data-draft]');
    if (dr) { const [sid, type] = dr.dataset.draft.split('|'); app.draft[sid] = type; return renderOverlay(); }
    const cell = t.closest('[data-cell]');
    if (cell) {
      const cardEl = t.closest('[data-card],[data-tent],[data-main]');
      const info = {};
      if (cardEl && cardEl.dataset.card !== undefined) info.cardId = Number(cardEl.dataset.card);
      if (cardEl && cardEl.dataset.tent !== undefined) info.tent = Number(cardEl.dataset.tent);
      if (cardEl && cardEl.dataset.main !== undefined) info.main = true;
      return onBoard(Number(cell.dataset.cell), info);
    }
    const act = t.closest('[data-do]');
    if (!act) return;
    const g = app.g;
    switch (act.dataset.do) {
      case 'reset-setup':
        app.setup = Object.assign({}, DEFAULT_SETUP, { mode: app.setup.mode });
        saveSetup();
        app.setupMsg = 'アイテムセット・コミ・灰色ルール・CPUの強さ・ドラフト順・対戦回数を初期設定に戻しました';
        render();
        break;
      case 'start':
        if (app.setup.mode === 'sim') startSim(); else startGame();
        break;
      case 'commit': commit(); break;
      case 'auto':
        if (app.sel.act) { app.sel.assigns = I.autoAssign(g, curP(), app.sel.act); autoActive(); render(); }
        break;
      case 'clear':
        Object.assign(app.sel, { act: null, opts: [], assigns: [], active: null, need: 0 }); app.msg = ''; render();
        break;
      case 'undo': undoTurn(); break;
      case 'pass': { const r = I.passTurn(g, curP()); if (!r.ok) { app.msg = r.error; render(); } else { app.last = []; proceed(); } break; }
      case 'item-ok': confirmItem(); break;
      case 'item-cancel': app.sel = emptySel(); app.msg = ''; render(); break;
      case 'draft-ok': {
        const picks = I.draftSets(g).map(set => app.draft[set.id]);
        const r = I.applyDraft(g, picks);
        if (r.ok) proceed();
        break;
      }
      case 'draft-random': I.draftSets(g).forEach(set => { app.draft[set.id] = set.items[app.rng() < 0.5 ? 0 : 1]; }); renderOverlay(); break;
      case 'init-ok': {
        const ini = app.init;
        if (!ini || ini.chosen === null) break;
        const p = ini.order[ini.step];
        ini.picks[p] = ini.chosen; ini.chosen = null; ini.step++;
        if (ini.step < 2 && app.humans[ini.order[ini.step]] && ini.picks[ini.order[ini.step]] === null) ini.blind = true;
        proceed();
        break;
      }
      case 'blind-ok': if (app.init) app.init.blind = false; render(); break;
      case 'again': app.dialog = null; startGame(); break;
      case 'to-setup': {
        const inGame = app.screen === 'game' && g && g.phase !== 'end';
        const inSim = app.screen === 'sim' && app.sim && app.sim.running;
        if (inGame || inSim) { app.dialog = 'leave'; renderOverlay(); break; }
        leave();
        break;
      }
      case 'leave-ok': leave(); break;
      case 'rules': app.dialog = 'rules'; renderOverlay(); break;
      case 'show-result': app.dialog = 'result'; renderOverlay(); break;
      case 'close-dialog': app.dialog = null; renderOverlay(); break;
      case 'sim-stop': stopSim(); break;
      case 'sim-again': startSim(); break;
      default: break;
    }
  });
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-hand], [data-side]')) { e.preventDefault(); e.target.click(); }
    if (e.key === 'Escape' && app.dialog) { app.dialog = null; renderOverlay(); }
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.matches('[data-set]')) {
      const id = t.dataset.set;
      const sets = new Set(app.setup.sets);
      if (t.checked) sets.add(id); else sets.delete(id);
      app.setup.sets = I.SETS.map(s => s.id).filter(x => sets.has(x));
      saveSetup();
    }
  });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'komi') {
      const v = Number(e.target.value);
      app.setup.komi = Number.isFinite(v) ? v : 0;
      saveSetup();
    }
  });

  // 開いたまま更新されたときに対戦を引き継ぐ
  function start(data) {
    if (data && data.g) {
      app.screen = 'game';
      app.g = data.g; app.humans = data.humans || [true, false]; app.snap = data.snap || null;
      app.setup = Object.assign({}, DEFAULT_SETUP, data.setup || {});
      proceed();
      return;
    }
    render();
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => (app.screen === 'game' && app.g && !app.busy && app.g.phase === 'play' ? { g: app.g, humans: app.humans, snap: app.snap, setup: app.setup } : {}));
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>

</body></html>
