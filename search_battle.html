<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>サーチバトル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="サイバー空間で敵の構造を透視する位置あてバトル。1vs1と最強CPU戦。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Dela+Gothic+One&family=M+PLUS+1:wght@400;500;700;800&family=Share+Tech+Mono&display=swap">
<style>
:root {
  /* Layout: サイバー空間の司令室。中央に自陣と敵陣のフィールドを横並びにし、
     左右の縦長パネルに防御・攻撃の記録を流す。単一のダークテーマ。 */
  color-scheme: dark;
  --void: #03050B;
  --panel: rgba(9, 15, 31, .8);
  --panel-hi: rgba(18, 30, 58, .85);
  --edge: rgba(96, 196, 255, .2);
  --edge-2: rgba(96, 196, 255, .46);
  --text: #DDE7F6;
  --muted: #8592AB;
  --dim: #4B566E;
  --cyan: #4FE3FF;
  --cyan-2: #18A6D6;
  --magenta: #FF3F8F;
  --hit: #FF7A3D;
  --amber: #FFC14A;
  --orange: #FF9A3C;
  --violet: #B49CFF;
  --good: #59F2A6;
  --bad: #FF5468;
  --ink-on-cyan: #021018;
  --steel-1: #F3F7FC; --steel-2: #A3AEC0; --steel-3: #586377; --steel-4: #232A38;
  --pc0: #C8D2E2; --pc1: #4E9BFF; --pc2: #39E0B4; --pc3: #FFA544; --pc4: #B484FF;
  --pc5: #4FE3FF; --pc6: #FF6FB4; --pc7: #CBE65A; --pc8: #FF7B5C;
  --f-logo: "Dela Gothic One", "M PLUS 1", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
  --f-tech: "Chakra Petch", "M PLUS 1", system-ui, sans-serif;
  --f-body: "M PLUS 1", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
  --f-mono: "Share Tech Mono", "M PLUS 1", ui-monospace, monospace;
}

* { box-sizing: border-box; }
body { background: var(--void); color: var(--text); font-family: var(--f-body); font-size: 14.5px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--void); }
button { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ===== 宇宙空間 ===== */
.space { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
  background:
    radial-gradient(1100px 620px at 50% -12%, rgba(38, 92, 210, .34), transparent 62%),
    radial-gradient(820px 560px at 104% 104%, rgba(255, 63, 143, .13), transparent 60%),
    radial-gradient(700px 520px at -6% 78%, rgba(79, 227, 255, .10), transparent 60%),
    var(--void); }
.space .stars { position: absolute; inset: 0; opacity: .7;
  background-image:
    radial-gradient(1px 1px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 27% 64%, #bfe9ff, transparent),
    radial-gradient(1.5px 1.5px at 44% 12%, #fff, transparent), radial-gradient(1px 1px at 63% 38%, #ffd1e6, transparent),
    radial-gradient(1px 1px at 78% 22%, #fff, transparent), radial-gradient(1.5px 1.5px at 88% 58%, #bfe9ff, transparent),
    radial-gradient(1px 1px at 8% 84%, #fff, transparent), radial-gradient(1px 1px at 52% 88%, #bfe9ff, transparent),
    radial-gradient(1px 1px at 35% 40%, #fff, transparent), radial-gradient(1px 1px at 70% 76%, #fff, transparent);
  animation: twinkle 7s ease-in-out infinite alternate; }
.space .floor { position: absolute; left: -40%; right: -40%; bottom: -8%; height: 46%; transform: perspective(620px) rotateX(74deg); transform-origin: 50% 100%;
  background-image: linear-gradient(rgba(79, 227, 255, .2) 1px, transparent 1px), linear-gradient(90deg, rgba(79, 227, 255, .2) 1px, transparent 1px);
  background-size: 56px 56px; -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 92%); mask-image: linear-gradient(to top, #000 10%, transparent 92%);
  animation: floor 5s linear infinite; opacity: .55; }
@keyframes floor { to { background-position: 0 56px, 0 0; } }
@keyframes twinkle { to { opacity: .35; } }

/* ===== 共通部品 ===== */
.wrap { max-width: 1420px; margin: 0 auto; padding-block: 8px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.note { color: var(--muted); font-size: .82rem; margin: 0; }
.note.warn { color: var(--amber); }
.eyebrow { font-family: var(--f-tech); letter-spacing: .32em; font-size: .72rem; color: var(--cyan); margin: 0; text-transform: uppercase; }
.panel { position: relative; background: var(--panel); border: 1px solid var(--edge); border-radius: 6px; padding: 12px; min-width: 0;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 22px 44px -30px rgba(0, 0, 0, .95); }
.panel::before, .panel::after { content: ""; position: absolute; width: 14px; height: 14px; pointer-events: none; opacity: .85; }
.panel::before { top: -1px; left: -1px; border-top: 2px solid var(--pcorner, var(--cyan)); border-left: 2px solid var(--pcorner, var(--cyan)); border-top-left-radius: 6px; }
.panel::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--pcorner, var(--cyan)); border-right: 2px solid var(--pcorner, var(--cyan)); border-bottom-right-radius: 6px; }
.panel.enemy { --pcorner: var(--magenta); }
.panel.own.active { border-color: rgba(79, 227, 255, .7); box-shadow: 0 0 0 1px rgba(79, 227, 255, .3), 0 0 32px -6px rgba(79, 227, 255, .5); }
.panel.enemy.active { border-color: rgba(255, 63, 143, .7); box-shadow: 0 0 0 1px rgba(255, 63, 143, .3), 0 0 32px -6px rgba(255, 63, 143, .5); }
.panel.enemy.active.treasure-active { --pcorner: #D4AF37; border-color: rgba(212, 175, 55, .85); box-shadow: 0 0 0 1px rgba(212, 175, 55, .4), 0 0 36px -6px rgba(212, 175, 55, .6); }
.panel.enemy.treasure-active .fhead b { color: #D4AF37; text-shadow: 0 0 10px rgba(212, 175, 55, .5); }
.ptitle { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 8px; font-size: .86rem; font-weight: 700; }
.ptitle small { font-family: var(--f-tech); font-size: .64rem; letter-spacing: .24em; color: var(--muted); font-weight: 500; }
.logcol .ptitle { flex-direction: column; align-items: flex-start; gap: 2px; }
.logcol .ptitle small { order: -1; font-size: .58rem; }

.btn { appearance: none; position: relative; border: 1px solid var(--edge-2); background: rgba(79, 227, 255, .07); color: var(--text); font: 700 .86rem/1.2 var(--f-body);
  padding: .6em 1.1em; cursor: pointer; touch-action: manipulation; transition: background .15s, box-shadow .15s, transform .08s;
  clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px); }
.btn:hover { background: rgba(79, 227, 255, .17); box-shadow: inset 0 0 14px rgba(79, 227, 255, .28); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(180deg, #7BEDFF, #17A4D4); color: var(--ink-on-cyan); border-color: transparent; }
.btn.primary:hover { background: linear-gradient(180deg, #A5F4FF, #2BB9E6); box-shadow: 0 0 18px rgba(79, 227, 255, .55); }
.btn.fire { background: linear-gradient(180deg, #FF77AE, #D81F69); color: #fff; border-color: transparent; }
/* バズーカの宣言ボタン（アイテムとは別枠） */
.btn.big { font-size: 1.02rem; padding: .78em 1.7em; letter-spacing: .04em; }
.btn.ghost { background: transparent; border-color: var(--edge); font-weight: 500; }
.btn:disabled { opacity: .38; cursor: not-allowed; box-shadow: none; }
.btn:focus-visible, .ichip:focus-visible, .shape-btn:focus-visible, .item-card:focus-visible, .seg input:focus-visible + label { outline: none; box-shadow: inset 0 0 0 2px var(--amber), 0 0 0 2px var(--amber); }

/* ロゴ */
.logo { font-family: var(--f-logo); line-height: 1; letter-spacing: .02em;
  background: linear-gradient(180deg, #FFFFFF 0%, #DCE6F3 40%, #7C8AA2 52%, #EAF2FC 70%, #A9B6CA 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 14px rgba(79, 227, 255, .35)); }
.logo-sub { font-family: var(--f-tech); letter-spacing: .5em; color: var(--cyan); font-size: .7rem; margin-top: 4px; }

/* ===== HUD ===== */
.hud { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; padding-block: 8px 10px; }
.hud .logo { font-size: 1.32rem; }
.hud-mid { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
/* サウンド切り替え */
.sndbtn { display: inline-flex; align-items: center; gap: 6px; }
.sndbtn svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.sndbtn svg .spk { fill: currentColor; fill-opacity: .18; }
.sndbtn span { font: 700 .72rem/1 var(--f-tech); letter-spacing: .08em; }
.sndbtn.all { color: var(--cyan); }
.sndbtn.off { color: var(--muted); }
@media (max-width: 560px) { .sndbtn span { display: none; } }
.stat { font: 600 .7rem/1.25 var(--f-tech); letter-spacing: .14em; color: var(--muted); padding: .38em .75em; border: 1px solid var(--edge); background: rgba(79, 227, 255, .05); white-space: nowrap; }
.stat b { color: var(--cyan); font-size: .92rem; letter-spacing: .04em; margin-left: .3em; }
.stat.hot { border-color: rgba(255, 63, 143, .6); color: var(--magenta); }
.stat.hot b { color: var(--magenta); }
.stat.me b { color: var(--good); }
.phase { margin: 0 0 12px; display: flex; align-items: center; gap: 10px; font-size: 1.02rem; font-weight: 700; }
.phase::before { content: ""; width: 8px; height: 8px; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); transform: rotate(45deg); flex: none; }
.phase.wait::before { background: var(--magenta); box-shadow: 0 0 10px var(--magenta); animation: blink 1s infinite; }
/* スマホでは「いまやること」が1行・2行と変わっても盤面が動かないよう、2行ぶん確保する */
@media (max-width: 719px) { .phase { min-height: 3.1em; } }
@keyframes blink { 50% { opacity: .25; } }

/* ===== 対戦レイアウト ===== */
.arena { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.center { display: grid; gap: 12px; min-width: 0; }
.logs { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 680px) { .logs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.logcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.itemlog .loglist { max-height: 170px; }
.calllog .loglist { max-height: 300px; }
@media (min-width: 1180px) {
  .arena { grid-template-columns: 250px minmax(0, 1fr) 250px; }
  .logs { display: contents; }
  .col-def { grid-column: 1; grid-row: 1; }
  .center { grid-column: 2; grid-row: 1; }
  .col-atk { grid-column: 3; grid-row: 1; }
  .logcol { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px); height: calc(100vh - 24px - env(safe-area-inset-top, 0px)); max-height: 880px; }
  .itemlog { flex: 0 0 auto; }
  .itemlog .loglist { max-height: 26vh; }
  .calllog { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .calllog .loglist { max-height: none; flex: 1 1 auto; min-height: 0; }
}
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 460px) { .fields { gap: 8px; } .fields .panel { padding: 8px 6px; } }
.fhead { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; margin-bottom: 8px; }
.fhead b { font-size: .86rem; }
.fhead small { font-family: var(--f-tech); letter-spacing: .22em; font-size: .62rem; color: var(--cyan); }
.panel.enemy .fhead small { color: var(--magenta); }
.fname { color: var(--muted); font-size: .76rem; }
@media (max-width: 520px) { .fhead small { display: none; } }

/* ===== アイテムチップ（フィールド上部：左＝攻撃、右＝防御） ===== */
.chiprow { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px 12px; margin-bottom: 10px; }
.chipgrp { display: grid; gap: 4px; min-width: 0; }
.chipgrp.atk { flex: 1 1 auto; justify-items: start; }
.chipgrp.def { flex: none; justify-items: end; }
.chipgrp .cap { font: 600 .6rem/1 var(--f-tech); letter-spacing: .12em; color: var(--muted); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 7px 5px; }
.chipgrp.def .chips { justify-content: flex-end; }
.ichip { --ic: var(--cyan); position: relative; flex: none; width: 31px; height: 31px; display: grid; place-items: center; padding: 0; color: var(--ic); cursor: default;
  border: 1px solid color-mix(in srgb, var(--ic) 48%, transparent); border-radius: 6px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--ic) 16%, transparent), color-mix(in srgb, var(--ic) 4%, transparent)); transition: transform .12s, box-shadow .12s, background .12s; }
.chips.enemy .ichip { --ic: var(--magenta); }
.ichip svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ichip svg .f { fill: currentColor; stroke: none; }
.ichip .bd { position: absolute; right: -5px; bottom: -6px; min-width: 15px; font: 700 .56rem/1.35 var(--f-tech); text-align: center; color: var(--ic);
  background: var(--void); border: 1px solid color-mix(in srgb, var(--ic) 60%, transparent); border-radius: 4px; padding: 0 3px; }
.ichip.usable { cursor: pointer; box-shadow: 0 0 10px color-mix(in srgb, var(--ic) 40%, transparent); }
.ichip.usable:hover { transform: translateY(-2px); box-shadow: 0 0 16px color-mix(in srgb, var(--ic) 75%, transparent); }
.ichip.active { background: var(--ic); color: var(--ink-on-cyan); box-shadow: 0 0 16px var(--ic); }
/* 使用済み：自分・相手どちらのアイテムもグレーにする */
.ichip.spent, .chips.enemy .ichip.spent { --ic: var(--dim); background: none; box-shadow: none; }
.ichip.spent svg { opacity: .8; }
.ichip.spent::after { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; height: 1.5px; background: var(--dim); transform: rotate(-35deg); }
.ichip.rebuy, .chips.enemy .ichip.rebuy { --ic: var(--amber); }
.itemhead .ichip { width: 36px; height: 36px; }
@media (max-width: 520px) { .ichip { width: 27px; height: 27px; } .ichip svg { width: 16px; height: 16px; } .chips { gap: 6px 4px; } .chiprow { gap: 6px; } }
/* ツールチップ（本文の外、最前面） */
.tipbox { position: fixed; left: 0; top: 0; z-index: 95; max-width: 250px; padding: 7px 9px; font: 500 .76rem/1.5 var(--f-body); color: var(--text);
  background: #0B1328; border: 1px solid var(--edge-2); border-radius: 4px; box-shadow: 0 12px 26px -10px rgba(0, 0, 0, .95), 0 0 14px rgba(79, 227, 255, .18);
  pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; }
.tipbox.show { opacity: 1; transform: none; }
/* フィールド上の調査記録 */
.intel { display: flex; flex-wrap: wrap; gap: 5px; margin: -2px 0 8px; }
.itag { --tc: var(--cyan); display: inline-flex; align-items: center; gap: 4px; font: 600 .7rem/1 var(--f-tech); padding: 4px 7px 4px 5px; color: var(--tc);
  border: 1px solid color-mix(in srgb, var(--tc) 50%, transparent); background: color-mix(in srgb, var(--tc) 9%, transparent); border-radius: 3px; white-space: nowrap; }
.intel.enemy .itag { --tc: var(--magenta); }
.itag svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.itag svg .f { fill: currentColor; stroke: none; }
.itag b { color: var(--text); font-size: .8rem; margin-left: 2px; }
.itag small { color: var(--muted); font-size: .58rem; margin-left: 3px; }
.itag.stale { opacity: .45; }
.itag em.sl { font-style: normal; color: var(--muted); margin: 0 1px 0 3px; font-size: .72rem; }
.itag b.apx { opacity: .5; }
/* スマホ幅では、タグの「残り」と調べたターンを省く（ツールチップには出る）。サーチラインの「2キューブ / 3ブロック」が盤の幅に収まるように */
@media (max-width: 560px) { .itag i, .itag small { display: none; } .itag { gap: 3px; padding: 3px 6px 3px 4px; } .itag em.sl { margin: 0 1px; } .intel .itag { max-width: 100%; } }
/* ===== フィールド ===== */
.board { --fc: var(--cyan); display: grid; grid-template-columns: 1.15em minmax(0, 1fr); grid-template-rows: 1.35em auto; max-width: 470px; margin-inline: auto; }
.board[data-board="pred"], .board.enemy { --fc: var(--magenta); }
.board.large { max-width: 520px; }
.ax { font-family: var(--f-mono); font-size: .76rem; color: color-mix(in srgb, var(--fc) 70%, var(--muted)); display: grid; }
.ax span { display: flex; align-items: center; justify-content: center; gap: 3px; min-width: 0; }
.ax-r span { flex-direction: column; gap: 2px; }
.axbtn { appearance: none; display: grid; place-items: center; width: 100%; height: 100%; min-height: 1.2em; padding: 0; cursor: pointer; color: var(--cyan); font: 700 .8rem/1 var(--f-mono);
  background: rgba(79, 227, 255, .1); border: 1px solid rgba(79, 227, 255, .55); border-radius: 3px; box-shadow: 0 0 10px rgba(79, 227, 255, .35); animation: blink 1.4s infinite; }
.axbtn:hover, .axbtn:focus-visible { background: var(--cyan); color: var(--ink-on-cyan); animation: none; outline: none; }
.board.picking .ax-c { gap: 3px; padding-inline: 2px; }
.board.picking .ax-r { gap: 3px; padding-block: 2px; }
.cell.line-hl { background-color: rgba(79, 227, 255, .24) !important; box-shadow: inset 0 0 0 1px var(--cyan), inset 0 0 14px rgba(79, 227, 255, .45); }
.ax-c { grid-column: 2; grid-row: 1; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
.ax-r { grid-column: 1; grid-row: 2; grid-template-rows: repeat(var(--n), minmax(0, 1fr)); }
.cells { position: relative; grid-column: 2; grid-row: 2; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); grid-template-rows: repeat(var(--n), minmax(0, 1fr));
  aspect-ratio: 1; max-width: 100%; border: 1px solid color-mix(in srgb, var(--fc) 60%, transparent); border-radius: 3px;
  background:
    radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--fc) 11%, transparent), transparent 72%),
    linear-gradient(180deg, #071226, #04080F);
  box-shadow: 0 0 26px color-mix(in srgb, var(--fc) 20%, transparent), inset 0 0 26px color-mix(in srgb, var(--fc) 9%, transparent); }
.cells::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
  background: repeating-linear-gradient(180deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 3px); }
.cell { position: relative; min-width: 0; border-right: 1px solid color-mix(in srgb, var(--fc) 17%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--fc) 17%, transparent); container-type: size; }
.cell.lc { border-right: 0; }
.cell.lr { border-bottom: 0; }
.cell.click { cursor: pointer; }
.cell.click:hover { background-color: color-mix(in srgb, var(--fc) 22%, transparent); box-shadow: inset 0 0 0 1px var(--fc), inset 0 0 14px color-mix(in srgb, var(--fc) 40%, transparent); }
.cell.sel { background-color: color-mix(in srgb, var(--amber) 30%, transparent); box-shadow: inset 0 0 0 2px var(--amber); }
.panel.enemy.treasure-active .cell.click { box-shadow: inset 0 0 0 1.5px rgba(212, 175, 55, .7), 0 0 8px rgba(212, 175, 55, .3); }
.panel.enemy.treasure-active .cell.click:hover { background-color: rgba(212, 175, 55, .28); box-shadow: inset 0 0 0 2px #D4AF37, 0 0 18px rgba(212, 175, 55, .8); }
.panel.enemy.answer-mode .cells { touch-action: none; }
/* 配置画面：空きブロックをなぞって形を描く。なぞったブロックを光らせ、スマホでは画面がスクロールしないように */
.panel.su-draw .cells { touch-action: none; }
.panel.su-board .cell.sel { background-color: color-mix(in srgb, var(--cyan) 30%, transparent); box-shadow: inset 0 0 0 2px var(--cyan), 0 0 10px rgba(79, 227, 255, .45); }

/* メタリックなキューブ */
.cell.pc { background:
    linear-gradient(115deg, transparent 38%, rgba(255, 255, 255, .34) 48%, transparent 58%) 0 0 / 300% 300%,
    linear-gradient(145deg, rgba(255, 255, 255, .62) 0%, rgba(255, 255, 255, .08) 32%, rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, .3) 100%),
    linear-gradient(160deg, color-mix(in srgb, var(--pcc) 40%, var(--steel-1)) 0%, color-mix(in srgb, var(--pcc) 58%, var(--steel-3)) 68%, color-mix(in srgb, var(--pcc) 38%, var(--steel-4)) 100%);
  box-shadow: inset 2px 2px 0 rgba(255, 255, 255, .55), inset -2px -2px 0 rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(0, 0, 0, .35);
  animation: sheen 7s linear infinite; }
@keyframes sheen { 0% { background-position: 120% 0, 0 0, 0 0; } 60%, 100% { background-position: -40% 0, 0 0, 0 0; } }
.cell.pc::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1; border: 0 solid var(--pcc); filter: drop-shadow(0 0 4px var(--pcc)); }
.cell.pc.et::before { border-top-width: 2px; }
.cell.pc.eb::before { border-bottom-width: 2px; }
.cell.pc.el::before { border-left-width: 2px; }
.cell.pc.er::before { border-right-width: 2px; }
.cell.pc.addpc::before { border-style: dashed; }
/* バズーカで分解された1ブロックのキューブ：元のキューブの色のまま、ひびを入れる */
.cell.pc.frag { background-image: linear-gradient(118deg, transparent 46%, rgba(10, 14, 24, .55) 47%, transparent 49%), linear-gradient(28deg, transparent 60%, rgba(10, 14, 24, .45) 61%, transparent 63%),
    linear-gradient(160deg, color-mix(in srgb, var(--pcc) 40%, var(--steel-1)) 0%, color-mix(in srgb, var(--pcc) 58%, var(--steel-3)) 68%, color-mix(in srgb, var(--pcc) 38%, var(--steel-4)) 100%); }
.cell.pc.frag::before { border-style: dashed; }
.cell.pc.hitc { box-shadow: inset 2px 2px 0 rgba(255, 255, 255, .4), inset -2px -2px 0 rgba(0, 0, 0, .5), inset 0 0 18px rgba(255, 63, 143, .55); }
.cell.pc.dead { animation: none; filter: saturate(.25) brightness(.55);
  background:
    linear-gradient(32deg, transparent 47%, rgba(255, 84, 104, .9) 48%, transparent 50%),
    linear-gradient(-58deg, transparent 58%, rgba(255, 84, 104, .7) 59%, transparent 61%),
    linear-gradient(160deg, var(--steel-3), var(--steel-4)); }
.cell.pc.dead::before { border-color: var(--bad); filter: none; }
.cell.pc.revealed { --pcc: var(--magenta); animation: none;
  background: repeating-linear-gradient(135deg, rgba(255, 63, 143, .28) 0 1px, transparent 1px 6px), linear-gradient(160deg, rgba(255, 63, 143, .16), rgba(20, 6, 18, .7)); box-shadow: inset 0 0 14px rgba(255, 63, 143, .35); }
/* バズーカで砕いたブロック */
.cell.pc.revealed.bz { --pcc: var(--amber); background: repeating-linear-gradient(45deg, rgba(255, 193, 74, .32) 0 1px, transparent 1px 6px), linear-gradient(160deg, rgba(255, 193, 74, .14), rgba(20, 14, 6, .7)); box-shadow: inset 0 0 14px rgba(255, 193, 74, .3); }
.cell.ghost { background: color-mix(in srgb, var(--pcc) 16%, transparent); }
.cell.ghost::before { content: ""; position: absolute; inset: 0; border: 0 dashed var(--pcc); }
.cell.ghost.et::before { border-top-width: 2px; } .cell.ghost.eb::before { border-bottom-width: 2px; }
.cell.ghost.el::before { border-left-width: 2px; } .cell.ghost.er::before { border-right-width: 2px; }

/* ===== キューブの柄（ui.js の patHTML） =====
   色の見え方に特性があってもキューブを見分けられるよう、色ごとに違う素材の質感（石・木・金属）を、キューブに薄く重ねる。
   形の柄（図形）は使わない。白と黒の半透明だけで描くので、下のキューブの色がそのまま透ける。
   ・割り当て：1 御影石／2 コンクリート／3 トラバーチン／4 ヘアライン／5 大理石／6 木目／7 スレート／8 テラゾー。
     色覚の特性で近く見える色の組（1と4・2と5・3と7・6と8・2と6 など）は、「粒・穴」と「筋」のように系統の違う質感にした
   ・細かい質感（1・2・4・8）は決まった大きさの区画を並べる（--pmsz・--pmt）。ブロックが小さくても粒が潰れない。
     ブロックごとに見える位置をずらす（--ox・--oy は 0〜1。patHTML がブロックの番号から決める）
   ・大きな模様（3・5・6・7）は1ブロックに1枚。ブロックごとに反転・回転する（v1〜v3）
   ・絵は tools/tile_patterns.py で作り、下の印のあいだに書き込む（形や濃さを変えるときは、そちらを直して実行する） */
.cell .pm { position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background-image: var(--pm); background-repeat: repeat; background-size: var(--pmsz);
  background-position: calc(var(--ox, 0) * var(--pmt) * -1) calc(var(--oy, 0) * var(--pmt) * -1); }
.cell .pm.v1 { transform: scaleX(-1); } .cell .pm.v2 { transform: scaleY(-1); } .cell .pm.v3 { transform: rotate(180deg); }
/* スレートは層の斜めの向きを保つ（左右だけ・上下だけの反転はしない） */
.cell .pm.pm7.v1 { transform: none; } .cell .pm.pm7.v2 { transform: rotate(180deg); }
.cell.pc.dead .pm { opacity: .55; }
/* 答え合わせの相手のキューブ（半透明）：明るい所だけを光らせる */
.cell.ghost .pm { opacity: .75; mix-blend-mode: screen; }

/* tile-patterns:end */
.cell.pickable { cursor: pointer; }
.cell.pickable:hover { filter: brightness(1.2); box-shadow: inset 0 0 0 3px var(--amber), 0 0 14px var(--amber); z-index: 2; }
.cell.picked { box-shadow: inset 0 0 0 3px var(--amber); }
.cell.pv-ok { background: color-mix(in srgb, var(--cyan) 30%, transparent) !important; box-shadow: inset 0 0 0 2px var(--cyan), inset 0 0 16px var(--cyan) !important; }
.cell.pv-bad { background: color-mix(in srgb, var(--bad) 26%, transparent) !important; box-shadow: inset 0 0 0 2px var(--bad) !important; }

/* 調査の記録（セル） */
/* ブロックのタグ（L3・#3・C2 など）：ノードショットのひし形と同じ大きさ・同じ見た目でそろえる。
   ひし形と同じく、記号の色の細い枠線と淡い光を付ける。背景は半透明（下のキューブの質感が透けて見えるように）。
   大きさは、ひし形の見えている大きさに合わせて一回り小さく（下の --tag-box）、文字の左右の余白も細くする。
   枠の太さはひし形の線と同じ割合（大きさの6%：24pxで約1.4px）。
   1文字は正方形、2文字は高さだけ正方形と同じにして、横幅は文字に合わせて伸ばす */
.ctag { --tc: var(--cyan); position: absolute; left: var(--tag-msq); top: var(--tag-msq); z-index: 3; height: var(--tag-box); min-width: var(--tag-box); box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; padding: 0 clamp(1px, 3cqw, 2px); font: 700 clamp(.4rem, 16cqw, .6rem)/1 var(--f-tech); letter-spacing: -0.01em; color: var(--tc);
  background: rgba(3, 5, 11, .55); border: calc(var(--tag-sz) * .06) solid var(--tc); border-radius: 3px; box-shadow: 0 0 3px color-mix(in srgb, var(--tc) 60%, transparent); text-shadow: 0 0 5px color-mix(in srgb, var(--tc) 70%, transparent); white-space: nowrap; max-width: 90%; pointer-events: none; }
/* 文字を上下のまん中に置く。ふつうは行の高さ（文字の上の余白・下の余白を含む）でまん中に置くため、
   小さい枠では、フォントの余白の偏りで文字が少し上に寄って見える。
   text-box で文字の箱を「大文字の上端〜文字の下の線（ベースライン）」まで切り詰め、見えている文字そのものをまん中に置く。
   （対応していないブラウザでは、これまでどおりの置き方になるだけ） */
.ctag > i, .tl > i { display: block; font-style: normal; text-box: trim-both cap alphabetic; }
.board[data-board="own"] .ctag { --tc: var(--magenta); }
.ctag.stale { opacity: .45; }
/* ブロックに付く記号（タグ・H/N/X・ひし形）の共通サイズ。ブロックの幅に合わせて 16〜24px */
.cell { --tag-sz: clamp(16px, 30cqw, 24px);
  /* 四角い記号の大きさ：ひし形の見えている大きさ（枠の約73%）にそろえて、枠の78%にする（24pxの枠で約19px） */
  --tag-box: calc(var(--tag-sz) * .78);
  /* 四角い記号を、ひし形と同じ枠の中央に置くためのずらし幅（左右・上下とも、ひし形と中心の列・行がそろう） */
  --tag-in: calc((var(--tag-sz) - var(--tag-box)) / 2);
  /* ブロックの縁から四角い記号までのすき間：前（4%＋ずらし幅）の半分にして、記号をブロックの角へ寄せる（真ん中のマークの周りを広く）。
     ひし形の枠は、四角い記号と中心の列・行がそろうよう、ずらし幅の分だけ外側に置く */
  --tag-msq: calc(2% + var(--tag-in) / 2);
  --tag-mbx: calc(2% - var(--tag-in) / 2); }
.pairs { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; overflow: visible; }
.pairs g { --pl: var(--cyan); }
.board[data-board="own"] .pairs g { --pl: var(--magenta); }
.pairs line { stroke: var(--pl); stroke-width: .05; stroke-linecap: round; filter: drop-shadow(0 0 2px var(--pl)); }
.pairs .diff line { stroke-dasharray: .12 .1; }
.pairs circle { fill: #04070F; stroke: var(--pl); stroke-width: .035; }
.pairs .sym { fill: none; stroke: var(--pl); stroke-width: .03; stroke-linecap: round; }
.pairs .stale { opacity: .4; }
.cube-menu { position: absolute; inset: 7%; z-index: 7; display: grid; align-content: center; gap: 6px; padding: 8px; background: rgba(4, 10, 22, .9);
  border: 1px solid var(--cyan); border-radius: 4px; box-shadow: 0 0 26px rgba(79, 227, 255, .4), inset 0 0 18px rgba(79, 227, 255, .2); animation: menuIn .25s ease-out; }
@keyframes menuIn { from { opacity: 0; transform: scale(.94); } }
.cube-menu p { margin: 0; font: 600 .6rem/1.2 var(--f-tech); letter-spacing: .12em; color: var(--cyan); text-align: center; }
.cm-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
.cm-grid.sizes { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.cm-close { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; background: rgba(14, 28, 48, .85); border: 1px solid rgba(79, 227, 255, .4); border-radius: 4px; color: var(--cyan); font: 700 .85rem/1 var(--f-tech); cursor: pointer; transition: all .15s; z-index: 8; }
.cm-close:hover, .cm-close:focus-visible { background: rgba(79, 227, 255, .25); border-color: var(--cyan); color: #fff; box-shadow: 0 0 8px rgba(79, 227, 255, .6); outline: none; }
.cm-btn { appearance: none; display: grid; place-items: center; gap: 3px; min-width: 0; padding: 6px 2px; cursor: pointer; color: var(--text); font: 700 clamp(.56rem, 1.6vw, .74rem)/1.1 var(--f-body);
  background: rgba(79, 227, 255, .08); border: 1px solid var(--edge-2); border-radius: 3px; }
.cm-btn b { font: 700 clamp(.8rem, 2.4vw, 1.1rem)/1 var(--f-tech); color: var(--cyan); }
.cm-btn span { white-space: nowrap; }
.cm-btn:hover, .cm-btn:focus-visible { background: rgba(79, 227, 255, .24); box-shadow: 0 0 12px rgba(79, 227, 255, .5); outline: none; }
.cm-btn .mini { max-width: 30px; height: auto; }
/* 形のボタンは、図の高さが形ごとに違う（L型は3段、キューブは2段）ため、段ごとに高さがずれていた。
   行の高さをそろえ、図を置く場所も3段分の高さ（30px）に固定して、文字の位置も横一列にそろえる */
.cm-grid.shapes { grid-auto-rows: 1fr; }
.cm-grid.shapes .cm-btn { grid-template-rows: 30px auto; }
.cm-btn .mini rect { fill: url(#g-metal); stroke: rgba(0, 0, 0, .5); stroke-width: .6; }

/* 記号 */
.mkw { position: absolute; inset: 9%; display: grid; place-items: center; pointer-events: none; z-index: 2; }
.mk { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; overflow: visible; }
/* マークの影：自分フィールドのキューブ（とくにミント・シアンなど明るい色）の上でもマークが溶けないように、
   少し下へ落とす薄い影を付ける。そのあとに各マークの色の光を重ねる（暗い相手フィールドでは影は見えず、見た目は変わらない） */
/* 変数は :root に置く（ブロックの外の凡例 .lg でも使うため。未定義だと filter ごと無効になり、光も消える） */
:root { --mk-shadow: drop-shadow(0 1px 1.5px rgba(0, 0, 0, .9)); }
.ink-oo { color: var(--magenta); filter: var(--mk-shadow) drop-shadow(0 0 4px var(--magenta)); }
.ink-o { color: var(--hit); filter: var(--mk-shadow) drop-shadow(0 0 4px var(--hit)); }
.ink-o .dot { fill: currentColor; stroke: none; }
/* Stealth hit（v13）：◎か○かを伏せたヒット。ミディアムターコイズ */
.ink-q { color: #48D1CC; filter: var(--mk-shadow) drop-shadow(0 0 4px #48D1CC); }
.ink-q .dot { fill: currentColor; stroke: none; }
/* ワープレティクル（v15 のワープで使う予定）：ラズベリー（ユーザーの指定）。ほかのヒットの印と同じく、下へ落とす影と同じ色の光を重ねる */
.ink-wp { color: #B24962; filter: var(--mk-shadow) drop-shadow(0 0 4px #B24962); }
/* 中央の×：小さな印なので、ほかの線（3）より細くする（同じ太さだと×がつぶれて点に見える） */
.ink-wp .wx { stroke-width: 2; }
.ink-x { color: var(--steel-2); opacity: .82; filter: var(--mk-shadow); }
.ink-x .mk { stroke-width: 2.4; }
/* 再コールできる×は、線はそのままで薄く */
.ink-x.stale { opacity: .3; }
/* バズーカで公開された×（色だけ少し変える） */
/* ワープで空いたブロック（移動前の位置） */
.wtag { position: absolute; right: 6%; bottom: 4%; z-index: 2; font: 700 clamp(.46rem, 20cqw, .66rem)/1 var(--f-tech); color: var(--violet); text-shadow: 0 0 6px var(--violet); }
/* ディスタンスショットの結果：○の上は丸、まだヒットしていないブロックは角丸の枠、NoData は文字 */
.mk .ordn { fill: currentColor; stroke: none; font: 700 17px var(--f-tech); text-anchor: middle; dominant-baseline: central; }
/* ノードショットの答え：ひし形の数字。ヒットしたブロックでは左下の小さな札 */
.ink-n { color: var(--cyan); filter: var(--mk-shadow) drop-shadow(0 0 4px var(--cyan)); }
.board[data-board="own"] .ink-n { color: var(--magenta); filter: var(--mk-shadow) drop-shadow(0 0 4px var(--magenta)); }
.ink-n .mk path { stroke-width: 2.2; }
.nbadge { --tc: var(--cyan); position: absolute; left: var(--tag-mbx); bottom: var(--tag-mbx); z-index: 3; width: var(--tag-sz); height: var(--tag-sz); display: grid; place-items: center;
  color: var(--tc); pointer-events: none; filter: drop-shadow(0 0 3px color-mix(in srgb, var(--tc) 60%, transparent)); }
.board[data-board="own"] .nbadge { --tc: var(--magenta); }
.nbadge.stale { opacity: .45; }
.nbadge .mk { width: 100%; height: 100%; overflow: visible; }
.nbadge .mk path { fill: rgba(3, 5, 11, .85); stroke: var(--tc); stroke-width: 2.4; }
.nbadge .mk .ordn { fill: var(--tc); stroke: none; font: 700 17px var(--f-tech); text-anchor: middle; dominant-baseline: central; }
.nodata { color: var(--steel-2); }
.nodata b { font: 700 clamp(.4rem, 17cqw, .66rem)/1 var(--f-tech); letter-spacing: .02em; white-space: nowrap; }
.mkw.ink-n.stale, .mkw.nodata.stale { opacity: .45; }
/* ステルス中の自分のキューブ（相手のフィールドには出ない） */
.cell.pc.stealth { filter: saturate(.55) brightness(1.08); box-shadow: inset 0 0 0 1px rgba(79, 227, 255, .45), inset 0 0 18px rgba(79, 227, 255, .45); }
.stl { position: absolute; right: 5%; bottom: 5%; z-index: 3; width: 32%; height: 32%; color: var(--cyan); filter: drop-shadow(0 0 4px var(--cyan)); pointer-events: none; }
.stl svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
/* ワープ（v15）：ワープを待っているキューブのトリガーブロックの印（ワープのアイコン）と、移動先（薄いキューブの形・自分のフィールドの色） */
.wtr { position: absolute; right: 5%; bottom: 5%; z-index: 3; width: 32%; height: 32%; color: var(--cyan); filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, .9)) drop-shadow(0 0 4px var(--cyan)); pointer-events: none; }
.wtr svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
/* ワープ後のトリガー（移動先の中で、トリガーで発動したときにワープレティクルが出るブロック）：トリガーと同じ印を、少し薄く */
.wtr.wtr-dest, .wtr.wtr-pv { opacity: .8; }
.cell.wtsel { box-shadow: inset 0 0 0 2px var(--cyan), inset 0 0 16px rgba(79, 227, 255, .55); }
.cell.wdest { background: repeating-linear-gradient(135deg, rgba(79, 227, 255, .13) 0 2px, transparent 2px 7px), rgba(79, 227, 255, .08); }
.cell.wdest::before { content: ""; position: absolute; inset: 0; pointer-events: none; border: 0 dashed rgba(79, 227, 255, .75); }
.cell.wdest.et::before { border-top-width: 2px; } .cell.wdest.eb::before { border-bottom-width: 2px; }
.cell.wdest.el::before { border-left-width: 2px; } .cell.wdest.er::before { border-right-width: 2px; }
/* 選んでいる途中の移動先（まだ決めていない）は少し明るく */
.cell.wdest.wset { background: repeating-linear-gradient(135deg, rgba(79, 227, 255, .22) 0 2px, transparent 2px 7px), rgba(79, 227, 255, .14); }
.cell.wdest.wset::before { border-color: var(--cyan); }
/* ワープの発動：レティクルが現れる光（ラズベリー） */
.fxo.wlock { display: grid; place-items: center; animation: wlock .9s ease-out forwards; }
.fxo.wlock svg { width: 82%; height: 82%; fill: none; stroke: #B24962; stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 6px #B24962); overflow: visible; }
.fxo.wlock svg .wx { stroke-width: 2; }

.fxb.cloakfield { background: repeating-linear-gradient(90deg, transparent 0 6px, rgba(255, 63, 143, .2) 6px 7px); animation: flash 1.2s ease-out forwards; }

/* トレジャーの記録（H・N・X）：上のタグと同じ正方形・同じ枠線。--tc に記号の色を入れて、枠・光・文字をその色にする */
.tl { --tc: #C6CFDC; position: absolute; top: var(--tag-msq); right: var(--tag-msq); z-index: 3; width: var(--tag-box); height: var(--tag-box); display: grid; place-items: center; padding: 0; box-sizing: border-box; font: 700 clamp(.46rem, 19cqw, .7rem)/1 var(--f-tech); color: var(--tc); border-radius: 3px;
  background: rgba(3, 5, 11, .55); border: calc(var(--tag-sz) * .06) solid var(--tc); box-shadow: 0 0 3px color-mix(in srgb, var(--tc) 60%, transparent); pointer-events: none; }
.tl-H { --tc: var(--amber); text-shadow: 0 0 6px var(--amber); }
.tl-N { --tc: var(--cyan); text-shadow: 0 0 6px var(--cyan); }
.tl-X { --tc: #C6CFDC; }
.tl.gray { opacity: .3; text-decoration: line-through; text-shadow: none; }
.cell.last::after { content: ""; position: absolute; inset: 3px; z-index: 2; pointer-events: none;
  background:
    linear-gradient(var(--amber), var(--amber)) top left / 8px 2px no-repeat, linear-gradient(var(--amber), var(--amber)) top left / 2px 8px no-repeat,
    linear-gradient(var(--amber), var(--amber)) top right / 8px 2px no-repeat, linear-gradient(var(--amber), var(--amber)) top right / 2px 8px no-repeat,
    linear-gradient(var(--amber), var(--amber)) bottom left / 8px 2px no-repeat, linear-gradient(var(--amber), var(--amber)) bottom left / 2px 8px no-repeat,
    linear-gradient(var(--amber), var(--amber)) bottom right / 8px 2px no-repeat, linear-gradient(var(--amber), var(--amber)) bottom right / 2px 8px no-repeat; }

/* ===== 操作ブロックとスコア ===== */

/* フィールドの上に置くので、中身が変わっても盤面が上下しないよう高さをそろえる */

}

}
.dock-msg { margin: 0; }

.banner { margin: 0; font-family: var(--f-body); font-weight: 500; padding: 7px 12px; border-left: 3px solid var(--cyan); background: rgba(79, 227, 255, .07); overflow-wrap: anywhere; }

.dots { display: inline-flex; gap: 4px; }

.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }

/* ===== ログ ===== */

/* ===== タイトル ===== */

@media (min-width: 900px) { .hero { grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 36px; padding-block: 34px 34px; } }
.hero .logo { font-size: clamp(3rem, 9vw, 5.4rem); }
.hero .logo-sub { font-size: clamp(.7rem, 1.6vw, .95rem); margin-top: 10px; }
.tagline { font-size: clamp(1rem, 2.2vw, 1.22rem); font-weight: 700; margin: 22px 0 10px; max-width: 30em; line-height: 1.7; }
.lede { color: var(--muted); max-width: 36em; margin: 0 0 16px; }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: .84rem; color: var(--muted); }

.visual { position: relative; display: grid; place-items: center; min-height: 300px; perspective: 900px; overflow: hidden; overflow: clip; }
.visual .board { width: min(320px, 78vw); transform: rotateX(48deg) rotateZ(-30deg); transform-style: preserve-3d; margin-top: 70px; }
.cube3d { position: absolute; top: 10px; left: 50%; width: 76px; height: 76px; margin-left: -38px; transform-style: preserve-3d; animation: spin3d 12s linear infinite; z-index: 2; }
.cube3d i { position: absolute; inset: 0; border: 1px solid rgba(255, 255, 255, .55);
  background: linear-gradient(135deg, rgba(255, 255, 255, .85), #9FB0C8 40%, #4C5870 60%, #D7E1EE); box-shadow: inset 0 0 18px rgba(79, 227, 255, .45); }
.cube3d i:nth-child(1) { transform: translateZ(38px); } .cube3d i:nth-child(2) { transform: rotateY(180deg) translateZ(38px); }
.cube3d i:nth-child(3) { transform: rotateY(90deg) translateZ(38px); } .cube3d i:nth-child(4) { transform: rotateY(-90deg) translateZ(38px); }
.cube3d i:nth-child(5) { transform: rotateX(90deg) translateZ(38px); } .cube3d i:nth-child(6) { transform: rotateX(-90deg) translateZ(38px); }
@keyframes spin3d { from { transform: translateY(0) rotateX(-22deg) rotateY(0deg); } 50% { transform: translateY(-10px) rotateX(-22deg) rotateY(180deg); } to { transform: translateY(0) rotateX(-22deg) rotateY(360deg); } }
.beamv { position: absolute; top: 92px; left: 50%; width: 2px; height: 110px; margin-left: -1px; z-index: 1; background: linear-gradient(180deg, rgba(79, 227, 255, .9), rgba(79, 227, 255, .45)); box-shadow: 0 0 12px var(--cyan); }
.beamv::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px 3px rgba(79, 227, 255, .8); animation: blink 1.6s ease-in-out infinite; }
.settings { display: grid; gap: 14px; padding: 18px; }
.set-row { display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); align-items: center; }
@media (min-width: 720px) { .set-row { grid-template-columns: 11em minmax(0, 1fr); } }

.seg { display: flex; flex-wrap: wrap; gap: 8px; }

.seg label { display: grid; gap: 0; padding: .5em 1em; border: 1px solid var(--edge); cursor: pointer; min-width: 7.6em; background: rgba(79, 227, 255, .04);
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
.seg label span { font-weight: 700; }

.item-pick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.item-pick input { position: absolute; opacity: 0; pointer-events: none; }
.item-pick label { display: inline-flex; align-items: center; gap: 6px; padding: .4em .75em .4em .5em; border: 1px solid var(--edge); border-radius: 4px; background: rgba(79, 227, 255, .03); cursor: pointer; font-size: .78rem; color: var(--muted); }
.item-pick label svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

.match-items { display: grid; gap: 6px; border-top: 1px solid rgba(96, 196, 255, .14); padding-top: 10px; }

.mi-list { display: flex; flex-wrap: wrap; gap: 6px; }

.mi svg { width: 16px; height: 16px; fill: none; stroke: var(--cyan); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.mi svg .f { fill: var(--cyan); stroke: none; }
.mi b { font-weight: 500; }
.seg input:checked + label { border-color: var(--cyan); background: rgba(79, 227, 255, .18); box-shadow: inset 0 0 14px rgba(79, 227, 255, .3); }
.seg input:checked + label small { color: var(--text); }
.start-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }

/* ===== 配置 ===== */
.setup { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 920px) { .setup { grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); } }

.pal-row { display: grid; gap: 6px; }
.pal-h { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); border-bottom: 1px solid rgba(96, 196, 255, .14); padding-bottom: 3px; }

.pal-shapes { display: flex; flex-wrap: wrap; gap: 8px; }
.shape-btn { display: grid; justify-items: center; gap: 5px; padding: 9px 10px 6px; min-width: 66px; border: 1px solid var(--edge); border-radius: 4px; background: rgba(79, 227, 255, .04); cursor: pointer; font-size: .72rem; color: var(--muted); }
.shape-btn .mini rect { fill: url(#g-metal); stroke: rgba(0, 0, 0, .5); stroke-width: .6; }

/* ===== 配置（v12.13：左＝アイテム、中央＝盤と操作・配置完了、右＝キューブ。3列の高さをそろえる） ===== */
.setup3 { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "board" "parts" "done" "items"; }
.su-items { grid-area: items; } .su-board { grid-area: board; } .su-parts { grid-area: parts; } .su-done { grid-area: done; }
@media (min-width: 760px) { .setup3 { grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: 1fr auto auto; grid-template-areas: "board parts" "done parts" "items items"; } }
@media (min-width: 1100px) { .setup3 { grid-template-columns: 300px minmax(0, 1fr) 300px; grid-template-rows: 1fr auto; grid-template-areas: "items board parts" "items done parts"; } }
.su-board { display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.su-ctrl { display: grid; gap: 8px; justify-items: center; border-top: 1px solid rgba(96, 196, 255, .14); padding-top: 12px; margin-top: 8px; }

.su-ilist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.su-ilist li { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: .8rem; padding: 4px 8px; border: 1px solid var(--edge); border-radius: 4px; background: rgba(79, 227, 255, .04); }
.su-ilist .ic svg { width: 18px; height: 18px; fill: none; stroke: var(--cyan); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; display: block; }
.su-ilist .ic svg .f { fill: var(--cyan); stroke: none; }
.su-ilist.enemy li { background: rgba(255, 63, 143, .04); border-color: rgba(255, 63, 143, .22); }
.su-ilist.enemy .ic svg { stroke: var(--magenta); } .su-ilist.enemy .ic svg .f { fill: var(--magenta); }

.su-ilist em { font: 700 .82rem var(--f-tech); font-style: normal; color: var(--cyan); }

/* 配置完了の下の一言：文字があってもなくても高さを変えない */
.su-donenote { min-height: 1.6em; }
/* 画面全体をウインドウの高さに合わせているとき（fitScreen）：下の余白を詰め、対戦の左右のログ列は中央の高さに合わせる（ログが伸びても画面が伸びない） */
.fit .wrap { padding-bottom: 10px; }
@media (min-width: 1180px) { .fit .logcol { position: relative; top: auto; height: auto; max-height: none; contain: size; align-self: stretch; } }

/* ログのアンサーにマウスを重ねたとき、盤の上で宣言したブロックを囲む（hlAnswer） */
.hl-layer { position: absolute; inset: 0; z-index: 7; pointer-events: none; filter: drop-shadow(0 0 6px rgba(255, 193, 74, .75)); }
.hl-layer i { position: absolute; box-sizing: border-box; border: 0 solid var(--amber); background: rgba(255, 193, 74, .22); }

/* ===== ドラフト ===== */
.draft { display: grid; gap: 12px; }

  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
.item-card svg { grid-row: span 2; width: 34px; height: 34px; fill: none; stroke: var(--cyan); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
