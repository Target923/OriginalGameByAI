<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>色彩陣取り</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: 盤を画面の中央に。左＝得点と在庫、右＝ラウンド・指示・記録（左右同じ幅）。手札とアイテムは盤の上下で点対称。狭い画面では縦1列。 */
:root {
  --paper: #e9ece8;
  --sheet: #f8f9f7;
  --ink: #1c2321;
  --ink-2: #4c5753;
  --ink-3: #6f7a76;
  --rule: #d2d8d4;
  --mat: #2d5c4d;
  --mat-deep: #254d40;
  --mat-line: rgba(226, 242, 233, 0.17);
  --mat-ink: #cbe0d4;
  --act: #1f5a4a;
  --act-ink: #f3faf6;
  --glow: #ffe07a;
  --warn: #b3261e;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s0: #a2a8a5;
  --track: #e2e6e3;
  --on-s1: #ffffff;
  --on-s2: #ffffff;
  --on-s0: #1c2321;

  --c-red: #d4382d;
  --c-blue: #2b56ad;
  --c-yellow: #f3bb1c;
  --c-white: #f7f6f0;
  --c-purple: #6d41a6;
  --c-orange: #ee7b20;
  --c-green: #2c8a4d;
  --c-pink: #f39abb;
  --c-aqua: #79cfe5;
  --c-lemon: #f1ec86;
  --c-black: #1f1f24;
  --c-lime: #a2cd3b;
  --c-gray: #8a8f93;
  --on-light: #1b1d1c;
  --on-dark: #ffffff;
  --kraft: #a77c4f;
  --kraft-line: #8f673d;

  --f-display: "Yusei Magic", "Hiragino Maru Gothic ProN", "Zen Maru Gothic", sans-serif;
  --f-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif;
  --card-shadow: 0 1px 0 rgba(0, 0, 0, 0.22), 0 3px 6px rgba(0, 0, 0, 0.22);
  --cell: clamp(38px, min(calc((100vw - 32px) / 8), calc((100vh - 486px) / 8)), 64px);
  --center: max(calc(var(--cell) * 8), 540px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121715; --sheet: #1b2220; --ink: #e5ebe8; --ink-2: #b0bcb7; --ink-3: #8b9792; --rule: #2d3734;
    --mat: #1f4438; --mat-deep: #1a3a30; --mat-line: rgba(214, 238, 226, 0.12); --mat-ink: #a6c8b8;
    --act: #63b398; --act-ink: #0d1613; --glow: #ffd65a; --warn: #ff8a80;
    --s1: #3987e5; --s2: #d95926; --s0: #6b7370; --track: #26302d; --on-s1: #ffffff; --on-s2: #ffffff; --on-s0: #ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121715; --sheet: #1b2220; --ink: #e5ebe8; --ink-2: #b0bcb7; --ink-3: #8b9792; --rule: #2d3734;
  --mat: #1f4438; --mat-deep: #1a3a30; --mat-line: rgba(214, 238, 226, 0.12); --mat-ink: #a6c8b8;
  --act: #63b398; --act-ink: #0d1613; --glow: #ffd65a; --warn: #ff8a80;
  --s1: #3987e5; --s2: #d95926; --s0: #6b7370; --track: #26302d; --on-s1: #ffffff; --on-s2: #ffffff; --on-s0: #ffffff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 14px;
  line-height: 1.6;
  font-weight: 500;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 24px;
}
button { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; }
.wrap { max-width: 1380px; margin: 0 auto; }
#scr-setup, #scr-sim { max-width: 1180px; margin: 0 auto; }

/* ---------- 汎用 ---------- */
.btn {
  appearance: none; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink);
  padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; line-height: 1.3;
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--act); border-color: var(--act); color: var(--act-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
.btn.small { min-height: 30px; padding: 4px 10px; font-size: 13px; }
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; }
.panel h3 { font-size: 13px; letter-spacing: 0.08em; color: var(--ink-2); margin-bottom: 8px; font-weight: 700; }
.muted { color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- 絵の具カード ---------- */
.card {
  --card: 52px;
  position: relative; width: var(--card); height: var(--card); flex: none;
  border-radius: calc(var(--card) * 0.1);
  background: var(--paint);
  background-image: radial-gradient(130% 100% at 28% 18%, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0) 58%);
  color: var(--on);
  border: 1px solid rgba(0, 0, 0, 0.28);
  box-shadow: var(--card-shadow);
  display: grid; place-items: center;
  user-select: none; -webkit-user-select: none;
}
.card .nm { font-weight: 900; font-size: calc(var(--card) * 0.3); line-height: 1; letter-spacing: -0.02em; }
.card .nm.long { font-size: calc(var(--card) * 0.24); }
.card .pt { position: absolute; top: calc(var(--card) * 0.05); left: calc(var(--card) * 0.08); font-size: calc(var(--card) * 0.2); font-weight: 900; line-height: 1; }
.card .chip {
  position: absolute; top: calc(var(--card) * 0.07); right: calc(var(--card) * 0.07);
  width: calc(var(--card) * 0.22); height: calc(var(--card) * 0.22); border-radius: calc(var(--card) * 0.055);
  background: var(--chip);
}
.card .bar { position: absolute; left: 26%; right: 26%; bottom: calc(var(--card) * 0.06); height: max(2px, calc(var(--card) * 0.05)); border-radius: 2px; background: currentColor; opacity: 0.5; }
.card.rot { transform: rotate(180deg); }
.card.back {
  background: var(--kraft);
  background-image: repeating-linear-gradient(45deg, var(--kraft-line) 0 2px, transparent 2px 7px);
  border-color: rgba(0, 0, 0, 0.35);
}
.p-red { --paint: var(--c-red); --on: var(--on-dark); }
.p-blue { --paint: var(--c-blue); --on: var(--on-dark); }
.p-yellow { --paint: var(--c-yellow); --on: var(--on-light); }
.p-white { --paint: var(--c-white); --on: var(--on-light); }
.p-purple { --paint: var(--c-purple); --on: var(--on-dark); }
.p-orange { --paint: var(--c-orange); --on: var(--on-light); }
.p-green { --paint: var(--c-green); --on: var(--on-dark); }
.p-pink { --paint: var(--c-pink); --on: var(--on-light); }
.p-aqua { --paint: var(--c-aqua); --on: var(--on-light); }
.p-lemon { --paint: var(--c-lemon); --on: var(--on-light); }
.p-black { --paint: var(--c-black); --on: var(--on-dark); }
.p-lime { --paint: var(--c-lime); --on: var(--on-light); }
.p-gray { --paint: var(--c-gray); --on: var(--on-dark); }
.q-red { --chip: var(--c-red); } .q-blue { --chip: var(--c-blue); } .q-yellow { --chip: var(--c-yellow); }
.q-white { --chip: var(--c-white); }
.card .chip.q-white { box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.3); }

/* ---------- 設定画面 ---------- */
.hero { display: grid; gap: 6px; padding-block: 28px 22px; }
.hero h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(40px, 8vw, 64px); line-height: 1.05; letter-spacing: 0.02em; }
.hero p { margin: 0; color: var(--ink-2); font-size: 15px; }
.swatchrow { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.swatchrow .card { --card: 30px; }
.setup-grid { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .setup-grid { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; } }
.modes { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.mode {
  border: 1.5px solid var(--rule); border-radius: 12px; padding: 12px 14px; cursor: pointer; background: var(--sheet);
  display: grid; gap: 2px; text-align: left;
}
.mode b { font-size: 16px; }
.mode span { color: var(--ink-3); font-size: 12.5px; line-height: 1.5; }
.mode[aria-pressed="true"] { border-color: var(--act); box-shadow: inset 0 0 0 1.5px var(--act); }
.field { display: grid; gap: 8px; padding-block: 14px; border-top: 1px solid var(--rule); }
.field:first-of-type { border-top: 0; }
.field > label, .field > .lbl { font-weight: 700; }
.field .hint { color: var(--ink-3); font-size: 12.5px; margin: 0; }
.setlist { display: grid; gap: 6px; }
.setopt { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 6px 8px 6px 10px; border-radius: 8px; border: 1px solid var(--rule); }
.setchk { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.setchk input { margin: 0; accent-color: var(--act); width: 16px; height: 16px; }
.setitems { display: flex; gap: 6px; }
.setitems .btn { min-width: 84px; justify-content: center; }
.setitems .btn[aria-pressed="true"] { border-color: var(--act); box-shadow: inset 0 0 0 1.5px var(--act); }
.side-stack { display: grid; gap: 20px; align-content: start; min-width: 0; }
/* アイテムの効果プレビュー */
.ipreview { display: grid; gap: 10px; }
.iphead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.iphead b { font-family: var(--f-display); font-weight: 400; font-size: 24px; line-height: 1.1; }
.iphead .tag { color: var(--ink-3); font-size: 12.5px; font-weight: 700; }
.ipdesc { margin: 0; color: var(--ink-2); }
.ipreview { container-type: inline-size; }
.demo { display: grid; grid-template-columns: minmax(0, 1fr) 18px minmax(0, 1fr); gap: 8px; align-items: start; }
.demo figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
.demo figcaption { font-size: 12px; color: var(--ink-2); line-height: 1.5; }
.demo figcaption b { display: block; font-size: 11.5px; color: var(--ink-3); letter-spacing: 0.06em; }
.darrow { align-self: center; justify-self: center; color: var(--ink-3); font-size: 18px; padding-bottom: 28px; }
@container (max-width: 470px) {
  .demo { grid-template-columns: minmax(0, 1fr); }
  .darrow { transform: rotate(90deg); padding-bottom: 0; }
}
.dwrap { display: flex; gap: 8px; align-items: flex-start; }
.dmat { --cell: 34px; display: grid; width: max-content; background: var(--mat); border-radius: 10px; padding: 5px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25); }
.dside { display: grid; gap: 4px; justify-items: center; font-size: 11px; color: var(--ink-3); min-width: 56px; }
.dside .card { --card: 30px; }
.dnone { font-size: 11px; color: var(--ink-3); padding-block: 6px; }
.card.new { outline: 3px solid var(--glow); outline-offset: 1px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.seg { justify-self: start; display: inline-flex; border: 1px solid var(--rule); border-radius: 9px; overflow: hidden; flex-wrap: wrap; }
.seg button { appearance: none; border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--act); color: var(--act-ink); }
input[type="number"] { font: inherit; width: 96px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); }
.recipes { display: grid; gap: 6px; }
.recipe { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.recipe .card { --card: 36px; }
.recipe .how { color: var(--ink-2); font-size: 13px; }
.recipe .pp { font-weight: 900; font-variant-numeric: tabular-nums; }

/* ---------- 対戦画面 ---------- */
.topbar { display: flex; gap: 8px; align-items: center; padding-block: 0 8px; }
.topbar .name { font-family: var(--f-display); font-size: 24px; line-height: 1; margin-right: auto; }
.rounds { display: flex; gap: 4px; flex-wrap: wrap; }
.rounds span { padding: 2px 9px; border-radius: 999px; border: 1px solid var(--rule); font-size: 12px; white-space: nowrap; color: var(--ink-3); font-weight: 700; background: var(--sheet); }
.rounds span.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.rounds span.done { color: var(--ink-2); }

/* 盤を中心に置き、左右の列は同じ幅：左＝得点と在庫、右＝進行・指示・記録 */
.table { display: grid; gap: 12px 18px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "status" "center" "scores" "log" "stock"; }
.col-l, .col-r { display: contents; }
.a-center { grid-area: center; display: grid; gap: 8px; align-content: center; min-width: 0; }
.a-status { grid-area: status; display: grid; gap: 8px; align-content: start; min-width: 0; }
.a-scores { grid-area: scores; min-width: 0; }
.a-stock { grid-area: stock; min-width: 0; }
.a-log { grid-area: log; min-width: 0; }
@media (min-width: 1080px) {
  /* 左右の2段目（在庫と記録）の上端をそろえる */
  .table {
    grid-template-columns: minmax(250px, 1fr) var(--center) minmax(250px, 1fr);
    grid-template-rows: auto 1fr;
    grid-template-areas: "scores center status" "stock center log";
    align-items: stretch;
  }
  .a-scores > .panel, .a-stock > .panel { height: 100%; }
  .a-status { display: flex; flex-direction: column; }
  .a-status .status { flex: 1 1 auto; min-height: 140px; align-content: start; }
  .a-log { position: relative; min-height: 220px; }
  .a-log > .panel { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .a-log .log { flex: 1 1 0; min-height: 0; max-height: none; }
}

.status { border-radius: 12px; padding: 10px 14px; background: var(--sheet); border: 1px solid var(--rule); display: grid; gap: 6px; }
.status .who { font-weight: 900; font-size: 15px; }
.status .say { color: var(--ink-2); }
.status .say b { color: var(--ink); }
.status .err { color: var(--warn); font-weight: 700; }
.status .acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* 手札とアイテム（相手側は左右反転して点対称に） */
.seat { --items-w: 184px; display: grid; gap: 10px; align-items: stretch; }
.seat.me { grid-template-columns: minmax(0, 1fr) var(--items-w); }
.seat.opp { grid-template-columns: var(--items-w) minmax(0, 1fr); }
@media (max-width: 560px) { .seat { --items-w: 150px; } .item { font-size: 12px; padding-inline: 3px; } .item small { display: none; } }
.hblock, .iblock { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 8px 10px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.hblock.active { border-color: var(--act); box-shadow: inset 0 0 0 1px var(--act); }
.hblock .head, .iblock .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; min-height: 20px; }
.hblock .head b, .iblock .head b { font-size: 14px; }
.hblock .head .tag, .iblock .head .tag { font-size: 11.5px; color: var(--ink-3); }
.opp .head, .opp .hand, .opp .acts { justify-content: flex-end; }
.hand { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-end; min-height: 52px; padding-top: 4px; }
.hand .card { --card: 46px; cursor: default; transition: transform 0.12s ease; }
.hand .card.can { cursor: pointer; }
.hand .card.can:hover { transform: translateY(-3px); }
.hand .card.sel { transform: translateY(-4px); outline: 3px solid var(--glow); outline-offset: 2px; }
.hand .card.dim { opacity: 0.45; }
.hand .empty { color: var(--ink-3); font-size: 13px; align-self: center; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-height: 32px; }
.acts .btn { min-height: 32px; padding: 4px 11px; font-size: 13px; }
.ilist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
.item {
  appearance: none; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper);
  padding: 4px 6px; min-height: 30px; font-size: 12.5px; font-weight: 700; line-height: 1.2; cursor: default; white-space: nowrap;
  display: flex; gap: 4px; align-items: center; justify-content: center; text-align: center;
}
.item small { font-size: 10.5px; color: var(--ink-3); font-weight: 500; }
.item.can { cursor: pointer; border-color: var(--act); color: var(--ink); }
.item.can:hover { background: var(--sheet); }
.item.used { opacity: 0.5; text-decoration: line-through; }
.item.on { box-shadow: inset 0 0 0 2px var(--glow); }
.iblock .small { font-size: 12.5px; }

/* 盤 */
.board-wrap { display: grid; justify-content: center; }
.mat {
  position: relative;
  display: grid; grid-template-columns: repeat(8, var(--cell)); grid-template-rows: repeat(8, var(--cell));
  background: var(--mat);
  border-radius: 14px; padding: 0;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25), 0 6px 18px rgba(0, 0, 0, 0.14);
}
.cell { position: relative; display: grid; place-items: center; }
.cell.main, .cell.wide { box-shadow: inset 0 0 0 0.5px var(--mat-line); }
.cell.wide { background: repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0 4px, transparent 4px 9px); }
.cell .lab { color: var(--mat-ink); font-size: calc(var(--cell) * 0.24); font-weight: 700; opacity: 0.85; }
.cell > .card { --card: calc(var(--cell) * 0.84); }
.cell .stack2 { position: absolute; inset: 0; }
.cell .stack2 > .card { --card: calc(var(--cell) * 0.62); position: absolute; }
.cell .stack2 > .card:first-child { left: 5%; top: 5%; }
.cell .stack2 > .card:last-child { right: 5%; bottom: 5%; }
.cell.click { cursor: pointer; }
.cell.legal::after {
  content: ""; position: absolute; width: 26%; height: 26%; border-radius: 50%;
  background: var(--glow); box-shadow: 0 0 0 4px rgba(255, 224, 122, 0.25); pointer-events: none;
}
.cell.legal:hover::after { width: 34%; height: 34%; }
/* 置けるマスの点線は、仮置きカードの点線（カードの外側1〜3px）と同じ位置・同じ角の丸みにそろえる */
.cell.free::before, .cell.spot::before { content: ""; position: absolute; inset: calc(8% - 3px); border-radius: calc(var(--cell) * 0.084 + 3px); border: 2px dashed var(--glow); pointer-events: none; }
/* パレットで選んでいない色の置き場は薄い点線 */
.cell.free.alt::before { opacity: 0.5; }
/* 点線・変化の枠はカードより手前に描く（カードのあるマスでも見えるように） */
.cell.free::before, .cell.spot::before, .cell.changed::before { z-index: 2; }
.card.back .who { font-size: calc(var(--card) * 0.2); font-weight: 900; line-height: 1.2; color: #fff6e8; background: rgba(40, 24, 8, 0.5); padding: 1px 5px; border-radius: 4px; }
.cell.last { background: rgba(255, 224, 122, 0.13); }
.cell.changed::before { content: ""; position: absolute; inset: 3%; border-radius: 8px; border: 2px solid var(--glow); pointer-events: none; }
/* ワイドの辺を選ぶ：盤のまわりの座標の枠を押せる。指した辺の6マスをまとめて明るくする */
.cell.side-pick { cursor: pointer; border-radius: 6px; }
.cell.side-pick::before { content: ""; position: absolute; inset: 10%; border-radius: 6px; border: 1.5px dashed var(--glow); opacity: 0.55; pointer-events: none; }
.cell.side-pick:hover, .cell.side-pick:focus-visible,
.mat:has(.side-pick[data-side="top"]:hover) .side-pick[data-side="top"],
.mat:has(.side-pick[data-side="bottom"]:hover) .side-pick[data-side="bottom"],
.mat:has(.side-pick[data-side="left"]:hover) .side-pick[data-side="left"],
.mat:has(.side-pick[data-side="right"]:hover) .side-pick[data-side="right"],
.mat:has(.side-pick[data-side="top"]:focus-visible) .side-pick[data-side="top"],
.mat:has(.side-pick[data-side="bottom"]:focus-visible) .side-pick[data-side="bottom"],

<script>/* 色彩陣取り — ゲームエンジン・CPU・シミュレーション
 * ブラウザでは window.Iro、Node では module.exports として公開する。
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.Iro = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ------------------------------------------------------------------
  // 定数
  // ------------------------------------------------------------------
  const COLOR_ORDER = ['red', 'blue', 'yellow', 'white', 'purple', 'orange', 'green',
    'pink', 'aqua', 'lemon', 'black', 'lime', 'gray'];
  const COLOR = {
    red: { name: '赤', pts: 1 },
    blue: { name: '青', pts: 1 },
    yellow: { name: '黄', pts: 1 },
    white: { name: '白', pts: 1 },
    purple: { name: '紫', pts: 3, from: ['red', 'blue'] },
    orange: { name: '橙', pts: 3, from: ['red', 'yellow'] },
    green: { name: '緑', pts: 3, from: ['blue', 'yellow'] },
    pink: { name: '桃', pts: 3, from: ['red', 'white'] },
    aqua: { name: '水', pts: 3, from: ['blue', 'white'] },
    lemon: { name: '檸檬', pts: 3, from: ['yellow', 'white'] },
    black: { name: '黒', pts: 6, from: ['red', 'blue', 'yellow'] },
    lime: { name: '黄緑', pts: 6, from: ['green', 'white'] },
    gray: { name: '灰色', pts: -3, from: ['black', 'white'] },
  };
  const PRIMARY = { red: true, blue: true, yellow: true };
  // 手札から最初から使える基本の色（原色と白）。R1・R3・初期配置で置けるのはこれだけ
  const isBase = color => !!PRIMARY[color] || color === 'white';
  // 2色を混ぜた3点の色には、元の2色のチップが1枚ずつと無地が1枚
  const CHIPS = {
    purple: ['red', 'blue', null], orange: ['red', 'yellow', null], green: ['blue', 'yellow', null],
    pink: ['red', 'white', null], aqua: ['blue', 'white', null], lemon: ['yellow', 'white', null],
  };
  const GEN_COLORS = ['purple', 'orange', 'green', 'pink', 'aqua', 'lemon', 'black', 'lime', 'gray'];
  const RECIPE = {};
  COLOR_ORDER.forEach(c => { if (COLOR[c].from) RECIPE[COLOR[c].from.slice().sort().join('|')] = c; });

  const ITEM = {
    all: { name: 'オール', kind: 'turn', desc: 'この手番の合成判定を、斜めを含む8方向で行う' },
    double: { name: 'ダブル', kind: 'turn', desc: 'この手番、生成した色をカードのあるマスに重ねて置ける（1マス2枚まで）' },
    spin: { name: 'スピン', kind: 'instant', desc: '自分と相手の同じ点数のカードを1枚ずつ選び、所有者を入れ替える' },
    change: { name: 'チェンジ', kind: 'instant', desc: '盤上のカード1枚を、在庫にある同じ点数の別の色の山の一番上と交換する（所有者はそのまま）' },
    reset: { name: 'リターン', kind: 'instant', desc: '盤上のカード1枚を所有者の手札に戻す' },
    slide: { name: 'スライド', kind: 'instant', desc: '盤上のカード1枚を上下左右に1マス動かす（合成は起きない）' },
    lock: { name: 'ロック', kind: 'permanent', desc: '空きマス1つを、相手だけが設置・移動・生成できないマスにする。そのマスのカードは、相手のリターン・スライド・チェンジ・スピンの対象にもならない' },
    wide: { name: 'ワイド', kind: 'permanent', desc: '盤の1辺の外側に、自分専用の1列（6マス）を追加する' },
    remote: { name: 'リモート', kind: 'permanent', desc: '空きマスに設置。自分だけ、このマスを透過して合成の並びにできる（盤の端なら反対側の端とつながる）。リモートに触れる並びで作った色は、周り8マスにも置ける' },
    portal: { name: 'ポータル', kind: 'permanent', desc: '空きマスに設置。自分が生成した色を、ポータルの上下左右にも置ける' },
  };
  const ITEM_ORDER = ['all', 'double', 'spin', 'change', 'reset', 'slide', 'lock', 'wide', 'remote', 'portal'];
  const SETS = [
    { id: '1', name: '空間拡張と密度突破', items: ['all', 'double'] },
    { id: '2', name: '価値の交換と属性の置換', items: ['spin', 'change'] },
    { id: '3', name: '空間の再定義と安全確保', items: ['reset', 'slide'] },
    { id: '4', name: '絶対領域と拒絶の空間', items: ['lock', 'wide'] },
    { id: '5', name: '位相と跳躍', items: ['remote', 'portal'] },
  ];
  const ROUND_LABEL = ['', 'R1 設置', 'R2 移動', 'R3 設置', 'R4 最終決戦'];

  // ------------------------------------------------------------------
  // 盤の座標（外周1マスを含む 8×8。本盤は x,y = 0..5）
  // ------------------------------------------------------------------
  const GW = 8, GN = GW * GW;
  const idx = (x, y) => (y + 1) * GW + (x + 1);
  const X = i => (i % GW) - 1;
  const Y = i => ((i / GW) | 0) - 1;
  const inMain = (x, y) => x >= 0 && x < 6 && y >= 0 && y < 6;
  const inGrid = (x, y) => x >= -1 && x <= 6 && y >= -1 && y <= 6;
  const ORTH = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const AXES4 = [[1, 0], [0, 1]];
  const AXES8 = [[1, 0], [0, 1], [1, 1], [1, -1]];
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const START = [idx(3, 3), idx(2, 2)]; // 手前のプレイヤー0 は D-4、奥のプレイヤー1 は C-3（盤の中心について点対称）
  const EMPTY = [];

  function inWide(side, x, y) {
    if (side === 'top') return y === -1 && x >= 0 && x < 6;
    if (side === 'bottom') return y === 6 && x >= 0 && x < 6;
    if (side === 'left') return x === -1 && y >= 0 && y < 6;
    if (side === 'right') return x === 6 && y >= 0 && y < 6;
    return false;
  }
  function wideCells(side) {
    const out = [];
    for (let k = 0; k < 6; k++) {
      if (side === 'top') out.push(idx(k, -1));
      if (side === 'bottom') out.push(idx(k, 6));
      if (side === 'left') out.push(idx(-1, k));
      if (side === 'right') out.push(idx(6, k));
    }
    return out;
  }
  function cellName(i) {
    const x = X(i), y = Y(i), C = 'ABCDEF';
    if (inMain(x, y)) return C[x] + '-' + (y + 1);
    if (y === -1) return C[x] + '-上';
    if (y === 6) return C[x] + '-下';
    if (x === -1) return '左-' + (y + 1);
    return '右-' + (y + 1);
  }
  function cellExists(s, i) {
    const x = X(i), y = Y(i);
    if (inMain(x, y)) return true;
    return !!(s.wide && inWide(s.wide.side, x, y));
  }
  // プレイヤー p がこのマスにカードを置けるか（設置・移動・生成・スライド先）
  function canPutFor(s, i, p) {
    const x = X(i), y = Y(i);
    if (!inMain(x, y)) {
      if (!s.wide || !inWide(s.wide.side, x, y) || s.wide.owner !== p) return false;
    }
    const c = s.cells[i];
    if (c.obj) return false;
    if (c.lock !== null && c.lock !== p) return false;
    return true;
  }

  // ------------------------------------------------------------------
  // 乱数
  // ------------------------------------------------------------------
  function rng32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

  function shuffle(a, rng) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // ------------------------------------------------------------------
  // 状態
  // ------------------------------------------------------------------
  const ok = (extra) => Object.assign({ ok: true }, extra || {});
  const fail = (error) => ({ ok: false, error });

  function newGame(opts, seed) {
    opts = opts || {};
    const settings = {
      sets: Array.isArray(opts.sets) ? opts.sets.slice() : ['1', '2', '3', '4', '5'],
      komi: Number(opts.komi) || 0,
      gray: opts.gray !== false,
      names: opts.names ? opts.names.slice() : ['P1', 'P2'],
    };
    if (seed === undefined || seed === null) seed = Math.floor(Math.random() * 4294967296);
    seed = seed >>> 0;
    const rng = rng32(seed);
    const cards = [];
    const mk = (color, chip) => { cards.push({ id: cards.length, color, chip: chip || null, owner: null }); return cards.length - 1; };
    const piles = {};
    COLOR_ORDER.forEach(k => { piles[k] = []; });
    const prim = [];
    ['red', 'blue', 'yellow'].forEach(k => { for (let i = 0; i < 3; i++) prim.push(mk(k)); });
    const whites = [mk('white'), mk('white'), mk('white')];
    Object.keys(CHIPS).forEach(k => CHIPS[k].forEach(ch => piles[k].push(mk(k, ch))));
    ['black', 'lime', 'gray'].forEach(k => { for (let i = 0; i < 3; i++) piles[k].push(mk(k)); });
    shuffle(prim, rng);
    const hands = [prim.slice(0, 4), prim.slice(4, 8)];
    piles[cards[prim[8]].color].push(prim[8]); // 公共の原色
    hands[0].push(whites[0]);
    hands[1].push(whites[1]);
    piles.white.push(whites[2]);
    hands.forEach((h, p) => h.forEach(id => { cards[id].owner = p; }));
    COLOR_ORDER.forEach(k => shuffle(piles[k], rng));
    const first = (opts.first === 0 || opts.first === 1) ? opts.first : (rng() < 0.5 ? 0 : 1);
    const cells = [];
    for (let i = 0; i < GN; i++) cells.push({ stack: [], lock: null, obj: null });
    const s = {
      settings, seed, cards, cells, piles, hands,
      items: [[], []], wide: null,
      first, draftFirst: 1 - first,
      phase: settings.sets.length ? 'draft' : 'initial',
      round: 0, turnPos: 0, turn: null,
      log: [], result: null,
    };
    sortHands(s);
    log(s, `${pname(s, first)}が先攻、${pname(s, 1 - first)}がドラフトの先手です。`);
    return s;
  }

  function clone(s, keepLog) {
    const piles = {};
    for (const k of COLOR_ORDER) piles[k] = s.piles[k].slice();
    const cells = new Array(GN);
    for (let i = 0; i < GN; i++) { const c = s.cells[i]; cells[i] = { stack: c.stack.slice(), lock: c.lock, obj: c.obj }; }
    return {
      settings: s.settings, seed: s.seed,
      cards: s.cards.map(c => ({ id: c.id, color: c.color, chip: c.chip, owner: c.owner })),
      cells, piles,
      hands: [s.hands[0].slice(), s.hands[1].slice()],
      items: [s.items[0].map(o => Object.assign({}, o)), s.items[1].map(o => Object.assign({}, o))],
      wide: s.wide, first: s.first, draftFirst: s.draftFirst,
      phase: s.phase, round: s.round, turnPos: s.turnPos,
      turn: s.turn ? { player: s.turn.player, itemsUsed: s.turn.itemsUsed, flags: Object.assign({}, s.turn.flags), actionStarted: false } : null,
      log: keepLog ? s.log.slice() : null,
      result: s.result,
    };
  }

  const pname = (s, p) => s.settings.names[p];
  const cname = (s, id) => { const c = s.cards[id]; return COLOR[c.color].name + (c.chip ? `(${COLOR[c.chip].name}チップ)` : ''); };
  function log(s, msg) { if (s.log) s.log.push({ round: s.round, msg }); }

  function sortHands(s) {
    const ord = c => COLOR_ORDER.indexOf(c.color) * 10 + (c.chip ? COLOR_ORDER.indexOf(c.chip) + 1 : 0);
    for (const h of s.hands) h.sort((a, b) => ord(s.cards[a]) - ord(s.cards[b]) || a - b);
  }

  function findCard(s, id) {
    for (let i = 0; i < GN; i++) { const k = s.cells[i].stack.indexOf(id); if (k >= 0) return { where: 'cell', idx: i, pos: k }; }
    for (const p of [0, 1]) if (s.hands[p].includes(id)) return { where: 'hand', p };
    for (const k of COLOR_ORDER) if (s.piles[k].includes(id)) return { where: 'pile', color: k };
    return null;
  }

  const currentPlayer = s => (s.turnPos === 0 ? s.first : 1 - s.first);
  function roundKinds(round) {
    if (round === 1) return { place: 'base', move: false };
    if (round === 2) return { place: null, move: true };
    if (round === 3) return { place: 'base', move: false };
    return { place: 'any', move: true };
  }

  function startTurn(s) {
    s.turn = { player: currentPlayer(s), itemsUsed: 0, flags: { all: false, double: false } };
  }
  function endTurn(s) {
    if (s.turnPos === 0) s.turnPos = 1;
    else { s.turnPos = 0; s.round++; }
    if (s.round > 4) {
      s.phase = 'end'; s.turn = null;
      s.result = finalResult(s);
      const r = s.result;
      log(s, r.winner === null ? `引き分け（${r.scores[0].total} 対 ${r.scores[1].total}）`
        : `${pname(s, r.winner)}の勝ち（${r.scores[0].total} 対 ${r.scores[1].total}）`);
    } else startTurn(s);
  }

  // ------------------------------------------------------------------
  // ドラフト・初期配置
  // ------------------------------------------------------------------
  function draftSets(s) { return s.settings.sets.map(id => SETS.find(t => t.id === id)); }

  function applyDraft(s, picks) {
    if (s.phase !== 'draft') return fail('ドラフト中ではありません');
    const sets = draftSets(s);
    if (!Array.isArray(picks) || picks.length !== sets.length) return fail('各セットから1つずつ選んでください');
    const df = s.draftFirst, other = 1 - df;
    const mine = [], rest = [];
    for (let k = 0; k < sets.length; k++) {
      if (!sets[k].items.includes(picks[k])) return fail('不正な選択です');
      mine.push({ type: picks[k], set: sets[k].id, used: false, round: null });
      rest.push({ type: sets[k].items.find(t => t !== picks[k]), set: sets[k].id, used: false, round: null });
    }
    s.items[df] = mine; s.items[other] = rest;
    s.phase = 'initial';
    log(s, `ドラフト：${pname(s, df)}は ${mine.map(o => ITEM[o.type].name).join('・')}、${pname(s, other)}は ${rest.map(o => ITEM[o.type].name).join('・')}`);
    return ok();
  }

  function applyInitial(s, ids) {
    if (s.phase !== 'initial') return fail('初期配置の段階ではありません');
    for (const p of [0, 1]) {
      const id = ids[p];
      if (!s.hands[p].includes(id)) return fail('手札にないカードです');
      if (!isBase(s.cards[id].color)) return fail('初期配置には原色か白を出せます');
    }
    for (const p of [0, 1]) {
      s.hands[p].splice(s.hands[p].indexOf(ids[p]), 1);
      s.cells[START[p]].stack.push(ids[p]);
    }
    const fp = s.first, sp = 1 - s.first;
    s.phase = 'play'; s.round = 1; s.turnPos = 0;
    log(s, `初期配置：${pname(s, fp)}が ${cellName(START[fp])} に${cname(s, ids[fp])}、${pname(s, sp)}が ${cellName(START[sp])} に${cname(s, ids[sp])}`);
    startTurn(s);
    return ok();
  }

  // ------------------------------------------------------------------
  // 合成判定
  // ------------------------------------------------------------------
  // ctx: 設置・移動を仮に反映した見え方 { placedIdx, placedId, removedIdx, removedId }
  function ctxOf(act) {
    if (act.type === 'move') return { placedIdx: act.to, placedId: act.cardId, removedIdx: act.from, removedId: act.cardId };
    return { placedIdx: act.to, placedId: act.cardId, removedIdx: -1, removedId: -1 };
  }
  function stackAt(s, ctx, i) {
    let st = s.cells[i].stack;
    if (ctx) {
      if (ctx.removedIdx === i) st = st.filter(id => id !== ctx.removedId);
      if (ctx.placedIdx === i) st = st.concat([ctx.placedId]);
    }
    return st;
  }

  // i から (dx,dy) 方向へ最大 n マス。自分のリモートは透過し、壁・相手のリモート・ポータルで止まる。
  // ループ：盤の端に自分のリモートがある直線は、両端がつながって輪になる（どちら向きにたどっても、リモートを通ってつながる）。
  // out.via[k]：out[k] に着く手前で自分のリモートを通ったか
  // out.tail：最後のマスの先で自分のリモートを通り、その先で止まったか（リモートの向こうに置き場がない）
  function walk(s, p, i, dx, dy, n) {
    const out = [];
    const via = [];
    let skipped = false;
    let x = X(i), y = Y(i);
    let wrapped = false;
    for (let g = 0; g < 20 && out.length < n; g++) {
      let nx = x + dx, ny = y + dy;
      let j = inGrid(nx, ny) ? idx(nx, ny) : -1;
      if (j < 0 || !cellExists(s, j)) {
        if (wrapped) break;
        // 反対側の端（同じ直線で、盤の外に出る直前のマス）
        let bx = x, by = y;
        for (;;) {
          const px = bx - dx, py = by - dy;
          if (!inGrid(px, py) || !cellExists(s, idx(px, py))) break;
          bx = px; by = py;
        }
        // 出ていく端か、入ってくる端のどちらかが自分のリモートなら、リモートを通ってつながる
        const isMine = (cx, cy) => { const ob = s.cells[idx(cx, cy)].obj; return !!ob && ob.type === 'remote' && ob.owner === p; };
        if (!isMine(x, y) && !isMine(bx, by)) break;
        wrapped = true;
        nx = bx; ny = by; j = idx(bx, by);
      }
      x = nx; y = ny;
      if (j === i) break; // 一周して置いたマスに戻った
      const ob = s.cells[j].obj;
      if (ob) {
        if (ob.type === 'remote' && ob.owner === p) { skipped = true; continue; }
        break;
      }
      out.push(j);
      via.push(skipped);
      skipped = false;
    }
    out.via = via;
    out.tail = skipped;
    return out;
  }

  // 自分のリモートの上下左右のマス（ここにカードがある並びは「リモートに触れる並び」）
  function remoteSide(s, p) {
    const out = new Set();
    for (let i = 0; i < GN; i++) {
      const ob = s.cells[i].obj;
      if (!ob || ob.type !== 'remote' || ob.owner !== p) continue;
      for (const [dx, dy] of ORTH) {
        const nx = X(i) + dx, ny = Y(i) + dy;
        if (inGrid(nx, ny)) out.add(idx(nx, ny));
      }
    }
    return out;
  }
  // 自分のリモートの周り8マス（リモートに触れる並びで作った色の置き場所）
  function remoteRing(s, p) {
    const out = [];
    for (let i = 0; i < GN; i++) {
      const ob = s.cells[i].obj;
      if (!ob || ob.type !== 'remote' || ob.owner !== p) continue;
      const x = X(i), y = Y(i);
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = x + dx, ny = y + dy;
        if (!inGrid(nx, ny)) continue;
        const j = idx(nx, ny);
        if (canPutFor(s, j, p) && !out.includes(j)) out.push(j);
      }
    }
    return out;
  }

  function portalCells(s, p) {
    const out = [];
    for (let i = 0; i < GN; i++) {
      const ob = s.cells[i].obj;
      if (!ob || ob.type !== 'portal' || ob.owner !== p) continue;
      const x = X(i), y = Y(i);
      for (const [dx, dy] of ORTH) {
        const nx = x + dx, ny = y + dy;
        if (!inGrid(nx, ny)) continue;
        const j = idx(nx, ny);
        if (canPutFor(s, j, p) && !out.includes(j)) out.push(j);
      }
    }
    return out;
  }

  function readingsOf(s, id, p) {
    const c = s.cards[id];
    return (c.chip && c.owner === p) ? [c.color, c.chip] : [c.color];
  }

  // 置いた（動かした）カードを含む、連続2〜3枚の並びから作れる色をすべて列挙する
  function enumerateOptions(s, p, ctx, flags) {
    const e = ctx.placedIdx, pid = ctx.placedId;
    const axes = flags && flags.all ? AXES8 : AXES4;
    const out = [];
    const seen = new Set();
    const has = j => stackAt(s, ctx, j).length > 0;
    const nearR = remoteSide(s, p);
    for (const [dx, dy] of axes) {
      const f = walk(s, p, e, dx, dy, 3);
      const b = walk(s, p, e, -dx, -dy, 3);
      let L = 0; while (L < 2 && L < b.length && has(b[L])) L++;
      let R = 0; while (R < 2 && R < f.length && has(f[R])) R++;
      const segs = [];
      if (L >= 1) segs.push([1, 0]);
      if (R >= 1) segs.push([0, 1]);
      if (L >= 2) segs.push([2, 0]);
      if (L >= 1 && R >= 1) segs.push([1, 1]);
      if (R >= 2) segs.push([0, 2]);
      for (const [bc, fc] of segs) {
        const seq = b.slice(0, bc).reverse().concat([e], f.slice(0, fc));
        // リモートに触れる並び：並びのカードがリモートの上下左右にある／カードどうしの間にリモートがある／
        // 並びの端の先がリモート（置き場がリモートの向こう側。ループも含む）
        const viaR = seq.some(j => nearR.has(j))
          || f.via.slice(0, fc).some(Boolean) || b.via.slice(0, bc).some(Boolean)
          || (f.length > fc ? f.via[fc] : f.tail) || (b.length > bc ? b.via[bc] : b.tail);
        const ends = [];
        if (b.length > bc) ends.push(b[bc]);
        if (f.length > fc) ends.push(f[fc]);
        const lists = seq.map(j => (j === e ? [pid] : stackAt(s, ctx, j)));
        const n = seq.length;
        const pick = new Array(n);
        const rd = new Array(n);
        const emitReadings = (rl, t) => {
          if (t === n) {
            const color = RECIPE[rd.slice().sort().join('|')];
            if (!color) return;
            if (n === 3 && color !== 'black') return;
            if (color === 'gray' && !s.settings.gray) return;
            const ids = pick.slice();
            const dk = ids.slice().sort((a, c) => a - c).join(',') + '>' + color;
            if (seen.has(dk)) return;
            seen.add(dk);
            out.push({ color, cardIds: ids, readings: rd.slice(), seq, ends, axis: [dx, dy], via: viaR });
            return;
          }
          for (const r of rl[t]) { rd[t] = r; emitReadings(rl, t + 1); }
        };
        const chooseCards = (t) => {
          if (t === n) { emitReadings(pick.map(id => readingsOf(s, id, p)), 0); return; }
          for (const id of lists[t]) { pick[t] = id; chooseCards(t + 1); }
        };
        chooseCards(0);
      }
    }
    const pc = portalCells(s, p);
    const rc = remoteRing(s, p);
    for (const o of out) {
      const cs = [];
      for (const j of o.ends) if (canPutFor(s, j, p) && !cs.includes(j)) cs.push(j);
      for (const j of pc) if (!cs.includes(j)) cs.push(j);
      if (o.via) for (const j of rc) if (!cs.includes(j)) cs.push(j);
      o.cells = cs;
    }
    return out;
  }

  const capOf = flags => (flags && flags.double ? 2 : 1);
  function countAt(s, ctx, i) { return stackAt(s, ctx, i).length; }

  function anyPlaceable(s, ctx, opts, cap) {
    for (const o of opts) {
      if (!s.piles[o.color].length) continue;
      for (const j of o.cells) if (countAt(s, ctx, j) < cap) return true;
    }
    return false;
  }

  // 灰色を同時に置ける最大枚数（灰色の強制ルールの基準）
  function maxGray(s, p, ctx, opts, cap, assigns) {
    const extra = {};
    let pile = s.piles.gray.length;
    const usedOpt = new Set();
    let placed = 0;
    for (const a of (assigns || [])) {
      extra[a.cell] = (extra[a.cell] || 0) + 1;
      usedOpt.add(a.opt);
      if (opts[a.opt].color === 'gray') { placed++; pile--; }
    }
    const grays = [];
    opts.forEach((o, k) => { if (o.color === 'gray' && !usedOpt.has(k)) grays.push(k); });
    let best = 0;
    const dfs = (t, n) => {
      if (n + (grays.length - t) <= best) return;
      if (t === grays.length) { if (n > best) best = n; return; }
      const o = opts[grays[t]];
      if (pile > 0) {
        for (const j of o.cells) {
          if (countAt(s, ctx, j) + (extra[j] || 0) >= cap) continue;
          extra[j] = (extra[j] || 0) + 1; pile--;
          dfs(t + 1, n + 1);
          extra[j]--; pile++;
        }
      }
      dfs(t + 1, n);
    };
    dfs(0, 0);
    return placed + best;
  }

  function validateAssigns(s, p, ctx, opts, assigns, flags) {
    const cap = capOf(flags);
    const used = new Set();
    const extra = {};
    const pileUse = {};
    for (const a of assigns) {
      const o = opts[a.opt];
      if (!o) return fail('不正な合成です');
      if (used.has(a.opt)) return fail('同じ合成は1回しか使えません');
      if (!o.cells.includes(a.cell)) return fail(`${cellName(a.cell)}には置けません`);
      if (countAt(s, ctx, a.cell) + (extra[a.cell] || 0) >= cap) return fail(`${cellName(a.cell)}は埋まっています`);
      if ((pileUse[o.color] || 0) >= s.piles[o.color].length) return fail(`${COLOR[o.color].name}の在庫がありません`);
      used.add(a.opt);
      extra[a.cell] = (extra[a.cell] || 0) + 1;
      pileUse[o.color] = (pileUse[o.color] || 0) + 1;
    }
    const need = maxGray(s, p, ctx, opts, cap, []);
    const have = assigns.filter(a => opts[a.opt].color === 'gray').length;
    if (have < need) return fail(`灰色をあと${need - have}枚置く必要があります`);
    return ok({ grayNeed: need });
  }

  // UI 用：仮置き状態で、合成 k を置けるマス
  function freeCells(s, p, act, opts, assigns, k) {
    const flags = s.turn ? s.turn.flags : {};
    const cap = capOf(flags);
    const ctx = ctxOf(act);
    const o = opts[k];
    if (!o) return [];
    if (assigns.some(a => a.opt === k)) return [];
    const pileUse = assigns.filter(a => opts[a.opt].color === o.color).length;
    if (pileUse >= s.piles[o.color].length) return [];
    const extra = {};
    assigns.forEach(a => { extra[a.cell] = (extra[a.cell] || 0) + 1; });
    const need = maxGray(s, p, ctx, opts, cap, []);
    const out = [];
    for (const j of o.cells) {
      if (countAt(s, ctx, j) + (extra[j] || 0) >= cap) continue;
      if (o.color !== 'gray' && need > 0) {
        // 灰色の置き場をふさぐ配置は許さない
        if (maxGray(s, p, ctx, opts, cap, assigns.concat([{ opt: k, cell: j }])) < need) continue;
      }
      out.push(j);
    }
    return out;
  }

  // ------------------------------------------------------------------
  // 手番の行動
  // ------------------------------------------------------------------
  function emptyPutCells(s, p) {
    const out = [];
    for (let i = 0; i < GN; i++) if (s.cells[i].stack.length === 0 && canPutFor(s, i, p)) out.push(i);
    return out;
  }

  function mainActions(s, p, round) {
    const kinds = roundKinds(round || s.round);
    const acts = [];
    const empties = emptyPutCells(s, p);
    if (kinds.place) {
      const seen = new Set();
      for (const id of s.hands[p]) {
        const c = s.cards[id];
        if (kinds.place === 'base' && !isBase(c.color)) continue;
        const key = c.color + '/' + c.chip;
        if (seen.has(key)) continue;
        seen.add(key);
        for (const i of empties) acts.push({ type: 'place', cardId: id, to: i });
      }
    }
    if (kinds.move) {
      for (let i = 0; i < GN; i++) {
        for (const id of s.cells[i].stack) {
          if (s.cards[id].owner !== p) continue;
          for (const j of empties) acts.push({ type: 'move', cardId: id, from: i, to: j });
        }
      }
    }
    return acts;
  }

  function flagsFor(s, p) {
    return (s.turn && s.turn.player === p) ? s.turn.flags : { all: false, double: false };
  }

  function isLegalAction(s, p, act) {
    const flags = flagsFor(s, p);
    const ctx = ctxOf(act);
    const opts = enumerateOptions(s, p, ctx, flags);
    return opts.length > 0 && anyPlaceable(s, ctx, opts, capOf(flags));
  }

  function hasLegalAction(s, p) {
    for (const act of mainActions(s, p)) if (isLegalAction(s, p, act)) return true;
    return false;
  }

  // UI 用：手札のカードを置けるマス
  function legalPlaceCells(s, p, cardId) {
    const kinds = roundKinds(s.round);
    if (!kinds.place || !s.hands[p].includes(cardId)) return [];
    if (kinds.place === 'base' && !isBase(s.cards[cardId].color)) return [];
    return emptyPutCells(s, p).filter(i => isLegalAction(s, p, { type: 'place', cardId, to: i }));
  }
  // UI 用：盤上の自分のカードの移動先
  function legalMoveCells(s, p, cardId) {
    const kinds = roundKinds(s.round);
    if (!kinds.move) return [];
    const loc = findCard(s, cardId);
    if (!loc || loc.where !== 'cell' || s.cards[cardId].owner !== p) return [];
    return emptyPutCells(s, p).filter(i => isLegalAction(s, p, { type: 'move', cardId, from: loc.idx, to: i }));
  }

  function optionsFor(s, p, act) {
    return enumerateOptions(s, p, ctxOf(act), flagsFor(s, p));
  }
  function grayNeed(s, p, act, opts) {
    return maxGray(s, p, ctxOf(act), opts, capOf(flagsFor(s, p)), []);
  }

  function commitTurn(s, p, act, assigns) {
    assigns = assigns || [];
    if (s.phase !== 'play') return fail('対戦中ではありません');
    if (currentPlayer(s) !== p) return fail('手番ではありません');
    const kinds = roundKinds(s.round);
    if (act.type === 'place') {
      if (!kinds.place) return fail('このラウンドは設置できません');
      if (!s.hands[p].includes(act.cardId)) return fail('手札にないカードです');
      if (kinds.place === 'base' && !isBase(s.cards[act.cardId].color)) return fail('R1・R3 は手札の原色か白しか置けません');
    } else if (act.type === 'move') {
      if (!kinds.move) return fail('このラウンドは移動できません');
      const loc = findCard(s, act.cardId);
      if (!loc || loc.where !== 'cell' || loc.idx !== act.from) return fail('盤上にないカードです');
      if (s.cards[act.cardId].owner !== p) return fail('自分のカードしか動かせません');
    } else return fail('不明な行動です');
    if (!canPutFor(s, act.to, p) || s.cells[act.to].stack.length) return fail(`${cellName(act.to)}には置けません`);
    const flags = s.turn.flags;
    const ctx = ctxOf(act);
    const opts = enumerateOptions(s, p, ctx, flags);
    if (!opts.length || !anyPlaceable(s, ctx, opts, capOf(flags))) return fail('合成が起きないマスです');
    const v = validateAssigns(s, p, ctx, opts, assigns, flags);
    if (!v.ok) return v;
    if (act.type === 'place') s.hands[p].splice(s.hands[p].indexOf(act.cardId), 1);
    else { const st = s.cells[act.from].stack; st.splice(st.indexOf(act.cardId), 1); }
    s.cells[act.to].stack.push(act.cardId);
    const created = [];
    for (const a of assigns) {
      const o = opts[a.opt];
      const id = s.piles[o.color].shift();
      s.cards[id].owner = p;
      s.cells[a.cell].stack.push(id);
      created.push({ id, cell: a.cell, color: o.color });
    }
    if (s.log) {
      const verb = act.type === 'place' ? `${cellName(act.to)}に${cname(s, act.cardId)}を設置`
        : `${cname(s, act.cardId)}を${cellName(act.from)}から${cellName(act.to)}へ移動`;
      const made = created.length ? ` → ${created.map(c => `${cname(s, c.id)}(${cellName(c.cell)})`).join('、')}` : ' → 合成なし';
      log(s, `${pname(s, p)}：${verb}${made}`);
    }
    endTurn(s);
    return ok({ created, opts });
  }

  function passTurn(s, p) {
    if (s.phase !== 'play' || currentPlayer(s) !== p) return fail('手番ではありません');
    if (hasLegalAction(s, p)) return fail('置ける手があるのでパスできません');
    log(s, `${pname(s, p)}：合法手がないためパス`);
    endTurn(s);
    return ok();
  }

  // ------------------------------------------------------------------
  // アイテム
  // ------------------------------------------------------------------
  function canUseItems(s, p) {
    return s.phase === 'play' && currentPlayer(s) === p && (s.round >= 4 || s.turn.itemsUsed < 1);
  }
  function unusedItems(s, p) {
    const seen = new Set();
    return s.items[p].filter(o => !o.used && !seen.has(o.type) && seen.add(o.type)).map(o => o.type);
  }
  function boardLoc(s, id) {
    const loc = findCard(s, id);
    return loc && loc.where === 'cell' ? loc : null;
  }
  // 相手がロックしたマスのカード（p のリターン・スライド・チェンジ・スピンの対象にできない）
  function isGuarded(s, p, id) {
    const loc = boardLoc(s, id);
    if (!loc) return false;
    const lk = s.cells[loc.idx].lock;
    return lk !== null && lk !== p;
  }
  const GUARD_MSG = '相手がロックしたマスのカードは選べません';

  function useItem(s, p, type, params) {
    params = params || {};
    if (s.phase !== 'play' || currentPlayer(s) !== p) return fail('手番ではありません');
    if (!(s.round >= 4 || s.turn.itemsUsed < 1)) return fail('R1〜R3 はアイテムを1手番に1つまでしか使えません');
    const it = s.items[p].find(o => o.type === type && !o.used);
    if (!it) return fail('そのアイテムは持っていません');
    const opp = 1 - p;
    let msg = '';
    switch (type) {
      case 'all':
      case 'double':
        if (s.turn.flags[type]) return fail('すでに使っています');
        s.turn.flags[type] = true;
        msg = 'この手番に適用';
        break;
      case 'spin': {
        const a = boardLoc(s, params.mine), b = boardLoc(s, params.theirs);
        if (!a || !b) return fail('盤上のカードを選んでください');
        const A = s.cards[params.mine], B = s.cards[params.theirs];
        if (A.owner !== p || B.owner !== opp) return fail('自分のカードと相手のカードを1枚ずつ選んでください');
        if (isGuarded(s, p, A.id) || isGuarded(s, p, B.id)) return fail(GUARD_MSG);
        if (COLOR[A.color].pts !== COLOR[B.color].pts) return fail('同じ点数のカードを選んでください');
        A.owner = opp; B.owner = p;
        msg = `${cellName(a.idx)}の${cname(s, A.id)}と${cellName(b.idx)}の${cname(s, B.id)}の所有者を交換`;
        break;
      }
      case 'change': {
        const a = boardLoc(s, params.cardId);
        if (!a) return fail('盤上のカードを選んでください');
        if (isGuarded(s, p, params.cardId)) return fail(GUARD_MSG);
        const A = s.cards[params.cardId];
        const col = params.color;
        if (!COLOR[col] || col === A.color) return fail('別の色を選んでください');
        if (COLOR[col].pts !== COLOR[A.color].pts) return fail('同じ点数の色しか選べません');
        if (!s.piles[col].length) return fail(`${COLOR[col].name}の在庫がありません`);
        const nid = s.piles[col].shift();
        s.cards[nid].owner = A.owner;
        s.cells[a.idx].stack[a.pos] = nid;
        A.owner = null;
        s.piles[A.color].unshift(A.id);
        msg = `${cellName(a.idx)}の${cname(s, A.id)}を${cname(s, nid)}と交換`;
        break;
      }
      case 'reset': {
        const a = boardLoc(s, params.cardId);
        if (!a) return fail('盤上のカードを選んでください');
        if (isGuarded(s, p, params.cardId)) return fail(GUARD_MSG);
        const A = s.cards[params.cardId];
        s.cells[a.idx].stack.splice(a.pos, 1);
        s.hands[A.owner].push(A.id);
        sortHands(s);
        msg = `${cellName(a.idx)}の${cname(s, A.id)}を${pname(s, A.owner)}の手札に戻す`;
        break;
      }
      case 'slide': {
        const a = boardLoc(s, params.cardId);
        const d = DIRS[params.dir];
        if (!a || !d) return fail('盤上のカードと方向を選んでください');
        if (isGuarded(s, p, params.cardId)) return fail(GUARD_MSG);
        const nx = X(a.idx) + d[0], ny = Y(a.idx) + d[1];
        if (!inGrid(nx, ny)) return fail('その方向には動かせません');
        const j = idx(nx, ny);
        if (!canPutFor(s, j, p) || s.cells[j].stack.length) return fail('その方向には動かせません');
        s.cells[a.idx].stack.splice(a.pos, 1);
        s.cells[j].stack.push(params.cardId);
        msg = `${cname(s, params.cardId)}を${cellName(a.idx)}から${cellName(j)}へ`;
        break;
      }
      case 'lock': {
        const i = params.idx;
        if (!(i >= 0 && i < GN) || !cellExists(s, i)) return fail('盤上のマスを選んでください');
        const c = s.cells[i];
        if (c.stack.length || c.obj || c.lock !== null) return fail('空きマスを選んでください');
        c.lock = p;
        msg = `${cellName(i)}をロック`;
        break;
      }
      case 'wide': {
        if (s.wide) return fail('すでにワイドが使われています');
        if (!['top', 'bottom', 'left', 'right'].includes(params.side)) return fail('辺を選んでください');
        s.wide = { owner: p, side: params.side };
        msg = { top: '上', bottom: '下', left: '左', right: '右' }[params.side] + '側に1列を追加';
        break;
      }
      case 'remote':
      case 'portal': {
        const i = params.idx;
        if (!(i >= 0 && i < GN) || !canPutFor(s, i, p) || s.cells[i].stack.length) return fail('自分が置ける空きマスを選んでください');
        s.cells[i].obj = { type, owner: p };
        msg = `${cellName(i)}に設置`;
        break;
      }
      default:
        return fail('不明なアイテムです');
    }
    it.used = true;
    it.round = s.round;
    s.turn.itemsUsed++;
    log(s, `${pname(s, p)}：${ITEM[type].name}（${msg}）`);
    return ok();
  }

  function tryItem(s, p, type, params) {
    return useItem(clone(s), p, type, params);
  }

  // ------------------------------------------------------------------
  // 得点
  // ------------------------------------------------------------------
  // 同じ色でつながったかたまり（上下左右のマス、または同じマスに重なったカード）のボーナス
  // 2枚なら1枚につき2点、3枚以上なら1枚につき3点を、それぞれのカードの持ち主に
  const groupPer = n => (n >= 3 ? 3 : n === 2 ? 2 : 0);
  // stFn(マス) のカードで色ごとのかたまりを作り、visit(大きさ, [持ち主0の枚数, 持ち主1の枚数]) を呼ぶ
  function eachGroup(s, stFn, visit) {
    const byColor = new Map();
    for (let i = 0; i < GN; i++) {
      const st = stFn(i);
      if (!st.length) continue;
      for (const id of st) {
        const c = s.cards[id];
        let m = byColor.get(c.color);
        if (!m) byColor.set(c.color, m = new Map());
        let tt = m.get(i);
        if (!tt) m.set(i, tt = [0, 0]);
        tt[c.owner === 1 ? 1 : 0]++;
      }
    }
    for (const m of byColor.values()) {
      const visited = new Set();
      for (const start of m.keys()) {
        if (visited.has(start)) continue;
        const cnt = [0, 0];
        const q = [start];
        visited.add(start);
        while (q.length) {
          const j = q.pop();
          const tt = m.get(j);
          cnt[0] += tt[0]; cnt[1] += tt[1];
          const x = X(j), y = Y(j);
          for (const [dx, dy] of ORTH) {
            const nx = x + dx, ny = y + dy;
            if (!inGrid(nx, ny)) continue;
            const k = idx(nx, ny);
            if (!visited.has(k) && m.has(k)) { visited.add(k); q.push(k); }
          }
        }
        visit(cnt[0] + cnt[1], cnt);
      }
    }
  }
  function score(s) {
    const r = [0, 1].map(() => ({ board: 0, bonus: 0, hand: 0, komi: 0, total: 0 }));
    for (let i = 0; i < GN; i++) {
      if (!cellExists(s, i)) continue;
      for (const id of s.cells[i].stack) r[s.cards[id].owner].board += COLOR[s.cards[id].color].pts;
    }
    eachGroup(s, j => s.cells[j].stack, (n, cnt) => {
      const per = groupPer(n);
      r[0].bonus += per * cnt[0];
      r[1].bonus += per * cnt[1];
    });
    for (const p of [0, 1]) for (const id of s.hands[p]) r[p].hand += COLOR[s.cards[id].color].pts;
    r[1 - s.first].komi = s.settings.komi;
    for (const x of r) x.total = x.board + x.bonus + x.hand + x.komi;
    return r;
  }
  function finalResult(s) {
    const sc = score(s);
    const winner = sc[0].total === sc[1].total ? null : (sc[0].total > sc[1].total ? 0 : 1);
    return { scores: sc, winner };
  }
  function evalDiff(s, p) {
    const sc = score(s);
    return sc[p].total - sc[1 - p].total;
  }
  // CPU 用の重み付き評価：カードの点数はそのまま、かたまりボーナスは adjW 倍
  function evalW(s, p, adjW) {
    const sc = score(s), q = 1 - p;
    return (sc[p].board + sc[p].hand + sc[p].komi) - (sc[q].board + sc[q].hand + sc[q].komi) + adjW * (sc[p].bonus - sc[q].bonus);
  }

  // CPU の考え方の設定
  //  adjW : かたまりボーナスの重み（1 = 得点どおり）
  //  mob  : 次のラウンドに自分の合法手がなくなる手への減点（0 = 考えない）
  //  pick : 'best' 最善手 / 'prop' 上位 k 手を評価値の比率で抽選 / 'soft' 上位 k 手を最善手との差で抽選
  const BASE_AI = { adjW: 1, mob: 0, pick: 'best', k: 3, temp: 1 };
  // CPU の強さ。どれもかたまりボーナスを 0.7 倍で評価する（R1 で同色を並べて R2 に詰まる癖がなくなる）
  const AI_LEVELS = {
    easy: { adjW: 0.7, mob: 0, pick: 'prop', k: 3, temp: 1 },
    normal: { adjW: 0.7, mob: 0, pick: 'soft', k: 3, temp: 1 },
    hard: { adjW: 0.7, mob: 0, pick: 'best', k: 3, temp: 1 },
  };
  const AI_LABEL = { easy: 'やさしい', normal: 'ふつう', hard: 'つよい' };
  const DEFAULT_AI = Object.assign({}, AI_LEVELS.normal);

  // ------------------------------------------------------------------
  // CPU（貪欲法：この手番の得点差を最大化）
  // ------------------------------------------------------------------
  // 盤全体のかたまりボーナスの差（p 視点：自分 − 相手）
  function groupBonusDiff(s, p, stFn) {
    let d = 0;
    eachGroup(s, stFn, (n, cnt) => { d += groupPer(n) * (p === 0 ? cnt[0] - cnt[1] : cnt[1] - cnt[0]); });
    return d;
  }
  // カード（color, owner）を i に足したときの、かたまりボーナスの得点差（p 視点）の変化
  // stFn：仮の盤のマスのカード、exFn：この手番に仮置きした生成カード（{color, owner}）
  function addGroupDiff(s, p, i, color, owner, stFn, exFn) {
    const tally = j => {
      let n = 0, net = 0;
      for (const id of stFn(j)) { const c = s.cards[id]; if (c.color === color) { n++; net += c.owner === p ? 1 : -1; } }
      for (const e of exFn(j)) if (e.color === color) { n++; net += e.owner === p ? 1 : -1; }
      return [n, net];
    };
    const neighbors = j => {
      const out = [], x = X(j), y = Y(j);
      for (const [dx, dy] of ORTH) {
        const nx = x + dx, ny = y + dy;
        if (inGrid(nx, ny)) out.push(idx(nx, ny));
      }
      return out;
    };
    const visited = new Set();
    let totalN = 1, totalNet = owner === p ? 1 : -1, oldVal = 0;
    for (const st of [i].concat(neighbors(i))) {
      if (visited.has(st) || tally(st)[0] === 0) continue;
      let n = 0, net = 0;
      const q = [st];
      visited.add(st);
      while (q.length) {
        const j = q.pop();
        const [a, b] = tally(j);
        n += a; net += b;
        for (const k of neighbors(j)) if (!visited.has(k) && tally(k)[0] > 0) { visited.add(k); q.push(k); }
      }
      oldVal += groupPer(n) * net;
      totalN += n; totalNet += net;
    }
    return groupPer(totalN) * totalNet - oldVal;
  }
  const noExtra = () => EMPTY;

  // 置いた・動かしたカード自身による、かたまりボーナスの変化（base：手を打つ前の値）
  function selfDelta(s, p, act, base) {
    if (base === undefined) base = groupBonusDiff(s, p, j => s.cells[j].stack);
    const ctx = ctxOf(act);
    return groupBonusDiff(s, p, j => stackAt(s, ctx, j)) - base;
  }

  // 生成カードの配置（灰色は最大枚数を優先、それ以外は貪欲）
  function planOutputs(s, p, ctx, opts, flags, adjW) {
    if (adjW === undefined) adjW = 1;
    const cap = capOf(flags);
    const extra = new Map();
    const exFn = j => extra.get(j) || EMPTY;
    const stFn = j => stackAt(s, ctx, j);
    const cnt = j => stackAt(s, ctx, j).length + (extra.has(j) ? extra.get(j).length : 0);
    const pileLeft = {};
    const left = c => (pileLeft[c] === undefined ? s.piles[c].length : pileLeft[c]);
    const assigns = [];
    let value = 0, grays = 0;
    const valueAt = (o, j) => COLOR[o.color].pts + adjW * addGroupDiff(s, p, j, o.color, p, stFn, exFn);
    const push = (k, j) => {
      if (!extra.has(j)) extra.set(j, []);
      extra.get(j).push({ color: opts[k].color, owner: p });
      pileLeft[opts[k].color] = left(opts[k].color) - 1;
    };
    const pop = (k, j) => {
      extra.get(j).pop();
      if (!extra.get(j).length) extra.delete(j);
      pileLeft[opts[k].color] = left(opts[k].color) + 1;
    };
    const grayKs = [];
    opts.forEach((o, k) => { if (o.color === 'gray') grayKs.push(k); });
    if (grayKs.length) {
      let best = { n: -1, v: -Infinity, list: [] };
      const cur = [];
      const dfs = (t, n, v) => {
        if (t === grayKs.length) {
          if (n > best.n || (n === best.n && v > best.v)) best = { n, v, list: cur.slice() };
          return;
        }
        const k = grayKs[t];
        if (left('gray') > 0) {
          for (const j of opts[k].cells) {
            if (cnt(j) >= cap) continue;
            const dv = valueAt(opts[k], j);
            push(k, j); cur.push({ k, j });
            dfs(t + 1, n + 1, v + dv);
            cur.pop(); pop(k, j);
          }
        }
        dfs(t + 1, n, v);
      };
      dfs(0, 0, 0);
      for (const { k, j } of best.list) {
        value += valueAt(opts[k], j);
        push(k, j);
        assigns.push({ opt: k, cell: j });
        grays++;
      }
    }
    const rest = [];
    opts.forEach((o, k) => { if (o.color !== 'gray') rest.push(k); });
    const done = new Set();
    for (;;) {
      let best = null;
      for (const k of rest) {
        if (done.has(k)) continue;
        const o = opts[k];
        if (left(o.color) <= 0) continue;
        for (const j of o.cells) {
          if (cnt(j) >= cap) continue;
          let contention = 0;
          for (const k2 of rest) if (k2 !== k && !done.has(k2) && opts[k2].cells.includes(j)) contention++;
          const v = valueAt(o, j) - contention * 0.01;
          if (!best || v > best.v) best = { k, j, v };
        }
      }
      if (!best) break;
      done.add(best.k);
      value += valueAt(opts[best.k], best.j);
      push(best.k, best.j);
      assigns.push({ opt: best.k, cell: best.j });
    }
    return { assigns, value, grays };
  }

  // UI 用：CPU と同じ考え方で生成カードの置き場所を決める
  function autoAssign(s, p, act) {
    const flags = flagsFor(s, p);
    const ctx = ctxOf(act);
    return planOutputs(s, p, ctx, enumerateOptions(s, p, ctx, flags), flags, DEFAULT_AI.adjW).assigns;
  }
  // UI 用：仮置きの内容で決定できるか
  function checkAssigns(s, p, act, opts, assigns) {
    return validateAssigns(s, p, ctxOf(act), opts, assigns, flagsFor(s, p));
  }

  const NOFLAGS = { all: false, double: false };

  // この手を打った後、次のラウンドに自分の合法手が残るか（相手の手は考えない近似）
  function keepsMoves(s, p, act, assigns, round) {
    if (round >= 4) return true;
    const c = clone(s);
    if (!commitTurn(c, p, act, assigns).ok) return true;
    for (const a of mainActions(c, p, round + 1)) {
      const ctx = ctxOf(a);
      const opts = enumerateOptions(c, p, ctx, NOFLAGS);
      if (opts.length && anyPlaceable(c, ctx, opts, 1)) return true;
    }
    return false;
  }

  // 1手先の最善手を探す。value はこの手の評価値（p 視点の重み付き得点差の変化）。
  function searchBest(s, p, o) {
    o = o || {};
    const ai = Object.assign({}, DEFAULT_AI, o.ai || {});
    const round = o.round || s.round;
    const flags = o.flags || flagsFor(s, p);
    const cap = capOf(flags);
    const acts = mainActions(s, p, round);
    const base0 = groupBonusDiff(s, p, j => s.cells[j].stack);
    const cands = [];
    let legal = 0, nonGray = 0;
    for (const act of acts) {
      const ctx = ctxOf(act);
      const opts = enumerateOptions(s, p, ctx, flags);
      if (!opts.length || !anyPlaceable(s, ctx, opts, cap)) continue;
      legal++;
      const plan = planOutputs(s, p, ctx, opts, flags, ai.adjW);
      if (plan.grays === 0) nonGray++;
      const v = ai.adjW * selfDelta(s, p, act, base0) + plan.value + (o.rng ? o.rng() * (o.noise || 0) : 0);
      cands.push({ value: v, act, assigns: plan.assigns, grays: plan.grays });
    }
    if (ai.mob > 0 && round < 4 && cands.length > 1 && s.phase === 'play' && currentPlayer(s) === p) {
      cands.sort((a, b) => b.value - a.value);
      for (const c of cands.slice(0, 6)) if (!keepsMoves(s, p, c.act, c.assigns, round)) c.value -= ai.mob;
    }
    let best = null;
    for (const c of cands) if (!best || c.value > best.value) best = c;
    return { best, legal, grayForced: legal > 0 && nonGray === 0, cands };
  }

  // 最終的な手の選び方
  function pickMove(cands, ai, rng) {
    const top = cands.slice().sort((a, b) => b.value - a.value).slice(0, Math.max(1, ai.k || 3));
    let ws;
    if (ai.pick === 'prop') ws = top.map(c => Math.max(0.1, c.value));
    else { const vmax = top[0].value; ws = top.map(c => Math.exp((c.value - vmax) / (ai.temp || 1))); }
    const sum = ws.reduce((a, b) => a + b, 0);
    let r = rng() * sum;
    for (let i = 0; i < top.length; i++) { r -= ws[i]; if (r <= 0) return top[i]; }
    return top[0];
  }

  // アイテムの使用候補（全候補を静的な得点差で並べ、上位だけ深く読む）
  function itemCandidates(s, p, type, rng, ai) {
    const adjW = ai ? ai.adjW : 1;
    const opp = 1 - p;
    const out = [];
    const boardCards = [];
    for (let i = 0; i < GN; i++) for (const id of s.cells[i].stack) if (!isGuarded(s, p, id)) boardCards.push({ id, i });
    const nearCards = () => {
      const res = [];
      for (const i of emptyPutCells(s, p)) {
        const x = X(i), y = Y(i);
        let near = false;
        for (let dy = -1; dy <= 1 && !near; dy++) for (let dx = -1; dx <= 1 && !near; dx++) {
          if (!dx && !dy) continue;
          const nx = x + dx, ny = y + dy;
          if (inGrid(nx, ny) && s.cells[idx(nx, ny)].stack.length) near = true;
        }
        if (near) res.push(i);
      }
      return res;
    };
    switch (type) {
      case 'all': case 'double': out.push({}); break;
      case 'wide': if (!s.wide) ['top', 'bottom', 'left', 'right'].forEach(side => out.push({ side })); break;
      case 'spin':
        for (const a of boardCards) for (const b of boardCards) {
          const A = s.cards[a.id], B = s.cards[b.id];
          if (A.owner === p && B.owner === opp && COLOR[A.color].pts === COLOR[B.color].pts) out.push({ mine: a.id, theirs: b.id });
        }
        break;
      case 'change':
        for (const a of boardCards) {
          const A = s.cards[a.id];
          for (const col of COLOR_ORDER) {
            if (col !== A.color && COLOR[col].pts === COLOR[A.color].pts && s.piles[col].length) out.push({ cardId: a.id, color: col });
          }
        }
        break;
      case 'reset':
        for (const a of boardCards) out.push({ cardId: a.id });
        break;
      case 'slide':
        for (const a of boardCards) for (const dir of Object.keys(DIRS)) {
          const nx = X(a.i) + DIRS[dir][0], ny = Y(a.i) + DIRS[dir][1];
          if (!inGrid(nx, ny)) continue;
          const j = idx(nx, ny);
          if (canPutFor(s, j, p) && !s.cells[j].stack.length) out.push({ cardId: a.id, dir });
        }
        break;
      case 'remote': case 'portal': {
        const cs = shuffle(nearCards(), rng);
        if (type === 'remote') {
          // 盤の端（ループの起点）で、その列か行にカードがあるマス
          const lineHas = (i) => {
            const x = X(i), y = Y(i);
            for (let k = 0; k < 6; k++) if (s.cells[idx(x, k)].stack.length || s.cells[idx(k, y)].stack.length) return true;
            return false;
          };
          const edges = emptyPutCells(s, p).filter(i => { const x = X(i), y = Y(i); return inMain(x, y) && (x === 0 || x === 5 || y === 0 || y === 5) && lineHas(i) && !cs.includes(i); });
          shuffle(edges, rng).slice(0, 6).forEach(i => cs.push(i));
        }
        cs.forEach(i => out.push({ idx: i }));
        break;
      }
      default: break;
    }
    if (['spin', 'change', 'reset', 'slide'].includes(type) && out.length > 3) {
      const base = evalW(s, p, adjW);
      const scored = out.map(params => {
        const c = clone(s);
        const r = useItem(c, p, type, params);
        return { params, v: r.ok ? evalW(c, p, adjW) - base + rng() * 0.2 : -Infinity };
      }).sort((a, b) => b.v - a.v);
      return scored.slice(0, 3).map(x => x.params);
    }
    return out;
  }

  // ロック：自分の手の後に相手が狙う最善のマスをふさいだ場合の、相手の得点の減り方
  function lockCandidates(s, p, base, rng, ai) {
    if (!base.best) return [];
    const nextExists = !(s.round === 4 && s.turnPos === 1);
    if (!nextExists) return [];
    const after = clone(s);
    if (!commitTurn(after, p, base.best.act, base.best.assigns).ok) return [];
    const opp = 1 - p;
    const oppRes = searchBest(after, opp, { rng, noise: 0, ai });
    if (!oppRes.best) return [];
    const cells = [oppRes.best.act.to].concat(oppRes.best.assigns.map(a => a.cell));
    const out = [];
    for (const i of cells) {
      if (out.some(c => c.idx === i)) continue;
      const c = s.cells[i];
      if (!cellExists(s, i) || c.stack.length || c.obj || c.lock !== null) continue;
      if (i === base.best.act.to || base.best.assigns.some(a => a.cell === i)) continue;
      out.push({ idx: i, oppValue: oppRes.best.value });
      if (out.length >= 3) break;
    }
    return out;
  }

  const ITEM_THRESHOLD = [0, 6, 5, 4, 0.01];

  function cpuPlan(s, p, rng, opt) {
    opt = opt || {};
    rng = rng || Math.random;
    const noise = opt.noise === undefined ? 0.3 : opt.noise;
    const ai = Object.assign({}, DEFAULT_AI, opt.ai || {});
    let cur = clone(s);
    let base = searchBest(cur, p, { rng, noise, ai });
    const legalAtStart = base.legal;
    const items = [];
    const th = ITEM_THRESHOLD[s.round] || 0.01;
    for (let guard = 0; guard < 8; guard++) {
      if (!canUseItems(cur, p)) break;
      const avail = unusedItems(cur, p);
      if (!avail.length) break;
      const baseVal = base.best ? base.best.value : 0;
      const baseEval = evalW(cur, p, ai.adjW);
      let pick = null;
      for (const t of avail) {
        if (t === 'lock') {
          for (const cand of lockCandidates(cur, p, base, rng, ai)) {
            const c2 = clone(cur);
            if (!useItem(c2, p, 'lock', { idx: cand.idx }).ok) continue;
            const r = searchBest(c2, p, { rng, noise, ai });
            if (!r.best) continue;
            const after = clone(c2);
            if (!commitTurn(after, p, r.best.act, r.best.assigns).ok) continue;
            const oppRes = searchBest(after, 1 - p, { rng, noise: 0, ai });
            const oppVal = oppRes.best ? oppRes.best.value : 0;
            const gain = (r.best.value - baseVal) + (cand.oppValue - oppVal);
            if (!pick || gain > pick.gain) pick = { t, params: { idx: cand.idx }, gain, state: c2, res: r };
          }
          continue;
        }
        for (const params of itemCandidates(cur, p, t, rng, ai)) {
          const c2 = clone(cur);
          if (!useItem(c2, p, t, params).ok) continue;
          const r = searchBest(c2, p, { rng, noise, ai });
          const gain = (evalW(c2, p, ai.adjW) - baseEval) + (r.best ? r.best.value : 0) - baseVal;
          if (!pick || gain > pick.gain) pick = { t, params, gain, state: c2, res: r };
        }
      }
      if (pick && pick.gain >= th) {
        items.push({ type: pick.t, params: pick.params, gain: pick.gain });
        cur = pick.state;
        base = pick.res;
        if (s.round < 4) break;
      } else break;
    }
    let chosen = base.best;
    if (chosen && ai.pick !== 'best' && base.cands.length > 1) chosen = pickMove(base.cands, ai, rng);
    return {
      items,
      act: chosen ? chosen.act : null,
      assigns: chosen ? chosen.assigns : [],
      legal: legalAtStart,
      grayForced: base.grayForced,
      value: chosen ? chosen.value : 0,
    };
  }

  function cpuDraft(s, rng) {
    return draftSets(s).map(set => set.items[rng() < 0.5 ? 0 : 1]);
  }
  // 初期配置は読み合い。つよい同士で初期カードだけを変えたときの先攻の勝率：
  //   先攻＼後攻   白    原色
  //   白          46%   57%
  //   原色        54%   47%
  // 先攻は相手と違う種類、後攻は同じ種類を出したい。決め打ちすると読まれるので、つよいは混ぜる：
  // 先攻は白4割・原色6割、後攻は白5割・原色5割（原色は手札でいちばん少ない色）。こうすると先攻の勝率はほぼ5割。
  // ふつうは6割、やさしいは3割でこの選び方をし、それ以外は手札の原色か白から均等に選ぶ。
  function cpuInitial(s, p, rng, ai) {
    const hand = s.hands[p];
    const opts = [];
    for (const id of hand) { const c = s.cards[id].color; if (isBase(c) && !opts.some(o => s.cards[o].color === c)) opts.push(id); }
    if (!opts.length) return hand[0];
    const pick = (ai && ai.pick) || 'best';
    const pStrong = pick === 'best' ? 1 : pick === 'soft' ? 0.6 : 0.3;
    if (rng() >= pStrong) return opts[Math.floor(rng() * opts.length)];
    const white = hand.find(id => s.cards[id].color === 'white');
    const cnt = {};
    for (const id of hand) { const c = s.cards[id].color; if (PRIMARY[c]) cnt[c] = (cnt[c] || 0) + 1; }
    const cols = Object.keys(cnt);
    if (!cols.length) return white !== undefined ? white : opts[0];
    const min = Math.min.apply(null, cols.map(c => cnt[c]));
    const rare = cols.filter(c => cnt[c] === min);
    const col = rare[Math.floor(rng() * rare.length)];
    const prim = hand.find(id => s.cards[id].color === col);
    if (white === undefined) return prim;
    return rng() < (p === s.first ? 0.4 : 0.5) ? white : prim;
  }

  // CPU の計画を実際の状態に適用する
  function applyPlan(s, p, plan) {
    for (const it of plan.items) {
      const r = useItem(s, p, it.type, it.params);
      if (!r.ok) return r;
    }
    if (plan.act) return commitTurn(s, p, plan.act, plan.assigns);
    return passTurn(s, p);
  }

  // ------------------------------------------------------------------
  // シミュレーション
  // ------------------------------------------------------------------
  function simulateGame(settings, seed, ais) {
    const rng = rng32((seed ^ 0x9E3779B9) >>> 0);
    const s = newGame(Object.assign({}, settings, { first: undefined }), seed);
    s.log = null;
    const rec = { legal: [], grays: [], items: [], stockout: {} };
    if (s.phase === 'draft') applyDraft(s, cpuDraft(s, rng));
    applyInitial(s, [cpuInitial(s, 0, rng, ais ? ais[0] : undefined), cpuInitial(s, 1, rng, ais ? ais[1] : undefined)]);
    while (s.phase === 'play') {
      const p = currentPlayer(s);
      const round = s.round;
      const seat = p === s.first ? 0 : 1;
      const plan = cpuPlan(s, p, rng, { noise: 0.3, ai: ais ? ais[p] : undefined });
      rec.legal.push({ round, seat, n: plan.legal });
      for (const it of plan.items) rec.items.push({ seat, type: it.type, round });
      const r = applyPlan(s, p, plan);
      if (!r.ok) throw new Error('simulation: ' + r.error);
      if (r.created) {
        const g = r.created.filter(c => c.color === 'gray').length;
        if (g) rec.grays.push({ round, seat, n: g, forced: plan.grayForced });
      }
      for (const k of GEN_COLORS) if (rec.stockout[k] === undefined && s.piles[k].length === 0) rec.stockout[k] = round;
    }
    const res = s.result;
    rec.scores = [res.scores[s.first].total, res.scores[1 - s.first].total]; // [先攻, 後攻]
    rec.winnerSeat = res.winner === null ? null : (res.winner === s.first ? 0 : 1);
    rec.held = [s.items[s.first].map(o => ({ type: o.type, used: o.used, round: o.round })),
      s.items[1 - s.first].map(o => ({ type: o.type, used: o.used, round: o.round }))];
    return rec;
  }

  function aggregate(recs, settings) {
    const n = recs.length;
    const out = { n, settings };
    const wins = [0, 0], draws = { n: 0 };
    let sum = [0, 0];
    const diffs = [];
    for (const r of recs) {
      if (r.winnerSeat === null) draws.n++; else wins[r.winnerSeat]++;
      sum[0] += r.scores[0]; sum[1] += r.scores[1];
      diffs.push(r.scores[0] - r.scores[1]);
    }
    out.wins = wins; out.draws = draws.n;
    out.avgScore = [sum[0] / n, sum[1] / n];
    out.avgDiff = diffs.reduce((a, b) => a + b, 0) / n;
    out.diffs = diffs;
    // 合法手
    const leg = {};
    for (const r of recs) for (const l of r.legal) {
      const k = l.round + '-' + l.seat;
      if (!leg[k]) leg[k] = { sum: 0, n: 0, zero: 0 };
      leg[k].sum += l.n; leg[k].n++; if (!l.n) leg[k].zero++;
    }
    out.legal = [];
    for (let rd = 1; rd <= 4; rd++) for (const seat of [0, 1]) {
      const v = leg[rd + '-' + seat] || { sum: 0, n: 0, zero: 0 };
      out.legal.push({ round: rd, seat, avg: v.n ? v.sum / v.n : 0, passRate: v.n ? v.zero / v.n : 0 });
    }
    // 灰色
    let gTotal = 0, gForced = 0, gGames = 0;
    for (const r of recs) {
      if (r.grays.length) gGames++;
      for (const g of r.grays) { gTotal += g.n; if (g.forced) gForced += g.n; }
    }
    out.gray = { total: gTotal, forced: gForced, chosen: gTotal - gForced, games: gGames };
    // 在庫切れ
    out.stockout = GEN_COLORS.map(k => {
      const rs = recs.map(r => r.stockout[k]).filter(v => v !== undefined);
      return { color: k, rate: rs.length / n, avgRound: rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : null };
    });
    // アイテム
    const items = {};
    ITEM_ORDER.forEach(t => { items[t] = { held: 0, points: 0, used: 0, rounds: [0, 0, 0, 0, 0] }; });
    for (const r of recs) for (const seat of [0, 1]) {
      const pts = r.winnerSeat === null ? 0.5 : (r.winnerSeat === seat ? 1 : 0);
      for (const h of r.held[seat]) {
        const it = items[h.type];
        it.held++; it.points += pts;
        if (h.used) { it.used++; it.rounds[h.round]++; }
      }
    }
    out.items = ITEM_ORDER.filter(t => items[t].held).map(t => {
      const it = items[t];
      return { type: t, held: it.held, winRate: it.points / it.held, useRate: it.used / it.held, rounds: it.rounds.slice(1) };
    });
    out.sets = settings.sets.map(id => {
      const set = SETS.find(x => x.id === id);
      const a = out.items.find(x => x.type === set.items[0]);
      const b = out.items.find(x => x.type === set.items[1]);
      return { id, name: set.name, a: set.items[0], b: set.items[1], aRate: a ? a.winRate : null, bRate: b ? b.winRate : null, diff: (a && b) ? a.winRate - b.winRate : null };
    });
    return out;
  }

  return {
    COLOR, COLOR_ORDER, PRIMARY, isBase, CHIPS, GEN_COLORS, ITEM, ITEM_ORDER, SETS, ROUND_LABEL, START, DIRS,
    idx, X, Y, inMain, inGrid, cellName, cellExists, canPutFor, wideCells, GN,
    rng32, shuffle, newGame, clone, findCard, currentPlayer, roundKinds, draftSets,
    applyDraft, applyInitial, enumerateOptions, ctxOf, optionsFor, grayNeed, freeCells,
    validateAssigns, legalPlaceCells, legalMoveCells, isLegalAction, hasLegalAction, mainActions,
    commitTurn, passTurn, canUseItems, unusedItems, useItem, tryItem, isGuarded,
    score, finalResult, evalDiff,
    searchBest, cpuPlan, cpuDraft, cpuInitial, applyPlan, simulateGame, aggregate,
    autoAssign, checkAssigns, evalW, BASE_AI, AI_LEVELS, AI_LABEL, DEFAULT_AI, pickMove,
    _test: { groupBonusDiff, addGroupDiff },
  };
});

  const pct = v => (v * 100).toFixed(0) + '%';

  const nameOf = p => app.g.settings.names[p];

  // ------------------------------------------------------------------

  // ------------------------------------------------------------------
  // アイテムの効果プレビュー（設定画面）
  // ------------------------------------------------------------------
  const ITEM_DETAIL = {
    all: { when: 'この手番だけ有効', text: 'この手番の合成判定を、上下左右に加えて斜めでも行います。斜めに連続する2〜3枚がレシピに合えば、その斜めの並びの端に色を置けます。' },

  };
  // 例の盤：cards は [x, y, 色, 持ち主(0=自分 1=相手), チップ, 強調]
  const DEMO = {

  function paintCard(color, owner, chip, cls) {
    const nm = C[color].name;
    return `<div class="card p-${color}${owner === 1 ? ' rot' : ''}${cls ? ' ' + cls : ''}"><span class="pt">${ptsText(C[color].pts)}</span>` +
      (chip ? `<span class="chip q-${chip}"></span>` : '') + `<span class="nm${nm.length > 1 ? ' long' : ''}">${nm}</span>` +
      (owner === 0 || owner === 1 ? '<span class="bar"></span>' : '') + '</div>';
  }
  function demoBoard(d) {
    const at = (list, x, y) => (list || []).some(a => a[0] === x && a[1] === y);
    let html = '';
    for (let y = 0; y < d.h; y++) {
      for (let x = 0; x < d.w; x++) {
        const cls = ['cell', d.wideRow === y ? 'wide' : 'main'];
        if (at(d.free, x, y)) cls.push('free');
        if (at(d.legal, x, y)) cls.push('legal');
        const cards = d.cards.filter(c => c[0] === x && c[1] === y).map(c => paintCard(c[2], c[3], c[4], c[5]));
        let inner = cards.length === 1 ? cards[0] : cards.length > 1 ? `<div class="stack2">${cards.join('')}</div>` : '';
        const ob = (d.objs || []).find(o => o[0] === x && o[1] === y);
        if (ob) inner += `<div class="obj${ob[3] === 1 ? ' rot' : ' mine'}">${ICON[ob[2]]}</div>`;
        const lk = (d.locks || []).find(o => o[0] === x && o[1] === y);
        if (lk) inner += `<div class="lockmark${lk[2] === 1 ? ' rot' : ''}">${ICON.lock}</div>`;
        html += `<div class="${cls.join(' ')}">${inner}</div>`;
      }
    }
    const side = d.side ? `<div class="dside"><small>${d.side.label}</small>${d.side.cards.length ? d.side.cards.map(c => paintCard(c[0], c[1], null, c[2])).join('') : '<span class="dnone">なし</span>'}</div>` : '';
    return `<div class="dwrap"><div class="dmat" style="grid-template-columns:repeat(${d.w}, var(--cell));grid-template-rows:repeat(${d.h}, var(--cell))">${html}</div>${side}</div>`;
  }
