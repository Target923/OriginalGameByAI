    const w = { t, oldCells: shown.slice(), oldMask: maskOf(shown), key: null, size: null, cat: null, treasure: hadT && !v.treasureFound, by };
    if (by === 'answer') { w.key = p.shape; w.size = p.size; w.cat = p.cat; w.fullCells = oldCells.slice(); }
    else { w.partial = true; w.trigger = plan.trigger; }
    let reticle = -1;
    if (by === 'trigger') {
      reticle = p.cells[idx];
      const t2 = this._tick();
      p.hitMask = bit(reticle); p.hitOrder = [reticle];
      v.marks[reticle] = { r: 'wp', t: t2 };
      kb.calls.push({ c: reticle, t: t2, r: 'wp' });
      w.reticle = reticle; w.reticleT = t2;
    }
    kb.warps.push(w);
    this._emit({ type: 'warpfire', owner: p.owner, actor, by, from: shown.slice(), trigger: by === 'trigger' ? plan.trigger : null, reticle, treasureMoved: hadT, ownerPriv: { oldCells, newCells: p.cells.slice() } });
    const tl = hadT ? '・トレジャーログがリセット' : '';
    const pubTxt = `${owner.name}：ワープ発動（移動前 ${coordList(shown, N)}${reticle >= 0 ? `・ワープレティクル ${this.coord(reticle)}` : '・移動先は不明'}）${tl}`;
    const privTxt = `${owner.name}：ワープ発動（移動前 ${coordList(oldCells, N)} → 移動後 ${coordList(p.cells, N)}）${tl}`;
    this._log(p.owner, pubTxt, privTxt, 'item', 'warp');
    // 1ブロックのキューブ（バズーカの破片）は、移動先のレティクルで全ブロックに当たったことになるので、そこで撃破
    let destroyed = null;
    if (p.hitMask === p.mask) {
      this._destroy(p, 'destroy');
      destroyed = { size: p.size, cells: p.cells.slice(), isAdd: p.isAdd };
      this._log(actor, `${A.name}：${pieceName(p)}を撃破（${coordList(p.cells, N)}）`, null, 'kill');
    }
    return { shown, reticle, destroyed };
  };

  Game.prototype._destroy = function (piece, cause) {
    piece.alive = false;
    piece.cause = cause;
    piece.deadAt = this._tick();
    const viewer = this.players[1 - piece.owner];
    for (const c of piece.cells) viewer.view.dead[c] = { pieceId: piece.id, size: piece.size, shape: piece.shape, cause, isAdd: piece.isAdd, frag: !!piece.frag };
    viewer.kb.deads.push({
      cells: piece.cells.slice(), mask: piece.mask, size: piece.size, cat: piece.cat, key: piece.shape,
      isAdd: piece.isAdd, frag: !!piece.frag, t: this.clock, cause,
    });
    if (!piece.isAdd) viewer.score.attack += piece.size;
    this._emit({ type: 'destroy', owner: piece.owner, cells: piece.cells.slice(), size: piece.size, isAdd: piece.isAdd, key: piece.shape, cause });
  };

  Game.prototype._checkEnd = function () {
    if (this.phase !== 'play') return this.phase === 'over';
    const a0 = this.living(0).length > 0, a1 = this.living(1).length > 0;
    if (a0 && a1) return false;
    this.phase = 'over';
    this.sub = null;
    this.pending = null;
    const winner = !a0 && !a1 ? -1 : (a0 ? 0 : 1);
    for (const P of this.players) {
      P.score.survival = P.pieces.filter((p) => p.alive && !p.isAdd).reduce((s, p) => s + p.size, 0);
      P.score.total = P.score.attack + P.score.survival + P.score.treasure - P.score.rebuy;
    }
    let tiebreak = -1;
    if (winner === -1) {
      const t0 = this.players[0].score.total, t1 = this.players[1].score.total;
      tiebreak = t0 === t1 ? -1 : (t0 > t1 ? 0 : 1);
    }
    this.result = { winner, draw: winner === -1, tiebreak };
    this._emit({ type: 'over', result: this.result });
    this._log(-1, winner === -1 ? '両者全滅で引き分け' : `${this.players[winner].name}の勝利`, null, 'system');
    return true;
  };

  // ---------------- アイテム ----------------
  Game.prototype.itemStatus = function (pi, key) {
    const P = this.players[pi];
    const inPlay = (this.itemKeys || ITEM_KEYS).indexOf(key) >= 0;
    const have = inPlay ? (P.items[key] || 0) : 0;
    // 大会の予選：1試合で同じ種類は1回まで（2つ持っていても、この試合ではもう使えない）
    const usedUp = !!(this.oncePerMatch && P.used[key]);
    const canRebuy = inPlay && !usedUp && have <= 0 && !!P.used[key] && P.wallet >= 3;
    const inPhase = this._myTurn(pi, ['item', 'answer']) && !this.itemUsed;
    return { inPlay, have, canRebuy, usedUp, usable: inPlay && inPhase && !usedUp && (have > 0 || canRebuy), rebuyNeeded: have <= 0 };
  };

  // ワープの移動先（v15）：キューブ p を、向き t・位置 (r0, c0) に置けるか。
  //  ・向きは、いまの向きを回したものだけ（裏返し＝反転はしない。ユーザーの決定）
  //  ・空きブロックだけ：ほかの生きているキューブ・撃破されたキューブのあったブロック・いまの自分の位置とは重ねない
  //  ・ほかのキューブがワープを待っている移動先とも重ねない（発動したとき、必ずその場所が空いているように）
  Game.prototype._warpDest = function (pi, p, t, r0, c0) {
    const N = this.N;
    if (!Number.isInteger(t) || t < 0 || t > 7) return { ok: false, reason: '向きが正しくありません' };
    if (!rotationOf(p.shape, p.t, t)) return { ok: false, reason: 'ワープは回転だけで、裏返し（反転）はできません' };
    // 左右対称な形は、裏返しの向きの番号でも回転と同じ形になる。形は同じでも、ブロックの順番（どのブロックがトリガーか）は
    //  裏返しの対応になってしまうので、回転の向きの番号に直してから置く（移動後のレティクル・トレジャーの位置が、回転で正しく対応するように）
    if ((t & 4) !== (p.t & 4)) { const sig = ORIENT[p.shape][t].sig; for (let r = 0; r < 4; r++) if (ORIENT[p.shape][(p.t & 4) | r].sig === sig) { t = (p.t & 4) | r; break; } }
    const cells = cellsFor(p.shape, t, r0, c0, N);
    if (!cells) return { ok: false, reason: '盤面からはみ出します' };
    const m = maskOf(cells);
    if (m & this.livingMask(pi, p.id)) return { ok: false, reason: 'ほかのキューブと重なります' };
    if (m & p.mask) return { ok: false, reason: '移動前の位置とは重ねられません' };
    if (m & this.deadMask(pi)) return { ok: false, reason: '撃破済みのキューブがあったブロックには置けません' };
    for (const q of this.players[pi].pieces) if (q.alive && q !== p && q.warpPlan && (q.warpPlan.mask & m)) return { ok: false, reason: 'ほかのキューブのワープ先と重なります' };
    return { ok: true, cells, mask: m, t };
  };
  // キューブ p の、いま選べるワープの移動先をすべて（向きと位置）。空なら、このキューブはワープできない
  Game.prototype.warpOptions = function (pi, p) {
    const out = [], N = this.N, seen = new Set();
    for (let t = 0; t < 8; t++) {
      const o = ORIENT[p.shape][t];
      for (let r0 = 0; r0 + o.h <= N; r0++) for (let c0 = 0; c0 + o.w <= N; c0++) {
        const d = this._warpDest(pi, p, t, r0, c0);
        if (!d.ok || seen.has(d.mask)) continue;   // 同じ形が重なる向き（R型の2×2など）は1つにまとめる
        seen.add(d.mask);
        out.push({ t: d.t, r0, c0, cells: d.cells, mask: d.mask });
      }
    }
    return out;
  };
  // いまワープを使えるキューブ（ステルス中・ワープ待ちでなく、まだ当たっていないブロックがあり、移動先が1つ以上ある）
  Game.prototype.warpable = function (pi) {
    return this.living(pi).filter((p) => !p.stealth && !p.warpPlan && p.hitMask !== p.mask && this.warpOptions(pi, p).length > 0);
  };

  Game.prototype.validateItem = function (pi, key, params) {
    const N = this.N, NN = this.NN;
    const me = this.players[pi];
    const v = me.view;
    params = params || {};
    const inRange = (c) => Number.isInteger(c) && c >= 0 && c < NN;
    switch (key) {
      case 'cube':
        if (params.kind === 'cat' && CATS.indexOf(params.value) >= 0) return { ok: true };
        if (params.kind === 'size' && [1, 2, 3, 4, 5].indexOf(params.value) >= 0) return { ok: true };
        return { ok: false, reason: '形状かブロック数を選んでください' };
      case 'line':
        if ((params.line === 'row' || params.line === 'col') && Number.isInteger(params.index) && params.index >= 0 && params.index < N) return { ok: true };
        return { ok: false, reason: '列か行を選んでください' };
      case 'number':
      case 'shape':
      case 'node':
        if (inRange(params.cell) && !v.dead[params.cell]) return { ok: true };
        return { ok: false, reason: '調べるブロックを選んでください' };
      case 'bazooka':
        if (inRange(params.cell) && !v.dead[params.cell]) return { ok: true };
        return { ok: false, reason: '撃ち込むブロックを選んでください（撃破済みのブロックは選べません）' };
      case 'pair':
        if (!inRange(params.a) || !inRange(params.b) || params.a === params.b) return { ok: false, reason: '違うブロックを2つ選んでください' };
        if (v.dead[params.a] || v.dead[params.b]) return { ok: false, reason: '撃破済みのブロックは選べません' };
        return { ok: true };
      case 'warp': {
        // ワープ（v15。ユーザーの案）：使うときは「どのキューブを・どのブロックをトリガーにして・どこへ移すか」を決めておくだけ。
        //  キューブが動くのは、トリガーブロックをコールされたときか、アンサーで当てられたとき（_warpFire）
        const p = me.pieces.find((x) => x.id === params.pieceId && x.alive);
        if (!p) return { ok: false, reason: 'ワープするキューブを選んでください' };
        // ステルス中のキューブはワープできない（v14）。ワープを待っているキューブにも重ねては使えない（1つのキューブに1つまで）
        if (p.stealth) return { ok: false, reason: 'ステルス中のキューブはワープできません' };
        if (p.warpPlan) return { ok: false, reason: 'そのキューブはすでにワープを待っています' };
        // トリガーブロック：そのキューブの、まだ当たっていない（コールされていない）ブロック
        if (!Number.isInteger(params.cell) || !(p.mask & bit(params.cell))) return { ok: false, reason: 'トリガーブロックにする、そのキューブのブロックを選んでください' };
        if (p.hitMask & bit(params.cell)) return { ok: false, reason: 'トリガーブロックは、まだ当たっていないブロックから選んでください' };
        const dest = this._warpDest(pi, p, params.t, params.r0, params.c0);
        if (!dest.ok) return dest;
        return { ok: true, cells: dest.cells, mask: dest.mask, t: dest.t, piece: p };
      }
      case 'stealth': {
        const p = me.pieces.find((x) => x.id === params.pieceId && x.alive);
        if (!p) return { ok: false, reason: 'ステルスにする自分のキューブを選んでください' };
        if (p.stealth) return { ok: false, reason: 'そのキューブはすでにステルス中です' };
        if (p.warpPlan) return { ok: false, reason: 'ワープを待っているキューブにはステルスを使えません' };   // v15：1つのキューブに防御アイテムは1つまで
        if (p.stealthRevealed) return { ok: false, reason: '見破られたキューブには使えません' };
        // トリガーブロック（v14.2）：隠すキューブのブロックを1つ選ぶ。まだ当たっていないブロックに限る（当たったブロックは二度とコールされず、弱点にならないため）
        if (!Number.isInteger(params.cell) || !(p.mask & bit(params.cell))) return { ok: false, reason: 'トリガーブロックにする、そのキューブのブロックを選んでください' };
        if (p.hitMask & bit(params.cell)) return { ok: false, reason: 'トリガーブロックは、まだ当たっていないブロックから選んでください' };
        return { ok: true, piece: p };
      }
    }
    return { ok: false, reason: '不明なアイテムです' };
  };

  Game.prototype.useItem = function (pi, key, params) {
    const st = this.itemStatus(pi, key);
    if (!st.usable) return { ok: false, reason: 'いまはアイテムを使えません' };
    const val = this.validateItem(pi, key, params);
    if (!val.ok) return val;
    const me = this.players[pi], foe = this.foeOf(pi);
    const fromSub = this.sub;
    if (st.rebuyNeeded) {
      me.wallet -= 3; me.score.rebuy += 3; me.rebuys += 1;
    } else {
      me.items[key] -= 1;
    }
    me.used[key] = true;
    this.itemUsed = true;
    const t = this._tick();
    const name = ITEMS[key].name;
    const tag = st.rebuyNeeded ? '（再購入）' : '';
    const N = this.N;
    let result = { ok: true, key };
    const livingFoe = this.living(foe.idx).filter((p) => !p.stealth);   // 隠れているステルスのキューブは数えない（v14）
    let emitted = false;
    switch (key) {
      case 'cube': {
        const n = livingFoe.filter((p) => (params.kind === 'cat' ? p.cat === params.value : p.size === params.value)).length;
        me.kb.counts.push({ t, turn: this.turn, kind: params.kind, value: params.value, n });
        result.n = n;
        const what = params.kind === 'cat' ? params.value : params.value + 'ブロック';
        this._log(pi, `${me.name}：${name}${tag}（${what}）→ 残り${n}キューブ`, null, 'item', key);
        break;
      }
      case 'line': {
        // その列・行にかかっている（1ブロックでも入っている）生きているキューブの数と、それらが占めているブロックの数（v12.12）。
        // バズーカの破片は1ブロックのキューブ1つずつとして数える
        const lm = lineMask(params.line, params.index, N);
        let occ = 0, k = 0;
        for (const p of livingFoe) { occ |= p.mask; if (p.mask & lm) k++; }
        const n = popcount(occ & lm);
        me.kb.counts.push({ t, turn: this.turn, kind: 'line', line: params.line, index: params.index, n, k });
        result.n = n;
        result.k = k;
        this._log(pi, `${me.name}：${name}${tag}（${lineLabel(params.line, params.index)}）→ 残り${k}キューブ / ${n}ブロック`, null, 'item', key);
        break;
      }
      case 'number': {
        const p = this._seenAt(foe.idx, params.cell);
        const size = p ? p.size : 0;
        if (size) me.kb.occs.push({ c: params.cell, t, cat: null, size, turn: this.turn, src: 'number' });
        else me.kb.empties.push({ c: params.cell, t, turn: this.turn, src: 'number' });
        result.size = size;
        this._log(pi, `${me.name}：${name}${tag}（${this.coord(params.cell)}）→ ${size ? size + 'ブロック' : 'NoData'}`, null, 'item', key);
        break;
      }
      case 'shape': {
        const p = this._seenAt(foe.idx, params.cell);
        const cat = p ? p.cat : null;
        if (cat) me.kb.occs.push({ c: params.cell, t, cat, turn: this.turn, src: 'shape' }); else me.kb.empties.push({ c: params.cell, t, turn: this.turn, src: 'shape' });
        result.cat = cat;
        this._log(pi, `${me.name}：${name}${tag}（${this.coord(params.cell)}）→ ${cat || 'NoData'}`, null, 'item', key);
        break;
      }
      case 'pair': {
        const pa = this._seenAt(foe.idx, params.a), pb = this._seenAt(foe.idx, params.b);
        const same = !!pa && pa === pb;
        me.kb.pairs.push({ t, turn: this.turn, a: params.a, b: params.b, same });
        result.same = same;
        this._log(pi, `${me.name}：${name}${tag}（${this.coord(params.a)}と${this.coord(params.b)}）→ ${same ? '同じキューブ' : '同じキューブではない'}`, null, 'item', key);
        break;
      }
      case 'node': {
        // そのブロックのキューブで、上下左右につながっている同じキューブのブロックの数（0〜3）。空きブロックは NoData
        const p = this._seenAt(foe.idx, params.cell);
        const k = p ? nodeDegree(p.mask, params.cell, N) : null;
        me.kb.nodes.push({ t, turn: this.turn, c: params.cell, k });
        if (k == null) me.kb.empties.push({ c: params.cell, t, turn: this.turn, src: 'node' });
        else me.kb.occs.push({ c: params.cell, t, cat: null, deg: k, turn: this.turn, src: 'node' });
        result.k = k;
        this._log(pi, `${me.name}：${name}${tag}（${this.coord(params.cell)}）→ ${k == null ? 'NoData' : 'つながり' + k}`, null, 'item', key);
        break;
      }
      case 'bazooka': {
        // そのブロックのキューブを1ブロックのキューブに分解する。ヒット済みのブロックはその場で撃破。空きブロックと、隠れているステルスのキューブは NoData
        const p = this._seenAt(foe.idx, params.cell);
        const ev = { type: 'item', actor: pi, key, rebuy: st.rebuyNeeded, cell: params.cell, owner: foe.idx, hit: !!p, killed: [] };
        if (!p) {
          me.kb.empties.push({ c: params.cell, t, turn: this.turn, src: 'bazooka' });
          result.hit = false;
          this._log(pi, `${me.name}：${name}${tag}（${this.coord(params.cell)}）→ NoData`, null, 'item', key);
          this._emit(ev);
          emitted = true;
          break;
        }
        ev.killed = p.cells.filter((c) => p.hitMask & bit(c));
        ev.ownerPriv = { frags: p.cells.filter((c) => !(p.hitMask & bit(c))) };
        this._emit(ev);
        emitted = true;
        // すでに1ブロックのキューブ（分解の破片）なら、形はそのまま（ステルスだけ解除）。撃った側には、ふつうの分解と同じに見える
        // （破片をもう一度分解すると、元のキューブの数え方（大会で失ったか・置いた数）がくずれるため）
        let sp;
        if (p.frag || p.size === 1) { p.stealth = false; p.stealthAt = null; sp = { killed: [], frags: [p.cells[0]] }; }
        else sp = this._split(p);
        me.kb.splits.push({ t, turn: this.turn, c: params.cell, killed: sp.killed.slice() });
        result.hit = true;
        result.killed = sp.killed;
        const kill = sp.killed.length ? `ヒット済みの${sp.killed.length}ブロックを撃破（${coordList(sp.killed, N)}）` : 'ヒット済みのブロックはなし';
        this._log(pi, `${me.name}：${name}${tag}（${this.coord(params.cell)}）→ キューブを1ブロックのキューブに分解・${kill}`, null, 'item', key);
        result.ended = this._checkEnd();
        break;
      }
      case 'warp': {
        // ワープ（v15）：ここでは決めておくだけ（キューブはまだ動かない）。使ったことは相手にも伝わるが、
        //  どのキューブか・トリガーブロック・移動先は伏せる。動くのは _warpFire（トリガーのコール・アンサーで当てられたとき）
        const p = val.piece;
        p.warpPlan = { at: t, trigger: params.cell, t: val.t, r0: params.r0, c0: params.c0, cells: val.cells.slice(), mask: val.mask };
        foe.kb.warpUses.push({ t });
        result.cells = p.cells.slice();
        this._log(pi, `${me.name}：${name}${tag}`, `${me.name}：${name}${tag}（${coordList(p.cells, N)} のキューブ・トリガー ${this.coord(params.cell)} → 移動先 ${coordList(val.cells, N)}）`, 'item', key);
        break;
      }
      case 'stealth': {
        // どのキューブにしたかは相手に伏せる（使ったことだけが伝わる）
        const p = val.piece;
        p.stealth = true;
        p.stealthAt = t;
        p.stealthTrigger = params.cell;
        // ステルスの番号（使った順に1・2…。見破られたら STEALTH HIT に添える。v14.3）
        me.stealthCount = (me.stealthCount || 0) + 1;
        p.stealthNo = me.stealthCount;
        foe.kb.stealths.push({ t, num: p.stealthNo });   // num：ステルスの番号（STEALTH HIT に出るので相手も知る）
        result.cells = p.cells.slice();
        this._log(pi, `${me.name}：${name}${tag}`, `${me.name}：${name}${tag}（${coordList(p.cells, N)} のキューブ）`, 'item', key);
        break;
      }
    }
    const pub = { type: 'item', actor: pi, key, rebuy: st.rebuyNeeded };
    if (key === 'cube' || key === 'line') { pub.n = result.n; }
    if (key === 'cube') { pub.kind = params.kind; pub.value = params.value; }
    if (key === 'line') { pub.line = params.line; pub.index = params.index; pub.k = result.k; }
    if (key === 'number') { pub.cell = params.cell; pub.size = result.size; }
    if (key === 'shape') { pub.cell = params.cell; pub.cat = result.cat; }
    if (key === 'pair') { pub.a = params.a; pub.b = params.b; pub.same = result.same; }
    if (key === 'node') { pub.cell = params.cell; pub.k = result.k; }
    // ワープ（v15）：本人の演出用に、キューブ・トリガー・移動先（相手には送らない。net.js の redactFor が priv を消す）
    if (key === 'warp') { pub.priv = { cells: result.cells, trigger: params.cell, dest: val.cells.slice() }; }
    if (key === 'stealth') { pub.priv = { cells: result.cells }; }
    if (!emitted) this._emit(pub);
    this.lastAction = { kind: 'item', pi, key, result };
    if (this.phase !== 'play') return result;   // バズーカで全滅させたとき
    this.sub = fromSub === 'answer' ? 'answer' : 'call';
    return result;
  };

  // ---------------- バズーカ（分解） ----------------
  // キューブを1ブロックのキューブに分解する。ヒット済みのブロックはその場で撃破（撃破ポイント1ブロック1pt）、ステルスは解除。
  // トレジャーは、そのブロックの1ブロックのキューブのものになる（ニアの「同じキューブ」はそのブロックだけ）。
  // 分解はその試合だけ：元のキューブは splitPieces に残し、大会では次の試合で元の形に戻す
  Game.prototype._split = function (piece) {
    const P = this.players[piece.owner];
    const N = this.N;
    P.pieces.splice(P.pieces.indexOf(piece), 1);
    P.splitPieces.push({ id: piece.id, shape: piece.shape, size: piece.size, cells: piece.cells.slice(), turn: this.turn, t: this.clock, col: piece.col });
    const frags = [];
    for (const c of piece.cells) {
      const f = this._makePiece(P, 'A1', 0, Math.floor(c / N), c % N, [c]);
      f.isAdd = false;
      f.frag = true;
      f.fromId = piece.id;
      f.col = piece.col;   // 破片は元のキューブの色・柄のまま
      if (piece.hitMask & bit(c)) { f.hitMask = f.mask; f.hitOrder = [c]; }
      P.pieces.push(f);
      frags.push(f);
    }
    if (P.treasure && P.treasure.pieceId === piece.id) {
      const f = frags.find((x) => x.cells[0] === P.treasure.cell);
      if (f) { P.treasure.pieceId = f.id; P.treasure.idx = 0; }
    }
    const killed = [];
    for (const f of frags) if (f.hitMask) { this._destroy(f, 'bazooka'); killed.push(f.cells[0]); }
    return { killed, frags: frags.filter((f) => f.alive).map((f) => f.cells[0]) };
  };

  // 試合のまとめ（大会の集計用）：得点、失ったキューブ（大会から消える）、残った手持ちのアイテム
  //  バズーカで分解されたキューブは、1ブロックのキューブが1つでも生き残っていれば失わない（次の試合で元のブロック数に戻る）
  Game.prototype.summary = function () {
    return this.players.map((P) => {
      const lost = [];
      for (const p of P.pieces) if (!p.frag && !p.isAdd && !p.alive) lost.push(p.size);
      for (const sp of P.splitPieces) if (!P.pieces.some((f) => f.frag && f.fromId === sp.id && f.alive)) lost.push(sp.size);
      const placed = P.pieces.filter((p) => !p.frag && !p.isAdd).map((p) => p.size).concat(P.splitPieces.map((sp) => sp.size));
      const used = Object.keys(P.used).filter((k) => P.used[k]);
      return {
        name: P.name, attack: P.score.attack, survival: P.score.survival, treasure: P.score.treasure,
        lost: lost.sort((a, b) => a - b), placed: placed.sort((a, b) => a - b), items: Object.assign({}, P.items), used,
        treasureFound: !!P.view.treasureFound,
      };
    });
  };

  // ---------------- リプレイ（v12.9） ----------------
  // 先攻の抽選のほかに運の要素がないので、操作（配置・トレジャー・ドラフト・アイテム・コール・アンサー・差し出し・
  // トレジャーコール・ターンエンドなど）を順に記録しておけば、同じ操作をやり直してどの場面でも同じ盤面を再現できる。
  // 操作の中から呼ばれる操作（おまかせ配置の中の配置など）は、外側だけを記録する。断られた操作（ok: false）は記録しない
  //  配置の途中の操作（試しに置いて外すなど。CPUは何十通りも試す）は、配置を終えたときに、決まった配置1つ（_setupState）にまとめる
  const REC_METHODS = ['placePiece', 'removePiece', 'clearSetup', 'setTreasure', 'finishSetup', 'draftPick', 'call', 'skipCall', 'answer', 'sacrifice', 'endTurn', 'treasureCall', 'useItem'];
  const SETUP_METHODS = { placePiece: 1, removePiece: 1, clearSetup: 1, setTreasure: 1 };
  let recDepth = 0;
  for (const m of REC_METHODS) {
    const f = Game.prototype[m];
    Game.prototype[m] = function () {
      if (recDepth || !this.actions) return f.apply(this, arguments);
      const args = JSON.parse(JSON.stringify(Array.prototype.slice.call(arguments)));
      let pre = null;
      if (m === 'finishSetup') { const P = this.players[args[0]]; if (P) pre = JSON.parse(JSON.stringify({ pieces: P.pieces, treasure: P.treasure, nextId: P.nextId })); }
      recDepth++;
      let r;
      try { r = f.apply(this, arguments); } finally { recDepth--; }
      if (r && r.ok === false) return r;
      if (m === 'finishSetup' && pre) {
        this.actions = this.actions.filter((a) => !(SETUP_METHODS[a[0]] && a[1] === args[0]));
        this.actions.push(['_setupState', args[0], pre]);
      }
      this.actions.push([m].concat(args));
      return r;
    };
  }
  // 配置を終えたときの、その人の配置（キューブの番号も含めてそのまま戻す）
  Game.prototype._setupState = function (pi, s) {
    const P = this.players[pi];
    P.pieces = JSON.parse(JSON.stringify(s.pieces));
    P.treasure = s.treasure ? Object.assign({}, s.treasure) : null;
    P.nextId = s.nextId;
    return { ok: true };
  };
  Game.prototype.replayRecord = function () {
    if (!this.actions || !this.initOpts) return null;
    return { v: VERSION, opts: this.initOpts, first: this.first, actions: this.actions.slice() };
  };
  // 記録のはじめの n 個の操作をやり直した対戦（n を省くと最後まで）
  function replayGame(rec, n) {
    const g = new Game(Object.assign({}, rec.opts, { first: rec.first, rng: () => 0.5 }));
    g.actions = null;   // やり直しの間は記録しない
    const k = n == null ? rec.actions.length : Math.min(n, rec.actions.length);
    for (let i = 0; i < k; i++) { const a = rec.actions[i]; g[a[0]].apply(g, a.slice(1)); }
    return g;
  }
  // リプレイの場面：対戦が始まった時点（配置とドラフトの後）を最初の場面にし、ターンエンドを除く操作ごとに1場面。
  //  n＝そこまでの操作の数、ev・log＝そこまでのイベント・ログの数、turn・actor＝その操作をしたターンと人、m・key＝操作（アイテムの種類）
  //  end＝その手番（ターンの中の1人分）の最後の場面
  function replayFrames(rec) {
    const g = replayGame(rec, 0);
    const frames = [];
    let started = false;
    for (let i = 0; i < rec.actions.length; i++) {
      const a = rec.actions[i], m = a[0];
      const turn = g.turn;
      g[m].apply(g, a.slice(1));
      if (!started) {
        if (g.phase === 'play' || g.phase === 'over') { started = true; frames.push({ n: i + 1, start: true, ev: g.events.length, log: g.log.length, turn: g.turn, actor: g.cur }); }
        continue;
      }
      if (m === 'endTurn') continue;
      frames.push({ n: i + 1, m, key: m === 'useItem' ? a[2] : null, actor: a[1], turn, ev: g.events.length, log: g.log.length });
    }
    for (let f = 0; f < frames.length; f++) {
      const x = frames[f], y = frames[f + 1];
      x.end = !y || x.start || y.turn !== x.turn || y.actor !== x.actor;
    }
    return { frames, final: g };
  }

  // ------------------------------------------------------------------
  // 大会：4人（あなた＋CPU3人）の総当たりの予選3試合 → 上位2名で決勝
  //  ・持ち点（v12.10）：80点＋宝石4つ（1つ5点）＝100点で始め、相手のキューブを撃破するとそのブロック数を相手から奪う（アンサー失敗で差し出したキューブ・バズーカで撃破したブロックも同じ）。
  //    勝者はさらに勝利点（予選1試合目5・2試合目10・3試合目15・決勝20）を奪う。トレジャーを見つけると相手の宝石を1つ奪う。1pt＝1万円
  //  ・予選の順位は持ち点の順。同点は勝ち数 → 撃破ブロック数（撃破で奪ったブロック数）→ 抽選の順（v12.8。それまではすぐ抽選）
  //  ・キューブは大会を通して 2ブロック×5・3ブロック×4・4ブロック×3・5ブロック×2。撃破・アンサー失敗で失ったキューブは大会から消える
  //  ・アイテムは9種類を2つずつ持って始める（購入はない）。予選は1試合で同じ種類は1回まで
  //  ・決勝は予選の残り＋ドラフト（9種類から4つずつ）。予選1位が「先攻」か「ドラフト先行権（後攻）」を選ぶ
  //  ・決勝は全滅させた側が優勝（持ち点は関係ない）。賞金は優勝者の持ち点×1万円
  // 状態はふつうのオブジェクト（JSONで保存できる）で持ち、ここの関数で動かす
  // 大会に出るCPU：4人の中から毎回3人（v12.6）。それぞれ性格（置き方・アイテムの使い方）がある
  const TOUR_CHARS = [
    { key: 'alpha', name: 'CPU-α', persona: 'mass' },
    { key: 'beta', name: 'CPU-β', persona: 'save' },
    { key: 'gamma', name: 'CPU-γ', persona: 'steady' },
    { key: 'delta', name: 'CPU-δ', persona: 'items' },
  ];
  // 持ち点（v12.10）：80点＋宝石4つ（20点）＝100点で始める。キューブ44ブロック・予選の勝利点30（5＋10＋15）・宝石20をすべて失っても94点なので、予選でマイナスにならない
  const TOUR_START = 80;
  // CPUの性格（大会での置き方・アイテムの使い方。中身の方針はCPUの側で持つ）。名前と説明は画面に出す
  const TOUR_PERSONAS = {
    mass: { name: '物量型', desc: '毎試合キューブを多く置き、盤面を埋める' },
    save: { name: 'キューブ温存型', desc: '序盤は2ブロックを少なく置き、3・4ブロックを3試合目と決勝に温存する' },
    steady: { name: '堅実型', desc: '3・4ブロックのキューブで毎試合厚く置く' },
    items: { name: 'アイテム浪費型', desc: 'アイテムを惜しまず使い、序盤から押し切る' },
  };
  // 宝石（v12.6の終わり）：1人4つ（1つ5点）持って始め、各試合1つをトレジャーとして置く。相手に見つけられたら、その宝石は相手のものになる
  const TOUR_GEMS = 4;
  const TOUR_GEM_PTS = 5;
  const TOUR_TREASURE = TOUR_GEM_PTS;
  // 勝者が負けた側から奪う勝利点：予選1試合目5・2試合目10・3試合目15・決勝20（v12.10。3試合目＝1・2試合目の合計で、最後まで逆転しやすい。宝石1つ＝1試合目の勝ち）
  const TOUR_VICTORY_BY = [5, 10, 15, 20];
  const TOUR_VICTORY = TOUR_VICTORY_BY[0];
  // スピードペナルティ（予選だけ。v12.15まではスピードボーナス）：早いターンで負けた側の持ち点を減らす。index＝決着したターン（1ターン＝両者の手番）。
  // v12.16：1ターン目24・2ターン目21・18・15・12・9・6・8ターン目3、9ターン目から0（3点ずつ下がる）。アンサー失敗で負けても同じ。
  // 減らした点は勝った側に渡さない（自滅点）。渡すと、わざと早く負けて特定の相手に点を与える動き（利敵行為）ができてしまうため。
  // ねらいは、大差でリードしているときに2ブロック1個だけ置いて即負けし、キューブを温存する動きを防ぐこと。
  // v12.15は 52・42・33・25・18・12・7・3 を、v12.14は 15・14・12・9・5 を、勝った側が負けた側から奪っていた
  const TOUR_SPEED = [0, 24, 21, 18, 15, 12, 9, 6, 3];
  function speedFor(turn) { return TOUR_SPEED[turn | 0] || 0; }
  function victoryFor(kind, round) { return kind === 'final' ? TOUR_VICTORY_BY[3] : TOUR_VICTORY_BY[Math.max(0, Math.min(2, round | 0))]; }
  function victorySteal() { return TOUR_VICTORY; }
  // 大会の初期アイテム：9種類を2つずつ（合計18個。v12.5で購入を廃止して1つずつ→2つずつ）
  const TOUR_ITEMS_EACH = 2;
  const Tour = {
    START: TOUR_START,
    TREASURE: TOUR_TREASURE,
    VICTORY: TOUR_VICTORY,
    VICTORY_BY: TOUR_VICTORY_BY,
    SPEED: TOUR_SPEED,
    speedFor,
    GEMS: TOUR_GEMS,
    GEM_PTS: TOUR_GEM_PTS,
    victoryFor,
    PERSONAS: TOUR_PERSONAS,
    CHARS: TOUR_CHARS,
    // その人の性格（CPUだけ。あなた・性格なしの大会は null）
    persona(T, id) { const k = T.personas && T.personas[id]; return k && TOUR_PERSONAS[k] ? k : null; },
    victorySteal,
    ITEMS_EACH: TOUR_ITEMS_EACH,
    create(opts) {
      opts = opts || {};
      const rng = opts.rng || Math.random;
      // 出場するCPU：opts.chars（キーの配列）か、4人からランダムに3人（並びはα・β・γ・δの順）
      let lineup = Array.isArray(opts.chars) ? opts.chars.slice(0, 3) : null;
      if (!lineup) {
        const keys = TOUR_CHARS.map((c) => c.key);
        const out = keys.splice(Math.floor(rng() * keys.length), 1);
        lineup = TOUR_CHARS.map((c) => c.key).filter((k) => k !== out[0]);
      }
      const charOf = (k) => TOUR_CHARS.find((c) => c.key === k);
      const names = opts.names || ['あなた'].concat(lineup.map((k) => charOf(k).name));
      const cpu = opts.cpu || [false, true, true, true];
      const each = opts.itemsEach != null ? opts.itemsEach : TOUR_ITEMS_EACH;
      const players = names.map((name, i) => {
        const inv = {};
        for (const k of ITEM_KEYS) inv[k] = each;
        return {
          id: i, name, cpu: !!cpu[i], char: i > 0 ? lineup[i - 1] : null, stock: Object.assign({}, STOCK), inv,
          // take＝撃破で奪った、taken＝撃破で奪われた、vicWon／vicLost＝勝利で奪った／奪われた。gems＝持っている宝石（1つ5点）
          pts: { start: TOUR_START, take: 0, taken: 0, vicWon: 0, vicLost: 0, spdWon: 0, spdLost: 0 }, gems: TOUR_GEMS, gemsWon: 0, gemsLost: 0, wins: 0, losses: 0, draws: 0,
          lotto: rng(),
        };
      });
      // 総当たり（3ラウンド）：あなた（0番）の相手の順はランダム。同じラウンドに残りの2人が対戦する
      const others = [1, 2, 3];
      for (let i = others.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = others[i]; others[i] = others[j]; others[j] = t; }
      const rounds = others.map((o) => [[0, o], [1, 2, 3].filter((x) => x !== o)]);
      // CPUの性格：出場するCPUの性格（opts.personas に null を渡すと性格なし＝CPUはみな標準の置き方）
      const personas = opts.personas !== undefined ? opts.personas : { 1: charOf(lineup[0]).persona, 2: charOf(lineup[1]).persona, 3: charOf(lineup[2]).persona };
      return { v: VERSION, players, rounds, round: 0, results: [], stage: 'intro', finalists: null, finalFirstBy: null, champion: null, log: [], personas };
    },
    // 持ち点の合計＝はじめ50＋撃破で奪った−奪われた＋勝利で奪った−奪われた＋宝石×5
    total(p) { const q = p.pts; return q.start + q.take - q.taken + q.vicWon - q.vicLost + (q.spdWon | 0) - (q.spdLost | 0) + (p.gems | 0) * TOUR_GEM_PTS; },
    cubes(p) { return [2, 3, 4, 5].reduce((s, k) => s + (p.stock[k] || 0), 0); },
    cells(p) { return [2, 3, 4, 5].reduce((s, k) => s + k * (p.stock[k] || 0), 0); },
    items(p) { return ITEM_KEYS.reduce((s, k) => s + (p.inv[k] || 0), 0); },
    // 順位（持ち点の多い順。同点は勝ち数 → 撃破ブロック数 → 抽選）
    standings(T) {
      const list = T.players.map((p) => ({ id: p.id, total: Tour.total(p), wins: p.wins | 0, take: p.pts.take | 0, lotto: p.lotto }));
      list.sort((a, b) => b.total - a.total || b.wins - a.wins || b.take - a.take || b.lotto - a.lotto);
      list.forEach((x, i) => { x.rank = i + 1; });
      return list;
    },
    rankOf(T, id) { return Tour.standings(T).find((x) => x.id === id).rank; },
    // 対戦の設定（Game の opts）
    matchOpts(T, a, b, kind, extra) {
      const pa = T.players[a], pb = T.players[b];
      const fin = kind === 'final';
      const stockFor = (p) => {
        const st = Object.assign({}, p.stock);
        // 決勝で置けるキューブが0なら、2ブロックを1つ支給する
        if (fin && Tour.cubes(p) === 0) st[2] = 1;
        return st;
      };
      return Object.assign({
        rules: fin ? 'final' : 'prelim',
        label: fin ? '決勝' : `予選 第${T.round + 1}試合`,
        names: [pa.name, pb.name], cpu: [pa.cpu, pb.cpu],
        stocks: [stockFor(pa), stockFor(pb)],
        inventory: [Object.assign({}, pa.inv), Object.assign({}, pb.inv)],
        oncePerMatch: !fin, draftEach: fin ? Math.floor(ITEM_KEYS.length / 2) : 0, treasurePts: TOUR_TREASURE, treasureSteal: true,
        victoryPts: victoryFor(kind, T.round), speedBonus: !fin,
      }, extra || {});
    },
    // 試合の結果を反映する（a, b は大会の番号。game の 0番が a、1番が b）
    // 1試合の持ち点の増減（席ごと）：take＝撃破で奪った、taken＝撃破で奪われた、victory＝勝利で奪った（＋）／奪われた（−）、
    // gems＝宝石の増減（相手のトレジャーを見つけたら+1、自分のトレジャーを見つけられたら−1）、treasure＝宝石の点（×5）
    matchPoints(game) {
      const sum = game.summary();
      const r = game.result || { winner: -1, draw: true };
      const vp = game.victoryPts || TOUR_VICTORY;
      return [0, 1].map((k) => {
        const s = sum[k], o = sum[1 - k];
        const win = !r.draw && r.winner === k, lose = !r.draw && r.winner === 1 - k;
        const victory = win ? vp : lose ? -vp : 0;
        const gems = (s.treasureFound ? 1 : 0) - (o.treasureFound ? 1 : 0);
        const treasure = gems * TOUR_GEM_PTS;
        // スピードペナルティ（予選だけ）：決着したターンで決まる点を、負けた側から減らすだけ（勝った側は増えない。v12.16）
        const sp = game.speedBonus && !r.draw ? speedFor(game.turn) : 0;
        const speed = lose ? -sp : 0;
        return { take: s.attack, taken: o.attack, victory, speed, gems, treasure, total: s.attack - o.attack + victory + speed + treasure, placed: s.placed.length };
      });
    },
    apply(T, a, b, game, kind) {
      const sum = game.summary();
      const r = game.result || { winner: -1, draw: true };
      const ids = [a, b];
      const pts = Tour.matchPoints(game);
      ids.forEach((id, k) => {
        const p = T.players[id], s = sum[k], d = pts[k];
        p.pts.take += d.take; p.pts.taken += d.taken;
        p.gems = (p.gems | 0) + d.gems;
        if (sum[k].treasureFound) p.gemsWon = (p.gemsWon | 0) + 1;
        if (sum[1 - k].treasureFound) p.gemsLost = (p.gemsLost | 0) + 1;
        if (d.victory > 0) p.pts.vicWon += d.victory; else p.pts.vicLost -= d.victory;
        // spdWon は v12.15 までの「奪った」分（v12.16 からはいつも0。項目は持ち点の式とそろえて残す）
        if (d.speed > 0) p.pts.spdWon = (p.pts.spdWon | 0) + d.speed; else if (d.speed < 0) p.pts.spdLost = (p.pts.spdLost | 0) - d.speed;
        for (const size of s.lost) p.stock[size] = Math.max(0, (p.stock[size] || 0) - 1);
        p.inv = Object.assign({}, s.items);
        if (r.draw) p.draws += 1; else if (r.winner === k) p.wins += 1; else p.losses += 1;
      });
      const res = {
        round: T.round, kind: kind || 'prelim', a, b, first: ids[game.first], turns: game.turn,
        winner: r.draw ? -1 : ids[r.winner], draw: !!r.draw,
        pts, placed: sum.map((s) => s.placed.length),
        lost: sum.map((s) => s.lost), used: sum.map((s) => s.used), treasure: sum.map((s) => s.treasureFound),
        replay: game.replayRecord ? game.replayRecord() : null,   // リプレイ（途中経過の画面からいつでも見られる）
      };
      T.results.push(res);
      return res;
    },
    finalists(T) { const s = Tour.standings(T); return [s[0].id, s[1].id]; },
  };

  const api = {
    VERSION, COLS, STOCK, CATS, SHAPES, SHAPES_BY_SIZE, ORIENT, ITEM_KEYS, ITEMS,
    bit, popcount, bitsOf, maskOf, cellsFor, rotationOf, placements, identifyShape, matchPlacement, coord, coordList, lineMask, lineLabel, blockDist, nodeDegree, makeRules, Game, Tour, replayGame, replayFrames,
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.SBEngine = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script id="src-net">
/* サーチバトル — オンライン対戦（P2P・ホスト権威）
 *
 * しくみ（くわしくは docs/online.md）
 *  ・部屋を作った人（ホスト）の端末が審判。本当の盤面を持ち、ルールのプログラム（engine.js）で判定する。
 *  ・相手（ゲスト）は操作を送るだけ。ホストは判定のたびに「ゲストが見てよい情報だけにしたスナップショット」を送り、
 *    ゲストはそれで画面を描く。だからゲストの端末には、ホストのキューブの位置がそもそも届かない。
 *  ・端末どうしは WebRTC で直接つながる。つながる前の「住所の交換」（シグナリング）だけ PeerJS の無料クラウドを使う。
 *
 * このファイルの中身
 *  ① 部屋のコード・名前の整え方
 *  ② 伏せる：redactFor（ゲスト向けのスナップショット）・fullSnap（決着後の全部）・restore（スナップショットから対戦を作り直す）
 *  ③ 届いた操作の中身を確かめる：cleanArgs・cleanSetup
 *  ④ ホストの役（Host）とゲストの役（Guest）：メッセージを受け取って処理する。通信のしかたには関わらない
 *     （テストでは、同じプログラムの中でメッセージを直接渡して動かす。test/net_sim.js）
 *  ⑤ PeerJS の部分：読み込み・部屋を作る（openRoom）・部屋に入る（joinRoom）・つながりの見張り（wrapConn）
 *
 * ブラウザでは window.SBNet、Node では module.exports として公開する（engine.js と同じ形）。
 */
(function (root) {
  'use strict';
  const E = typeof module !== 'undefined' && module.exports ? require('./engine.js') : root.SBEngine;

  // ---------------- 定数 ----------------
  const APP = 'searchbattle';
  // 通信の約束ごと（メッセージの形）の版。形を変えたら上げる。ゲームの版（E.VERSION）と両方が同じ相手とだけ遊べる
  const NET_VERSION = 4;   // 2：v14.5 形の分類の名前が変わった（R型・L型・T型・Z型）／3：v15 ワープの作り直し（トリガーを送る・発動の演出 warpfire）／4：v15.1 ステルスの見破りがキューブごとに
  const HOST_SEAT = 0, GUEST_SEAT = 1;   // ホストは0番の席、ゲストは1番の席
  // PeerJS のクラウドはみんなで使う場所なので、ほかのアプリの ID とぶつからないよう頭に付ける
  const PEER_PREFIX = 'searchbattle-';
  // 部屋のコードに使う文字（32文字）。読み間違えやすい 0・O・1・I は使わない。6文字で約10億通り
  const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const CODE_LEN = 6;
  const PEERJS_URL = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js';
  // オンライン対戦を遊べるページ（GitHub Pages 版）。claude.ai の公開ページから案内する
  const PLAY_URL = 'https://target923.github.io/OriginalGameByAI/search_battle.html';
  // ゲストがホストに頼める操作（対戦中の操作だけ。配置は最後にまとめて setup で送る）
  const PLAY_ACTS = ['draftPick', 'call', 'useItem', 'answer', 'skipCall', 'endTurn', 'treasureCall', 'sacrifice'];
  // ホストが自分で実行したとき、ゲストに新しい状態を送る操作（配置の途中は送らない。送っても伏せる部分なので意味がない）
  const SYNC_ACTS = PLAY_ACTS.concat(['finishSetup']);
  const PING_MS = 4000;          // 「生きているよ」の合図を送る間隔
  const TIMEOUT_MS = 45000;      // これだけ何も届かなければ切れたとみなす（スマホでほかのアプリを少し開いても切れないよう長め）
  const JOIN_TIMEOUT_MS = 20000; // 部屋に入るとき、これだけ待ってもつながらなければあきらめる

  // ---------------- ① 部屋のコード・名前 ----------------
  // 0〜n-1 の乱数。できれば暗号用の乱数（予想されにくい）を使う。32は 2の32乗を割り切るので、余りで偏らない
  function randomInt(n) {
    const c = root.crypto;
    if (c && c.getRandomValues) { const a = new Uint32Array(1); c.getRandomValues(a); return a[0] % n; }
    return Math.floor(Math.random() * n);
  }
  function makeCode(rand) {
    rand = rand || randomInt;
    let s = '';
    for (let i = 0; i < CODE_LEN; i++) s += CODE_CHARS[rand(CODE_CHARS.length)];
    return s;
  }
  // 入力されたコードを整える。全角・小文字・空白・ハイフンは許す。使えない文字があるか長さが違えば null
  function normCode(s) {
    const t = String(s == null ? '' : s).normalize('NFKC').toUpperCase().replace(/[\s\-ー－]/g, '');
    if (t.length !== CODE_LEN) return null;
    for (const ch of t) if (CODE_CHARS.indexOf(ch) < 0) return null;
    return t;
  }
  // 名前を整える：相手の画面にそのまま出るので、HTML の記号と制御文字を取り除き、12文字までにする。
  //  「：」はログの「名前：〜」の区切りに使うので、名前には入れない（NFKC で全角の「：」も半角になる）
  function cleanName(s, fallback) {
    const t = String(s == null ? '' : s).normalize('NFKC').replace(/[\u0000-\u001f\u007f<>&"'`:]/g, '').trim();
    return Array.from(t).slice(0, 12).join('') || fallback;
  }

  // ---------------- ② 伏せる ----------------
  // 撃破された相手のキューブのうち、ゲストに送ってよい項目（撃破されたキューブは公開済み）。
  //  送らないもの：fromId（バズーカの破片の元のキューブ＝元の形が分かる）、stealth（どれをステルスにしたか）、placedAt など
  const DEAD_FIELDS = ['id', 'owner', 'shape', 'size', 'cat', 'isAdd', 'frag', 't', 'r0', 'c0', 'cells', 'mask', 'alive', 'hitMask', 'hitOrder', 'oonums', 'cause', 'deadAt'];

  // 対戦（Game）を、送れる形（ただのデータ）に写す。乱数の関数（rng）は送れないので外す。
  //  JSON にして戻すと、関数と undefined の項目が消え、元の対戦とつながりのない「写し」になる
  function plain(game, drop) {
    const o = Object.assign({}, game, { rng: undefined });
    for (const k of drop || []) o[k] = undefined;
    return JSON.parse(JSON.stringify(o));
  }

  // seat の人に送るスナップショット：相手（1 - seat）だけが知っている情報を取り除く。
  //  ここで消し忘れると、ゲストの端末に秘密が届いてしまう。消すものの一覧は docs/online.md の「5. ゲストに送らないもの」。
  //  消し忘れがないことは test/net_sim.js が、どの場面のスナップショットでも確かめる
  function redactFor(game, seat) {
    const hide = 1 - seat;
    // 操作の記録（actions）は配置の座標を含むので送らない。はじめの設定（initOpts）・CPUの方針も要らない
    const s = plain(game, ['actions', 'initOpts', 'setupPlan', 'itemKeep']);
    const H = s.players[hide], me = s.players[seat];
    // ① 相手のキューブ：撃破されたもの（公開済み）だけを残す。
    //    キューブの番号は置いた順に付いているので、そのままだと「何個置いたか」の手がかりになる。撃破された順に付け直す
    const dead = H.pieces.filter((p) => !p.alive).sort((a, b) => (a.deadAt - b.deadAt) || (a.id - b.id));
    const newId = {};
    H.pieces = dead.map((p, i) => {
      const q = {};
      for (const k of DEAD_FIELDS) if (p[k] !== undefined) q[k] = p[k];
      newId[p.id] = q.id = i + 1;
      return q;
    });
    // 自分から見た相手の盤（撃破したブロック）も、同じ番号に付け直す（どのブロックが同じキューブだったかは公開済み）
    for (const d of me.view.dead) if (d && newId[d.pieceId] != null) d.pieceId = newId[d.pieceId];
    H.treasure = null;     // トレジャーのブロック
    H.splitPieces = [];    // バズーカで分解された元のキューブの形
    H.nextId = 0;          // 次のキューブの番号（置いた数が分かる）
    // ② 先攻・後攻は、配置が終わるまで伏せる（ふつうの試合でも、配置のあとの「試合開始」で分かる）
    if (s.phase === 'setup') { s.first = null; s.cur = null; }
    // ③ 演出の記録：数と順番は変えない（ゲストの画面は「どこまで見せたか」を番号で覚えているため）
    for (const ev of s.events) {
      if (ev.actor === hide) delete ev.priv;          // 相手のワープのキューブ・トリガー・移動先、ステルスをかけたブロック
      if (ev.owner === hide) {
        delete ev.ownerPriv;                          // バズーカで分解された相手のキューブの、残りのブロック／ワープの移動前の全部のブロックと移動後（v15）
        if (ev.type === 'shield') delete ev.cells;    // ステルスが撃破を防いだ相手のキューブのブロック
      }
    }
    // ④ ログ：本人向けの詳しい文（priv。ワープの移動先など）は消す
    for (const e of s.log) if (e.actor === hide) e.priv = null;
    // ⑤ 直前の操作：相手のステルスの結果（ブロック）
    const la = s.lastAction;
    if (la && la.pi === hide && la.result) { delete la.result.cells; delete la.result.newCells; }
    return s;
  }

  // 決着のあとは全部見せる（答え合わせとリプレイのため。リプレイには操作の記録 actions が要る）
  function fullSnap(game) { return plain(game); }

  // スナップショット（ただのデータ）から、対戦（Game）を作り直す。
  //  Game のメソッド（isCallable など）が使えるように、Game の「型」（prototype）を付け直すだけ。
  //  公開ページの更新で対戦を引き継ぐとき（ui.js の restore）と同じ方法
  function restore(snap) {
    const g = Object.create(E.Game.prototype);
    Object.assign(g, snap);
    g.rng = Math.random;
    if (!Array.isArray(g.events)) g.events = [];
    if (!Array.isArray(g.log)) g.log = [];
    // 伏せたスナップショットには記録（actions）がない。null にしておくと、手元で配置する操作は記録しない
    if (!Array.isArray(g.actions)) g.actions = null;
    return g;
  }

  // ---------------- ③ 届いた操作の中身を確かめる ----------------
  // ルールのプログラムも確かめるが、改造したゲームから変な形のデータ（数の代わりに文字など）が届いても
  // おかしくならないよう、先に形をそろえる。合わなければ null（＝断る）
  const isInt = (x, lo, hi) => Number.isInteger(x) && x >= lo && x <= hi;
  function cleanArgs(name, args, g) {
    if (!Array.isArray(args)) return null;
    const N = g.N, cell = (x) => isInt(x, 0, g.NN - 1);
    switch (name) {
      case 'skipCall':
      case 'endTurn':
        return [];
      case 'call':
      case 'treasureCall':
        return cell(args[0]) ? [args[0]] : null;
      case 'sacrifice':
        return isInt(args[0], 1, 9999) ? [args[0]] : null;
      case 'draftPick':
        return E.ITEM_KEYS.indexOf(args[0]) >= 0 ? [args[0]] : null;
      case 'answer': {
        const cells = args[0];
        if (!Array.isArray(cells) || cells.length < 1 || cells.length > 5 || !cells.every(cell)) return null;
        return [cells.slice()];
      }
      case 'useItem': {
        const key = args[0], p = args[1];
        if (E.ITEM_KEYS.indexOf(key) < 0 || !p || typeof p !== 'object') return null;
        let q = null;
        switch (key) {
          case 'cube':
            if (p.kind === 'cat' && E.CATS.indexOf(p.value) >= 0) q = { kind: 'cat', value: p.value };
            else if (p.kind === 'size' && isInt(p.value, 1, 5)) q = { kind: 'size', value: p.value };
            break;
          case 'line':
            if ((p.line === 'row' || p.line === 'col') && isInt(p.index, 0, N - 1)) q = { line: p.line, index: p.index };
            break;
          case 'number': case 'shape': case 'node': case 'bazooka':
            if (cell(p.cell)) q = { cell: p.cell };
            break;
          case 'pair':
            if (cell(p.a) && cell(p.b)) q = { a: p.a, b: p.b };
            break;
          case 'warp':
            // v15：cell＝トリガーブロック。t・r0・c0＝移動先（向きと位置）
            if (isInt(p.pieceId, 1, 9999) && cell(p.cell) && isInt(p.t, 0, 7) && isInt(p.r0, 0, N - 1) && isInt(p.c0, 0, N - 1)) q = { pieceId: p.pieceId, cell: p.cell, t: p.t, r0: p.r0, c0: p.c0 };
            break;
          case 'stealth':
            if (isInt(p.pieceId, 1, 9999) && cell(p.cell)) q = { pieceId: p.pieceId, cell: p.cell };   // cell＝トリガーブロック（v14.2）
            break;
        }
        return q ? [key, q] : null;
      }
    }
    return null;
  }
  // 配置（形・向き・位置の並びと、トレジャーのブロック）の形をそろえる
  function cleanSetup(msg, g) {
    const list = msg && msg.pieces;
    if (!Array.isArray(list) || list.length < 1 || list.length > 20) return null;
    const pieces = [];
    for (const p of list) {
      if (!p || typeof p.key !== 'string' || p.key === 'A1' || !Object.prototype.hasOwnProperty.call(E.SHAPES, p.key)) return null;
      if (!isInt(p.t, 0, 7) || !isInt(p.r0, 0, g.N - 1) || !isInt(p.c0, 0, g.N - 1)) return null;
      pieces.push({ key: p.key, t: p.t, r0: p.r0, c0: p.c0, col: isInt(p.col, 1, 99) ? p.col : 0 });
    }
    if (!isInt(msg.treasure, 0, g.NN - 1)) return null;
    return { pieces, treasure: msg.treasure };
  }

  // ---------------- ④ ホストの役 ----------------
  // o.name：ホストの名前、o.send(msg)：ゲストへ送る、o.makeGame(names)：試合を作る（ルール・アイテムはホストの設定で）
  // o.on：画面への知らせ { guest(名前), match(対戦), change(操作の名前), bye(理由) }
  function Host(o) {
    this.name = cleanName(o.name, 'ホスト');
    this.send = o.send;
    this.makeGame = o.makeGame;
    this.on = o.on || {};
    this.game = null;       // 本当の対戦（ホストだけが持つ）
    this.guestName = null;
    this.ack = 0;           // 最後に処理したゲストの操作の番号（ゲストが「自分の操作の結果か」を見分けるため）
  }
  Host.prototype._emit = function (k, x) { if (this.on[k]) this.on[k](x); };
  // ゲストから届いたメッセージを、種類ごとに振り分ける
  Host.prototype.receive = function (msg) {
    if (!msg || typeof msg !== 'object') return;
    if (msg.t === 'hello') this._hello(msg);
    else if (msg.t === 'setup') this._setup(msg);
    else if (msg.t === 'act') this._act(msg);
    else if (msg.t === 'bye') this._emit('bye', typeof msg.reason === 'string' ? msg.reason : 'left');
  };
  Host.prototype._hello = function (msg) {
    // 同じゲームの同じ版どうしでないと、ルールや通信の形が食い違うので断る
    if (msg.app !== APP || msg.net !== NET_VERSION || msg.v !== E.VERSION) {
      this.send({ t: 'bye', reason: 'version' });
      this._emit('bye', 'version');
      return;
    }
    if (this.guestName != null) return;   // 2回目の hello は無視する
    let nm = cleanName(msg.name, 'ゲスト');
    if (nm === this.name) nm = Array.from(nm).slice(0, 11).join('') + '2';   // 同じ名前だと画面で見分けられないので
    this.guestName = nm;
    this._emit('guest', nm);
    this.newMatch();
  };
  // 新しい試合を作って、ゲストに知らせる（最初の試合と「もう一度」）
  Host.prototype.newMatch = function () {
    this.game = this.makeGame([this.name, this.guestName]);
    this.send({ t: 'welcome', seat: GUEST_SEAT, snap: redactFor(this.game, GUEST_SEAT), ack: this.ack });
    this._emit('match', this.game);
  };
  // ゲストの配置：ホストのルールのプログラムで1つずつ置き直して確かめる（置けない配置は断る）
  Host.prototype._setup = function (msg) {
    const g = this.game, pi = GUEST_SEAT;
    const open = () => g && g.phase === 'setup' && !g.players[pi].setupDone;
    const fail = (reason) => {
      if (open()) g.clearSetup(pi);
      this.send({ t: 'reject', what: 'setup', reason: reason || '配置が正しくありません' });
    };
    if (!open()) return fail('いまは配置を受け付けていません');
    const s = cleanSetup(msg, g);
    if (!s) return fail();
    g.clearSetup(pi);
    for (const p of s.pieces) {
      const r = g.placePiece(pi, p.key, p.t, p.r0, p.c0);
      if (!r.ok) return fail(r.reason);
      // 色・柄の番号は、ゲストの画面で付いたものを使う（外した番号が空いたままになるので、置き直すと詰まってしまう）
      if (p.col && !g.players[pi].pieces.some((q) => q !== r.piece && q.col === p.col)) r.piece.col = p.col;
    }
    const tr = g.setTreasure(pi, s.treasure);
    if (!tr.ok) return fail(tr.reason);
    const fr = g.finishSetup(pi);
    if (!fr.ok) return fail(fr.reason);
    this.sync();
    this._emit('change', 'setup');
  };
  // ゲストの対戦中の操作。いつでもゲストの席（1番）として実行するので、ホストの席の操作はできない。
  //  手番・アイテムの残り・ブロックの範囲などは、ルールのプログラム（engine.js）が確かめる
  Host.prototype._act = function (msg) {
    const g = this.game;
    const seq = isInt(msg.seq, 1, 1e9) ? msg.seq : 0;
    const args = g && PLAY_ACTS.indexOf(msg.name) >= 0 ? cleanArgs(msg.name, msg.args, g) : null;
    let r = null;
    if (args) {
      try { r = g[msg.name].apply(g, [GUEST_SEAT].concat(args)); } catch (e) { r = null; }
    }
    if (seq > this.ack) this.ack = seq;
    if (!r || r.ok === false) {
      this.send({ t: 'reject', what: 'act', seq, reason: (r && r.reason) || 'いまはその操作はできません' });
      return;
    }
    this.sync();
    this._emit('change', msg.name);
  };
  // ホスト自身の操作：その場で実行し、対戦の操作ならゲストに新しい状態を送る（args の先頭は席の番号）
  Host.prototype.run = function (name, args) {
    const g = this.game;
    const r = g[name].apply(g, args);
    if (SYNC_ACTS.indexOf(name) >= 0 && !(r && r.ok === false)) this.sync();
    return r;
  };
  // ゲストに今の状態を送る。決着したら伏せない全部（答え合わせとリプレイ用）
  Host.prototype.sync = function () {
    const g = this.game;
    if (!g) return;
    if (g.phase === 'over') this.send({ t: 'full', snap: fullSnap(g), ack: this.ack });
    else this.send({ t: 'state', snap: redactFor(g, GUEST_SEAT), ack: this.ack });
  };

  // ---------------- ④ ゲストの役 ----------------
  // o.name：ゲストの名前、o.send(msg)：ホストへ送る
  // o.on：画面への知らせ { welcome(対戦), state(対戦), foeReady(真偽), reject(メッセージ), bye(理由) }
  function Guest(o) {
    this.name = cleanName(o.name, 'ゲスト');
    this.send = o.send;
    this.on = o.on || {};
    this.seat = GUEST_SEAT;
    this.game = null;        // 画面に描く対戦（ホストから届いたスナップショット。配置の途中だけは手元で動かす）
    this.seq = 0;            // 送った操作の通し番号
    this.wait = 0;           // 結果を待っている操作の番号（0＝待っていない）
    this.setupSent = false;  // 配置を送って、ホストの確認を待っている
    this.foeReady = false;   // 相手（ホスト）が配置を終えたか
  }
  Guest.prototype._emit = Host.prototype._emit;
  Guest.prototype.hello = function () {
    this.send({ t: 'hello', app: APP, net: NET_VERSION, v: E.VERSION, name: this.name });
  };
  Guest.prototype.receive = function (msg) {
    if (!msg || typeof msg !== 'object') return;
    switch (msg.t) {
      case 'welcome': {
        // 新しい試合。届いた（伏せた）対戦を手元に置き、自分の席の配置はこの中で行う
        this.seat = GUEST_SEAT;
        this.game = restore(msg.snap);
        this.wait = 0;
        this.setupSent = false;
        this.foeReady = !!this.game.players[1 - this.seat].setupDone;
        this._emit('welcome', this.game);
        return;
      }
      case 'state':
      case 'full': {
        if (this.wait && msg.ack >= this.wait) this.wait = 0;   // 自分が送った操作の結果が届いた
        const g = restore(msg.snap);
        // 配置をまだ受け付けてもらっていないあいだは、手元で置いている途中の配置を消さないよう、盤面は差し替えない
        if (g.phase === 'setup' && !g.players[this.seat].setupDone && this.game && this.game.phase === 'setup') {
          this.foeReady = !!g.players[1 - this.seat].setupDone;
          this._emit('foeReady', this.foeReady);
          return;
        }
        this.game = g;
        this.setupSent = false;
        this.foeReady = !!g.players[1 - this.seat].setupDone;
        this._emit('state', g);
        return;
      }
      case 'reject':
        if (msg.what === 'setup') this.setupSent = false;
        else if (this.wait && msg.seq >= this.wait) this.wait = 0;
        this._emit('reject', msg);
        return;
      case 'bye':
        this._emit('bye', typeof msg.reason === 'string' ? msg.reason : 'left');
    }
  };
  // 対戦中の操作をホストに頼む（args に自分の席は入れない）。結果はあとで state として届く
  Guest.prototype.act = function (name, args) {
    if (this.wait) return { ok: false, reason: '前の操作の結果を待っています' };
    if (PLAY_ACTS.indexOf(name) < 0) return { ok: false, reason: 'できない操作です' };
    this.seq += 1;
    this.wait = this.seq;
    this.send({ t: 'act', name, args: args || [], seq: this.seq });
    return { ok: true, sent: true };
  };
  // 配置をまとめてホストに送る（形・向き・位置・色と柄の番号と、トレジャーのブロック）。置いた順に並べる（キューブの色が変わらないように）

    if (!P || g.phase !== 'setup' || P.setupDone || this.setupSent) return { ok: false, reason: '配置の時間ではありません' };
    if (!P.pieces.length) return { ok: false, reason: '最低1キューブを置いてください' };
    if (!P.treasure) return { ok: false, reason: 'トレジャーをセットしてください' };
    const pieces = P.pieces.slice().sort((a, b) => a.id - b.id).map((p) => ({ key: p.shape, t: p.t, r0: p.r0, c0: p.c0, col: p.col }));

  // ---------------- ⑤ PeerJS（端末どうしをつなぐ部分） ----------------
  // このページでオンライン対戦が使えるか。claude.ai の公開ページ（artifact）は、安全のために

        s.onload = () => (root.Peer ? resolve(root.Peer) : reject(new Error('Peer not found')));

  // PeerJS の設定。ふだんは何も指定しない（＝PeerJS の無料クラウドと、PeerJS が用意している STUN・TURN を使う）。
  //  テスト用：URL に ?peer=localhost:9000 があれば、その PeerServer を使う（この環境からは外のクラウドに出られないため）
  function peerOptions() {
    const o = { debug: 0 };

      const m = /[?&]peer=([^&#]+)/.exec((root.location && root.location.search) || '');
      if (m) {
        const hp = decodeURIComponent(m[1]).split(':');

  const ERR_TEXT = {
    'browser-incompatible': 'このブラウザはオンライン対戦（WebRTC）に対応していません',
    network: '通信の仲介サーバーにつながりません。インターネットの接続を確かめてください',
    'server-error': '通信の仲介サーバーにつながりません。しばらくしてから試してください',
    'socket-error': '通信の仲介サーバーとの接続が切れました',
    'socket-closed': '通信の仲介サーバーとの接続が切れました',
    'unavailable-id': '部屋のコードが使えませんでした。もう一度作ってください',
    'peer-unavailable': 'その部屋は見つかりませんでした。コードを確かめてください',
    webrtc: '相手と直接つながれませんでした。別の回線（Wi-Fi とモバイル回線など）で試してください',
    'ssl-unavailable': '安全な接続（https）が使えません',

  // PeerJS のつながり（DataConnection）を、このゲームで使う「通信路」の形にまとめる。
  //  外に見せるのは send(msg)・onmessage・onclose・close() だけ（Host・Guest はこれだけを使う）。
  //  相手がタブを閉じたときに「切れた」の知らせが来ないことがあるので、合図（ping）を送り合い、
  //  しばらく何も届かなければ切れたとみなす
  function wrapConn(conn, peer) {
    // つながったあとは、仲介サーバー（クラウド）との接続が切れても、相手との直接のつながりはそのまま続く
    const link = { onmessage: null, onclose: null, closed: false };

    let timer = null;
    const end = (reason) => {
      if (link.closed) return;
      link.closed = true;
      clearInterval(timer);
      try { conn.close(); } catch (e) { /* もう閉じている */ }
      try { peer.destroy(); } catch (e) { /* もう閉じている */ }
      if (link.onclose) link.onclose(reason);
    };
    link.send = (msg) => {
      if (link.closed) return;
      try { conn.send(msg); } catch (e) { end('error'); }
    };
    // やめるとき：最後のメッセージ（bye）を送ってから、少し待って閉じる（すぐ閉じると届かないことがある）
    link.close = (lastMsg) => {
      if (link.closed) return;
      if (lastMsg) link.send(lastMsg);
      link.onclose = null;     // 自分でやめたときは「切れた」と知らせない
      link.onmessage = null;
      setTimeout(() => end('local'), 300);
    };

      if (Date.now() - lastSeen > TIMEOUT_MS) end('timeout');
      else link.send({ t: 'ping' });
    }, PING_MS);
    conn.on('data', (msg) => {
      lastSeen = Date.now();
      if (msg && msg.t === 'ping') return;   // 合図は Host・Guest には渡さない
      if (link.onmessage) link.onmessage(msg);
    });

    conn.on('error', () => end('error'));
    return link;
  }

  // 部屋を作る：コードを決めて PeerJS のクラウドに「searchbattle-コード」で登録し、相手がつないでくるのを待つ。
  //  o.onOpen(code)：登録できた（コードを画面に出す）、o.onGuest(link)：相手とつながった、o.onError(文)：失敗。
  //  戻り値の close() でやめる
  function openRoom(o) {
    let peer = null, stopped = false, tries = 0, taken = false;
    const start = (Peer) => {
      if (stopped) return;
      const code = makeCode();
      const p = new Peer(PEER_PREFIX + code, peerOptions());
      peer = p;
      p.on('open', () => { if (!stopped && peer === p) o.onOpen(code); });
      p.on('connection', (conn) => {
        // 1つの部屋に入れるのは1人だけ。2人目には「満員」と伝えて閉じる
        if (taken) {
          // 相手が受け取る準備（つながった直後の処理）を終えるまで少し待ってから「満員」を送り、さらに待って閉じる
          conn.on('open', () => {
            setTimeout(() => { try { conn.send({ t: 'bye', reason: 'full' }); } catch (e) { /* 無視 */ } }, 400);
            setTimeout(() => conn.close(), 1500);
          });
          return;
        }
        taken = true;
        let opened = false;
        conn.on('open', () => { opened = true; if (!stopped) o.onGuest(wrapConn(conn, p)); });
        conn.on('close', () => { if (!opened) taken = false; });   // 開く前に切れたら、ほかの人を待てるように戻す
      });
      p.on('disconnected', () => { if (!stopped && !taken) try { p.reconnect(); } catch (e) { /* 次の error で知らせる */ } });
      p.on('error', (err) => {
        if (stopped || peer !== p || taken) return;
        // たまたま同じコードの部屋があれば、コードを変えて作り直す
        if (err && err.type === 'unavailable-id' && tries++ < 4) { try { p.destroy(); } catch (e) { /* 無視 */ } start(Peer); return; }
        stopped = true;
        try { p.destroy(); } catch (e) { /* 無視 */ }
        o.onError(errorText(err));
      });
    };
    loadPeerJS().then(start, () => { if (!stopped) { stopped = true; o.onError('通信の部品（PeerJS）を読み込めませんでした。インターネットの接続を確かめてください'); } });
    return { close() { stopped = true; if (peer && !taken) try { peer.destroy(); } catch (e) { /* 無視 */ } } };
  }

  // 部屋に入る：自分も PeerJS のクラウドに（名前なしで）登録し、「searchbattle-コード」の相手につなぐ。
  //  o.onLink(link)：つながった、o.onError(文)：失敗。戻り値の close() でやめる
  function joinRoom(code, o) {
    let peer = null, done = false;
    const fail = (text) => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      try { if (peer) peer.destroy(); } catch (e) { /* 無視 */ }
      o.onError(text);
    };
    const timer = setTimeout(() => fail('つながりませんでした。コードを確かめて、もう一度試してください'), JOIN_TIMEOUT_MS);
    loadPeerJS().then((Peer) => {
      if (done) return;
      peer = new Peer(peerOptions());   // 自分の ID はクラウドに決めてもらう
      peer.on('open', () => {
        if (done) return;
        // reliable：届く順番を保つ（state が前後すると古い盤面に戻ってしまうため）
        const conn = peer.connect(PEER_PREFIX + code, { reliable: true });
        conn.on('open', () => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          o.onLink(wrapConn(conn, peer));
        });
        conn.on('error', () => fail('つながりませんでした'));
      });
      peer.on('error', (err) => fail(errorText(err)));
    }, () => fail('通信の部品（PeerJS）を読み込めませんでした。インターネットの接続を確かめてください'));
    return { close() { if (!done) { done = true; clearTimeout(timer); try { if (peer) peer.destroy(); } catch (e) { /* 無視 */ } } } };
  }

  const api = {
    APP, NET_VERSION, HOST_SEAT, GUEST_SEAT, PEER_PREFIX, CODE_CHARS, CODE_LEN, PEERJS_URL, PLAY_ACTS, SYNC_ACTS, DEAD_FIELDS,
    makeCode, normCode, cleanName, redactFor, fullSnap, restore, cleanArgs, cleanSetup, Host, Guest,
    supported, loadPeerJS, peerOptions, errorText, openRoom, joinRoom, PLAY_URL,
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.SBNet = api;
})(typeof window !== 'undefined' ? window : globalThis);

<script id="src-ai">
/* サーチバトル — CPU
 * 人間と同じ情報（自分の盤面・攻撃ログ・防御ログ・アイテム状況）だけで推論する。
 *  1. 確定推論：◎ごとに「ありうる配置」を列挙し、すべての事実と矛盾しない組み合わせを全探索。

(function (root) {
  'use strict';

  const { SHAPES, SHAPES_BY_SIZE, ITEM_KEYS, ORIENT, CATS, placements, bit, popcount, bitsOf, lineMask, cellsFor, blockDist, nodeDegree } = E;
  // ノードショットの答え（つながりの数 0〜3）の出方の目安：CPUの配置で測った、キューブのあるブロックのうちの割合
  const NODE_PRIOR = [0, 0.6, 0.37, 0.03];

  // CPU同士の対戦とキャリブレーションの検証で 2 がいちばん良かった
  const CALIB_DEFAULT = 2;

  // ------------------------------------------------------------------
  // 事実の整理
  // ------------------------------------------------------------------
  function currentCounts(kb, N) {
    const res = { all: null, size: {}, cat: {}, lines: [] };
    const matchDead = (q, d) => q.kind === 'all' || (q.kind === 'size' ? d.size === q.value : d.cat === q.value);
    const matchAdd = (q) => q.kind === 'all' || (q.kind === 'size' ? q.value === 1 : q.value === 'R型');
    for (const q of kb.counts) {
      if (q.kind === 'line') {
        if (kb.warps.some((w) => w.t > q.t) || kb.adds.some((a) => a.t > q.t)) continue;
        // サーチライン＝その列・行にかかっているキューブの数 k と、そのブロックの数 n（v12.12）。その後に撃破されたキューブの分を引く。
        // その後にバズーカの分解があると、破片の数だけキューブが増える（分解されたキューブがかかっていたかは分からない）ので、k は使わない
        const lm = lineMask(q.line, q.index, N);

        let k = q.k != null && !(kb.splits || []).some((sp) => sp.t > q.t) ? q.k : null;
        for (const d of kb.deads) {

      if ((kb.splits || []).some((sp) => sp.t > q.t)) continue;

      for (const d of kb.deads) if (d.t > q.t && matchDead(q, d)) n--;
      for (const a of kb.adds) if (a.t > q.t && matchAdd(q)) n++;

      else if (q.kind === 'size') res.size[q.value] = n;

  function buildContext(kb, N) {

    const groups = U.filter((k) => k.r === 'oo' || k.r === 'wp').map((k) => (k.r === 'wp' ? { num: 'w' + k.t, c: k.c, t: k.t, wp: true } : { num: k.num, c: k.c, t: k.t }));

    const warpedAfter = (t) => kb.warps.some((w) => w.t > t);

    //  そのため、ワープの前にそのキューブの当たっていないブロックで調べた事実（形・ブロック数・つながり・同じキューブ）は、
    //  もう空いたブロックの事実かもしれない。分かっているブロックから（5−分かっている数）ブロック以内は、そのキューブだったかもしれないので使わない。

    const partialWarps = kb.warps.filter((w) => w.partial).map((w) => ({ t: w.t, mask: w.oldMask, reach: Math.max(0, 5 - popcount(w.oldMask)) }));

        if (partialWarps.some((w) => w.t > p.t && !safeFromWarp(p.a, w) && !safeFromWarp(p.b, w))) continue;

    const splits = [];
    for (const sp of (kb.splits || [])) {
      let killedMask = 0;
      for (const c of sp.killed) killedMask |= bit(c);
      const targetFrag = !(killedMask & bit(sp.c)) && !explained(sp.c, sp.t) ? sp.c : -1;
      splits.push({ t: sp.t, c: sp.c, killedMask, targetFrag });
    }
    // 生きていると分かっている破片のブロック（ヒットしたブロックは◎のキューブとして数えるので除く。同じブロックに2回撃っても1つ）
    let fragMask = 0;
    for (const sp of splits) if (sp.targetFrag >= 0) fragMask |= bit(sp.targetFrag);
    fragMask &= ~hitMask;
    // ステルス：使われた時刻だけが分かる。全ブロックに当たっても生きているキューブは、それより前にステルスになっていたはず
    const stealthTimes = (kb.stealths || []).map((x) => x.t).sort((a, b) => a - b);
    // ステルス（v14）：見破られていない数（使った数−見破った数）。見破られていないステルスのキューブは、
    // コールが×・アイテムが NoData・数に入らないので、見えている世界では「いない」のと同じに見える
    const unrevealed = Math.max(0, stealthTimes.length - (kb.reveals || []).reduce((a, r) => a + r.n, 0));
    const occs = kb.occs.filter((o) => !explained(o.c, o.t) && !warpTouches(o.c, o.t))
      .map((o) => ((o.cat || o.size || o.deg != null) && splitTouches(o.c, o.t) ? { c: o.c, t: o.t, cat: null, src: o.src } : o))
      .concat(derivedOccs);
    const occMaskBefore = (t0) => { let m = 0; for (const o of occs) if (o.t < t0) m |= bit(o.c); return m; };

    const deadSetup = { 2: 0, 3: 0, 4: 0, 5: 0 };
    for (const d of kb.deads) if (!d.isAdd && d.size >= 2) deadSetup[d.size]++;
    const stockBound = {};
    for (const s of [2, 3, 4, 5]) stockBound[s] = kb.stock[s] - deadSetup[s];
    const PL = placements(N);
    const sizeAllowed = (s) => stockBound[s] > 0 && (counts.size[s] == null || counts.size[s] > 0);
    const catAllowed = (cat) => counts.cat[cat] == null || counts.cat[cat] > 0;

    const groupIndexByNum = new Map(groups.filter((g) => !g.q).map((g, i) => [g.num, i]));

    // ワープ・アッドで動いたキューブの追跡（索敵用の近似）
    const wEnt = [];
    const addEnt = kb.adds.map((a) => ({ t: a.t, col: a.col, alive: true }));
    const sortedWarps = kb.warps.slice().sort((a, b) => a.t - b.t);
    for (const w of sortedWarps) {
      // トリガーで発動したワープ（v15）は、移動後のレティクルがグループ（見つかったキューブ）になるので、ここでは追わない（形も分からない）
      if (!w.key) continue;
      if (w.size === 1) {
        const col = bitsOf(w.oldMask)[0] % N;
        const pick = addEnt.filter((a) => a.alive && a.t < w.t && a.col === col).pop()
          || wEnt.filter((e) => e.alive && e.key === 'A1' && e.t < w.t).pop()
          || addEnt.filter((a) => a.alive && a.t < w.t).pop();
        if (pick) pick.alive = false;
      } else {
        const neverMoved = !(w.oldMask & (xMaskBetween(-1, w.t) | oldMaskBefore(w.t)));
        if (!neverMoved) {
          const prev = wEnt.filter((e) => e.alive && e.key === w.key && e.t < w.t && !(w.oldMask & e.oldMask) && !(w.oldMask & xMaskBetween(e.t, w.t))).pop();
          if (prev) prev.alive = false;
        }
      }
      wEnt.push({ t: w.t, key: w.key, size: w.size, cat: w.cat, oldMask: w.oldMask, treasure: !!w.treasure, alive: true });
    }
    for (const d of kb.deads.slice().sort((a, b) => a.t - b.t)) {
      if (d.isAdd) {
        const col = bitsOf(d.mask)[0] % N;
        const pick = addEnt.filter((a) => a.alive && a.t < d.t && a.col === col).pop()
          || wEnt.filter((e) => e.alive && e.key === 'A1' && e.t < d.t).pop()
          || addEnt.filter((a) => a.alive && a.t < d.t).pop();
        if (pick) pick.alive = false;
        continue;
      }
      const cands = wEnt.filter((e) => e.alive && e.key === d.key && e.t < d.t && !(d.mask & e.oldMask) && !(d.mask & xMaskBetween(e.t, d.t)));
      const neverMoved = !(d.mask & (xMaskBetween(-1, d.t) | oldMaskBefore(d.t)));
      if (cands.length && !neverMoved) cands[cands.length - 1].alive = false;
    }

    return {
      N, NN, kb, PL, explained, deadMask, oldMaskAll, xs, xMaskAll, xMaskAfter, xMaskBetween, oldMaskAfter, oldMaskBefore,
      counts, lineZeroMask, lineMax, U, Ucell, groups, oList, ooMask, hitMask, occs, occMaskBefore,
      deadSetup, stockBound, sizeAllowed, catAllowed, groupIndexByNum, pairs, splits, fragPossible: splits.length > 0, fragMask, stealthTimes, unrevealed,
      wEnt: wEnt.filter((e) => e.alive), addEnt: addEnt.filter((a) => a.alive),
    };
  }

  // sizeW：ブロック数ごとの重み（実験用。既定はどのブロック数も同じ）
  function shapePrior(ctx, sizeW) {
    const sizes = [2, 3, 4, 5].filter((s) => ctx.sizeAllowed(s));
    let wsum = 0; for (const s of sizes) wsum += sizeW ? (sizeW[s] || 0) : 1;
    const list = [];
    for (const s of sizes) {
      const keys = SHAPES_BY_SIZE[s].filter((k) => ctx.PL[k].length && ctx.catAllowed(SHAPES[k].cat));
      const ws = wsum > 0 ? (sizeW ? (sizeW[s] || 0) : 1) / wsum : 1 / sizes.length;
      for (const k of keys) list.push({ key: k, size: s, prior: ws / keys.length });
    }
    return list;
  }

  // ------------------------------------------------------------------
  // ◎ごとの候補配置（健全：本当の配置を必ず含む）
  // ------------------------------------------------------------------
  // サーチシェイプ（形状）・サーチサイズ（ブロック数）・ノードショット（つながりの数）の結果と矛盾しないか
  function factsOK(P, occs, tp, N) {
    for (const o of occs) {
      if (o.t <= tp || !(P.mask & bit(o.c))) continue;
      if (o.cat && o.cat !== P.cat) return false;
      if (o.size && o.size !== P.size) return false;
      if (o.deg != null && nodeDegree(P.mask, o.c, N) !== o.deg) return false;
    }
    return true;
  }

  function groupCands(g, ctx, priorByKey) {
    const out = new Map();
    const others = ctx.ooMask & ~bit(g.c);
    let early = 0;
    for (const u of ctx.U) if (u.t < g.t) early |= bit(u.c);
    const base = others | early | ctx.deadMask | ctx.lineZeroMask;
    const add = (P, branch, wf) => {
      const ex = out.get(P.mask);
      if (ex) { if (ex.branches.indexOf(branch) < 0) ex.branches.push(branch); return; }
      // 全ブロックに当たっているのに生きているキューブはいない（全ブロック当たれば撃破される。v13 でステルスの「撃破されない」効果は廃止）
      const full = false, lastHit = -1;
      if ((P.mask & ~ctx.hitMask) === 0) return;
      const pr = priorByKey[P.key] || 0.05;
      out.set(P.mask, { mask: P.mask, key: P.key, size: P.size, cat: P.cat, cells: P.cells, branches: [branch], w: (pr / ctx.PL[P.key].length) * (wf || 1), full, lastHit });
    };
    const fa = base | ctx.xMaskAll | ctx.oldMaskAll;
    // 1ブロックのキューブ（バズーカの破片）は当たれば撃破されるので、生きている◎のキューブにはならない（候補は上の「全ブロック命中」で落ちる）
    const sizes = ctx.fragPossible ? [1, 2, 3, 4, 5] : [2, 3, 4, 5];
    // ワープレティクルのグループ（v15）：ワープしたキューブだと分かっているので、「動いていないキューブ」（枝 a）と「ステルス」（枝 s）は考えない。
    //  移動の条件（ワープより後の×だけを避ける・移動前の位置に重ならない・形は移動前と同じで回転だけ）で候補を作る
    if (g.wp) {
      const w = ctx.kb.warps.find((x) => x.reticle === g.c && x.reticleT === g.t);
      if (w) {
        warpGroupCands(g, w, ctx, base, add, null);
        // ワープの後でステルスにされたかもしれない（ワープしたあとのキューブには、ステルスを使える）。ふつうの◎の枝 s と同じ考え方
        if (ctx.unrevealed > 0) {
          const unc = uncalledMask(ctx);
          for (const ts of ctx.stealthTimes) {
            if (ts <= g.t) continue;
            let after = 0;
            for (const u of ctx.U) if (u.t > ts) after |= bit(u.c);
            for (const o of ctx.occs) if (o.t > ts && (o.src === 'number' || o.src === 'shape' || o.src === 'node')) after |= bit(o.c);
            warpGroupCands(g, w, ctx, others | early | ctx.deadMask, add, { ts, after, unc });
          }
        }
      }
      return finishCands(g, out, ctx);
    }
    for (const s of sizes) {
      if (s === 1) {
        // 1ブロックのキューブは分解のときにできるので、それより前の×やワープ前の位置とは関係ない。◎のブロックそのものだけを考える
        if (ctx.counts.size[1] === 0 || !ctx.catAllowed('R型')) continue;
        const P = ctx.PL.A1.find((x) => x.mask === bit(g.c));
        if (P && !(P.mask & base) && factsOK(P, ctx.occs, 0, ctx.N)) add(P, 'a');
        continue;
      }
      if (!ctx.sizeAllowed(s)) continue;
      for (const key of SHAPES_BY_SIZE[s]) {
        if (!ctx.catAllowed(SHAPES[key].cat)) continue;
        for (const P of ctx.PL[key]) {
          if (!(P.mask & bit(g.c)) || (P.mask & fa)) continue;
          if (!factsOK(P, ctx.occs, 0, ctx.N)) continue;
          add(P, 'a');
        }
      }
    }
    for (const w of ctx.kb.warps) {
      // トリガーで発動したワープ（v15）のキューブは、移動後のレティクルのグループだけ（上の g.wp）。ほかの◎はそのキューブではない
      if (!w.key) continue;
      if (w.t >= g.t || w.size < 2) continue;
      if (!ctx.sizeAllowed(w.size) || !ctx.catAllowed(w.cat)) continue;
      const fb = base | ctx.xMaskAfter(w.t) | w.oldMask | ctx.oldMaskAfter(w.t) | ctx.occMaskBefore(w.t);
      // アンサーで当てて逃げられたワープ（v15）：移動前の形が全部分かっていて、向きはそれを回しただけ（反転なし）
      const rot = w.fullCells ? rotSigs(w.key, w.fullCells, ctx) : null;
      for (const P of ctx.PL[w.key]) {
        if (!(P.mask & bit(g.c)) || (P.mask & fb)) continue;
        if (rot && !rot.has(ORIENT[w.key][P.t].sig)) continue;
        if (!factsOK(P, ctx.occs, w.t, ctx.N)) continue;
        add(P, 'w');
      }
    }
    // ステルス（v14）：◎のあとでステルスにされたキューブかもしれない（見破られていないステルスがあるとき）。
    //  ステルスの後は、そのキューブへのコールが×、アイテムが NoData になるので、ステルスの後の×・NoData のブロックにも広がりうる。
    //  ステルスの後のヒット・調べた結果（形やブロック数など）のあるブロックは、ほかのキューブなので入らない。ステルスの前の×には入らない。
    //  数（サーチキューブ・ライン）には入らないので、ブロック数・形の数の条件は在庫だけを見る。重みは小さめ（ステルスにされた見込み）
    if (!g.q && ctx.unrevealed > 0) {
      const unc = uncalledMask(ctx);
      for (const ts of ctx.stealthTimes) {
        if (ts <= g.t) continue;
        let after = 0;
        for (const u of ctx.U) if (u.t > ts) after |= bit(u.c);
        // アイテムの結果（形・ブロック数・つながり）だけ。トレジャーの的中（src なし）はステルスでもふつうに出るので、ここでは除かない
        for (const o of ctx.occs) if (o.t > ts && (o.src === 'number' || o.src === 'shape' || o.src === 'node')) after |= bit(o.c);
        const fb = others | early | ctx.deadMask | after | ctx.xMaskBetween(-1, ts) | ctx.oldMaskAll;
        const occBefore = ctx.occs.filter((o) => o.t < ts);
        for (const sz of [2, 3, 4, 5]) {
          if (!(ctx.stockBound[sz] > 0)) continue;
          for (const key of SHAPES_BY_SIZE[sz]) {
            for (const P of ctx.PL[key]) {
              if (!(P.mask & bit(g.c)) || (P.mask & fb)) continue;
              if (!(P.mask & unc)) continue;   // トリガーブロック（まだコールされていない）を含む（v14.2）
              if (!factsOK(P, occBefore, 0, ctx.N)) continue;
              add(P, 's', 0.3);
            }
          }
        }
      }
    }
    return finishCands(g, out, ctx);
  }
  // 候補の一覧を仕上げる（ステルスの枝の印・Stealth hit の merge 候補）
  function finishCands(g, out, ctx) {
    const list = Array.from(out.values());
    for (const cd of list) if (cd.branches.indexOf('s') >= 0) { cd.st = true; cd.pureSt = cd.branches.every((b) => b === 's'); }
    // Stealth hit のグループ：「前に見つかったキューブの○だった」候補（merge）を足す。前に◎か Stealth hit があるときだけありうる。
    // 重みは、新しいキューブだった場合の重みの合計と同じ（どちらとも決めない）
    if (g.q && ctx.groups.some((h) => h !== g && h.t < g.t)) {
      const wsum = list.reduce((a, cd) => a + cd.w, 0) || 1e-6;
      list.push({ mask: 0, key: null, size: 0, cat: null, cells: [], branches: ['m'], w: wsum, full: false, lastHit: -1, merge: true });
    }
    return list;
  }
  // ワープレティクルのグループの候補（v15）。w：そのワープ（kb.warps）。ワープしたキューブについて分かっていること：
  //  ・移動前に当たっていたブロック（w.oldCells。トリガーも含む）は同じキューブで、形は移動前と同じ・向きは回しただけ（反転なし）
  //   → トリガーがレティクルに重なるように、移動前のブロックを4通りに回して置いた形のどれかを、候補は必ず含む
  //  ・ワープより後の×・NoData のブロック、移動前に分かっているブロックには重ならない（ワープより前の×には動いてきうる）
  //  ・ワープより後に調べた事実（形・ブロック数・つながり）と合う
  //  st（ステルスの枝）：{ ts＝ステルスの時刻, after＝ステルスの後のヒット・調べた結果のあるブロック, unc＝まだコールされていないブロック }。
  //   ステルスの後の×・NoData のブロックにも広がりうる（そのキューブへのコールは×に見えるため）。トリガー（まだコールされていないブロック）を含む
  function warpGroupCands(g, w, ctx, base, add, st) {
    const N = ctx.N;
    const tr = Math.floor(w.trigger / N), tc = w.trigger % N;
    const rr = Math.floor(g.c / N), rc = g.c % N;
    const images = [];
    for (let k = 0; k < 4; k++) {
      let m = 0, ok = true;
      for (const c of w.oldCells) {
        let dr = Math.floor(c / N) - tr, dc = (c % N) - tc;
        for (let j = 0; j < k; j++) { const tmp = dr; dr = dc; dc = -tmp; }   // engine の transform と同じ向きの回転
        const r = rr + dr, cc = rc + dc;
        if (r < 0 || cc < 0 || r >= N || cc >= N) { ok = false; break; }
        m |= bit(r * N + cc);
      }
      if (ok) images.push(m);
    }
    if (!images.length) return;
    const xm = st ? ctx.xMaskBetween(w.t, st.ts) | st.after : ctx.xMaskAfter(w.t);
    const fb = base | xm | w.oldMask | ctx.oldMaskAfter(w.t) | ctx.occMaskBefore(w.t);
    const occs = st ? ctx.occs.filter((o) => o.t < st.ts) : ctx.occs;
    const minSize = Math.max(2, popcount(w.oldMask));
    for (const s of [2, 3, 4, 5]) {
      // ステルスのキューブは数（サーチキューブ）に入らないので、ステルスの枝では在庫だけを見る（ふつうの枝 s と同じ）
      if (s < minSize || !(st ? ctx.stockBound[s] > 0 : ctx.sizeAllowed(s))) continue;
      for (const key of SHAPES_BY_SIZE[s]) {
        if (!st && !ctx.catAllowed(SHAPES[key].cat)) continue;
        for (const P of ctx.PL[key]) {
          if (!(P.mask & bit(g.c)) || (P.mask & fb)) continue;
          if (!images.some((m) => (P.mask & m) === m)) continue;
          if (st && !(P.mask & st.unc)) continue;
          if (!factsOK(P, occs, w.t, N)) continue;
          if (st) add(P, 's', 0.3); else add(P, 'w');
        }
      }
    }
  }
  // アンサーで逃げられたワープの、移動後にありうる向き（形の sig）：移動前の向きを回したものだけ（反転なし。v15）
  function rotSigs(key, cells, ctx) {
    const m = 0 | cells.reduce((a, c) => a | bit(c), 0);
    const P0 = ctx.PL[key].find((P) => P.mask === m);
    if (!P0) return null;
    const set = new Set();
    for (let t = 0; t < 8; t++) if (E.rotationOf(key, P0.t, t)) set.add(ORIENT[key][t].sig);
    return set;
  }

  // ------------------------------------------------------------------
  // ◎キューブの組み合わせを全探索（重なり・○の帰属・アイテム結果・在庫を同時に満たすもの）
  // ------------------------------------------------------------------
  function jointEnumerate(ctx, cap, rng) {
    const G = ctx.groups, nG = G.length, NN = ctx.NN;
    const res = { total: 0, count: 0, nodes: 0, aborted: false, inconsistent: false, cellW: new Float64Array(NN), candW: G.map((g) => new Float64Array(g.cands.length)), sameW: null, nodeW: new Map(),
      qSize: [0, 1, 2, 3, 4, 5].map(() => new Float64Array(nG + 1)), qCat: CATS.map(() => new Float64Array(nG + 1)) };
    if (!nG) return res;
    if (G.some((g) => !g.cands.length)) { res.inconsistent = true; return res; }
    const order = G.map((g, i) => i).sort((a, b) => G[a].cands.length - G[b].cands.length);
    const assign = new Int32Array(nG).fill(-1);
    const owner = new Int32Array(NN).fill(-1);
    const tOf = G.map((g) => g.t);
    const oList = ctx.oList;
    const counts = ctx.counts;
    const sameW = new Float64Array(NN * NN);
    res.sameW = sameW;
    const szCnt = new Int32Array(6), ctCnt = new Int32Array(CATS.length);
    const candOrder = G.map((g) => {
      const idx = g.cands.map((c, i) => i);
      if (rng) for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp; }
      return idx;
    });

    function setOwner(mask, v) { let m = mask; while (m) { const lb = m & -m; owner[31 - Math.clz32(lb)] = v; m ^= lb; } }
    // Stealth hit のグループ（gi）と、そのブロック・時刻。merge（○だった）なら、そのブロックは前のグループのキューブに入っていなければならない
    const qList = [];
    G.forEach((g, i) => { if (g.q) qList.push({ gi: i, c: g.c, t: g.t }); });
    const isMerge = (i) => assign[i] >= 0 && G[i].cands[assign[i]].merge;
    function partialOK(depth, used) {
      for (const q of qList) {
        const ow = owner[q.c];
        if (ow === q.gi) continue;                       // 新しいキューブの最初の1発だった
        if (ow >= 0) { if (tOf[ow] >= q.t) return false; continue; }   // ほかのキューブの○：そのキューブは前に見つかっている
        if (!isMerge(q.gi)) continue;                    // まだ決めていない
        let ok = false;
        for (let d = depth + 1; d < nG && !ok; d++) {
          const gj = order[d];
          if (tOf[gj] >= q.t) continue;
          for (const cd of G[gj].cands) if ((cd.mask & bit(q.c)) && !(cd.mask & used)) { ok = true; break; }
        }
        if (!ok) return false;
      }
      for (const o of oList) {
        const ow = owner[o.c];
        if (ow >= 0) { if (tOf[ow] >= o.t) return false; continue; }
        let ok = false;
        for (let d = depth + 1; d < nG && !ok; d++) {
          const gj = order[d];
          if (tOf[gj] >= o.t) continue;
          for (const cd of G[gj].cands) if ((cd.mask & bit(o.c)) && !(cd.mask & used)) { ok = true; break; }
        }
        if (!ok) return false;
      }
      return true;
    }
    // サーチライン（v12.12）の条件で、探索の途中でも枝を刈る（v12.13）。order[0..depth] の◎キューブだけで判断する。
    //  ・ブロックの数・キューブの数は、◎キューブを足すほど増えるので、途中で n・k を超えたらその先も超える
    //  ・ちょうど k になったら、残りの◎キューブはその列・行にかからない（かかれば k を超える）ので、ブロックもいまの数で n に決まる
    // 終わりでしか確かめていなかった頃は、厚い盤面（3・4ブロックの7キューブなど）で全探索が打ち切られると、近似の部分探索が
    // 条件を満たす組み合わせに1つも届かず、「矛盾」と判定することがあった（invariants の決勝で1件）
    function lineOK(depth) {
      for (const L of ctx.lineMax) {
        let cells = 0, pcs = 0;
        for (let d = 0; d <= depth; d++) { const i = order[d]; const cd = G[i].cands[assign[i]]; if (cd.st) continue; const m = cd.mask & L.mask; if (m) { pcs++; cells += popcount(m); } }
        if (cells > L.n) return false;
        if (L.k != null) {
          const fr = popcount(ctx.fragMask & L.mask);
          if (pcs + fr > L.k) return false;
          if (pcs + fr === L.k && cells + fr !== L.n) return false;
        }
      }
      return true;
    }
    function finalOK() {
      let nReal = 0, nSt = 0;
      for (let i = 0; i < nG; i++) { const cd = G[i].cands[assign[i]]; if (cd.pureSt) nSt++; if (!cd.merge && !cd.st) nReal++; }
      if (nSt > ctx.unrevealed) return false;
      if (counts.all != null && nReal > counts.all) return false;
      const bySize = {}, byCat = {};
      for (let i = 0; i < nG; i++) {
        const cd = G[i].cands[assign[i]];
        if (cd.merge || cd.st) continue;
        bySize[cd.size] = (bySize[cd.size] || 0) + 1;
        byCat[cd.cat] = (byCat[cd.cat] || 0) + 1;
      }
      for (const s in bySize) {
        if (bySize[s] > ctx.stockBound[s]) return false;
        if (counts.size[s] != null && bySize[s] > counts.size[s]) return false;
      }
      for (const c in byCat) if (counts.cat[c] != null && byCat[c] > counts.cat[c]) return false;
      for (const L of ctx.lineMax) {
        // ブロックの数：◎キューブがその列・行で埋めるブロック ≦ n。
        // キューブの数（分かっていれば）：かかっている◎キューブ＋生きている破片 ≦ k。ちょうど k なら、ほかのキューブはかかっていないので、ブロックもちょうど n
        let cells = 0, pcs = 0;
        for (let i = 0; i < nG; i++) { const cd = G[i].cands[assign[i]]; if (cd.st) continue; const m = cd.mask & L.mask; if (m) { pcs++; cells += popcount(m); } }
        if (cells > L.n) return false;
        if (L.k != null) {
          const fr = popcount(ctx.fragMask & L.mask);
          if (pcs + fr > L.k) return false;
          if (pcs + fr === L.k && cells + fr !== L.n) return false;
        }
      }
      for (const p of ctx.pairs) {
        const oa = owner[p.a], ob = owner[p.b];
        if ((oa >= 0 && G[oa].cands[assign[oa]].st) || (ob >= 0 && G[ob].cands[assign[ob]].st)) continue;
        if (p.same) { if (oa !== ob) return false; }
        else if (oa >= 0 && oa === ob) return false;
      }
      return true;
    }
    // ノードショットを撃ったときの結果の分布（0＝◎キューブのブロックではない、1〜4＝つながり0〜3）。撃破済み以外のブロック
    const probe = [];
    for (let c = 0; c < NN; c++) if (!(ctx.deadMask & bit(c))) probe.push(c);
    for (const c of probe) res.nodeW.set(c, new Float64Array(5));
    function dfs(depth, used, w) {
      if (res.aborted) return;
      if (++res.nodes > cap) { res.aborted = true; return; }
      if (depth === nG) {
        if (!finalOK()) return;
        res.total += w; res.count++;
        for (let i = 0; i < nG; i++) {
          res.candW[i][assign[i]] += w;
          const cells = G[i].cands[assign[i]].cells;
          for (let a = 0; a < cells.length; a++) for (let b = 0; b < cells.length; b++) if (a !== b) sameW[cells[a] * NN + cells[b]] += w;
        }
        let m = used;
        while (m) { const lb = m & -m; res.cellW[31 - Math.clz32(lb)] += w; m ^= lb; }
        for (const c of probe) { const gi = owner[c]; res.nodeW.get(c)[gi >= 0 ? 1 + nodeDegree(G[gi].cands[assign[gi]].mask, c, ctx.N) : 0] += w; }
        // サーチキューブを使ったときの結果の分布用：◎キューブのうち、各ブロック数・各形状に当てはまる数
        szCnt.fill(0); ctCnt.fill(0);
        for (let i = 0; i < nG; i++) { const cd = G[i].cands[assign[i]]; if (cd.merge || cd.pureSt) continue; szCnt[cd.size]++; ctCnt[CAT_INDEX[cd.cat]]++; }
        for (let sz = 2; sz <= 5; sz++) res.qSize[sz][szCnt[sz]] += w;
        for (let ci = 0; ci < CATS.length; ci++) res.qCat[ci][ctCnt[ci]] += w;
        return;
      }
      const gi = order[depth], g = G[gi];
      for (const k of candOrder[gi]) {
        const cd = g.cands[k];
        if (cd.mask & used) continue;
        assign[gi] = k;
        setOwner(cd.mask, gi);
        if (partialOK(depth, used | cd.mask) && lineOK(depth)) dfs(depth + 1, used | cd.mask, w * cd.w);
        setOwner(cd.mask, -1);
        if (res.aborted) break;
      }
      assign[gi] = -1;
    }
    dfs(0, 0, 1);
    if (res.count === 0 && !res.aborted) res.inconsistent = true;
    return res;
  }

  function solveGroups(ctx, rng) {
    let joint = jointEnumerate(ctx, 120000, null);
    let exact = !joint.aborted;
    if (joint.aborted) {
      // 大きすぎるときは順序を変えた部分探索を重ねて近似する
      const acc = jointEnumerate(ctx, 1, null);
      acc.aborted = false;
      for (let rep = 0; rep < 24; rep++) {
        const part = jointEnumerate(ctx, 6000, rng || Math.random);
        acc.total += part.total; acc.count += part.count;
        for (let c = 0; c < ctx.NN; c++) acc.cellW[c] += part.cellW[c];
        for (let i = 0; i < ctx.groups.length; i++) for (let k = 0; k < acc.candW[i].length; k++) acc.candW[i][k] += part.candW[i][k];
        if (part.sameW) for (let x = 0; x < part.sameW.length; x++) acc.sameW[x] += part.sameW[x];
