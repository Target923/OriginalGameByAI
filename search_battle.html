/* ===== 結果・ルール ===== */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; overflow-y: auto; background: rgba(2, 4, 10, .72); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dialog { width: 100%; max-width: 560px; display: grid; gap: 12px; padding: 22px; }
.verdict { font: 700 clamp(2.6rem, 9vw, 4.2rem)/1 var(--f-tech); letter-spacing: .12em; margin: 0; color: var(--cyan); text-shadow: 0 0 22px rgba(79, 227, 255, .7); animation: glitch 1.6s steps(1) 1; }
.verdict.lose { color: var(--magenta); text-shadow: 0 0 22px rgba(255, 63, 143, .7); }
.verdict.draw { color: var(--amber); text-shadow: 0 0 22px rgba(255, 193, 74, .6); }
.verdict-sub { font-size: 1.15rem; font-weight: 800; margin: 0; }
@keyframes glitch { 0% { transform: translate(3px, -2px); clip-path: inset(10% 0 55% 0); } 8% { transform: translate(-3px, 1px); clip-path: inset(60% 0 8% 0); } 16% { transform: none; clip-path: none; } 30% { transform: translate(2px, 0); } 34% { transform: none; } }
.tablewrap { overflow-x: auto; }
table.score { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .88rem; }
.score th, .score td { padding: .4em .4em; text-align: right; border-bottom: 1px solid rgba(96, 196, 255, .12); }
.score thead th { font: 600 .64rem var(--f-tech); letter-spacing: .14em; color: var(--muted); }
.score tbody th { text-align: left; }
.score .tot { font: 700 1.1rem var(--f-tech); color: var(--cyan); }
.score td.vp { color: var(--good); font-weight: 700; }
.score th, .score td { white-space: nowrap; }
@media (max-width: 520px) {
  table.score { font-size: .8rem; }
  .score th, .score td { padding: .4em .28em; }
  .score thead th { letter-spacing: .04em; }
  .score .tot { font-size: .98rem; }
}
.score small { color: var(--muted); }
.rules { max-width: 680px; font-size: .88rem; }
.rules h2 { font: 700 1.5rem var(--f-tech); letter-spacing: .1em; margin: 0; }
.rules p { margin: 0; }
.flow { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }
.legend-h { font-size: .8rem; margin: 4px 0 0; color: var(--muted); font-weight: 500; }
.icon-legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.icon-legend li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: start; font-size: .82rem; }
.icon-legend svg { width: 22px; height: 22px; fill: none; stroke: var(--cyan); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.icon-legend svg .f { fill: var(--cyan); stroke: none; }
.icon-legend b { display: block; }
.icon-legend span { color: var(--muted); }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 60;
  background: #0B1328; color: var(--text); border: 1px solid var(--edge-2); padding: .6em 1.1em; font-weight: 700; font-size: .88rem; max-width: calc(100% - 32px); text-align: center; transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.good { border-color: var(--good); color: var(--good); }
.toast.warn { border-color: var(--amber); color: var(--amber); }

/* ===== 演出 ===== */
/* ===== シミュレーター（タイトルから開く計算の画面） ===== */
.sim-screen .sim-src { font-size: .8rem; color: var(--muted); margin: 0; }
.sim-screen .sim-src b { color: var(--text); font-family: var(--f-tech); }
.sim-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 6px 16px; }
.sim-head h2 { margin: 0; font: 400 clamp(1.2rem, 3vw, 1.7rem)/1.2 var(--f-logo); }
.sim-head h2 small { display: block; font: 600 .66rem var(--f-tech); letter-spacing: .3em; color: var(--cyan); margin-bottom: 4px; }
.sim-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; align-items: start; }
.sim-side { display: grid; gap: 14px; position: sticky; top: max(12px, env(safe-area-inset-top, 0px)); }
.sim-field { display: grid; gap: 4px; margin-bottom: 10px; }
.sim-field label, .sim-lab { font-size: .76rem; color: var(--muted); }
.sim-num { width: 100%; padding: 7px 8px; border-radius: 4px; border: 1px solid var(--edge-2); background: rgba(3, 8, 20, .8); color: var(--text); font: 700 .95rem var(--f-tech); font-variant-numeric: tabular-nums; }
.sim-trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; align-items: end; }
.sim-vic { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.sim-spd { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 4px; row-gap: 4px; }
.sim-vic span { display: block; font-size: .64rem; color: var(--muted); text-align: center; margin-top: 2px; }
.sim-total { font-size: .8rem; color: var(--muted); margin: 10px 0 8px; }
.sim-total b { font: 700 1.05rem var(--f-tech); color: var(--cyan); }
.sim-check { display: flex; gap: 6px; align-items: center; font-size: .82rem; }
.sim-check input { accent-color: var(--cyan); }
.sim-bar { height: 6px; border-radius: 3px; background: rgba(79, 227, 255, .12); overflow: hidden; }
.sim-bar i { display: block; height: 100%; background: var(--cyan); width: 0; transition: width .2s; }
.sim-prog { display: grid; gap: 4px; font-size: .78rem; color: var(--muted); margin-top: 10px; }
.sim-note { font-size: .76rem; color: var(--muted); margin: 6px 0 0; }
.sim-note.warn { color: #FFD38A; }
.sim-main { display: grid; gap: 14px; min-width: 0; }
.sim-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sim-kpi { padding: 10px 12px; border: 1px solid var(--edge); border-radius: 6px; background: var(--panel-hi); display: grid; gap: 2px; }
.sim-kpi .k { font-size: .72rem; color: var(--muted); }
.sim-kpi .v { font: 700 1.5rem/1.1 var(--f-tech); font-variant-numeric: tabular-nums; }
.sim-kpi .v small { font-size: .72rem; color: var(--muted); margin-left: 2px; }
.sim-kpi .s { font-size: .7rem; color: var(--muted); }
.sim-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.sim-tw { overflow-x: auto; }
.sim-table { width: 100%; border-collapse: collapse; font-size: .82rem; font-variant-numeric: tabular-nums; }
.sim-table th, .sim-table td { padding: 6px 8px; border-bottom: 1px solid rgba(96, 196, 255, .1); text-align: right; white-space: nowrap; }
.sim-table th:first-child, .sim-table td:first-child { text-align: left; }
.sim-table thead th { font: 600 .7rem var(--f-body); color: var(--muted); border-bottom-color: var(--edge); }
.sim-cellbar { display: inline-flex; align-items: center; gap: 6px; justify-content: flex-end; width: 100%; }
.sim-cellbar i { display: inline-block; height: 6px; border-radius: 3px; background: var(--cyan); }
.sim-cellbar i.mg { background: var(--magenta); }
.sim-kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: .84rem; margin: 0; }
.sim-kv dt { color: var(--muted); }
.sim-kv dd { margin: 0; font: 700 .9rem var(--f-tech); font-variant-numeric: tabular-nums; text-align: right; }
.sim-dist { display: grid; gap: 4px; margin-top: 8px; }
.sim-dist div { display: grid; grid-template-columns: 3.2em minmax(0, 1fr) 3.6em; gap: 8px; align-items: center; font-size: .78rem; }
.sim-dist b { font: 700 .78rem var(--f-tech); text-align: right; }
.sim-dist .sim-bar i { background: var(--magenta); }
.sim-hist { width: 100%; height: auto; display: block; }
.sim-hist text { fill: var(--muted); font: 10px var(--f-tech); }
.sim-hist rect.b { fill: var(--amber); }
.sim-hist line { stroke: rgba(96, 196, 255, .2); }
.sim-cmp td.lab { white-space: nowrap; text-align: left; font-size: .76rem; line-height: 1.35; }
.sim-cmp td.lab small { display: block; color: var(--muted); }
.sim-cmp thead th { white-space: normal; min-width: 5.5em; vertical-align: bottom; line-height: 1.3; }
.sim-cmp tr.cur td { background: rgba(79, 227, 255, .06); }
.sim-x { appearance: none; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: .9rem; padding: 2px 6px; }
.sim-x:hover { color: var(--bad); }
@media (max-width: 960px) {
  .sim-layout { grid-template-columns: minmax(0, 1fr); }
  .sim-side { position: static; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .sim-grid2 { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .sim-bar i { transition: none; } }
/* 大会の試合の記録（リプレイの入り口） */
.history { margin-top: 12px; }
.history .hl { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.history .hl li { display: grid; grid-template-columns: 3.4em minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 6px 8px; border: 1px solid var(--edge); background: rgba(79, 227, 255, .03); font-size: .84rem; }
.history .hl li.mine { border-color: rgba(79, 227, 255, .45); }
.hl-r { font: 700 .72rem var(--f-tech); letter-spacing: .06em; color: var(--cyan); }
.hl-m { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hl-w { color: var(--muted); font-size: .76rem; white-space: nowrap; }
.hl-btn, .mc-rp { padding: 4px 10px; font-size: .76rem; }
.mc-rp { justify-self: start; margin-top: 2px; }
@media (max-width: 560px) { .history .hl li { grid-template-columns: 3em minmax(0, 1fr) auto; } .history .hl li > .hl-w:nth-child(3) { display: none; } }
/* ===== リプレイ（ポップアップ。演出のキャンバスより下、ふつうのダイアログより上の段） ===== */
.replay-host { position: fixed; inset: 0; z-index: 40; display: flex; overflow-y: auto; padding: 16px; background: rgba(2, 4, 10, .8); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.replay-host[hidden] { display: none; }
body.replaying #app { display: none; }
/* 画面の中央に置く（入りきらないときは上からスクロール） */
.rp { width: 100%; max-width: 1420px; margin: auto; display: grid; gap: 10px; padding: 14px; animation: menuIn .22s ease-out; }
.rp-head { display: flex; align-items: center; gap: 10px; }
.rp-head > div { flex: 1; min-width: 0; }
.rp-head h2 { margin: 2px 0 0; font-size: 1.02rem; }
.rp-close { min-width: 40px; }
.rp-now { margin: 0; min-height: 2.6em; padding: 6px 10px; border-left: 3px solid var(--cyan); background: rgba(79, 227, 255, .06); font-size: .88rem; line-height: 1.4; }
.rp-now b { font-family: var(--f-tech); letter-spacing: .06em; margin-right: 6px; }
.rp-now.foe { border-left-color: var(--magenta); background: rgba(255, 63, 143, .06); }
.rp-main { display: grid; grid-template-columns: 230px minmax(0, 1fr) 230px; grid-template-areas: "l1 stage l0"; gap: 12px; }
.rp-fields { grid-area: stage; } .rp-side0 { grid-area: l0; } .rp-side1 { grid-area: l1; }
.rp-lh { margin: 0; font-size: .8rem; font-weight: 700; color: var(--cyan); }
.rp-side1 .rp-lh { color: var(--magenta); }
.rp-logwrap { display: flex; flex-direction: column; gap: 6px; }
.rp-logbox { position: relative; flex: 1 1 auto; min-height: 160px; }
.rp-side1 .rp-log li.cur { border-left-color: var(--magenta); background: rgba(255, 63, 143, .08); }
.rp-log li.sys { opacity: .6; }
.rp-log li.none { cursor: default; }
.rp-fields { gap: 12px; }
.rp-left { font: 700 .72rem var(--f-tech); color: var(--cyan); white-space: nowrap; }
.panel.enemy .rp-left { color: var(--magenta); }
/* 盤は画面の高さに合わせて小さくし、ポップアップが画面に収まるように */
.rp-field .board { max-width: clamp(240px, calc(100vh - 430px), 440px); }
.rp-logbox .rp-log { position: absolute; inset: 0; max-height: none; border: 1px solid var(--edge); border-radius: 4px; }
.rp-ctrl { position: sticky; bottom: -14px; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 0; background: var(--panel); }
.rp-ctrl .btn { min-width: 44px; }
.rp-range { flex: 1 1 180px; min-width: 120px; accent-color: var(--cyan); }
.rp-count { font: 700 .78rem var(--f-tech); color: var(--muted); min-width: 4.6em; text-align: right; }
.rp-unit { display: inline-flex; border: 1px solid var(--edge); border-radius: 4px; overflow: hidden; }
.rp-unit button { appearance: none; border: 0; background: transparent; color: var(--muted); font: 600 .78rem var(--f-body); padding: 6px 10px; cursor: pointer; }
.rp-unit button.on { background: rgba(79, 227, 255, .16); color: var(--text); }
.rp-log { position: relative; max-height: 210px; overflow-y: auto; margin: 0; padding: 4px 0; list-style: none; font-size: .78rem; }
.rp-log li { padding: 3px 8px; border-left: 2px solid transparent; color: var(--muted); cursor: pointer; }
.rp-log li:hover { color: var(--text); }
.rp-log li.cur { border-left-color: var(--cyan); background: rgba(79, 227, 255, .08); color: var(--text); }
.rp-log li .t { font: 600 .7rem var(--f-tech); color: var(--muted); margin-right: 6px; }
.rp-pcts { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
.rp-pct { position: absolute; transform: translate(-50%, -50%); padding: 1px 5px; border-radius: 3px; background: rgba(4, 8, 18, .8); border: 1px solid rgba(255, 255, 255, .28); font: 700 clamp(.56rem, 1.5vw, .8rem)/1.25 var(--f-tech); color: #fff; white-space: nowrap; }
.rp-pct.sure { color: var(--amber); border-color: rgba(255, 193, 74, .75); box-shadow: 0 0 8px rgba(255, 193, 74, .35); }
.rp-pct.wait { opacity: .55; }
.rp-warp { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; overflow: visible; }
.rp-warp rect { fill: rgba(180, 156, 255, .12); stroke: var(--violet); stroke-width: .05; stroke-dasharray: .14 .1; }
.rp-cubes { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--edge); }
.rp-cubes .hr-cap { margin-right: 0; }
@media (max-width: 1100px) {
  .rp-main { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-areas: "stage stage" "l1 l0"; }
  .rp-field .board { max-width: clamp(220px, calc(100vh - 560px), 420px); }
  .rp-logbox { min-height: 0; }
  .rp-logbox .rp-log { position: relative; max-height: 150px; }
}
@media (max-width: 720px) {
  .replay-host { padding: 6px; }
  .rp { padding: 10px; }
  .rp-fields { grid-template-columns: 1fr; }
  .rp-main { grid-template-columns: minmax(0, 1fr); grid-template-areas: "stage" "l1" "l0"; }
  .rp-field .board { max-width: 340px; }
  .rp-ctrl { bottom: -10px; }
}
.fx-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 44; pointer-events: none; }
.fx-layer { position: fixed; inset: 0; z-index: 45; pointer-events: none; overflow: hidden; }
.fx-text { position: fixed; transform: translate(-50%, -50%); font: 700 clamp(.9rem, 2.4vw, 1.3rem)/1 var(--f-tech); letter-spacing: .14em; white-space: nowrap; color: #fff;
  animation: fxrise 1.25s cubic-bezier(.2, .8, .2, 1) forwards; text-shadow: 0 0 10px currentColor; }
.fx-text.first { color: var(--magenta); font-size: clamp(1rem, 2.8vw, 1.5rem); }
.fx-text.hit { color: var(--hit); }
.fx-text.stealth { color: #48D1CC; }
/* ステルスを見破って本当の値に直ったアイテムの結果は、数字をゴールドにする（v14.5。どの情報がステルスの影響を受けていたか分かるように） */
.itag.rv b { color: var(--amber); text-shadow: 0 0 6px color-mix(in srgb, var(--amber) 70%, transparent); }
.ctag.rv, .nbadge.rv, .board[data-board="own"] .ctag.rv, .board[data-board="own"] .nbadge.rv { --tc: var(--amber); }
.ink-n.rv, .board[data-board="own"] .ink-n.rv { color: var(--amber); filter: var(--mk-shadow) drop-shadow(0 0 4px var(--amber)); }
/* STEALTH HIT の番号（ステルスを使った順）：◎の番号と同じ位置・大きさで、ターコイズ */
.num.qn { color: #48D1CC; text-shadow: 0 1px 1.5px rgba(0, 0, 0, .9), 0 0 6px rgba(72, 209, 204, .8); }
.fx-text.miss { color: var(--steel-2); font-size: .82rem; text-shadow: none; }
.fx-text.kill { color: #fff; font-size: clamp(1.4rem, 4.4vw, 2.3rem); text-shadow: 0 0 14px var(--magenta), 0 0 30px var(--magenta); animation-duration: 1.5s; }
.fx-text.gold { color: var(--amber); font-size: clamp(1.1rem, 3vw, 1.6rem); }
.fx-text.near { color: var(--cyan); }
.fx-text.count { color: var(--cyan); font-size: clamp(1.2rem, 3.6vw, 1.9rem); animation-duration: 1.6s; }
.fx-text.item { color: var(--cyan); font-size: .9rem; animation-name: fxpop; }
.fx-text.item.enemy, .fx-text.count.enemy { color: var(--magenta); }
.fx-text.bad { color: var(--bad); }
.fx-text.sub { font-family: var(--f-body); font-size: .86rem; letter-spacing: .04em; }
@keyframes fxrise { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 70% { opacity: 1; transform: translate(-50%, -80%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -120%) scale(1); } }
@keyframes fxpop { 0% { opacity: 0; transform: translate(-50%, -50%) scaleX(.2); } 15% { opacity: 1; transform: translate(-50%, -50%) scaleX(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%); } }
.fx-banner { position: fixed; left: 0; right: 0; top: 38%; display: grid; place-items: center; gap: 4px; padding: 16px 0; transform: translateY(-50%);
  background: linear-gradient(90deg, transparent, rgba(6, 14, 30, .92) 18%, rgba(6, 14, 30, .92) 82%, transparent); border-block: 1px solid var(--edge-2);
  animation: bannerIn 1.1s cubic-bezier(.2, .8, .2, 1) forwards; }
.fx-banner b { font: 700 clamp(1.6rem, 5vw, 2.8rem)/1 var(--f-tech); letter-spacing: .3em; color: var(--cyan); text-shadow: 0 0 18px var(--cyan); padding-left: .3em; }
.fx-banner span { font-size: .9rem; color: var(--text); }
.fx-banner.enemy { border-color: rgba(255, 63, 143, .5); }
.fx-banner.enemy b { color: var(--magenta); text-shadow: 0 0 18px var(--magenta); }
.fx-banner.treasure { border-color: rgba(255, 154, 60, .6); }
.fx-banner.treasure b { color: var(--orange); text-shadow: 0 0 18px var(--orange); }
@keyframes bannerIn { 0% { opacity: 0; clip-path: inset(48% 0 48% 0); } 18% { opacity: 1; clip-path: inset(0 0 0 0); } 78% { opacity: 1; clip-path: inset(0 0 0 0); } 100% { opacity: 0; clip-path: inset(48% 0 48% 0); } }
.fxo { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.fxo.lock svg { position: absolute; inset: -30%; width: 160%; height: 160%; fill: none; stroke: var(--magenta); stroke-width: 2.4; filter: drop-shadow(0 0 6px var(--magenta)); animation: lockon .8s cubic-bezier(.2, .8, .2, 1) forwards; }
@keyframes lockon { 0% { opacity: 0; transform: scale(2.2) rotate(-90deg); } 45% { opacity: 1; transform: scale(.9) rotate(0); } 70% { transform: scale(1.05); } 100% { opacity: 0; transform: scale(1); } }
.fxo.reticle svg { position: absolute; inset: -20%; width: 140%; height: 140%; fill: none; stroke: var(--cyan); stroke-width: 2.4; filter: drop-shadow(0 0 6px var(--cyan)); animation: lockon .9s cubic-bezier(.2, .8, .2, 1) forwards; }
.fxo.reticle.enemy svg { stroke: var(--magenta); filter: drop-shadow(0 0 6px var(--magenta)); }
.fxo.impact { background: radial-gradient(circle, #fff 0%, rgba(255, 122, 61, .9) 30%, transparent 70%); animation: impact .45s ease-out forwards; }
@keyframes impact { 0% { opacity: 1; transform: scale(.4); } 100% { opacity: 0; transform: scale(1.6); } }
.fxo.ripple { border: 2px solid var(--steel-2); border-radius: 50%; animation: ripple .7s ease-out forwards; }
@keyframes ripple { 0% { opacity: .9; transform: scale(.2); } 100% { opacity: 0; transform: scale(1.5); } }
.fxo.flash { background: #fff; animation: flash .5s ease-out forwards; }
@keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
.fxo.glitch { background: repeating-linear-gradient(0deg, rgba(255, 84, 104, .65) 0 3px, transparent 3px 7px); animation: glitchCell .9s steps(6) forwards; }
@keyframes glitchCell { 0% { transform: translateX(-4px); opacity: 1; } 30% { transform: translateX(5px); } 60% { transform: translateX(-2px); opacity: .8; } 100% { transform: none; opacity: 0; } }
.fxo.dissolve { background: linear-gradient(160deg, var(--steel-1), var(--steel-3)); box-shadow: inset 0 0 12px var(--cyan); animation: dissolve .9s steps(9) forwards; }
@keyframes dissolve { 0% { opacity: 1; clip-path: inset(0 0 0 0); } 100% { opacity: 0; clip-path: inset(0 0 100% 0); filter: blur(2px) brightness(2); } }
.cell.materialize { animation: materialize .9s cubic-bezier(.2, .8, .2, 1) both; z-index: 2; }
@keyframes materialize { 0% { opacity: 0; transform: scale(.3); filter: brightness(3); } 55% { opacity: 1; transform: scale(1.1); } 100% { transform: scale(1); filter: none; } }
.fxb { position: absolute; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
.fxb.sweep i { position: absolute; inset: -45%; border-radius: 50%; background: conic-gradient(from 0deg, rgba(79, 227, 255, .6), rgba(79, 227, 255, 0) 22%, transparent); animation: sweep 1.3s linear forwards; }
.fxb.sweep.enemy i { background: conic-gradient(from 0deg, rgba(255, 63, 143, .6), rgba(255, 63, 143, 0) 22%, transparent); }
@keyframes sweep { 0% { transform: rotate(0); opacity: 0; } 10% { opacity: 1; } 85% { opacity: 1; } 100% { transform: rotate(540deg); opacity: 0; } }
.fxb.rings { background: repeating-radial-gradient(circle, transparent 0 18px, rgba(79, 227, 255, .25) 18px 19px); animation: flash 1.3s ease-out forwards; }
.fxb.scan .bar { position: absolute; background: linear-gradient(90deg, transparent, rgba(79, 227, 255, .75), transparent); box-shadow: 0 0 18px var(--cyan); }
.fxb.scan.row .bar { left: 0; right: 0; top: calc(100% * var(--i) / var(--n)); height: calc(100% / var(--n)); background-size: 50% 100%; background-repeat: no-repeat; animation: scanx 1.1s ease-in-out forwards; }
.fxb.scan.col .bar { top: 0; bottom: 0; left: calc(100% * var(--i) / var(--n)); width: calc(100% / var(--n)); background: linear-gradient(180deg, transparent, rgba(79, 227, 255, .75), transparent); background-size: 100% 50%; background-repeat: no-repeat; animation: scany 1.1s ease-in-out forwards; }
.fxb.scan.enemy .bar { box-shadow: 0 0 18px var(--magenta); }
.fxb.scan.row.enemy .bar { background-image: linear-gradient(90deg, transparent, rgba(255, 63, 143, .75), transparent); }
.fxb.scan.col.enemy .bar { background-image: linear-gradient(180deg, transparent, rgba(255, 63, 143, .75), transparent); }
@keyframes scanx { 0% { background-position: -100% 0; opacity: 0; } 15% { opacity: 1; } 100% { background-position: 200% 0; opacity: .2; } }
@keyframes scany { 0% { background-position: 0 -100%; opacity: 0; } 15% { opacity: 1; } 100% { background-position: 0 200%; opacity: .2; } }
.fxb.column .bar { position: absolute; top: 0; bottom: 0; left: calc(100% * var(--i) / var(--n)); width: calc(100% / var(--n)); transform-origin: top;
  background: linear-gradient(180deg, rgba(255, 255, 255, .95), rgba(79, 227, 255, .55) 35%, rgba(79, 227, 255, .08)); box-shadow: 0 0 22px var(--cyan); animation: drop 1s cubic-bezier(.2, .8, .2, 1) forwards; }
.fxb.column.enemy .bar { background: linear-gradient(180deg, rgba(255, 255, 255, .95), rgba(255, 63, 143, .55) 35%, rgba(255, 63, 143, .08)); box-shadow: 0 0 22px var(--magenta); }
@keyframes drop { 0% { transform: scaleY(0); opacity: 1; } 40% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }
.fxb.shock { background: radial-gradient(circle, rgba(255, 255, 255, .9), rgba(255, 63, 143, .5) 30%, transparent 62%); animation: impact .8s ease-out forwards; }
/* バズーカで空きブロックが開く */
/* バズーカで分解されたブロック（持ち主にだけ見せる）：ひびが走る */
.fxo.crack { background: linear-gradient(118deg, transparent 44%, rgba(255, 244, 214, .95) 47%, transparent 50%), linear-gradient(28deg, transparent 58%, rgba(255, 193, 74, .9) 61%, transparent 64%); animation: crack .9s ease-out forwards; }
@keyframes crack { 0% { opacity: 0; clip-path: inset(0 100% 0 0); } 40% { opacity: 1; clip-path: inset(0 0 0 0); } 100% { opacity: 0; } }
.fxb.holo { display: grid; place-items: center; perspective: 500px; container-type: size; background: radial-gradient(circle, rgba(79, 227, 255, .2), transparent 60%); animation: flash 1.5s ease-in forwards; }
.fxb.holo.enemy { background: radial-gradient(circle, rgba(255, 63, 143, .2), transparent 60%); }
.holo-cube { --hz: 17cqmin; position: relative; width: 34cqmin; height: 34cqmin; transform-style: preserve-3d; animation: holospin 1.5s cubic-bezier(.2, .8, .2, 1) forwards; }
.holo-cube i { position: absolute; inset: 0; border: 2px solid var(--cyan); background: rgba(79, 227, 255, .12); box-shadow: 0 0 14px rgba(79, 227, 255, .6), inset 0 0 14px rgba(79, 227, 255, .5); }
.fxb.holo.enemy .holo-cube i { border-color: var(--magenta); background: rgba(255, 63, 143, .12); box-shadow: 0 0 14px rgba(255, 63, 143, .6), inset 0 0 14px rgba(255, 63, 143, .5); }
.holo-cube i:nth-child(1) { transform: translateZ(var(--hz)); } .holo-cube i:nth-child(2) { transform: rotateY(180deg) translateZ(var(--hz)); }
.holo-cube i:nth-child(3) { transform: rotateY(90deg) translateZ(var(--hz)); } .holo-cube i:nth-child(4) { transform: rotateY(-90deg) translateZ(var(--hz)); }
.holo-cube i:nth-child(5) { transform: rotateX(90deg) translateZ(var(--hz)); } .holo-cube i:nth-child(6) { transform: rotateX(-90deg) translateZ(var(--hz)); }
@keyframes holospin { 0% { transform: scale(0) rotateX(-30deg) rotateY(0); } 30% { transform: scale(1) rotateX(-30deg) rotateY(160deg); } 100% { transform: scale(1) rotateX(-30deg) rotateY(540deg); } }
#app.shake-1 { animation: shake1 .38s linear; }
#app.shake-2 { animation: shake2 .6s linear; }
@keyframes shake1 { 20% { transform: translate(-3px, 2px); } 40% { transform: translate(3px, -2px); } 60% { transform: translate(-2px, 1px); } 80% { transform: translate(2px, 0); } }
@keyframes shake2 { 10% { transform: translate(-7px, 4px); } 25% { transform: translate(7px, -5px); } 40% { transform: translate(-5px, 3px); } 55% { transform: translate(5px, -2px); } 70% { transform: translate(-3px, 2px); } 85% { transform: translate(2px, -1px); } }

/* ===== 設定：固定の説明・個数の指定 ===== */
.set-fixed { margin: 0; font-size: .86rem; color: var(--muted); padding: .55em .9em; border: 1px dashed var(--edge-2); }
.set-fixed b { color: var(--text); }
.stepper { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.btn.sq { width: 2.4em; height: 2.4em; padding: 0; display: grid; place-items: center; font-size: 1.1rem; }
.stepper output { min-width: 3.2em; text-align: center; font: 700 1.3rem/1 var(--f-tech); color: var(--cyan); }
.stepper output small { font: 500 .74rem var(--f-body); color: var(--muted); margin-left: 2px; }
.warn-t { display: block; margin-top: 6px; color: var(--amber); font-weight: 500; }

/* ===== 大会 ===== */
.tour-screen { display: grid; gap: 14px; }
.tour-hero { padding: 18px 18px 14px; display: grid; gap: 10px; overflow: hidden; }
.tour-hero::selection { background: none; }
.tour-title { margin: 0; font: 800 clamp(1.5rem, 4.6vw, 2.4rem)/1.15 var(--f-body); letter-spacing: .02em; display: flex; flex-wrap: wrap; align-items: center; gap: .3em; }
.tour-title .av { font-size: .5em; }
.tour-lede { margin: 0; color: var(--muted); max-width: 52em; }
.tour-lede b { color: var(--text); }
.tour-lede .rk { color: var(--cyan); font: 700 1.15em var(--f-tech); }
.glitch-in { animation: glitch 1.4s steps(1) 1; }
.tour-steps { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tour-steps li { position: relative; display: grid; gap: 2px; padding: 7px 10px; border: 1px solid var(--edge); background: rgba(79, 227, 255, .03); color: var(--muted); font-size: .72rem; }
.tour-steps li b { font: 700 .86rem var(--f-tech); letter-spacing: .1em; color: var(--dim); }
.tour-steps li.done { border-color: rgba(89, 242, 166, .45); }
.tour-steps li.done b { color: var(--good); }
.tour-steps li.done::after { content: "✓"; position: absolute; right: 8px; top: 6px; color: var(--good); font-weight: 700; }
.tour-steps li.cur { border-color: var(--cyan); background: rgba(79, 227, 255, .14); color: var(--text); box-shadow: 0 0 18px -4px rgba(79, 227, 255, .6); }
.tour-steps li.cur b { color: var(--cyan); }
.tour-steps li.fin b { color: var(--amber); }
.tour-steps li.fin.cur { border-color: var(--amber); background: rgba(255, 193, 74, .12); box-shadow: 0 0 18px -4px rgba(255, 193, 74, .6); }
@media (max-width: 520px) { .tour-steps li span { display: none; } .tour-steps li { padding: 6px 8px; } }

/* アバター（名前の頭の記号） */
.av { flex: none; display: inline-grid; place-items: center; width: 2.3em; height: auto; aspect-ratio: 2 / 1.7320508; font: 700 .74rem/1 var(--f-tech); color: var(--ink-on-cyan);
  clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); background: var(--cyan); }
.av i { font-style: normal; }
.av-alpha { background: var(--magenta); color: #fff; } .av-beta { background: var(--violet); } .av-gamma { background: var(--pc2); } .av-delta { background: #FF9A4D; }
.av0 { background: linear-gradient(180deg, #7BEDFF, #17A4D4); }
.av0 i { font-size: .62em; letter-spacing: -.03em; }

/* 出場者・日程 */
.entrants { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 620px) { .entrants { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ent { display: grid; justify-items: center; gap: 4px; padding: 12px 6px; border: 1px solid var(--edge); background: rgba(79, 227, 255, .04); text-align: center;
  opacity: 0; animation: entIn .5s cubic-bezier(.2, .8, .2, 1) forwards; animation-delay: calc(var(--i) * 140ms + 200ms); }
.ent .av { font-size: 1.1rem; }
.ent b { font-size: .96rem; }
.ent small { color: var(--muted); font-size: .7rem; line-height: 1.4; }
.ent .persona { font: 700 .74rem var(--f-body); font-style: normal; color: var(--amber); letter-spacing: .08em; }
@keyframes entIn { from { opacity: 0; transform: translateY(14px) scale(.96); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
.schedule { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .82rem; }
.schedule li { display: flex; flex-wrap: wrap; gap: 4px 12px; border-bottom: 1px solid rgba(96, 196, 255, .12); padding: 4px 0; }
.schedule b { font-family: var(--f-tech); color: var(--cyan); min-width: 5em; }

/* 試合のカード */
.mcards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.mcards.one { grid-template-columns: minmax(0, 640px); }
.mcard { position: relative; overflow: hidden; display: grid; gap: 6px; padding: 12px 14px; border: 1px solid var(--edge); background: var(--panel); border-radius: 6px; }
.mcard.mine { border-color: rgba(79, 227, 255, .5); }
.mc-h { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font: 600 .72rem var(--f-tech); letter-spacing: .12em; color: var(--muted); }
.mc-tag { font: 500 .66rem var(--f-body); letter-spacing: 0; color: var(--violet); border: 1px solid rgba(180, 156, 255, .5); padding: 1px 6px; }
.mc-vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; }
.mc-vs .vs { font: 700 .8rem var(--f-tech); color: var(--dim); letter-spacing: .1em; }
.mc-p { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 8px; align-items: center; min-width: 0; }
.mc-p:last-child { grid-template-columns: minmax(0, 1fr) auto; text-align: right; }
.mc-p:last-child .av { grid-column: 2; grid-row: 1 / span 2; }
.mc-p .av { grid-row: 1 / span 2; }
.mc-p b { font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mc-pt { font: 700 1rem var(--f-tech); color: var(--muted); }
.mc-pt small { font-size: .66rem; margin-left: 1px; }
.mc-p em { grid-column: 1 / -1; font: 700 .66rem var(--f-tech); letter-spacing: .2em; color: var(--good); font-style: normal; }
.mc-p:not(:last-child) em { grid-column: 2; }
.mc-p:last-child em { grid-column: 1; grid-row: 3; }
.mc-p.win .mc-pt { color: var(--good); }
.mc-pt.minus { color: var(--magenta); }
.scorebar td.live { color: var(--cyan); }
.mc-sub { margin: 0; font-size: .8rem; color: var(--text); }
.mc-lost { margin: 0; font-size: .72rem; color: var(--muted); }
/* CPUどうしの試合：はじめは「走らせている」幕を見せ、終わったら結果を出す */
.mc-scan { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5, 9, 20, .92); transition: opacity .35s .1s; }
.mc-scan .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 34%; background: linear-gradient(90deg, transparent, rgba(180, 156, 255, .35), transparent); animation: scanX 1s linear infinite; }
.mc-scan .tt { position: relative; font: 700 .9rem var(--f-tech); letter-spacing: .3em; color: var(--violet); }
.mc-scan .tt b { color: #fff; letter-spacing: .1em; margin-left: .4em; }
@keyframes scanX { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
.mcard.sim.done .mc-scan, .tour-screen:not(.fx) .mc-scan { opacity: 0; pointer-events: none; }
.mcard.sim.done { animation: cardFlash .6s ease-out; }
@keyframes cardFlash { from { box-shadow: 0 0 0 1px rgba(180, 156, 255, .9), 0 0 30px rgba(180, 156, 255, .6); } to { box-shadow: none; } }

/* 順位表と横の列 */
.tour-grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1240px) { .tour-grid:not(.solo) { grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); } }
.tour-side { display: grid; gap: 10px; }
.standings { display: grid; gap: 6px; }
.st-head, .st-row { display: grid; grid-template-columns: 3.4em minmax(8.5em, 1.2fr) 6.6em minmax(0, 1.3fr) minmax(0, 1.4fr); gap: 8px; align-items: center; }
.st-head { font: 600 .62rem var(--f-tech); letter-spacing: .14em; color: var(--muted); padding: 0 10px; }
.st-body { display: grid; gap: 6px; }
.st-row { position: relative; padding: 9px 10px; border: 1px solid var(--edge); background: rgba(79, 227, 255, .035); }
.st-row.me { border-color: rgba(79, 227, 255, .65); background: rgba(79, 227, 255, .1); box-shadow: inset 3px 0 0 var(--cyan); }
.st-row.fin { box-shadow: inset 3px 0 0 var(--amber); }
.st-row.me.fin { box-shadow: inset 3px 0 0 var(--amber), 0 0 0 1px rgba(79, 227, 255, .35); }
.st-row.champ { border-color: rgba(255, 193, 74, .8); background: linear-gradient(90deg, rgba(255, 193, 74, .16), rgba(255, 193, 74, .03)); }
/* 演出：はじめは前の順位の位置に置いて点数を数え、数え終わったら（.slid）新しい順位へスライドする */
.fx .st-row { animation: rowIn .5s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 90ms); transform: translateY(calc(var(--shift) * (100% + 6px))); transition: transform .9s cubic-bezier(.3, .9, .2, 1); }
.fx.slid .st-row { transform: none; }
@keyframes rowIn { from { opacity: 0; } to { opacity: 1; } }
.st-rank { display: grid; justify-items: start; gap: 1px; }
.st-rank b { font: 700 1.5rem/1 var(--f-tech); color: var(--text); }
.st-row.fin .st-rank b { color: var(--amber); }
.chg { font: 700 .62rem var(--f-tech); font-style: normal; }
.chg.up { color: var(--good); } .chg.down { color: var(--bad); }
.fx .chg { opacity: 0; transition: opacity .3s .5s; } .fx.slid .chg { opacity: 1; }
.st-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
.st-name > div { display: grid; min-width: 0; }
.st-name b { font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-name small { color: var(--muted); font-size: .7rem; }
.st-name .gold { color: var(--amber); font-weight: 700; }
.st-pts { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 3px; }
.st-pts b { font: 700 1.45rem/1 var(--f-tech); color: var(--cyan); font-variant-numeric: tabular-nums; }
.st-pts small { color: var(--muted); font-size: .7rem; }
.gain { font: 700 .74rem var(--f-tech); margin-left: 4px; }
.gain.up { color: var(--good); } .gain.down { color: var(--bad); }
.fx .gain { opacity: 0; transition: opacity .3s .6s; } .fx.counted .gain { opacity: 1; }
.st-pts .tie { align-self: center; margin-left: 5px; padding: 0 4px; font: 700 .6rem var(--f-tech); letter-spacing: .06em; color: var(--amber); border: 1px solid rgba(255, 193, 74, .55); border-radius: 2px; }
.st-gems { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 1px; margin-top: 5px; min-height: 13px; }
.st-gems em { font: 600 .62rem var(--f-tech); font-style: normal; color: var(--muted); letter-spacing: .06em; }
.gm { width: 13px; height: 13px; flex: none; }
.gm path { fill: rgba(255, 63, 143, .78); stroke: #FFB3D1; stroke-width: 1.6; stroke-linejoin: round; }
.gm path.facet { fill: none; stroke: rgba(255, 255, 255, .55); stroke-width: 1.2; }
.score td.gems { white-space: nowrap; }
.score .gx { display: inline-flex; align-items: center; gap: 1px; font-weight: 700; }
.score .gx + .gx { margin-left: 5px; }
.score .gx.up { color: var(--good); } .score .gx.down { color: var(--bad); }
.score .gx .gm { width: 12px; height: 12px; }
.gm.new { filter: drop-shadow(0 0 4px rgba(255, 63, 143, .95)); }
.fx .gm.new { animation: gemIn .9s .5s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes gemIn { 0% { opacity: 0; transform: translateY(-6px) scale(.4); } 60% { opacity: 1; transform: translateY(0) scale(1.25); } 100% { transform: none; } }
.gm.lost path { fill: none; stroke: rgba(255, 179, 209, .72); stroke-dasharray: 2.5 2; }
.gm.lost path.facet { display: none; }
.fx .gm.lost { animation: gemOut .9s .5s ease-out both; }
@keyframes gemOut { 0% { opacity: 1; transform: none; } 100% { opacity: .75; transform: translateY(2px); } }
.st-cubes { display: flex; flex-wrap: wrap; gap: 3px 9px; }
.cb { display: inline-flex; align-items: center; gap: 2px; }
.cb b { font: 700 .72rem var(--f-tech); color: var(--muted); margin-right: 2px; }
.cb i { width: 7px; height: 7px; border: 1px solid var(--dim); background: transparent; transform: rotate(45deg) scale(.86); }
.cb i.on { border-color: transparent; background: linear-gradient(135deg, #F3F7FC, #8A97AE); box-shadow: 0 0 5px rgba(79, 227, 255, .45); }
.st-items { display: flex; flex-wrap: wrap; gap: 3px; }
.si { position: relative; display: grid; place-items: center; width: 21px; height: 21px; border: 1px solid rgba(79, 227, 255, .35); color: var(--cyan); background: rgba(79, 227, 255, .06); }
.si svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.si svg .f { fill: currentColor; stroke: none; }
.si.bz { color: var(--amber); border-color: rgba(255, 193, 74, .45); }
.si.none { color: var(--dim); border-color: rgba(75, 86, 110, .5); background: none; opacity: .55; }
.si em { position: absolute; right: -5px; bottom: -6px; font: 700 .55rem/1.3 var(--f-tech); font-style: normal; color: var(--text); background: var(--void); border: 1px solid var(--edge-2); padding: 0 2px; border-radius: 3px; }
.st-line { position: relative; height: 0; margin: 2px 0; border-top: 1px dashed rgba(255, 193, 74, .7); }
.st-line span { position: absolute; right: 8px; top: -.75em; font: 600 .62rem var(--f-tech); letter-spacing: .12em; color: var(--amber); background: var(--void); padding: 0 6px; }
@media (max-width: 860px) {
  .st-head { display: none; }
  .st-row { grid-template-columns: 2.6em minmax(0, 1fr) auto; grid-template-areas: "rank name pts" "rank cubes cubes" "rank items items"; row-gap: 6px; }
  .st-rank { grid-area: rank; align-self: start; }
  .st-name { grid-area: name; }
  .st-pts { grid-area: pts; justify-content: flex-end; }
  .st-gems { justify-content: flex-end; }
  .st-cubes { grid-area: cubes; }
  .st-items { grid-area: items; }
}

/* ショップ */
.btn.sq-sm { padding: .42em .7em; font-size: .74rem; display: grid; justify-items: center; line-height: 1.1; }
.btn.sq-sm small { font: 600 .6rem var(--f-tech); color: inherit; opacity: .8; }

/* 決勝の先攻・後攻 */
.choice-btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-width: 640px; }
.choice { display: grid; gap: 3px; text-align: left; padding: 12px 14px; border: 1px solid var(--edge-2); background: rgba(79, 227, 255, .05); color: var(--text); cursor: pointer;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
.choice b { font-size: 1.05rem; }
.choice small { color: var(--muted); font-size: .76rem; }
.choice:hover { background: rgba(79, 227, 255, .14); }
.choice.on { border-color: var(--amber); background: rgba(255, 193, 74, .16); box-shadow: inset 0 0 16px rgba(255, 193, 74, .3); }
.choice.on b { color: var(--amber); }

/* 通過・敗退・優勝の幕 */
.big-banner { position: relative; font: 800 clamp(2.2rem, 8.5vw, 4.4rem)/1.05 var(--f-logo); letter-spacing: .04em; overflow: hidden; padding: .08em 0; }

<script id="src-engine">
/* サーチバトル — ルールエンジン
 * 盤面・形状・コール・アンサー・トレジャー・アイテム・スコア・勝敗を処理する。
 * ブラウザでは window.SBEngine、Node では module.exports として公開する。
 */
(function (root) {
  'use strict';

  const COLS = 'ABCDE';
  const STOCK = { 2: 5, 3: 4, 4: 3, 5: 2 };
  // Z型（v12.17）：段違いの形。4ブロック・5ブロックに入れて、2×2キューブやL型・T型に化けられるようにした（5ブロックが弱かったため）
  const CATS = ['R型', 'L型', 'T型', 'Z型'];

  // base はインデックス順を保ったまま回転・反転する（トレジャー位置の追従に使う）
  const SHAPES = {
    A1: { size: 1, cat: 'R型', name: 'アッド', base: [[0, 0]] },
    D2: { size: 2, cat: 'R型', name: '1×2', base: [[0, 0], [0, 1]] },
    I3: { size: 3, cat: 'R型', name: '1×3', base: [[0, 0], [0, 1], [0, 2]] },
    L3: { size: 3, cat: 'L型', name: 'L型', base: [[0, 0], [1, 0], [1, 1]] },
    I4: { size: 4, cat: 'R型', name: '1×4', base: [[0, 0], [0, 1], [0, 2], [0, 3]] },
    O4: { size: 4, cat: 'R型', name: '2×2', base: [[0, 0], [0, 1], [1, 0], [1, 1]] },
    L4: { size: 4, cat: 'L型', name: 'L型', base: [[0, 0], [1, 0], [2, 0], [2, 1]] },
    T4: { size: 4, cat: 'T型', name: 'T型', base: [[0, 0], [0, 1], [0, 2], [1, 1]] },
    I5: { size: 5, cat: 'R型', name: '1×5', base: [[0, 0], [0, 1], [0, 2], [0, 3], [0, 4]] },
    L5: { size: 5, cat: 'L型', name: 'L型(4+1)', base: [[0, 0], [1, 0], [2, 0], [3, 0], [3, 1]] },
    V5: { size: 5, cat: 'L型', name: 'L型(3+3)', base: [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2]] },
    T5: { size: 5, cat: 'T型', name: 'T型(3+2)', base: [[0, 0], [0, 1], [0, 2], [1, 1], [2, 1]] },
    Y5: { size: 5, cat: 'T型', name: 'T型(4+1)', base: [[0, 0], [0, 1], [0, 2], [0, 3], [1, 1]] },
    // Z型（v12.17）。■■ / _■■ ・ ■■ / _■■■ ・ ■■ / _■ / _■■
    Z4: { size: 4, cat: 'Z型', name: 'Z型', base: [[0, 0], [0, 1], [1, 1], [1, 2]] },
    Z5: { size: 5, cat: 'Z型', name: 'Z型(2+3)', base: [[0, 0], [0, 1], [1, 1], [1, 2], [1, 3]] },
    S5: { size: 5, cat: 'Z型', name: 'Z型(2+1+2)', base: [[0, 0], [0, 1], [1, 1], [2, 1], [2, 2]] },
  };
  const SHAPES_BY_SIZE = { 1: ['A1'], 2: ['D2'], 3: ['I3', 'L3'], 4: ['I4', 'O4', 'L4', 'T4', 'Z4'], 5: ['I5', 'L5', 'V5', 'T5', 'Y5', 'Z5', 'S5'] };

  // 状態の形が変わったら上げる（公開ページの更新時に、古い対戦を新しいルールで再開しないため）
  // 20：v12.16 スピードペナルティ自滅点化＆アンサー失敗で手番即終了
  // 21：v12.17 Z型（Z4・Z5・S5）を追加
  // 22：v13 ステルスを作り直し（当たると「Stealth hit」。◎か○かを伏せる）
  // 23：v14 ステルスを作り直し（キューブを隠す。ステルスアンサーで見破る）
  // 24：v14.1 ×に撃ったステルスアンサーの外れは手番終了だけ（kb.probes。v14.2 で元に戻した）
  // 25：v14.2 ステルスのトリガーブロック（コールされると STEALTH HIT。すべてのステルスが見破られる）
  // 26：v14.5 用語の変更（形の分類の名前が R型・L型・T型・Z型に）
  // 27：v15 ワープを作り直し（トリガーと移動先を決めておき、トリガーをコールされるかアンサーで当てられると移動する）
  // 28：v15.1 ステルスの見破りをキューブごとに（トリガー・ぴったりのアンサー・ステルスアンサーで見破られるのは、そのキューブだけ）
  const VERSION = 28;
  const ITEM_KEYS = ['cube', 'line', 'number', 'shape', 'pair', 'node', 'bazooka', 'warp', 'stealth'];
  // アイテムの説明（v14.5 で短くした。空きブロックにはどのアイテムも NoData、とルール画面の見出しに1回だけ書く）
  const ITEMS = {
    cube: { name: 'サーチキューブ', desc: '選んだ形かブロック数のキューブが、いくつ残っているか分かる' },
    line: { name: 'サーチライン', desc: '選んだ1列（1行）にかかるキューブの数とブロックの数が分かる（例：2キューブ / 3ブロック）' },
    number: { name: 'サーチサイズ', desc: '選んだブロックのキューブが何ブロックか分かる' },
    shape: { name: 'サーチシェイプ', desc: '選んだブロックのキューブの形が分かる' },
    pair: { name: 'ペアショット', desc: '選んだ2ブロックが同じキューブか分かる' },
    node: { name: 'ノードショット', desc: '選んだブロックから、同じキューブが上下左右にいくつつながっているか分かる（0〜3）' },
    bazooka: { name: 'バズーカ', desc: '選んだブロックのキューブを1ブロックずつに分解する。当たっていたブロックはその場で撃破' },
    warp: { name: 'ワープ', desc: 'キューブにトリガーと移動先を決めておく。トリガーをコールされるか、アンサーで当てられると移動する' },
    stealth: { name: 'ステルス', desc: '自分のキューブを1つ隠す（コールは×、アイテムは効かない）。選んだ1ブロックが弱点で、撃たれるか、×のブロックでアンサーされるとばれる' },
  };

  function bit(c) { return 1 << c; }
  function popcount(x) {
    x = x - ((x >>> 1) & 0x55555555);
    x = (x & 0x33333333) + ((x >>> 2) & 0x33333333);
    return (((x + (x >>> 4)) & 0x0f0f0f0f) * 0x01010101) >>> 24;
  }
  function bitsOf(m) { const out = []; while (m) { const lb = m & -m; out.push(31 - Math.clz32(lb)); m ^= lb; } return out; }
  function maskOf(cells) { let m = 0; for (const c of cells) m |= bit(c); return m; }

  function normalize(cells) {
    let minR = Infinity, minC = Infinity;
    for (const [r, c] of cells) { if (r < minR) minR = r; if (c < minC) minC = c; }
    return cells.map(([r, c]) => [r - minR, c - minC]);
  }
  function sigOf(cells) { return cells.map(([r, c]) => r * 16 + c).sort((a, b) => a - b).join(','); }
  // t: 0..7 （下位2ビット=回転回数, 4以上=反転）
  function transform(base, t) {
    const out = base.map(([r, c]) => {
      let rr = r, cc = (t >> 2) ? -c : c;
      for (let k = 0; k < (t & 3); k++) { const tmp = rr; rr = cc; cc = -tmp; }
      return [rr, cc];
    });
    return normalize(out);
  }

  const ORIENT = {};
  for (const key in SHAPES) {
    ORIENT[key] = [];
    for (let t = 0; t < 8; t++) {
      const cells = transform(SHAPES[key].base, t);
      let h = 0, w = 0;
      for (const [r, c] of cells) { if (r + 1 > h) h = r + 1; if (c + 1 > w) w = c + 1; }
      ORIENT[key].push({ cells, h, w, sig: sigOf(cells) });
    }
  }

  // 向き t2 が、向き t1 を回しただけの形か（裏返していないか）。ワープの「回転だけ・反転なし」（v15）に使う。
  //  向きの番号は下位2ビットが回転の回数、4以上が裏返し。形が左右対称なら、裏返しても回転と同じ形になるので、形（sig）で比べる
  function rotationOf(key, t1, t2) {
    const sig = ORIENT[key][t2].sig;
    for (let r = 0; r < 4; r++) if (ORIENT[key][(t1 & 4) | r].sig === sig) return true;
    return false;
  }
  function cellsFor(key, t, r0, c0, N) {
    const o = ORIENT[key][t];
    if (r0 < 0 || c0 < 0 || r0 + o.h > N || c0 + o.w > N) return null;
    return o.cells.map(([r, c]) => (r + r0) * N + (c + c0));
  }

  const PLC_CACHE = {};
  // 形状ごとの重複なし配置一覧（CPUの推論用）
  function placements(N) {
    if (PLC_CACHE[N]) return PLC_CACHE[N];
    const out = {};
    for (const key in SHAPES) {
      const seen = new Set();
      const arr = [];
      for (let t = 0; t < 8; t++) {
        const o = ORIENT[key][t];
        for (let r0 = 0; r0 + o.h <= N; r0++) {
          for (let c0 = 0; c0 + o.w <= N; c0++) {
            const cells = o.cells.map(([r, c]) => (r + r0) * N + (c + c0));
            const mask = maskOf(cells);
            if (seen.has(mask)) continue;
            seen.add(mask);
            arr.push({ key, size: SHAPES[key].size, cat: SHAPES[key].cat, t, r0, c0, cells, mask });
          }
        }
      }
      out[key] = arr;
    }
    PLC_CACHE[N] = out;
    return out;
  }

  function identifyShape(cells, N) {
    if (!cells.length) return null;
    const sig = sigOf(normalize(cells.map((c) => [Math.floor(c / N), c % N])));
    for (const key in SHAPES) {
      if (SHAPES[key].size !== cells.length) continue;
      for (const o of ORIENT[key]) if (o.sig === sig) return key;
    }
    return null;
  }

  function coord(c, N) { return COLS[c % N] + '-' + (Math.floor(c / N) + 1); }
  // 配置画面でなぞって選んだブロックの組から、形・向き・置く位置を逆算する（配置できる形でなければ null）。
  // 1ブロック（アッド）は配置で使わないので除く
  function matchPlacement(cells, N) {
    if (!cells || cells.length < 2) return null;
    const rc = cells.map((c) => [Math.floor(c / N), c % N]);
    let r0 = Infinity, c0 = Infinity;
    for (const [r, c] of rc) { if (r < r0) r0 = r; if (c < c0) c0 = c; }
    const sig = sigOf(normalize(rc));
    for (const key of SHAPES_BY_SIZE[cells.length] || []) {
      if (key === 'A1') continue;
      for (let t = 0; t < 8; t++) if (ORIENT[key][t].sig === sig) return { key, t, r0, c0 };
    }
    return null;
  }
  // ログ用のキューブの呼び名（バズーカで分解されたものは「1ブロックのキューブ」）
  function pieceName(p) { return p.frag ? '1ブロックのキューブ' : p.isAdd ? 'アッド' : p.size + 'ブロックのキューブ'; }
  // ログ用：ブロックを読み順（A-1, B-1, …, A-2, …）に並べて「・」でつなぐ
  function coordList(cells, N) { return cells.slice().sort((a, b) => a - b).map((c) => coord(c, N)).join('・'); }
  function lineMask(line, index, N) {
    let m = 0;
    for (let k = 0; k < N; k++) m |= bit(line === 'row' ? index * N + k : k * N + index);
    return m;
  }
  function lineLabel(line, index) { return line === 'row' ? (index + 1) + '行' : COLS[index] + '列'; }
  // ノードショット：そのブロックで、同じキューブのブロックが上下左右にいくつつながっているか
  function nodeDegree(mask, c, N) {
    const r = Math.floor(c / N), col = c % N;
    let k = 0;
    if (r > 0 && (mask & bit(c - N))) k++;
    if (r < N - 1 && (mask & bit(c + N))) k++;
    if (col > 0 && (mask & bit(c - 1))) k++;
    if (col < N - 1 && (mask & bit(c + 1))) k++;
    return k;
  }
  // 2ブロックのブロック数（上下左右に何ブロック進むか）。どの形状でも、キューブの中を通る最短距離と一致する
  function blockDist(a, b, N) { return Math.abs(Math.floor(a / N) - Math.floor(b / N)) + Math.abs((a % N) - (b % N)); }

  // 盤面のルール：4×4（予選ルール）／5×5（決勝ルール）。ドラフトの有無はアイテムの設定（draftEach）で決める
  function makeRules(kind) {
    return kind === 'final'
      // lateTurn：終盤（BGMが激しくなる）のターン（v12.5のキューブの上限は、v12.6でなくした）
      ? { kind: 'final', label: '決勝', N: 5, lateTurn: 13, treasureMax: 5 }
      : { kind: 'prelim', label: '予選', N: 4, lateTurn: 9, treasureMax: 4 };
  }

  // ------------------------------------------------------------------
  // opts：
  //  rules 'prelim'（4×4）／'final'（5×5）、label 画面に出す試合名
  //  items この試合で使えるアイテムの種類、inventory [手持ち, 手持ち]（種類ごとの数。省略時は使える種類を1つずつ）
  //  draftEach ドラフトで1人が取る数（0＝ドラフトなし。ドラフトのときは手持ち0から始める）
  //  oncePerMatch 1試合で同じ種類のアイテムは1回まで（大会の予選）
  //  stocks [置けるキューブ, 置けるキューブ]（ブロック数ごとの数。大会では試合ごとに減る）
  //  setupPlan [席0の方針, 席1の方針]（CPUの配置の方針。大会で使う）
  //  itemKeep [席0, 席1]（CPUが温存するアイテムの数。大会の予選で使う）
  function Game(opts) {
    opts = opts || {};
    this.rules = makeRules(opts.rules);
    if (opts.label) this.rules.label = opts.label;
    this.N = this.rules.N;
    this.NN = this.N * this.N;
    this.rng = opts.rng || Math.random;
    this.mode = opts.mode || 'pvp';
    this.v = VERSION;
    // この試合で使えるアイテム
    const pick = Array.isArray(opts.items) ? ITEM_KEYS.filter((k) => opts.items.indexOf(k) >= 0) : [];
    this.itemKeys = pick.length ? pick : ITEM_KEYS.slice();
    this.draftEach = Math.max(0, Math.min(Math.floor(this.itemKeys.length / 2), opts.draftEach | 0));
    this.oncePerMatch = !!opts.oncePerMatch;
    // CPUの配置の方針（[席0, 席1]。大会で、CPUが順位・残りのキューブ・試合の残りから決めたもの。中身はCPUだけが読む）
    this.setupPlan = Array.isArray(opts.setupPlan) ? opts.setupPlan : null;
    // CPUがこの試合で使わずに残しておくアイテムの数（[席0, 席1]、種類ごと。大会の予選で使う。中身はCPUだけが読む）
    this.itemKeep = Array.isArray(opts.itemKeep) ? opts.itemKeep : null;
    // トレジャーの的中で増える点（大会は+3。単発の試合は点数なし＝0）。ログ・演出の表示に使う
    this.treasurePts = opts.treasurePts | 0;
    this.treasureSteal = !!opts.treasureSteal;   // 大会：トレジャー＝相手の宝石（見つけたら奪う）
    this.victoryPts = opts.victoryPts | 0;       // 大会：この試合の勝利点（表示用）
    this.speedBonus = !!opts.speedBonus;         // 大会の予選：スピードペナルティあり（v12.14。v12.15まではスピードボーナス。項目の名前は互換のためそのまま）
    this.clock = 0;
    this.turn = 1;
    this.first = opts.first != null ? opts.first : (this.rng() < 0.5 ? 0 : 1);
    this.cur = this.first;
    this.phase = 'setup';
    this.sub = null;
    this.itemUsed = false;
    this.pending = null;
    this.draft = null;
    this.log = [];
    this.result = null;
    this.lastAction = null;
    this.events = [];
    // リプレイ（v12.9）：この試合の操作の記録（メソッド名と引数の並び）と、はじめの設定。先攻（first）と合わせて、どの場面も再現できる
    this.actions = [];
    try { this.initOpts = JSON.parse(JSON.stringify(Object.assign({}, opts, { rng: undefined }))); } catch (e) { this.initOpts = null; }
    const names = opts.names || ['プレイヤー1', 'プレイヤー2'];
    const cpu = opts.cpu || [false, false];
    const stocks = opts.stocks || [];
    const inv = opts.inventory || [];
    this.players = [0, 1].map((i) => this._newPlayer(i, names[i], !!cpu[i], opts.wallet || 0, stocks[i], inv[i]));
    // 相手が置けるキューブの数（大会では公開情報）を推論に使う
    for (const i of [0, 1]) this.players[i].kb.stock = Object.assign({}, this.players[1 - i].stock);
  }

  Game.prototype._newPlayer = function (i, name, isCPU, wallet, stock, inv) {
    const NN = this.NN;
    const items = {};
    for (const k of ITEM_KEYS) {
      const inPlay = this.itemKeys.indexOf(k) >= 0;
      items[k] = !inPlay ? 0 : inv ? Math.max(0, inv[k] | 0) : this.draftEach ? 0 : 1;
    }
    const st = { 2: 0, 3: 0, 4: 0, 5: 0 };
    const src = stock || STOCK;
    for (const s of [2, 3, 4, 5]) st[s] = Math.max(0, src[s] | 0);
    return {
      idx: i, name, isCPU, stock: st,
      pieces: [], nextId: 1, treasure: null, setupDone: false,
      splitPieces: [],   // バズーカで分解された元のキューブ（大会では次の試合で元の形に戻す）
      items, used: {}, wallet, rebuys: 0,
      score: { attack: 0, survival: 0, treasure: 0, rebuy: 0, total: 0 },
      // 相手盤面についての自分の記録（予想盤面）
      view: {
        marks: new Array(NN).fill(null), dead: new Array(NN).fill(null), tlog: new Array(NN).fill(null),
        oo: 0, treasureFound: false, lastCall: -1,
      },
      // 推論用の事実ログ（相手盤面について自分が知り得たこと）
      kb: {
        N: this.N, stock: Object.assign({}, STOCK),
        calls: [], deads: [], warps: [], adds: [], empties: [], occs: [], counts: [],
        pairs: [], nodes: [], splits: [], stealths: [], tlogs: [], grays: [], failedAnswers: [],
        reveals: [],   // ステルスを見破った時刻と、見破ったキューブの数（v14）
        warpUses: [],  // 相手がワープを使った時刻（v15。使ったことだけが分かる。どのキューブか・移動先は伏せられる）
      },
    };
  };

  Game.prototype.foeOf = function (pi) { return this.players[1 - pi]; };
  Game.prototype.living = function (pi) { return this.players[pi].pieces.filter((p) => p.alive); };
  // 相手から見えるキューブ（v14）：隠れているステルスのキューブは、アイテムの対象にならない（空きブロックと同じに見える）
  Game.prototype._seenAt = function (pi, c) { const p = this.pieceAt(pi, c); return p && !p.stealth ? p : null; };
  Game.prototype.pieceAt = function (pi, c, includeDead) {
    for (const p of this.players[pi].pieces) {
      if (!includeDead && !p.alive) continue;
      if (p.mask & bit(c)) {
        if (p.alive) return p;
        if (includeDead) return p;
      }
    }
    return null;
  };
  Game.prototype.deadMask = function (pi) {
    let m = 0;
    for (const p of this.players[pi].pieces) if (!p.alive) m |= p.mask;
    return m;
  };
  Game.prototype.livingMask = function (pi, exceptId) {
    let m = 0;
    for (const p of this.players[pi].pieces) if (p.alive && p.id !== exceptId) m |= p.mask;
    return m;
  };
  Game.prototype.coord = function (c) { return coord(c, this.N); };
  Game.prototype._tick = function () { return ++this.clock; };
  // 演出用のイベント（公開情報と、当事者だけが見てよい情報を分けて持つ）
  Game.prototype._emit = function (ev) {
    ev.id = this.events.length;
    ev.turn = this.turn;
    this.events.push(ev);
  };
  // extra：表示に使う追加の情報（アンサーの cells＝宣言したブロック。ログにマウスを重ねたとき、盤の上で光らせる）
  Game.prototype._log = function (actor, text, priv, kind, key, extra) {
    this.log.push(Object.assign({ id: this.log.length, turn: this.turn, actor, text, priv: priv || null, kind: kind || 'info', key: key || null }, extra || {}));
  };

  // ---------------- 配置 ----------------
  Game.prototype.stockLeft = function (pi, size) {
    const P = this.players[pi];
    const used = P.pieces.filter((p) => !p.isAdd && p.size === size).length;
    return ((P.stock && P.stock[size]) || 0) - used;
  };
  Game.prototype.checkPlacement = function (pi, key, t, r0, c0) {
    const cells = cellsFor(key, t, r0, c0, this.N);
    if (!cells) return { ok: false, reason: '盤面からはみ出します' };
    const mask = maskOf(cells);
    if (mask & this.livingMask(pi)) return { ok: false, reason: 'ほかのキューブと重なります', cells, mask };
    return { ok: true, cells, mask };
  };
  Game.prototype.placePiece = function (pi, key, t, r0, c0) {
    const P = this.players[pi];
    if (this.phase !== 'setup' || P.setupDone) return { ok: false, reason: '配置フェーズではありません' };
    const sh = SHAPES[key];
    if (!sh || key === 'A1') return { ok: false, reason: '置けない形です' };
    if (this.stockLeft(pi, sh.size) <= 0) return { ok: false, reason: sh.size + 'ブロックのキューブは残っていません' };
    const chk = this.checkPlacement(pi, key, t, r0, c0);
    if (!chk.ok) return chk;
    const piece = this._makePiece(P, key, t, r0, c0, chk.cells);
    piece.col = this._freeCol(P);
    P.pieces.push(piece);
    return { ok: true, piece };
  };
  // キューブの色・柄の番号（col）：置いたときに、そのとき空いている中でいちばん小さい番号を付け、あとは変えない。
  //  途中のキューブを外しても、ほかのキューブの色・柄が変わらないようにするため（外した番号は、次に置くキューブが使う）。
  //  画面は col を 1〜8 の色・柄に当てはめる（ui.js の colorIndex）。バズーカの破片は元のキューブの番号を受け継ぐ
  Game.prototype._freeCol = function (P) {
    const used = new Set(P.pieces.filter((p) => !p.isAdd && !p.frag && p.col).map((p) => p.col));
    for (const sp of P.splitPieces || []) if (sp.col) used.add(sp.col);
    let k = 1;
    while (used.has(k)) k++;
    return k;
  };
  Game.prototype._makePiece = function (P, key, t, r0, c0, cells) {
    const sh = SHAPES[key];
    return {
      id: P.nextId++, owner: P.idx, shape: key, size: sh.size, cat: sh.cat, isAdd: key === 'A1',
      t, r0, c0, cells, mask: maskOf(cells), alive: true, hitMask: 0, hitOrder: [], oonums: [], cause: null,
      placedAt: this.clock, deadAt: null,
    };
  };
  Game.prototype.removePiece = function (pi, id) {
    const P = this.players[pi];
    if (this.phase !== 'setup' || P.setupDone) return { ok: false };
    P.pieces = P.pieces.filter((p) => p.id !== id);
    if (P.treasure && P.treasure.pieceId === id) P.treasure = null;
    return { ok: true };
  };
  Game.prototype.clearSetup = function (pi) {
    const P = this.players[pi];
    if (this.phase !== 'setup' || P.setupDone) return;
    P.pieces = []; P.treasure = null;
  };
  Game.prototype.setTreasure = function (pi, cell) {
    const P = this.players[pi];
    if (this.phase !== 'setup' || P.setupDone) return { ok: false };
    const p = this.pieceAt(pi, cell);
    if (!p) return { ok: false, reason: 'トレジャーはキューブのブロックに置きます' };
    P.treasure = { pieceId: p.id, idx: p.cells.indexOf(cell), cell };
    return { ok: true };
  };
  // sizes: 置くキューブのブロック数の配列。省略時はテンプレートから選ぶ
  Game.prototype.randomSetup = function (pi, sizes, rng) {
    rng = rng || this.rng;
    const N = this.N;
    const templates = N === 4
      ? [[2, 3, 4], [2, 3, 3], [3, 4], [2, 2, 3, 4], [2, 3, 5], [3, 3, 4]]
      : [[2, 3, 4, 5], [3, 4, 5], [2, 3, 4, 4], [2, 2, 3, 4, 5], [3, 3, 4, 5]];
    for (let attempt = 0; attempt < 60; attempt++) {
      this.clearSetup(pi);
      const list = sizes || templates[Math.floor(rng() * templates.length)];
      let ok = true;
      for (const size of list) {
        if (this.stockLeft(pi, size) <= 0) { ok = false; break; }
        const keys = SHAPES_BY_SIZE[size].filter((k) => placements(N)[k].length > 0);
        let placed = false;
        for (let k = 0; k < 80 && !placed; k++) {
          const key = keys[Math.floor(rng() * keys.length)];
          const t = Math.floor(rng() * 8);
          const o = ORIENT[key][t];
          if (o.h > N || o.w > N) continue;
          const r0 = Math.floor(rng() * (N - o.h + 1));
          const c0 = Math.floor(rng() * (N - o.w + 1));
          if (this.placePiece(pi, key, t, r0, c0).ok) placed = true;
        }
        if (!placed) { ok = false; break; }
      }
      if (!ok) continue;
      const ps = this.players[pi].pieces;
      const p = ps[Math.floor(rng() * ps.length)];
      this.setTreasure(pi, p.cells[Math.floor(rng() * p.cells.length)]);
      return true;
    }
    return false;
  };
  Game.prototype.finishSetup = function (pi) {
    const P = this.players[pi];
    if (this.phase !== 'setup' || P.setupDone) return { ok: false, reason: '配置フェーズではありません' };
    if (!P.pieces.length) return { ok: false, reason: '最低1キューブを置いてください' };
    if (!P.treasure) return { ok: false, reason: 'トレジャーをセットしてください' };
    P.setupDone = true;
    if (this.players.every((q) => q.setupDone)) {
      if (this.draftEach > 0) {
        // ドラフト：使えるアイテムの中から1人 draftEach 個ずつ、後攻から取る（大会の決勝は9種類から4つずつ）
        // 順番はトゥエ・モース順（i の2進数の1の個数が偶数なら後攻、奇数なら先攻：後先先後先後後先…）。
        // 最初と最後を同じプレイヤーが取らないよう、そうなるときは最後の2つを入れ替える
        // 4つずつ＝後先先後先後後先（v11.1で 後先先後後先後先 から変更。CPUどうしの先攻勝率 41.1%→50.1%）
        // 3つずつ＝後先先後後先、2つずつ＝後先後先（これらは前と同じ）
        const second = 1 - this.first;
        const pool = this.itemKeys.slice();
        const each = this.draftEach;
        const order = [];
        for (let i = 0; i < each * 2; i++) {
          let odd = 0;
          for (let x = i; x; x >>= 1) odd ^= x & 1;
          order.push(odd ? this.first : second);
        }
        const n = order.length;
        if (n >= 2 && order[n - 1] === order[0]) { const tmp = order[n - 1]; order[n - 1] = order[n - 2]; order[n - 2] = tmp; }
        if (!order.length) { this._startPlay(); return { ok: true }; }
        this.draft = { pool, order, step: 0, picks: [[], []], each };
        this.phase = 'draft';
      } else {
        this._startPlay();
      }
    }
    return { ok: true };
  };

  // ---------------- ドラフト ----------------
  Game.prototype.draftTurn = function () { return this.draft ? this.draft.order[this.draft.step] : -1; };
  Game.prototype.draftPick = function (pi, key) {
    const d = this.draft;
    if (this.phase !== 'draft' || !d) return { ok: false };
    if (d.order[d.step] !== pi) return { ok: false, reason: '相手の番です' };
    const i = d.pool.indexOf(key);
    if (i < 0) return { ok: false, reason: 'そのアイテムは残っていません' };
    d.pool.splice(i, 1);
    d.picks[pi].push(key);
    this.players[pi].items[key] += 1;
    this._log(pi, `${this.players[pi].name}：ドラフトで${ITEMS[key].name}を獲得`, null, 'draft', key);
    d.step++;
    if (d.step >= d.order.length || !d.pool.length) this._startPlay();
    return { ok: true };
  };

  Game.prototype._startPlay = function () {
    this.phase = 'play';
    this.turn = 1;
    this.cur = this.first;
    this.sub = 'item';
    this.itemUsed = false;
    this._log(-1, `試合開始。先攻は${this.players[this.first].name}`, null, 'system');
    this._emit({ type: 'start', first: this.first });
  };

  // ---------------- 手番 ----------------
  Game.prototype.isCallable = function (pi, c) {
    if (!Number.isInteger(c) || c < 0 || c >= this.NN) return false;   // 盤の外・ブロックの指定なしはコールできない
    const v = this.players[pi].view;
    if (v.dead[c]) return false;
    const m = v.marks[c];
    return !m || (m.r === 'x' && m.callable);
  };
  Game.prototype.isTreasureCallable = function (pi, c) {
    if (!Number.isInteger(c) || c < 0 || c >= this.NN) return false;
    const v = this.players[pi].view;
    if (v.treasureFound) return false;
    const tl = v.tlog[c];
    return !tl || tl.gray;
  };
  Game.prototype._myTurn = function (pi, subs) {
    return this.phase === 'play' && this.cur === pi && subs.indexOf(this.sub) >= 0;
  };

  Game.prototype.call = function (pi, c) {
    if (!this._myTurn(pi, ['item', 'call'])) return { ok: false, reason: 'コールできる状態ではありません' };
    if (!this.isCallable(pi, c)) return { ok: false, reason: 'そのブロックはコールできません' };
    const me = this.players[pi], foe = this.foeOf(pi);
    const v = me.view;
    const t = this._tick();
    const p = this.pieceAt(foe.idx, c);
    let res;
    if (!p) {
      v.marks[c] = { r: 'x', callable: false, t };
      me.kb.calls.push({ c, t, r: 'x' });
      res = { r: 'x' };
      this._log(pi, `${me.name}：${this.coord(c)}をコール → ×`, null, 'call');
      this._emit({ type: 'call', actor: pi, owner: foe.idx, c, r: 'x' });
    } else if (p.warpPlan && c === p.warpPlan.trigger) {
      // ワープのトリガーブロック（v15）：ここをコールされるとワープが発動する。
      //  当たったブロックはワープレティクルになり（演出）、キューブは決めておいた移動先へ。移動先にもワープレティクルが出る（相手のヒント）
      p.hitMask |= bit(c);
      (p.hitOrder || (p.hitOrder = [])).push(c);
      v.marks[c] = { r: 'wp', t };
      me.kb.calls.push({ c, t, r: 'wp' });   // 移動前の位置へのヒット。すぐ後のワープ（kb.warps）で「もういない」と説明がつく
      this._log(pi, `${me.name}：${this.coord(c)}をコール → ワープ発動（トリガー）`, null, 'hit');
      this._emit({ type: 'call', actor: pi, owner: foe.idx, c, r: 'wp' });
      const fire = this._warpFire(p, 'trigger', pi);
      res = { r: 'wp', warp: true, reticle: fire.reticle };
      if (fire.destroyed) res.destroyed = fire.destroyed;
    } else {
      const first = p.hitMask === 0;
      p.hitMask |= bit(c);
      (p.hitOrder || (p.hitOrder = [])).push(c);
      if (p.stealth && c === p.stealthTrigger) {
        // トリガーブロック（v14.2）：隠れたキューブの弱点。ここをコールされると STEALTH HIT になり、
        // 見破られるのはこのキューブだけ（v15.1。ユーザーの指摘：v14.2 までは、ほかのステルスもまとめて見破られていた）
        // num：ステルスの番号（使った順。v14.3）。同じ番号の STEALTH HIT は同じキューブ
        v.marks[c] = { r: 'q', num: p.stealthNo, t, trigger: true };   // trigger：ここがトリガーブロックだった（画面で目の印を出す）
        me.kb.calls.push({ c, t, r: 'q', num: p.stealthNo });
        res = { r: 'q', num: p.stealthNo, trigger: true };
        this._log(pi, `${me.name}：${this.coord(c)}をコール → STEALTH HIT ${p.stealthNo}（トリガー）`, null, 'hit');
      } else if (p.stealth) {
        // ステルス（v14）：見破られるまでは、当たっても×に見せる（コールした側には空きブロックと同じに見える）。
        //  ヒットとしては数えておき、見破られたら STEALTH HIT に変わる。見破られるまでは全ブロック当たっても撃破されない（相手に見えないため）
        v.marks[c] = { r: 'x', callable: false, t };
        me.kb.calls.push({ c, t, r: 'x' });
        res = { r: 'x' };
        this._log(pi, `${me.name}：${this.coord(c)}をコール → ×`, null, 'call');
      } else if (p.stealthRevealed) {
        // 見破られたステルスのキューブ：ヒットは STEALTH HIT（◎の番号は使わない）
        v.marks[c] = { r: 'q', num: p.stealthNo, t };
        me.kb.calls.push({ c, t, r: 'q', num: p.stealthNo });
        res = { r: 'q', num: p.stealthNo };
        this._log(pi, `${me.name}：${this.coord(c)}をコール → STEALTH HIT ${p.stealthNo}`, null, 'hit');
      } else if (first) {
        v.oo += 1;
        p.oonums.push(v.oo);
        v.marks[c] = { r: 'oo', num: v.oo, t };
        me.kb.calls.push({ c, t, r: 'oo', num: v.oo });
        res = { r: 'oo', num: v.oo };
        this._log(pi, `${me.name}：${this.coord(c)}をコール → ◎${v.oo}`, null, 'hit');
      } else {
        v.marks[c] = { r: 'o', t };
        me.kb.calls.push({ c, t, r: 'o' });
        res = { r: 'o' };
        this._log(pi, `${me.name}：${this.coord(c)}をコール → ○`, null, 'hit');
      }
      this._emit({ type: 'call', actor: pi, owner: foe.idx, c, r: res.r, num: res.num });
      if (res.trigger) this._revealAll(foe.idx, [p], pi);
      // 全ブロックに当たったら撃破（隠れているステルスのキューブは、見破られるまで撃破しない。見破りで撃破済みなら何もしない）
      if (p.alive && p.hitMask === p.mask && !p.stealth) {
        this._destroy(p, 'destroy');
        res.destroyed = { size: p.size, cells: p.cells.slice(), isAdd: p.isAdd };
        this._log(pi, `${me.name}：${pieceName(p)}を撃破（${coordList(p.cells, this.N)}）`, null, 'kill');
      }
    }
    v.lastCall = c;
    this.lastAction = { kind: 'call', pi, c, res };
    this.sub = 'answer';
    res.ended = this._checkEnd();
    return Object.assign({ ok: true }, res);
  };

  // コールできるブロックが1つもないとき（全ブロックをコール済みなど）は、コールを飛ばしてアンサーへ進める
  Game.prototype.hasCallable = function (pi) {
    for (let c = 0; c < this.NN; c++) if (this.isCallable(pi, c)) return true;
    return false;
  };
  Game.prototype.skipCall = function (pi) {
    if (!this._myTurn(pi, ['item', 'call']) || this.hasCallable(pi)) return { ok: false, reason: 'コールできるブロックがあります' };
    this.sub = 'answer';
    this._log(pi, `${this.players[pi].name}：コールできるブロックがないため、コールを飛ばした`, null, 'call');
    return { ok: true };
  };

  Game.prototype.answer = function (pi, cells) {
    if (!this._myTurn(pi, ['answer'])) return { ok: false, reason: 'アンサーできる状態ではありません' };
    cells = Array.from(new Set(cells)).sort((a, b) => a - b);
    const key = identifyShape(cells, this.N);
    if (!key) return { ok: false, reason: 'R型・L型・T型のいずれかの形で宣言してください' };
    const me = this.players[pi], foe = this.foeOf(pi);
    const mask = maskOf(cells);
    this._tick();
    const target = foe.pieces.find((p) => p.alive && p.mask === mask);
    const where = coordList(cells, this.N);
    const hidden = foe.pieces.filter((p) => p.alive && p.stealth);
    if (target && target.warpPlan) {
      // ワープを待っているキューブを当てた（v15）：撃破されずに、決めておいた移動先へ逃げる。移動先のヒント（レティクル）は出ない。
      //  アンサーは正しいので失敗ではなく（差し出しなし）、手番も続く（アンサー成功と同じ）
      this._emit({ type: 'answer', actor: pi, owner: foe.idx, cells, success: true, escaped: true });
      this._log(pi, `${me.name}：アンサー成功（${where}）→ ワープで逃げられた`, null, 'kill', null, { cells: cells.slice() });
      this._warpFire(target, 'answer', pi);
      this.lastAction = { kind: 'answer', pi, ok: true, escaped: true, cells };
      return { ok: true, success: true, escaped: true, ended: false };
    }
    if (target) {
      this._emit({ type: 'answer', actor: pi, owner: foe.idx, cells, success: true });
      // 隠れているステルスのキューブをぴったり当てたら、ふつうに撃破。ほかのステルスのキューブは隠れたまま（v15.1）
      if (target.stealth) this._revealAll(foe.idx, [], pi, null, target);
      this._destroy(target, 'answer');
      this._log(pi, `${me.name}：アンサー成功（${where}）`, null, 'kill', null, { cells: cells.slice() });
      this.lastAction = { kind: 'answer', pi, ok: true, cells };
      const ended = this._checkEnd();
      return { ok: true, success: true, size: target.size, ended };
    }
    // ステルスアンサー（v14）：宣言したブロックが全部、隠れているステルスのキューブのブロックならセーフ（失敗にならない）。
    //  見破られるのは、宣言したブロックを含むステルスのキューブだけ（×が STEALTH HIT に、アイテムの結果が本当の値に変わる。v15.1）。手番は続く（アンサー成功と同じ）。
    //  1ブロックでよい（何ブロックでもよいが、関係ないブロックが1つでも入れば、ふつうのアンサーとして失敗）
    let sMask = 0;
    for (const p of hidden) sMask |= p.mask;
    if (sMask && (mask & ~sMask) === 0) {
      this._emit({ type: 'answer', actor: pi, owner: foe.idx, cells, success: true, stealth: true });
      this._log(pi, `${me.name}：ステルスアンサー（${where}）→ ステルスを見破った`, null, 'kill', null, { cells: cells.slice() });
      this._revealAll(foe.idx, hidden.filter((p) => p.mask & mask), pi, cells);
      this.lastAction = { kind: 'answer', pi, ok: true, stealth: true, cells };
      const ended = this._checkEnd();
      return { ok: true, success: true, stealth: true, ended };
    }
    me.kb.failedAnswers.push({ mask, t: this.clock });
    this._emit({ type: 'answer', actor: pi, owner: foe.idx, cells, success: false });
    this._log(pi, `${me.name}：アンサー失敗（${where}）`, null, 'miss', null, { cells: cells.slice() });
    this.sub = 'sacrifice';
    this.pending = { kind: 'answerFail', who: pi };
    this.lastAction = { kind: 'answer', pi, ok: false, cells };
    return { ok: true, success: false };
  };

  Game.prototype.sacrifice = function (pi, pieceId) {
    if (!(this.phase === 'play' && this.sub === 'sacrifice' && this.pending && this.pending.who === pi)) return { ok: false };
    const p = this.players[pi].pieces.find((x) => x.id === pieceId && x.alive);
    if (!p) return { ok: false, reason: '生きている自分のキューブを選んでください' };
    // 隠れているステルスのキューブを差し出したら、そのキューブだけ公開する（ほかのステルスはそのまま）
    if (p.stealth) this._revealStealth(pi, [p]);
    // ワープを待っているキューブを差し出しても、ワープは発動しない（自分で差し出すので逃げられない。v15）
    p.warpPlan = null;
    this._destroy(p, 'answerFail');
    this._log(pi, `${this.players[pi].name}：ペナルティで${pieceName(p)}を公開・撃破（${coordList(p.cells, this.N)}）`, null, 'penalty');
    this.pending = null;
    const ended = this._checkEnd();
    if (!ended) {
      // アンサー失敗時はペナルティ後にその手番を即終了（v12.16）
      // 連続アンサーによる捨て身の総当たりを防ぐため、以降のアンサーやトレジャーコールはスキップし直ちに相手の手番へ移る
      this._advance();
    }
    return { ok: true, ended };
  };

  // トレジャーチャンスの残り回数（予選4回・決勝5回まで）
  Game.prototype.treasureLeft = function (pi) {
    const P = this.players[pi];
    if (P.view.treasureFound) return 0;
    return Math.max(0, (this.rules.treasureMax || 99) - P.kb.tlogs.length);
  };
  Game.prototype.endTurn = function (pi) {
    if (!this._myTurn(pi, ['answer'])) return { ok: false };
    if (this.turn % 2 === 0 && this.treasureLeft(pi) > 0) {
      this.sub = 'treasure';
      this._emit({ type: 'tchance', actor: pi, left: this.treasureLeft(pi), max: this.rules.treasureMax });
      return { ok: true, treasure: true };
    }
    this._advance();
    return { ok: true };
  };

  Game.prototype.treasureCall = function (pi, c) {
    if (!this._myTurn(pi, ['treasure'])) return { ok: false };
    if (!this.isTreasureCallable(pi, c)) return { ok: false, reason: 'そのブロックにはトレジャーコールできません' };
    const me = this.players[pi], foe = this.foeOf(pi);
    const t = this._tick();
    const T = foe.treasure.cell;
    const tp = foe.pieces.find((p) => p.id === foe.treasure.pieceId);
    const N = this.N;
    const adj = Math.abs(Math.floor(c / N) - Math.floor(T / N)) + Math.abs((c % N) - (T % N)) === 1;
    let r;
    if (c === T) r = 'H';
    else if (adj || (tp && (tp.mask & bit(c)))) r = 'N';
    else r = 'X';
    me.view.tlog[c] = { r, gray: false, t };
    me.kb.tlogs.push({ c, t, r });
    if (r === 'H') {
      me.view.treasureFound = true;
      me.kb.treasureFound = true;
      me.score.treasure += 10;
      me.kb.occs.push({ c, t, cat: null });
    }
    this._emit({ type: 'treasure', actor: pi, owner: foe.idx, c, r });
    const label = r === 'H' ? (this.treasureSteal ? `的中！（宝石を1つ奪う +${this.treasurePts}pt）` : this.treasurePts ? `的中！（+${this.treasurePts}pt）` : '的中！') : r === 'N' ? 'ニア' : '外れ';
    const left = this.treasureLeft(pi);
    this._log(pi, `${me.name}：${this.coord(c)}にトレジャーコール → ${label}${r === 'H' ? '' : `（残り${left}回）`}`, null, r === 'H' ? 'treasure' : 'tcall');
    if (r !== 'H' && left === 0) {
      this._log(pi, `${me.name}：トレジャーチャンスを使い切りました（トレジャー失敗）`, null, 'tcall');
      this._emit({ type: 'tfail', actor: pi });
    }
    this.lastAction = { kind: 'treasure', pi, c, r };
    this._advance();
    return { ok: true, r };
  };

  Game.prototype._advance = function () {
    this.cur = 1 - this.cur;
    if (this.cur === this.first) this.turn += 1;
    this.sub = 'item';
    this.itemUsed = false;
    this.pending = null;
    this._emit({ type: 'turn', cur: this.cur, turn: this.turn });
  };

  // ---------------- 撃破と終了 ----------------
  // ステルスを見破る（v14）：持ち主 owner の隠れているステルスのキューブ（pieces）を公開し、
  // 相手（見破った側）の記録を本当の姿に直す。
  //  ①ステルスの後にそのキューブのブロックへコールした×は STEALTH HIT に
  //  ②ステルスの後にそのキューブのブロックへ使ったアイテムの NoData は本当の結果に（サーチサイズ・シェイプ・ノード。バズーカはさかのぼって分解しない）
  //  ③ステルスの後のサーチキューブ・サーチラインの数に、そのキューブを足す
  //  ④ステルスの後のペアショットで、2ブロックともそのキューブなら「同じキューブ」に
  //  キューブの位置そのものは明かさない（分かるのは、×だったブロックが STEALTH HIT に変わることと、アイテムの結果だけ）。
  //  STEALTH HIT に変わったブロック（turned）と、画面の演出用に結果が変わったブロック（fixed）・数が変わったか（counts）を返す
  Game.prototype._revealStealth = function (owner, pieces) {
    const A = this.players[1 - owner];
    const v = A.view, kb = A.kb, N = this.N;
    const turned = [];
    // 画面の演出用：結果が変わったブロック（NoData→本当の値・ペアショット）と、数（サーチキューブ・ライン）が変わったか
    const fixed = [];
    let countsChanged = false;
    for (const p of pieces) {
      const ts = p.stealthAt;
      const inP = (c) => (p.mask & bit(c)) !== 0;
      // ステルスの後の×と、ステルスの前に当たっていた◎・○（v14.4。ユーザーの希望：ステルスマークの間に◎が残らないように）を、
      // どちらも番号つきの STEALTH HIT にそろえる（同じキューブのヒットが同じ印・同じ番号で並ぶ）
      //  ◎・○は、いまそのブロックに付いている印で、このキューブのヒット（hitMask）のものだけ（ワープ前の別のキューブの記録は変えない）
      const turnable = (c, m) => m && ((m.r === 'x' && m.t > ts) || ((m.r === 'oo' || m.r === 'o') && m.t <= ts && (p.hitMask & bit(c))));
      // 記録（kb.calls）：ステルスの後の×はすべて（ワープの後にもう一度コールした×も）、◎・○はいま付いている印と同じ時刻のもの
      for (const k of kb.calls) if (inP(k.c) && k.r === 'x' && k.t > ts) { k.r = 'q'; k.num = p.stealthNo; }
      for (const c of p.cells) {
        const m = v.marks[c];
        if (!turnable(c, m)) continue;
        if (m.r !== 'x') for (const k of kb.calls) if (k.c === c && k.t === m.t) { k.r = 'q'; k.num = p.stealthNo; }
        v.marks[c] = { r: 'q', num: p.stealthNo, t: m.t };
        turned.push(c);
      }
      const keep = [];
      for (const e of kb.empties) {
        if (!(e.t > ts && inP(e.c))) { keep.push(e); continue; }
        fixed.push(e.c);
        // rv：見破りで本当の値に直した記録（画面でゴールドにして、ステルスの影響があった情報だと分かるようにする。v14.5）
        if (e.src === 'number') kb.occs.push({ c: e.c, t: e.t, cat: null, size: p.size, turn: e.turn, src: 'number', rv: true });
        else if (e.src === 'shape') kb.occs.push({ c: e.c, t: e.t, cat: p.cat, turn: e.turn, src: 'shape', rv: true });
        else if (e.src === 'node') {
          const deg = nodeDegree(p.mask, e.c, N);
          kb.occs.push({ c: e.c, t: e.t, cat: null, deg, turn: e.turn, src: 'node', rv: true });
          const nd = kb.nodes.find((x) => x.t === e.t && x.c === e.c);
          if (nd) { nd.k = deg; nd.rv = true; }
        }
      }
      kb.empties = keep;
      kb.occs.sort((a, b) => a.t - b.t);
      for (const q of kb.counts) {
        if (q.t <= ts) continue;
        if (q.kind === 'line') {
          const lm = lineMask(q.line, q.index, N);
          if (p.mask & lm) { q.k += 1; q.n += popcount(p.mask & lm); countsChanged = true; q.rv = true; }
        } else if (q.kind === 'cat' ? p.cat === q.value : p.size === q.value) { q.n += 1; countsChanged = true; q.rv = true; }
      }
      for (const pr of kb.pairs) if (pr.t > ts && inP(pr.a) && inP(pr.b)) { pr.same = true; pr.rv = true; fixed.push(pr.a, pr.b); }
      p.stealth = false;
      p.stealthRevealed = true;
    }
    // nums：見破ったステルスの番号（STEALTH HIT の番号＝使った順。どのステルスがまだ隠れているかを CPU が知るため。v15.1）
    kb.reveals.push({ t: this.clock, n: pieces.length, nums: pieces.map((p) => p.stealthNo) });
    return { turned, fixed: Array.from(new Set(fixed)), counts: countsChanged };
  };
  // ステルスの見破り（トリガー・ステルスアンサー・ぴったりのアンサー）：pieces のキューブだけを見破る（v15.1）。全ブロック当たっていたキューブは撃破
  //  target：ぴったり当てて撃破するキューブ（このあと answer が撃破する）。×の付け替えとアイテムの結果の訂正だけして、ここでは撃破しない
  Game.prototype._revealAll = function (owner, pieces, actor, answered, target) {
    const all = target ? pieces.concat([target]) : pieces;
    if (!all.length) return;
    const me = this.players[actor];
    const fx = this._revealStealth(owner, all);
    const turned = fx.turned.sort((a, b) => a - b);
    // ステルスアンサーで宣言したブロックは、ステルスのキューブのブロックだと分かる（位置の事実として残す。ヒットではない）
    const t = this.clock;
    for (const c of answered || []) me.kb.occs.push({ c, t, cat: null, turn: this.turn, src: 'stealth' });
    this._emit({ type: 'reveal', actor, owner, cells: turned.slice(), fixed: fx.fixed, counts: fx.counts });
    this._log(actor, `${me.name}：ステルスを見破った（${turned.length ? `×→STEALTH HIT：${coordList(turned, this.N)}` : '隠れていたヒットはなし'}）`, null, 'kill');
    for (const p of pieces) {
      if (p.alive && p.hitMask === p.mask) {
        this._destroy(p, 'destroy');
        this._log(actor, `${me.name}：${pieceName(p)}を撃破（${coordList(p.cells, this.N)}）`, null, 'kill');
      }
    }
  };

  // ワープの発動（v15）：決めておいた移動先へキューブを移す。by：'trigger'（トリガーブロックをコールされた）／'answer'（アンサーで当てられた）。
  //  actor：コール・アンサーをした側（相手）。相手の記録（予想盤面と推論用の kb）を次のように直す：
  //  ①相手の×はすべて、もう一度コールできるようにする（キューブが×のブロックへ動いてきたかもしれないため）
  //  ②移動前の位置のうち、相手が知っているブロックだけを×（W付き）にする：
  //     トリガー → 当たっていたブロック（◎・○とトリガー）だけ。当たっていないブロックは伏せたまま（v15 で少し強く。v14 までは全部公開）
  //     アンサー → 宣言したブロック全部（相手はもう知っている）
  //  ③トリガーのときは、移動後のキューブの「トリガーにあたるブロック」にワープレティクルを出す（コール済み・1発目のヒットとして数える）
  //  ④トレジャーはキューブと一緒に動き、相手のトレジャーログはグレーになる（今までのワープと同じ）
  Game.prototype._warpFire = function (p, by, actor) {
    const owner = this.players[p.owner], A = this.players[actor];
    const v = A.view, kb = A.kb, N = this.N;
    const plan = p.warpPlan;
    p.warpPlan = null;
    const t = this._tick();
    const oldCells = p.cells.slice();
    const idx = oldCells.indexOf(plan.trigger);   // トリガーが、キューブの何番目のブロックか（向きを変えても番号は同じブロックを指す）
    const shown = by === 'answer' ? oldCells.slice() : oldCells.filter((c) => p.hitMask & bit(c));
    for (let c = 0; c < this.NN; c++) { const m = v.marks[c]; if (m && m.r === 'x') m.callable = true; }
    // wtrig：相手が当てたトリガーのブロック（画面でワープの印を出す。ステルスの trigger と同じ考え方）
    for (const c of shown) v.marks[c] = by === 'trigger' && c === plan.trigger ? { r: 'x', callable: false, t, warp: true, wtrig: true } : { r: 'x', callable: false, t, warp: true };
    // キューブを動かす（被弾はリセット）
    p.t = plan.t; p.r0 = plan.r0; p.c0 = plan.c0;
    p.cells = plan.cells.slice(); p.mask = plan.mask; p.hitMask = 0; p.hitOrder = [];
    // warpTrig：ワープしたあとのトリガーのブロック（トリガーを移動先へ運んだブロック）。発動したあとも、持ち主の画面・リプレイ・答え合わせで
    //  ワープの印を出し続ける（どこがトリガーだったか分かるように。ステルスの stealthTrigger と同じ。ユーザーの希望）
    p.warpTrig = p.cells[idx];
    const hadT = !!(owner.treasure && owner.treasure.pieceId === p.id);
    if (hadT) {
      owner.treasure.cell = p.cells[owner.treasure.idx];
      for (let c = 0; c < this.NN; c++) if (v.tlog[c]) v.tlog[c].gray = true;
      kb.grays.push(t);
    }
    // 推論用の記録：移動前の位置で分かっているブロック（oldMask）。形（key）は、アンサーのとき（全ブロックが分かっている）だけ。
    //  partial：移動前の位置の一部しか分からないワープ（トリガー）。trigger・reticle：移動前のトリガーと移動後のレティクルのブロック
