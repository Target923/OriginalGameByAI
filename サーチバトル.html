<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>サーチバトル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="サイバー空間で敵の構造を透視する位置あてバトル。1vs1と最強CPU戦。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Dela+Gothic+One&family=M+PLUS+1:wght@400;500;700;800&family=Share+Tech+Mono&display=swap">
<style>
:root {
  /* Layout: サイバー空間の司令室。中央に自陣と敵陣のフィールドを横並びにし、
     左右の縦長パネルに防御・攻撃の記録を流す。単一のダークテーマ。 */
  color-scheme: dark;
  --void: #03050B;
  --panel: rgba(9, 15, 31, .8);
  --panel-hi: rgba(18, 30, 58, .85);
  --edge: rgba(96, 196, 255, .2);
  --edge-2: rgba(96, 196, 255, .46);
  --text: #DDE7F6;
  --muted: #8592AB;
  --dim: #4B566E;
  --cyan: #4FE3FF;
  --cyan-2: #18A6D6;
  --magenta: #FF3F8F;
  --hit: #FF7A3D;
  --amber: #FFC14A;
  --orange: #FF9A3C;
  --violet: #B49CFF;
  --good: #59F2A6;
  --bad: #FF5468;
  --ink-on-cyan: #021018;
  --steel-1: #F3F7FC; --steel-2: #A3AEC0; --steel-3: #586377; --steel-4: #232A38;
  --pc0: #C8D2E2; --pc1: #4E9BFF; --pc2: #39E0B4; --pc3: #FFA544; --pc4: #B484FF;
  --pc5: #4FE3FF; --pc6: #FF6FB4; --pc7: #CBE65A; --pc8: #FF7B5C;
  --f-logo: "Dela Gothic One", "M PLUS 1", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
  --f-tech: "Chakra Petch", "M PLUS 1", system-ui, sans-serif;
  --f-body: "M PLUS 1", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
  --f-mono: "Share Tech Mono", "M PLUS 1", ui-monospace, monospace;
}

* { box-sizing: border-box; }
body { background: var(--void); color: var(--text); font-family: var(--f-body); font-size: 14.5px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--void); }
button { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ===== 宇宙空間 ===== */
.space { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
  background:
    radial-gradient(1100px 620px at 50% -12%, rgba(38, 92, 210, .34), transparent 62%),
    radial-gradient(820px 560px at 104% 104%, rgba(255, 63, 143, .13), transparent 60%),
    radial-gradient(700px 520px at -6% 78%, rgba(79, 227, 255, .10), transparent 60%),
    var(--void); }
.space .stars { position: absolute; inset: 0; opacity: .7;
  background-image:
    radial-gradient(1px 1px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 27% 64%, #bfe9ff, transparent),
    radial-gradient(1.5px 1.5px at 44% 12%, #fff, transparent), radial-gradient(1px 1px at 63% 38%, #ffd1e6, transparent),
    radial-gradient(1px 1px at 78% 22%, #fff, transparent), radial-gradient(1.5px 1.5px at 88% 58%, #bfe9ff, transparent),
    radial-gradient(1px 1px at 8% 84%, #fff, transparent), radial-gradient(1px 1px at 52% 88%, #bfe9ff, transparent),
    radial-gradient(1px 1px at 35% 40%, #fff, transparent), radial-gradient(1px 1px at 70% 76%, #fff, transparent);
  animation: twinkle 7s ease-in-out infinite alternate; }
.space .floor { position: absolute; left: -40%; right: -40%; bottom: -8%; height: 46%; transform: perspective(620px) rotateX(74deg); transform-origin: 50% 100%;
  background-image: linear-gradient(rgba(79, 227, 255, .2) 1px, transparent 1px), linear-gradient(90deg, rgba(79, 227, 255, .2) 1px, transparent 1px);
  background-size: 56px 56px; -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 92%); mask-image: linear-gradient(to top, #000 10%, transparent 92%);
  animation: floor 5s linear infinite; opacity: .55; }
@keyframes floor { to { background-position: 0 56px, 0 0; } }
@keyframes twinkle { to { opacity: .35; } }

/* ===== 共通部品 ===== */
.wrap { max-width: 1420px; margin: 0 auto; padding-block: 8px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.note { color: var(--muted); font-size: .82rem; margin: 0; }
.note.warn { color: var(--amber); }
.eyebrow { font-family: var(--f-tech); letter-spacing: .32em; font-size: .72rem; color: var(--cyan); margin: 0; text-transform: uppercase; }
.panel { position: relative; background: var(--panel); border: 1px solid var(--edge); border-radius: 6px; padding: 12px; min-width: 0;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 22px 44px -30px rgba(0, 0, 0, .95); }
.panel::before, .panel::after { content: ""; position: absolute; width: 14px; height: 14px; pointer-events: none; opacity: .85; }
.panel::before { top: -1px; left: -1px; border-top: 2px solid var(--pcorner, var(--cyan)); border-left: 2px solid var(--pcorner, var(--cyan)); border-top-left-radius: 6px; }
.panel::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--pcorner, var(--cyan)); border-right: 2px solid var(--pcorner, var(--cyan)); border-bottom-right-radius: 6px; }
.panel.enemy { --pcorner: var(--magenta); }
.panel.own.active { border-color: rgba(79, 227, 255, .7); box-shadow: 0 0 0 1px rgba(79, 227, 255, .3), 0 0 32px -6px rgba(79, 227, 255, .5); }
.panel.enemy.active { border-color: rgba(255, 63, 143, .7); box-shadow: 0 0 0 1px rgba(255, 63, 143, .3), 0 0 32px -6px rgba(255, 63, 143, .5); }
.ptitle { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 8px; font-size: .86rem; font-weight: 700; }
.ptitle small { font-family: var(--f-tech); font-size: .64rem; letter-spacing: .24em; color: var(--muted); font-weight: 500; }
.logcol .ptitle { flex-direction: column; align-items: flex-start; gap: 2px; }
.logcol .ptitle small { order: -1; font-size: .58rem; }

.btn { appearance: none; position: relative; border: 1px solid var(--edge-2); background: rgba(79, 227, 255, .07); color: var(--text); font: 700 .86rem/1.2 var(--f-body);
  padding: .6em 1.1em; cursor: pointer; touch-action: manipulation; transition: background .15s, box-shadow .15s, transform .08s;
  clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px); }
.btn:hover { background: rgba(79, 227, 255, .17); box-shadow: inset 0 0 14px rgba(79, 227, 255, .28); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(180deg, #7BEDFF, #17A4D4); color: var(--ink-on-cyan); border-color: transparent; }
.btn.primary:hover { background: linear-gradient(180deg, #A5F4FF, #2BB9E6); box-shadow: 0 0 18px rgba(79, 227, 255, .55); }
.btn.fire { background: linear-gradient(180deg, #FF77AE, #D81F69); color: #fff; border-color: transparent; }
/* バズーカの宣言ボタン（アイテムとは別枠） */
.btn.bzbtn { display: inline-flex; align-items: center; gap: .4em; background: linear-gradient(180deg, #FFD27A, #E08A12); color: #1A1003; }
.btn.bzbtn:hover { background: linear-gradient(180deg, #FFE2A6, #F09A22); box-shadow: 0 0 18px rgba(255, 193, 74, .55); }
.btn.bzbtn svg, .btn.fire svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.btn.big { font-size: 1.02rem; padding: .78em 1.7em; letter-spacing: .04em; }
.btn.ghost { background: transparent; border-color: var(--edge); font-weight: 500; }
.btn:disabled { opacity: .38; cursor: not-allowed; box-shadow: none; }
.btn:focus-visible, .ichip:focus-visible, .shape-btn:focus-visible, .item-card:focus-visible, .seg input:focus-visible + label { outline: none; box-shadow: inset 0 0 0 2px var(--amber), 0 0 0 2px var(--amber); }

/* ロゴ */
.logo { font-family: var(--f-logo); line-height: 1; letter-spacing: .02em;
  background: linear-gradient(180deg, #FFFFFF 0%, #DCE6F3 40%, #7C8AA2 52%, #EAF2FC 70%, #A9B6CA 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 14px rgba(79, 227, 255, .35)); }
.logo-sub { font-family: var(--f-tech); letter-spacing: .5em; color: var(--cyan); font-size: .7rem; margin-top: 4px; }

/* ===== HUD ===== */
.hud { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; padding-block: 8px 10px; }
.hud .logo { font-size: 1.32rem; }
.hud-mid { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
/* サウンド切り替え */
.sndbtn { display: inline-flex; align-items: center; gap: 6px; }
.sndbtn svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.sndbtn svg .spk { fill: currentColor; fill-opacity: .18; }
.sndbtn span { font: 700 .72rem/1 var(--f-tech); letter-spacing: .08em; }
.sndbtn.all { color: var(--cyan); }
.sndbtn.off { color: var(--muted); }
@media (max-width: 560px) { .sndbtn span { display: none; } }
.stat { font: 600 .7rem/1.25 var(--f-tech); letter-spacing: .14em; color: var(--muted); padding: .38em .75em; border: 1px solid var(--edge); background: rgba(79, 227, 255, .05); white-space: nowrap; }
.stat b { color: var(--cyan); font-size: .92rem; letter-spacing: .04em; margin-left: .3em; }
.stat.hot { border-color: rgba(255, 63, 143, .6); color: var(--magenta); }
.stat.hot b { color: var(--magenta); }
.stat.me b { color: var(--good); }
.phase { margin: 0 0 12px; display: flex; align-items: center; gap: 10px; font-size: 1.02rem; font-weight: 700; }
.phase::before { content: ""; width: 8px; height: 8px; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); transform: rotate(45deg); flex: none; }
.phase.wait::before { background: var(--magenta); box-shadow: 0 0 10px var(--magenta); animation: blink 1s infinite; }
/* スマホでは「いまやること」が1行・2行と変わっても盤面が動かないよう、2行ぶん確保する */
@media (max-width: 719px) { .phase { min-height: 3.1em; } }
@keyframes blink { 50% { opacity: .25; } }

/* ===== 対戦レイアウト ===== */
.arena { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.center { display: grid; gap: 12px; min-width: 0; }
.logs { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 680px) { .logs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.logcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.itemlog .loglist { max-height: 170px; }
.calllog .loglist { max-height: 300px; }
@media (min-width: 1180px) {
  .arena { grid-template-columns: 250px minmax(0, 1fr) 250px; }
  .logs { display: contents; }
  .col-def { grid-column: 1; grid-row: 1; }
  .center { grid-column: 2; grid-row: 1; }
  .col-atk { grid-column: 3; grid-row: 1; }
  .logcol { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px); height: calc(100vh - 24px - env(safe-area-inset-top, 0px)); max-height: 880px; }
  .itemlog { flex: 0 0 auto; }
  .itemlog .loglist { max-height: 26vh; }
  .calllog { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .calllog .loglist { max-height: none; flex: 1 1 auto; min-height: 0; }
}
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 460px) { .fields { gap: 8px; } .fields .panel { padding: 8px 6px; } }
.fhead { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; margin-bottom: 8px; }
.fhead b { font-size: .86rem; }
.fhead small { font-family: var(--f-tech); letter-spacing: .22em; font-size: .62rem; color: var(--cyan); }
.panel.enemy .fhead small { color: var(--magenta); }
.fname { color: var(--muted); font-size: .76rem; }
@media (max-width: 520px) { .fhead small { display: none; } }

/* ===== アイテムチップ（フィールド上部：左＝攻撃、右＝防御） ===== */
.chiprow { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px 12px; margin-bottom: 10px; }
.chipgrp { display: grid; gap: 4px; min-width: 0; }
.chipgrp.atk { flex: 1 1 auto; justify-items: start; }
.chipgrp.def { flex: none; justify-items: end; }
.chipgrp .cap { font: 600 .6rem/1 var(--f-tech); letter-spacing: .12em; color: var(--muted); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 7px 5px; }
.chipgrp.def .chips { justify-content: flex-end; }
.ichip { --ic: var(--cyan); position: relative; flex: none; width: 31px; height: 31px; display: grid; place-items: center; padding: 0; color: var(--ic); cursor: default;
  border: 1px solid color-mix(in srgb, var(--ic) 48%, transparent); border-radius: 6px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--ic) 16%, transparent), color-mix(in srgb, var(--ic) 4%, transparent)); transition: transform .12s, box-shadow .12s, background .12s; }
.chips.enemy .ichip { --ic: var(--magenta); }
.ichip svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ichip svg .f { fill: currentColor; stroke: none; }
.ichip .bd { position: absolute; right: -5px; bottom: -6px; min-width: 15px; font: 700 .56rem/1.35 var(--f-tech); text-align: center; color: var(--ic);
  background: var(--void); border: 1px solid color-mix(in srgb, var(--ic) 60%, transparent); border-radius: 4px; padding: 0 3px; }
.ichip.usable { cursor: pointer; box-shadow: 0 0 10px color-mix(in srgb, var(--ic) 40%, transparent); }
.ichip.usable:hover { transform: translateY(-2px); box-shadow: 0 0 16px color-mix(in srgb, var(--ic) 75%, transparent); }
.ichip.active { background: var(--ic); color: var(--ink-on-cyan); box-shadow: 0 0 16px var(--ic); }
/* 使用済み：自分・相手どちらのアイテムもグレーにする */
.ichip.spent, .chips.enemy .ichip.spent { --ic: var(--dim); background: none; box-shadow: none; }
.ichip.spent svg { opacity: .8; }
.ichip.spent::after { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; height: 1.5px; background: var(--dim); transform: rotate(-35deg); }
.ichip.rebuy, .chips.enemy .ichip.rebuy { --ic: var(--amber); }
.itemhead .ichip { width: 36px; height: 36px; }
@media (max-width: 520px) { .ichip { width: 27px; height: 27px; } .ichip svg { width: 16px; height: 16px; } .chips { gap: 6px 4px; } .chiprow { gap: 6px; } }
/* ツールチップ（本文の外、最前面） */
.tipbox { position: fixed; left: 0; top: 0; z-index: 95; max-width: 250px; padding: 7px 9px; font: 500 .76rem/1.5 var(--f-body); color: var(--text);
  background: #0B1328; border: 1px solid var(--edge-2); border-radius: 4px; box-shadow: 0 12px 26px -10px rgba(0, 0, 0, .95), 0 0 14px rgba(79, 227, 255, .18);
  pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; }
.tipbox.show { opacity: 1; transform: none; }
/* フィールド上の調査記録 */
.intel { display: flex; flex-wrap: wrap; gap: 5px; margin: -2px 0 8px; }
.itag { --tc: var(--cyan); display: inline-flex; align-items: center; gap: 4px; font: 600 .7rem/1 var(--f-tech); padding: 4px 7px 4px 5px; color: var(--tc);
  border: 1px solid color-mix(in srgb, var(--tc) 50%, transparent); background: color-mix(in srgb, var(--tc) 9%, transparent); border-radius: 3px; white-space: nowrap; }
.intel.enemy .itag { --tc: var(--magenta); }
.itag svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.itag svg .f { fill: currentColor; stroke: none; }
.itag b { color: var(--text); font-size: .8rem; margin-left: 2px; }
.itag small { color: var(--muted); font-size: .58rem; margin-left: 3px; }
.itag.stale { opacity: .45; }
/* ===== フィールド ===== */
.board { --fc: var(--cyan); display: grid; grid-template-columns: 1.15em minmax(0, 1fr); grid-template-rows: 1.35em auto; max-width: 470px; margin-inline: auto; }
.board[data-board="pred"], .board.enemy { --fc: var(--magenta); }
.board.large { max-width: 520px; }
.ax { font-family: var(--f-mono); font-size: .76rem; color: color-mix(in srgb, var(--fc) 70%, var(--muted)); display: grid; }
.ax span { display: flex; align-items: center; justify-content: center; gap: 3px; min-width: 0; }
.ax-r span { flex-direction: column; gap: 2px; }
.axbtn { appearance: none; display: grid; place-items: center; width: 100%; height: 100%; min-height: 1.2em; padding: 0; cursor: pointer; color: var(--cyan); font: 700 .8rem/1 var(--f-mono);
  background: rgba(79, 227, 255, .1); border: 1px solid rgba(79, 227, 255, .55); border-radius: 3px; box-shadow: 0 0 10px rgba(79, 227, 255, .35); animation: blink 1.4s infinite; }
.axbtn:hover, .axbtn:focus-visible { background: var(--cyan); color: var(--ink-on-cyan); animation: none; outline: none; }
.board.picking .ax-c { gap: 3px; padding-inline: 2px; }
.board.picking .ax-r { gap: 3px; padding-block: 2px; }
.cell.line-hl { background-color: rgba(79, 227, 255, .24) !important; box-shadow: inset 0 0 0 1px var(--cyan), inset 0 0 14px rgba(79, 227, 255, .45); }
.ax-c { grid-column: 2; grid-row: 1; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
.ax-r { grid-column: 1; grid-row: 2; grid-template-rows: repeat(var(--n), minmax(0, 1fr)); }
.cells { position: relative; grid-column: 2; grid-row: 2; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); grid-template-rows: repeat(var(--n), minmax(0, 1fr));
  aspect-ratio: 1; max-width: 100%; border: 1px solid color-mix(in srgb, var(--fc) 60%, transparent); border-radius: 3px;
  background:
    radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--fc) 11%, transparent), transparent 72%),
    linear-gradient(180deg, #071226, #04080F);
  box-shadow: 0 0 26px color-mix(in srgb, var(--fc) 20%, transparent), inset 0 0 26px color-mix(in srgb, var(--fc) 9%, transparent); }
.cells::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
  background: repeating-linear-gradient(180deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 3px); }
.cell { position: relative; min-width: 0; border-right: 1px solid color-mix(in srgb, var(--fc) 17%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--fc) 17%, transparent); container-type: size; }
.cell.lc { border-right: 0; }
.cell.lr { border-bottom: 0; }
.cell.click { cursor: pointer; }
.cell.click:hover { background-color: color-mix(in srgb, var(--fc) 22%, transparent); box-shadow: inset 0 0 0 1px var(--fc), inset 0 0 14px color-mix(in srgb, var(--fc) 40%, transparent); }
.cell.sel { background-color: color-mix(in srgb, var(--amber) 30%, transparent); box-shadow: inset 0 0 0 2px var(--amber); }

/* メタリックなキューブ */
.cell.pc { background:
    linear-gradient(115deg, transparent 38%, rgba(255, 255, 255, .34) 48%, transparent 58%) 0 0 / 300% 300%,
    linear-gradient(145deg, rgba(255, 255, 255, .62) 0%, rgba(255, 255, 255, .08) 32%, rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, .3) 100%),
    linear-gradient(160deg, color-mix(in srgb, var(--pcc) 40%, var(--steel-1)) 0%, color-mix(in srgb, var(--pcc) 58%, var(--steel-3)) 68%, color-mix(in srgb, var(--pcc) 38%, var(--steel-4)) 100%);
  box-shadow: inset 2px 2px 0 rgba(255, 255, 255, .55), inset -2px -2px 0 rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(0, 0, 0, .35);
  animation: sheen 7s linear infinite; }
@keyframes sheen { 0% { background-position: 120% 0, 0 0, 0 0; } 60%, 100% { background-position: -40% 0, 0 0, 0 0; } }
.cell.pc::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1; border: 0 solid var(--pcc); filter: drop-shadow(0 0 4px var(--pcc)); }
.cell.pc.et::before { border-top-width: 2px; }
.cell.pc.eb::before { border-bottom-width: 2px; }
.cell.pc.el::before { border-left-width: 2px; }
.cell.pc.er::before { border-right-width: 2px; }
.cell.pc.addpc::before { border-style: dashed; }
.cell.pc.hitc { box-shadow: inset 2px 2px 0 rgba(255, 255, 255, .4), inset -2px -2px 0 rgba(0, 0, 0, .5), inset 0 0 18px rgba(255, 63, 143, .55); }
.cell.pc.dead { animation: none; filter: saturate(.25) brightness(.55);
  background:
    linear-gradient(32deg, transparent 47%, rgba(255, 84, 104, .9) 48%, transparent 50%),
    linear-gradient(-58deg, transparent 58%, rgba(255, 84, 104, .7) 59%, transparent 61%),
    linear-gradient(160deg, var(--steel-3), var(--steel-4)); }
.cell.pc.dead::before { border-color: var(--bad); filter: none; }
.cell.pc.revealed { --pcc: var(--magenta); animation: none;
  background: repeating-linear-gradient(135deg, rgba(255, 63, 143, .28) 0 1px, transparent 1px 6px), linear-gradient(160deg, rgba(255, 63, 143, .16), rgba(20, 6, 18, .7)); box-shadow: inset 0 0 14px rgba(255, 63, 143, .35); }
.cell.ghost { background: color-mix(in srgb, var(--pcc) 16%, transparent); }
.cell.ghost::before { content: ""; position: absolute; inset: 0; border: 0 dashed var(--pcc); }
.cell.ghost.et::before { border-top-width: 2px; } .cell.ghost.eb::before { border-bottom-width: 2px; }
.cell.ghost.el::before { border-left-width: 2px; } .cell.ghost.er::before { border-right-width: 2px; }
.cell.pickable { cursor: pointer; }
.cell.pickable:hover { filter: brightness(1.2); box-shadow: inset 0 0 0 3px var(--amber), 0 0 14px var(--amber); z-index: 2; }
.cell.picked { box-shadow: inset 0 0 0 3px var(--amber); }
.cell.pv-ok { background: color-mix(in srgb, var(--cyan) 30%, transparent) !important; box-shadow: inset 0 0 0 2px var(--cyan), inset 0 0 16px var(--cyan) !important; }
.cell.pv-bad { background: color-mix(in srgb, var(--bad) 26%, transparent) !important; box-shadow: inset 0 0 0 2px var(--bad) !important; }

/* 調査の記録（セル） */
.ctag { --tc: var(--cyan); position: absolute; left: 5%; top: 5%; z-index: 3; font: 700 clamp(.46rem, 21cqw, .68rem)/1 var(--f-tech); color: var(--tc);
  background: rgba(3, 5, 11, .78); border: 1px solid color-mix(in srgb, var(--tc) 55%, transparent); padding: 2px 3px; border-radius: 3px; white-space: nowrap; max-width: 90%; overflow: hidden; }
.board[data-board="own"] .ctag { --tc: var(--magenta); }
.ctag.stale { opacity: .45; }
.pairs { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; overflow: visible; }
.pairs g { --pl: var(--cyan); }
.board[data-board="own"] .pairs g { --pl: var(--magenta); }
.pairs line { stroke: var(--pl); stroke-width: .05; stroke-linecap: round; filter: drop-shadow(0 0 2px var(--pl)); }
.pairs .diff line { stroke-dasharray: .12 .1; }
.pairs circle { fill: #04070F; stroke: var(--pl); stroke-width: .035; }
.pairs .sym { fill: none; stroke: var(--pl); stroke-width: .03; stroke-linecap: round; }
.pairs .stale { opacity: .4; }
.cube-menu { position: absolute; inset: 7%; z-index: 7; display: grid; align-content: center; gap: 6px; padding: 8px; background: rgba(4, 10, 22, .9);
  border: 1px solid var(--cyan); border-radius: 4px; box-shadow: 0 0 26px rgba(79, 227, 255, .4), inset 0 0 18px rgba(79, 227, 255, .2); animation: menuIn .25s ease-out; }
@keyframes menuIn { from { opacity: 0; transform: scale(.94); } }
.cube-menu p { margin: 0; font: 600 .6rem/1.2 var(--f-tech); letter-spacing: .12em; color: var(--cyan); text-align: center; }
.cm-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
.cm-grid.sizes { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.cm-btn { appearance: none; display: grid; place-items: center; gap: 3px; min-width: 0; padding: 6px 2px; cursor: pointer; color: var(--text); font: 700 clamp(.56rem, 1.6vw, .74rem)/1.1 var(--f-body);
  background: rgba(79, 227, 255, .08); border: 1px solid var(--edge-2); border-radius: 3px; }
.cm-btn b { font: 700 clamp(.8rem, 2.4vw, 1.1rem)/1 var(--f-tech); color: var(--cyan); }
.cm-btn span { white-space: nowrap; }
.cm-btn:hover, .cm-btn:focus-visible { background: rgba(79, 227, 255, .24); box-shadow: 0 0 12px rgba(79, 227, 255, .5); outline: none; }
.cm-btn .mini { max-width: 30px; height: auto; }
.cm-btn .mini rect { fill: url(#g-metal); stroke: rgba(0, 0, 0, .5); stroke-width: .6; }

/* 記号 */
.mkw { position: absolute; inset: 9%; display: grid; place-items: center; pointer-events: none; z-index: 2; }
.mk { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; overflow: visible; }
.ink-oo { color: var(--magenta); filter: drop-shadow(0 0 4px var(--magenta)); }
.ink-o { color: var(--hit); filter: drop-shadow(0 0 4px var(--hit)); }
.ink-o .dot { fill: currentColor; stroke: none; }
.ink-x { color: var(--steel-2); opacity: .82; }
.ink-x .mk { stroke-width: 2.4; }
/* 再コールできる×は、線はそのままで薄く */
.ink-x.stale { opacity: .3; }
/* バズーカで公開された×（色だけ少し変える） */
.ink-x.bzx { color: color-mix(in srgb, var(--amber) 62%, var(--steel-2)); opacity: .78; }
/* ワープで空いたマス（移動前の位置） */
.wtag { position: absolute; right: 6%; bottom: 4%; z-index: 2; font: 700 clamp(.46rem, 20cqw, .66rem)/1 var(--f-tech); color: var(--violet); text-shadow: 0 0 6px var(--violet); }
/* ディスタンスショットの結果：○の上は丸、まだヒットしていないマスは角丸の枠、NoData は文字 */
.ink-o.num-hit .mk circle { stroke-width: 2.6; }
.mk .ordn { fill: currentColor; stroke: none; font: 700 19px var(--f-tech); text-anchor: middle; dominant-baseline: central; }
.ink-d { color: var(--cyan); filter: drop-shadow(0 0 4px var(--cyan)); }
.board[data-board="own"] .ink-d { color: var(--magenta); filter: drop-shadow(0 0 4px var(--magenta)); }
.ink-d .mk rect { stroke-width: 2.4; }
.nodata { color: var(--steel-2); }
.nodata b { font: 700 clamp(.4rem, 17cqw, .66rem)/1 var(--f-tech); letter-spacing: .02em; white-space: nowrap; }
.mkw.ink-d.stale, .mkw.num-hit.stale, .mkw.nodata.stale { opacity: .45; }
/* ステルス中の自分のキューブ（相手のフィールドには出ない） */
.cell.pc.stealth { filter: saturate(.55) brightness(1.08); box-shadow: inset 0 0 0 1px rgba(79, 227, 255, .45), inset 0 0 18px rgba(79, 227, 255, .45); }
.stl { position: absolute; right: 5%; bottom: 5%; z-index: 3; width: 32%; height: 32%; color: var(--cyan); filter: drop-shadow(0 0 4px var(--cyan)); pointer-events: none; }
.stl svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fxo.cloak { background: repeating-linear-gradient(180deg, transparent 0 3px, rgba(79, 227, 255, .55) 3px 4px); animation: cloak 1.1s steps(8) forwards; }
@keyframes cloak { 0% { opacity: 0; transform: translateY(-30%); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(30%); } }
.fxb.cloakfield { background: repeating-linear-gradient(90deg, transparent 0 6px, rgba(255, 63, 143, .2) 6px 7px); animation: flash 1.2s ease-out forwards; }
.stat.treasure b { color: var(--orange); }
.stat.bzstat b { color: var(--amber); }
.stat.bzstat.me b { color: var(--good); }
.stat.bzstat.hot { border-color: rgba(255, 193, 74, .7); color: var(--amber); }
.stat.bzstat.hot b { color: var(--amber); }
.stat.bzstat.pulse { animation: bzpulse 1.2s ease-in-out infinite; }
@keyframes bzpulse { 50% { box-shadow: 0 0 14px rgba(255, 193, 74, .55); background: rgba(255, 193, 74, .12); } }
.itemhead .ichip.bz { --ic: var(--amber); }
.mi.bz { border-color: rgba(255, 193, 74, .45); }
.mi.bz svg { stroke: var(--amber); }
.mk-add { color: var(--ink-on-cyan); stroke-width: 3.4; }
.gem { position: absolute; left: 5%; bottom: 6%; width: 34%; height: 34%; z-index: 2; fill: var(--amber); stroke: #FFF1CF; stroke-width: 1.4; filter: drop-shadow(0 0 5px var(--amber)); animation: gem 2.6s ease-in-out infinite; }
.gem .facet { fill: none; stroke: rgba(120, 70, 0, .55); stroke-width: 1.2; }
@keyframes gem { 50% { filter: drop-shadow(0 0 10px var(--amber)); transform: translateY(-1px); } }
.num { position: absolute; left: 6%; bottom: 3%; z-index: 2; font: 700 clamp(.55rem, 24cqw, .8rem)/1 var(--f-mono); color: var(--magenta); text-shadow: 0 0 6px rgba(255, 63, 143, .8); }
.tl { position: absolute; top: 4%; right: 6%; z-index: 2; font: 700 clamp(.5rem, 24cqw, .74rem)/1 var(--f-tech); }
.tl-H { color: var(--amber); text-shadow: 0 0 6px var(--amber); }
.tl-N { color: var(--cyan); text-shadow: 0 0 6px var(--cyan); }
.tl-X { color: var(--steel-2); }
.tl.gray { opacity: .3; text-decoration: line-through; text-shadow: none; }
.cell.last::after { content: ""; position: absolute; inset: 3px; z-index: 2; pointer-events: none;
  background:
    linear-gradient(var(--amber), var(--amber)) top left / 8px 2px no-repeat, linear-gradient(var(--amber), var(--amber)) top left / 2px 8px no-repeat,
    linear-gradient(var(--amber), var(--amber)) top right / 8px 2px no-repeat, linear-gradient(var(--amber), var(--amber)) top right / 2px 8px no-repeat,
    linear-gradient(var(--amber), var(--amber)) bottom left / 8px 2px no-repeat, linear-gradient(var(--amber), var(--amber)) bottom left / 2px 8px no-repeat,
    linear-gradient(var(--amber), var(--amber)) bottom right / 8px 2px no-repeat, linear-gradient(var(--amber), var(--amber)) bottom right / 2px 8px no-repeat; }

/* ===== 操作ブロックとスコア ===== */
.dock { display: grid; gap: 10px; align-content: start; }
/* フィールドの上に置くので、中身が変わっても盤面が上下しないよう高さをそろえる */
.dock-main { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
.dock-body { flex: 1 1 320px; min-width: 0; }
.dock-body .note, .dock-body .dock-msg { margin: 0; }
.dock-acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; margin-left: auto; }
.banner.empty { visibility: hidden; }
@media (min-width: 720px) {
  .dock { min-height: 140px; } .dock-body { flex-basis: 200px; } .dock-acts { flex-wrap: nowrap; }
  .dock .banner { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}
.dock-acts .chip { min-width: 8.6em; text-align: center; }
@media (max-width: 719px) {
  /* スマホ：説明は上の行（いまやること）に任せ、ボタンは常に自分の段に置いて高さをそろえる */
  .dock .ih-desc { display: none; }
  .dock-body { flex-basis: 100%; }
  .dock-acts { flex-basis: 100%; justify-content: flex-start; margin-left: 0; }
  .dock-acts .btn { padding-inline: .7em; font-size: .8rem; }
  .dock { min-height: 186px; }
  .dock .banner { display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
}
.dock-msg { margin: 0; }
.dock-msg.warn { color: var(--amber); font-weight: 700; }
.dock-msg.wait { display: flex; gap: 10px; align-items: center; color: var(--muted); }
.banner { margin: 0; font-family: var(--f-body); font-weight: 500; padding: 7px 12px; border-left: 3px solid var(--cyan); background: rgba(79, 227, 255, .07); overflow-wrap: anywhere; }
.banner.k-hit, .banner.k-kill { border-left-color: var(--magenta); background: rgba(255, 63, 143, .08); }
.banner.k-treasure { border-left-color: var(--amber); background: rgba(255, 193, 74, .08); }
.banner.k-penalty, .banner.k-miss { border-left-color: var(--bad); background: rgba(255, 84, 104, .08); }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 6px; height: 6px; background: var(--magenta); box-shadow: 0 0 6px var(--magenta); animation: blink 1s infinite; transform: rotate(45deg); }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
.chip { font: 600 .74rem/1.2 var(--f-tech); padding: .38em .8em; border: 1px solid var(--edge); background: rgba(79, 227, 255, .05); white-space: nowrap; }
.chip.ok { border-color: var(--good); color: var(--good); }
.itemhead { display: flex; gap: 10px; align-items: center; }
.itemhead .ichip { flex: none; cursor: default; }

.scorebar table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.scorebar th, .scorebar td { padding: .42em .5em; text-align: right; border-bottom: 1px solid rgba(96, 196, 255, .1); font-size: .86rem; }
.scorebar thead th { font: 600 .64rem var(--f-tech); letter-spacing: .16em; color: var(--muted); }
.scorebar tbody th { text-align: left; font-weight: 700; }
.scorebar td { font-family: var(--f-tech); font-size: .98rem; }
.scorebar small { color: var(--muted); font-size: .7rem; margin-left: 3px; font-family: var(--f-body); }
.scorebar .unk { color: var(--magenta); font-weight: 700; }
.scorebar .known { color: var(--cyan); }
.scorebar .tag { display: inline-block; font: 600 .6rem var(--f-tech); letter-spacing: .1em; border: 1px solid var(--edge); padding: 0 4px; margin-left: 4px; color: var(--muted); vertical-align: 1px; }

/* ===== ログ ===== */
.loglist { list-style: none; margin: 0; padding: 0; overflow: auto; font-size: .8rem; scrollbar-width: thin; scrollbar-color: var(--edge-2) transparent; }
.loglist li { display: grid; grid-template-columns: 2.5em minmax(0, 1fr); gap: 6px; padding: .36em 0; border-bottom: 1px dashed rgba(96, 196, 255, .12); overflow-wrap: anywhere; }
.loglist li.wicon { grid-template-columns: 2.5em 20px minmax(0, 1fr); align-items: start; }
.loglist .t { font: .72rem var(--f-mono); color: var(--muted); padding-top: 1px; }
.loglist .li-ic svg { width: 18px; height: 18px; fill: none; stroke: var(--cyan); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.loglist .li-ic svg .f { fill: var(--cyan); stroke: none; }
.loglist .li-ic.enemy svg { stroke: var(--magenta); }
.loglist .li-ic.enemy svg .f { fill: var(--magenta); }
.loglist li.enemy .x { color: color-mix(in srgb, var(--magenta) 35%, var(--text)); }
.loglist li.k-hit .x { color: var(--hit); }
.loglist li.k-kill .x { color: var(--magenta); font-weight: 700; }
.loglist li.k-treasure .x { color: var(--amber); font-weight: 700; }
.loglist li.k-bazooka .x { color: var(--amber); }
.loglist .li-ic.sys svg { stroke: var(--amber); }
.banner.k-bazooka { border-left-color: var(--amber); background: rgba(255, 193, 74, .08); }
.loglist li.k-penalty .x, .loglist li.k-miss .x { color: var(--bad); }
.loglist li.none { color: var(--muted); }
.logcol .panel { display: flex; flex-direction: column; }

/* ===== タイトル ===== */
.hero { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); align-items: center; padding-block: 18px 22px; }
@media (min-width: 900px) { .hero { grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 36px; padding-block: 34px 34px; } }
.hero .logo { font-size: clamp(3rem, 9vw, 5.4rem); }
.hero .logo-sub { font-size: clamp(.7rem, 1.6vw, .95rem); margin-top: 10px; }
.tagline { font-size: clamp(1rem, 2.2vw, 1.22rem); font-weight: 700; margin: 22px 0 10px; max-width: 30em; line-height: 1.7; }
.lede { color: var(--muted); max-width: 36em; margin: 0 0 16px; }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: .84rem; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 6px; }
.lg { width: 1.7em; height: 1.7em; display: inline-grid; place-items: center; }
.lg .mk { width: 100%; height: 100%; }
.tlg { color: var(--cyan); font: 700 .78rem var(--f-tech); border: 1px solid var(--edge-2); padding: 0 .35em; }
.visual { position: relative; display: grid; place-items: center; min-height: 300px; perspective: 900px; }
.visual .board { width: min(320px, 78vw); transform: rotateX(48deg) rotateZ(-30deg); transform-style: preserve-3d; margin-top: 70px; }
.cube3d { position: absolute; top: 10px; left: 50%; width: 76px; height: 76px; margin-left: -38px; transform-style: preserve-3d; animation: spin3d 12s linear infinite; z-index: 2; }
.cube3d i { position: absolute; inset: 0; border: 1px solid rgba(255, 255, 255, .55);
  background: linear-gradient(135deg, rgba(255, 255, 255, .85), #9FB0C8 40%, #4C5870 60%, #D7E1EE); box-shadow: inset 0 0 18px rgba(79, 227, 255, .45); }
.cube3d i:nth-child(1) { transform: translateZ(38px); } .cube3d i:nth-child(2) { transform: rotateY(180deg) translateZ(38px); }
.cube3d i:nth-child(3) { transform: rotateY(90deg) translateZ(38px); } .cube3d i:nth-child(4) { transform: rotateY(-90deg) translateZ(38px); }
.cube3d i:nth-child(5) { transform: rotateX(90deg) translateZ(38px); } .cube3d i:nth-child(6) { transform: rotateX(-90deg) translateZ(38px); }
@keyframes spin3d { from { transform: translateY(0) rotateX(-22deg) rotateY(0deg); } 50% { transform: translateY(-10px) rotateX(-22deg) rotateY(180deg); } to { transform: translateY(0) rotateX(-22deg) rotateY(360deg); } }
.beamv { position: absolute; top: 92px; left: 50%; width: 2px; height: 110px; margin-left: -1px; background: linear-gradient(180deg, rgba(79, 227, 255, .9), transparent); box-shadow: 0 0 12px var(--cyan); }
.settings { display: grid; gap: 14px; padding: 18px; }
.set-row { display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); align-items: center; }
@media (min-width: 720px) { .set-row { grid-template-columns: 11em minmax(0, 1fr); } }
.set-row h2 { font-size: .84rem; margin: 0; color: var(--muted); font-weight: 500; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { display: grid; gap: 0; padding: .5em 1em; border: 1px solid var(--edge); cursor: pointer; min-width: 7.6em; background: rgba(79, 227, 255, .04);
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
.seg label span { font-weight: 700; }
.seg label small { color: var(--muted); font-size: .72rem; }
.item-pick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.item-pick input { position: absolute; opacity: 0; pointer-events: none; }
.item-pick label { display: inline-flex; align-items: center; gap: 6px; padding: .4em .75em .4em .5em; border: 1px solid var(--edge); border-radius: 4px; background: rgba(79, 227, 255, .03); cursor: pointer; font-size: .78rem; color: var(--muted); }
.item-pick label svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.item-pick label svg .f { fill: currentColor; stroke: none; }
.item-pick input:checked + label { color: var(--text); border-color: var(--cyan); background: rgba(79, 227, 255, .14); }
.item-pick input:checked + label svg { color: var(--cyan); }
.item-pick input:focus-visible + label { box-shadow: 0 0 0 2px var(--amber); }
.item-pick .note { flex-basis: 100%; }
.match-items { display: grid; gap: 6px; border-top: 1px solid rgba(96, 196, 255, .14); padding-top: 10px; }
.match-items .cap { font: 600 .66rem/1 var(--f-tech); letter-spacing: .12em; color: var(--muted); }
.mi-list { display: flex; flex-wrap: wrap; gap: 6px; }
.mi { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; padding: 3px 8px 3px 5px; border: 1px solid var(--edge); border-radius: 4px; }
.mi svg { width: 16px; height: 16px; fill: none; stroke: var(--cyan); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.mi svg .f { fill: var(--cyan); stroke: none; }
.mi b { font-weight: 500; }
.seg input:checked + label { border-color: var(--cyan); background: rgba(79, 227, 255, .18); box-shadow: inset 0 0 14px rgba(79, 227, 255, .3); }
.seg input:checked + label small { color: var(--text); }
.start-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }

/* ===== 配置 ===== */
.setup { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 920px) { .setup { grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); } }
.hint { font-size: .84rem; color: var(--muted); margin: 10px 0 0; text-align: center; }
.setup-panel { display: grid; gap: 12px; }
.palette { display: grid; gap: 10px; }
.pal-row { display: grid; gap: 6px; }
.pal-h { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); border-bottom: 1px solid rgba(96, 196, 255, .14); padding-bottom: 3px; }
.pal-h b { color: var(--text); font-family: var(--f-tech); letter-spacing: .06em; }
.pal-shapes { display: flex; flex-wrap: wrap; gap: 8px; }
.shape-btn { display: grid; justify-items: center; gap: 5px; padding: 9px 10px 6px; min-width: 66px; border: 1px solid var(--edge); border-radius: 4px; background: rgba(79, 227, 255, .04); cursor: pointer; font-size: .72rem; color: var(--muted); }
.shape-btn .mini rect { fill: url(#g-metal); stroke: rgba(0, 0, 0, .5); stroke-width: .6; }
.shape-btn .mini { max-width: 52px; height: auto; filter: drop-shadow(0 0 4px rgba(79, 227, 255, .35)); }
.shape-btn.on { border-color: var(--cyan); color: var(--text); background: rgba(79, 227, 255, .16); box-shadow: inset 0 0 12px rgba(79, 227, 255, .3); }

  // t: 0..7 （下位2ビット=回転回数, 4以上=反転）
  function transform(base, t) {
    const out = base.map(([r, c]) => {
      let rr = r, cc = (t >> 2) ? -c : c;
      for (let k = 0; k < (t & 3); k++) { const tmp = rr; rr = cc; cc = -tmp; }
      return [rr, cc];
    });
    return normalize(out);
  }

  const ORIENT = {};
  for (const key in SHAPES) {
    ORIENT[key] = [];
    for (let t = 0; t < 8; t++) {
      const cells = transform(SHAPES[key].base, t);
      let h = 0, w = 0;
      for (const [r, c] of cells) { if (r + 1 > h) h = r + 1; if (c + 1 > w) w = c + 1; }
      ORIENT[key].push({ cells, h, w, sig: sigOf(cells) });
    }
  }

  function cellsFor(key, t, r0, c0, N) {
    const o = ORIENT[key][t];
    if (r0 < 0 || c0 < 0 || r0 + o.h > N || c0 + o.w > N) return null;
    return o.cells.map(([r, c]) => (r + r0) * N + (c + c0));
  }

  const PLC_CACHE = {};
  // 形状ごとの重複なし配置一覧（CPUの推論用）
  function placements(N) {
    if (PLC_CACHE[N]) return PLC_CACHE[N];
    const out = {};
    for (const key in SHAPES) {
      const seen = new Set();
      const arr = [];
      for (let t = 0; t < 8; t++) {
        const o = ORIENT[key][t];
        for (let r0 = 0; r0 + o.h <= N; r0++) {
          for (let c0 = 0; c0 + o.w <= N; c0++) {
            const cells = o.cells.map(([r, c]) => (r + r0) * N + (c + c0));
            const mask = maskOf(cells);
            if (seen.has(mask)) continue;
            seen.add(mask);
            arr.push({ key, size: SHAPES[key].size, cat: SHAPES[key].cat, t, r0, c0, cells, mask });
          }
        }
      }
      out[key] = arr;
    }
    PLC_CACHE[N] = out;
    return out;
  }

  function identifyShape(cells, N) {
    if (!cells.length) return null;
    const sig = sigOf(normalize(cells.map((c) => [Math.floor(c / N), c % N])));
    for (const key in SHAPES) {
      if (SHAPES[key].size !== cells.length) continue;
      for (const o of ORIENT[key]) if (o.sig === sig) return key;
    }
    return null;
  }

  function coord(c, N) { return COLS[c % N] + '-' + (Math.floor(c / N) + 1); }
  // ログ用：マスを読み順（A-1, B-1, …, A-2, …）に並べて「・」でつなぐ
  function coordList(cells, N) { return cells.slice().sort((a, b) => a - b).map((c) => coord(c, N)).join('・'); }
  function lineMask(line, index, N) {
    let m = 0;
    for (let k = 0; k < N; k++) m |= bit(line === 'row' ? index * N + k : k * N + index);
    return m;
  }
  function lineLabel(line, index) { return line === 'row' ? (index + 1) + '行' : COLS[index] + '列'; }
  // 2マスのブロック数（上下左右に何マス進むか）。どの形状でも、個体の中を通る最短距離と一致する
  function blockDist(a, b, N) { return Math.abs(Math.floor(a / N) - Math.floor(b / N)) + Math.abs((a % N) - (b % N)); }

  function makeRules(kind) {
    return kind === 'final'
      // bazookaTurn：バズーカの使用を宣言できる最初のターン（発動は早くてもその次のターン）
      ? { kind: 'final', label: '決勝', N: 5, bazookaTurn: 12, draft: true, treasureMax: 5 }
      : { kind: 'prelim', label: '予選', N: 4, bazookaTurn: 8, draft: false, treasureMax: 4 };
  }

  // ------------------------------------------------------------------
  function Game(opts) {
    opts = opts || {};
    this.rules = makeRules(opts.rules);
    this.N = this.rules.N;
    this.NN = this.N * this.N;
    this.rng = opts.rng || Math.random;
    this.mode = opts.mode || 'pvp';
    this.v = VERSION;
    // バズーカ（宣言制。opts.bazooka === false で無効にできる＝検証用）
    this.bazookaOn = opts.bazooka !== false;
    this.bazooka = { decl: [null, null], fired: null };
    // この試合で使えるアイテム（バズーカは別枠）
    const pick = Array.isArray(opts.items) ? ITEM_KEYS.filter((k) => opts.items.indexOf(k) >= 0) : [];
    this.itemKeys = pick.length ? pick : ITEM_KEYS.slice();
    this.clock = 0;
    this.turn = 1;
    this.first = opts.first != null ? opts.first : (this.rng() < 0.5 ? 0 : 1);
    this.cur = this.first;
    this.phase = 'setup';
    this.sub = null;
    this.itemUsed = false;
    this.pending = null;
    this.draft = null;
    this.log = [];
    this.result = null;
    this.lastAction = null;
    this.events = [];
    const names = opts.names || ['プレイヤー1', 'プレイヤー2'];
    const cpu = opts.cpu || [false, false];
    this.players = [0, 1].map((i) => this._newPlayer(i, names[i], !!cpu[i], opts.wallet || 0));
  }

  Game.prototype._newPlayer = function (i, name, isCPU, wallet) {
    const NN = this.NN;
    const items = {};
    for (const k of ITEM_KEYS) items[k] = this.itemKeys.indexOf(k) >= 0 ? 1 : 0;
    return {
      idx: i, name, isCPU,
      pieces: [], nextId: 1, treasure: null, setupDone: false,
      items, used: {}, wallet, rebuys: 0,
      score: { attack: 0, survival: 0, treasure: 0, rebuy: 0, total: 0 },
      // 相手盤面についての自分の記録（予想盤面）
      view: {
        marks: new Array(NN).fill(null), dead: new Array(NN).fill(null), tlog: new Array(NN).fill(null),
        oo: 0, treasureFound: false, lastCall: -1,
      },
      // 推論用の事実ログ（相手盤面について自分が知り得たこと）
      kb: {
        N: this.N, stock: Object.assign({}, STOCK),
        calls: [], deads: [], warps: [], adds: [], empties: [], occs: [], counts: [],
        pairs: [], dists: [], stealths: [], tlogs: [], grays: [], failedAnswers: [],
        reveal: null,   // バズーカで空きマスが公開された時刻と、そのとき個体があったマス
      },
    };
  };

  Game.prototype.foeOf = function (pi) { return this.players[1 - pi]; };
  Game.prototype.living = function (pi) { return this.players[pi].pieces.filter((p) => p.alive); };
  Game.prototype.pieceAt = function (pi, c, includeDead) {
    for (const p of this.players[pi].pieces) {
      if (!includeDead && !p.alive) continue;
      if (p.mask & bit(c)) {
        if (p.alive) return p;
        if (includeDead) return p;
      }
    }
    return null;
  };
  Game.prototype.deadMask = function (pi) {
    let m = 0;
    for (const p of this.players[pi].pieces) if (!p.alive) m |= p.mask;
    return m;
  };
  Game.prototype.livingMask = function (pi, exceptId) {
    let m = 0;
    for (const p of this.players[pi].pieces) if (p.alive && p.id !== exceptId) m |= p.mask;
    return m;
  };
  Game.prototype.coord = function (c) { return coord(c, this.N); };
  Game.prototype._tick = function () { return ++this.clock; };
  // 演出用のイベント（公開情報と、当事者だけが見てよい情報を分けて持つ）
  Game.prototype._emit = function (ev) {
    ev.id = this.events.length;
    ev.turn = this.turn;
    this.events.push(ev);
  };
  Game.prototype._log = function (actor, text, priv, kind, key) {
    this.log.push({ id: this.log.length, turn: this.turn, actor, text, priv: priv || null, kind: kind || 'info', key: key || null });
  };

  // ---------------- 配置 ----------------
  Game.prototype.stockLeft = function (pi, size) {
    const used = this.players[pi].pieces.filter((p) => !p.isAdd && p.size === size).length;
    return STOCK[size] - used;
  };
  Game.prototype.checkPlacement = function (pi, key, t, r0, c0) {
    const cells = cellsFor(key, t, r0, c0, this.N);
    if (!cells) return { ok: false, reason: '盤面からはみ出します' };
    const mask = maskOf(cells);
    if (mask & this.livingMask(pi)) return { ok: false, reason: 'ほかの個体と重なります', cells, mask };
    return { ok: true, cells, mask };
  };
  Game.prototype.placePiece = function (pi, key, t, r0, c0) {
    const P = this.players[pi];
    if (this.phase !== 'setup' || P.setupDone) return { ok: false, reason: '配置フェーズではありません' };
    const sh = SHAPES[key];
    if (!sh || key === 'A1') return { ok: false, reason: '置けない形です' };
    if (this.stockLeft(pi, sh.size) <= 0) return { ok: false, reason: sh.size + 'マスの個体は残っていません' };
    const chk = this.checkPlacement(pi, key, t, r0, c0);
    if (!chk.ok) return chk;
    const piece = this._makePiece(P, key, t, r0, c0, chk.cells);
    P.pieces.push(piece);
    return { ok: true, piece };
  };
  Game.prototype._makePiece = function (P, key, t, r0, c0, cells) {
    const sh = SHAPES[key];
    return {
      id: P.nextId++, owner: P.idx, shape: key, size: sh.size, cat: sh.cat, isAdd: key === 'A1',
      t, r0, c0, cells, mask: maskOf(cells), alive: true, hitMask: 0, hitOrder: [], oonums: [], cause: null,
      placedAt: this.clock, deadAt: null,
    };
  };
  Game.prototype.removePiece = function (pi, id) {
    const P = this.players[pi];
    if (this.phase !== 'setup' || P.setupDone) return { ok: false };
    P.pieces = P.pieces.filter((p) => p.id !== id);
    if (P.treasure && P.treasure.pieceId === id) P.treasure = null;
    return { ok: true };
  };
  Game.prototype.clearSetup = function (pi) {
    const P = this.players[pi];
    if (this.phase !== 'setup' || P.setupDone) return;
    P.pieces = []; P.treasure = null;
  };
  Game.prototype.setTreasure = function (pi, cell) {
    const P = this.players[pi];
    if (this.phase !== 'setup' || P.setupDone) return { ok: false };
    const p = this.pieceAt(pi, cell);
    if (!p) return { ok: false, reason: 'トレジャーは個体のマスに置きます' };
    P.treasure = { pieceId: p.id, idx: p.cells.indexOf(cell), cell };
    return { ok: true };
  };
  // sizes: 置く個体のマス数の配列。省略時はテンプレートから選ぶ
  Game.prototype.randomSetup = function (pi, sizes, rng) {
    rng = rng || this.rng;
    const N = this.N;
    const templates = N === 4
      ? [[2, 3, 4], [2, 3, 3], [3, 4], [2, 2, 3, 4], [2, 3, 5], [3, 3, 4]]
      : [[2, 3, 4, 5], [3, 4, 5], [2, 3, 4, 4], [2, 2, 3, 4, 5], [3, 3, 4, 5]];
    for (let attempt = 0; attempt < 60; attempt++) {
      this.clearSetup(pi);
      const list = sizes || templates[Math.floor(rng() * templates.length)];
      let ok = true;
      for (const size of list) {
        if (this.stockLeft(pi, size) <= 0) { ok = false; break; }
        const keys = SHAPES_BY_SIZE[size].filter((k) => placements(N)[k].length > 0);
        let placed = false;
        for (let k = 0; k < 80 && !placed; k++) {
          const key = keys[Math.floor(rng() * keys.length)];
          const t = Math.floor(rng() * 8);
          const o = ORIENT[key][t];
          if (o.h > N || o.w > N) continue;
          const r0 = Math.floor(rng() * (N - o.h + 1));
          const c0 = Math.floor(rng() * (N - o.w + 1));
          if (this.placePiece(pi, key, t, r0, c0).ok) placed = true;
        }
        if (!placed) { ok = false; break; }
      }
      if (!ok) continue;
      const ps = this.players[pi].pieces;
      const p = ps[Math.floor(rng() * ps.length)];
      this.setTreasure(pi, p.cells[Math.floor(rng() * p.cells.length)]);
      return true;
    }
    return false;
  };
  Game.prototype.finishSetup = function (pi) {
    const P = this.players[pi];
    if (this.phase !== 'setup' || P.setupDone) return { ok: false, reason: '配置フェーズではありません' };
    if (!P.pieces.length) return { ok: false, reason: '最低1個体を置いてください' };
    if (!P.treasure) return { ok: false, reason: 'トレジャーをセットしてください' };
    P.setupDone = true;
    if (this.players.every((q) => q.setupDone)) {
      if (this.rules.draft) {
        // 決勝のドラフト：使えるアイテムの半分（端数切り捨て）ずつ、後攻から交互に取る（9種類なら4つずつ）
        // 順番はスネーク（後先・先後・後先…）。最初と最後を同じプレイヤーが取らないよう、最後の2つだけ入れ替える
        // 8種類なら 後先先後後先後先
        const second = 1 - this.first;
        const pool = this.itemKeys.slice();
        const each = Math.floor(pool.length / 2);
        const order = [];
        for (let i = 0; i < each * 2; i++) {
          const lead = Math.floor(i / 2) % 2 === 0 ? second : this.first;
          order.push(i % 2 === 0 ? lead : 1 - lead);
        }
        const n = order.length;
        if (n >= 2 && order[n - 1] === order[0]) { const tmp = order[n - 1]; order[n - 1] = order[n - 2]; order[n - 2] = tmp; }
        if (!order.length) { this._startPlay(); return { ok: true }; }
        this.draft = { pool, order, step: 0, picks: [[], []], each };
        this.phase = 'draft';
      } else {
        this._startPlay();
      }
    }
    return { ok: true };
  };

  // ---------------- ドラフト ----------------
  Game.prototype.draftTurn = function () { return this.draft ? this.draft.order[this.draft.step] : -1; };
  Game.prototype.draftPick = function (pi, key) {
    const d = this.draft;
    if (this.phase !== 'draft' || !d) return { ok: false };
    if (d.order[d.step] !== pi) return { ok: false, reason: '相手の番です' };
    const i = d.pool.indexOf(key);
    if (i < 0) return { ok: false, reason: 'そのアイテムは残っていません' };
    d.pool.splice(i, 1);
    d.picks[pi].push(key);
    this.players[pi].items[key] += 1;
    this._log(pi, `${this.players[pi].name}：ドラフトで${ITEMS[key].name}を獲得`, null, 'draft', key);
    d.step++;
    if (d.step >= d.order.length || !d.pool.length) this._startPlay();
    return { ok: true };
  };

  Game.prototype._startPlay = function () {
    this.phase = 'play';
    this.turn = 1;
    this.cur = this.first;
    this.sub = 'item';
    this.itemUsed = false;
    this._log(-1, `試合開始。先攻は${this.players[this.first].name}`, null, 'system');
    this._emit({ type: 'start', first: this.first });
  };

  // ---------------- 手番 ----------------
  Game.prototype.isCallable = function (pi, c) {
    const v = this.players[pi].view;
    if (v.dead[c]) return false;
    const m = v.marks[c];
    return !m || (m.r === 'x' && m.callable);
  };
  Game.prototype.isTreasureCallable = function (pi, c) {
    const v = this.players[pi].view;
    if (v.treasureFound) return false;
    const tl = v.tlog[c];
    return !tl || tl.gray;
  };
  Game.prototype._myTurn = function (pi, subs) {
    return this.phase === 'play' && this.cur === pi && subs.indexOf(this.sub) >= 0;
  };

  Game.prototype.call = function (pi, c) {
    if (!this._myTurn(pi, ['item', 'call'])) return { ok: false, reason: 'コールできる状態ではありません' };
    if (!this.isCallable(pi, c)) return { ok: false, reason: 'そのマスはコールできません' };
    const me = this.players[pi], foe = this.foeOf(pi);
    const v = me.view;
    const t = this._tick();
    const p = this.pieceAt(foe.idx, c);
    let res;
    if (!p) {
      v.marks[c] = { r: 'x', callable: false, t };
      me.kb.calls.push({ c, t, r: 'x' });
      res = { r: 'x' };
      this._log(pi, `${me.name}：${this.coord(c)}をコール → ×`, null, 'call');
      this._emit({ type: 'call', actor: pi, owner: foe.idx, c, r: 'x' });
    } else {
      const first = p.hitMask === 0;
      p.hitMask |= bit(c);
      (p.hitOrder || (p.hitOrder = [])).push(c);
      if (first) {
        v.oo += 1;
        p.oonums.push(v.oo);
        v.marks[c] = { r: 'oo', num: v.oo, t };
        me.kb.calls.push({ c, t, r: 'oo', num: v.oo });
        res = { r: 'oo', num: v.oo };
        this._log(pi, `${me.name}：${this.coord(c)}をコール → ◎${v.oo}`, null, 'hit');
      } else {
        v.marks[c] = { r: 'o', t };
        me.kb.calls.push({ c, t, r: 'o' });
        res = { r: 'o' };
        this._log(pi, `${me.name}：${this.coord(c)}をコール → ○`, null, 'hit');
      }
      this._emit({ type: 'call', actor: pi, owner: foe.idx, c, r: res.r, num: res.num });
      if (p.hitMask === p.mask && p.stealth) {
        // ステルス：全マスに当たっても撃破されない（相手には何も伝わらない）
        this._emit({ type: 'shield', owner: foe.idx, cells: p.cells.slice() });
      } else if (p.hitMask === p.mask) {
        this._destroy(p, 'destroy');
        res.destroyed = { size: p.size, cells: p.cells.slice(), isAdd: p.isAdd };
        this._log(pi, `${me.name}：${p.isAdd ? 'アッド' : p.size + 'マスの個体'}を撃破（${coordList(p.cells, this.N)}）`, null, 'kill');
      }
    }
    v.lastCall = c;
    this.lastAction = { kind: 'call', pi, c, res };
    this.sub = 'answer';
    res.ended = this._checkEnd();
    return Object.assign({ ok: true }, res);
  };

  // コールできるマスが1つもないとき（全マスをコール済みなど）は、コールを飛ばしてアンサーへ進める
  Game.prototype.hasCallable = function (pi) {
    for (let c = 0; c < this.NN; c++) if (this.isCallable(pi, c)) return true;
    return false;
  };
  Game.prototype.skipCall = function (pi) {
    if (!this._myTurn(pi, ['item', 'call']) || this.hasCallable(pi)) return { ok: false, reason: 'コールできるマスがあります' };
    this.sub = 'answer';
    this._log(pi, `${this.players[pi].name}：コールできるマスがないため、コールを飛ばした`, null, 'call');
    return { ok: true };
  };

  Game.prototype.answer = function (pi, cells) {
    if (!this._myTurn(pi, ['answer'])) return { ok: false, reason: 'アンサーできる状態ではありません' };
    cells = Array.from(new Set(cells)).sort((a, b) => a - b);
    const key = identifyShape(cells, this.N);
    if (!key) return { ok: false, reason: 'キューブ・L字・T字のいずれかの形で宣言してください' };
    const me = this.players[pi], foe = this.foeOf(pi);
    const mask = maskOf(cells);
    this._tick();
    const target = foe.pieces.find((p) => p.alive && p.mask === mask);
    const where = coordList(cells, this.N);
    if (target) {
      this._emit({ type: 'answer', actor: pi, owner: foe.idx, cells, success: true });
      this._destroy(target, 'answer');
      this._log(pi, `${me.name}：アンサー成功（${where}）`, null, 'kill');
      this.lastAction = { kind: 'answer', pi, ok: true, cells };
      const ended = this._checkEnd();
      return { ok: true, success: true, size: target.size, ended };
    }
    me.kb.failedAnswers.push({ mask, t: this.clock });
    this._emit({ type: 'answer', actor: pi, owner: foe.idx, cells, success: false });
    this._log(pi, `${me.name}：アンサー失敗（${where}）`, null, 'miss');
    this.sub = 'sacrifice';
    this.pending = { kind: 'answerFail', who: pi };
    this.lastAction = { kind: 'answer', pi, ok: false, cells };
    return { ok: true, success: false };
  };

  Game.prototype.sacrifice = function (pi, pieceId) {
    if (!(this.phase === 'play' && this.sub === 'sacrifice' && this.pending && this.pending.who === pi)) return { ok: false };
    const p = this.players[pi].pieces.find((x) => x.id === pieceId && x.alive);
    if (!p) return { ok: false, reason: '生きている自分の個体を選んでください' };
    this._destroy(p, 'answerFail');
    this._log(pi, `${this.players[pi].name}：ペナルティで${p.isAdd ? 'アッド' : p.size + 'マスの個体'}を公開・撃破（${coordList(p.cells, this.N)}）`, null, 'penalty');
    this.pending = null;
    this.sub = 'answer';
    const ended = this._checkEnd();
    return { ok: true, ended };
  };

  // トレジャーチャンスの残り回数（予選4回・決勝5回まで）
  Game.prototype.treasureLeft = function (pi) {
    const P = this.players[pi];
    if (P.view.treasureFound) return 0;
    return Math.max(0, (this.rules.treasureMax || 99) - P.kb.tlogs.length);
  };
  Game.prototype.endTurn = function (pi) {
    if (!this._myTurn(pi, ['answer'])) return { ok: false };
    if (this.turn % 2 === 0 && this.treasureLeft(pi) > 0) {
      this.sub = 'treasure';
      this._emit({ type: 'tchance', actor: pi, left: this.treasureLeft(pi), max: this.rules.treasureMax });
      return { ok: true, treasure: true };
    }
    this._advance();
    return { ok: true };
  };

  Game.prototype.treasureCall = function (pi, c) {
    if (!this._myTurn(pi, ['treasure'])) return { ok: false };
    if (!this.isTreasureCallable(pi, c)) return { ok: false, reason: 'そのマスにはトレジャーコールできません' };
    const me = this.players[pi], foe = this.foeOf(pi);
    const t = this._tick();
    const T = foe.treasure.cell;
    const tp = foe.pieces.find((p) => p.id === foe.treasure.pieceId);
    const N = this.N;
    const adj = Math.abs(Math.floor(c / N) - Math.floor(T / N)) + Math.abs((c % N) - (T % N)) === 1;
    let r;
    if (c === T) r = 'H';
    else if (adj || (tp && (tp.mask & bit(c)))) r = 'N';
    else r = 'X';
    me.view.tlog[c] = { r, gray: false, t };
    me.kb.tlogs.push({ c, t, r });
    if (r === 'H') {
      me.view.treasureFound = true;
      me.kb.treasureFound = true;
      me.score.treasure += 10;
      me.kb.occs.push({ c, t, cat: null });
    }
    this._emit({ type: 'treasure', actor: pi, owner: foe.idx, c, r });
    const label = r === 'H' ? '的中！（+10pt）' : r === 'N' ? 'ニア' : '外れ';
    const left = this.treasureLeft(pi);
    this._log(pi, `${me.name}：${this.coord(c)}にトレジャーコール → ${label}${r === 'H' ? '' : `（残り${left}回）`}`, null, r === 'H' ? 'treasure' : 'tcall');
    if (r !== 'H' && left === 0) {
      this._log(pi, `${me.name}：トレジャーチャンスを使い切りました（トレジャー失敗）`, null, 'tcall');
      this._emit({ type: 'tfail', actor: pi });
    }
    this.lastAction = { kind: 'treasure', pi, c, r };
    this._advance();
    return { ok: true, r };
  };

  Game.prototype._advance = function () {
    this.cur = 1 - this.cur;
    const newTurn = this.cur === this.first;
    if (newTurn) this.turn += 1;
    this.sub = 'item';
    this.itemUsed = false;
    this.pending = null;
    // 両者のバズーカ宣言がそろっていたら、新しいターンの始めに発動する
    const B = this.bazooka;
    if (newTurn && B && !B.fired && B.decl[0] && B.decl[1]) this._fireBazooka();
    this._emit({ type: 'turn', cur: this.cur });
  };

  // ---------------- 撃破と終了 ----------------
  Game.prototype._destroy = function (piece, cause) {
    piece.alive = false;
    piece.cause = cause;
    piece.deadAt = this._tick();
    const viewer = this.players[1 - piece.owner];
    for (const c of piece.cells) viewer.view.dead[c] = { pieceId: piece.id, size: piece.size, shape: piece.shape, cause, isAdd: piece.isAdd };
    viewer.kb.deads.push({
      cells: piece.cells.slice(), mask: piece.mask, size: piece.size, cat: piece.cat, key: piece.shape,
      isAdd: piece.isAdd, t: this.clock, cause,
    });
    if (!piece.isAdd) viewer.score.attack += piece.size;
    this._emit({ type: 'destroy', owner: piece.owner, cells: piece.cells.slice(), size: piece.size, isAdd: piece.isAdd, key: piece.shape, cause });
  };

  Game.prototype._checkEnd = function () {
    if (this.phase !== 'play') return this.phase === 'over';
    const a0 = this.living(0).length > 0, a1 = this.living(1).length > 0;
    if (a0 && a1) return false;
    this.phase = 'over';
    this.sub = null;
    this.pending = null;
    const winner = !a0 && !a1 ? -1 : (a0 ? 0 : 1);
    for (const P of this.players) {
      P.score.survival = P.pieces.filter((p) => p.alive && !p.isAdd).reduce((s, p) => s + p.size, 0);
      P.score.total = P.score.attack + P.score.survival + P.score.treasure - P.score.rebuy;
    }
    let tiebreak = -1;
    if (winner === -1) {
      const t0 = this.players[0].score.total, t1 = this.players[1].score.total;
      tiebreak = t0 === t1 ? -1 : (t0 > t1 ? 0 : 1);
    }
    this.result = { winner, draw: winner === -1, tiebreak };
    this._emit({ type: 'over', result: this.result });
    this._log(-1, winner === -1 ? '両者全滅で引き分け' : `${this.players[winner].name}の勝利`, null, 'system');
    return true;
  };

  // ---------------- アイテム ----------------
  Game.prototype.itemStatus = function (pi, key) {
    const P = this.players[pi];
    const inPlay = (this.itemKeys || ITEM_KEYS).indexOf(key) >= 0;
    const have = inPlay ? (P.items[key] || 0) : 0;
    const canRebuy = inPlay && have <= 0 && !!P.used[key] && P.wallet >= 3;
    const inPhase = this._myTurn(pi, ['item', 'answer']) && !this.itemUsed;
    return { inPlay, have, canRebuy, usable: inPlay && inPhase && (have > 0 || canRebuy), rebuyNeeded: have <= 0 };
  };

  Game.prototype.validateItem = function (pi, key, params) {
    const N = this.N, NN = this.NN;
    const me = this.players[pi];
    const v = me.view;
    params = params || {};
    const inRange = (c) => Number.isInteger(c) && c >= 0 && c < NN;
    switch (key) {
      case 'cube':
        if (params.kind === 'cat' && CATS.indexOf(params.value) >= 0) return { ok: true };
        if (params.kind === 'size' && [1, 2, 3, 4, 5].indexOf(params.value) >= 0) return { ok: true };
        return { ok: false, reason: '形状かマス数を選んでください' };
      case 'line':
        if ((params.line === 'row' || params.line === 'col') && Number.isInteger(params.index) && params.index >= 0 && params.index < N) return { ok: true };
        return { ok: false, reason: '列か行を選んでください' };
      case 'number':
      case 'shape':
        if (inRange(params.cell) && !v.dead[params.cell]) return { ok: true };
        return { ok: false, reason: '調べるマスを選んでください' };
      case 'pair':
        if (!inRange(params.a) || !inRange(params.b) || params.a === params.b) return { ok: false, reason: '違うマスを2つ選んでください' };
        if (v.dead[params.a] || v.dead[params.b]) return { ok: false, reason: '撃破済みのマスは選べません' };
        return { ok: true };
      case 'dist':
        if (!inRange(params.cell) || v.dead[params.cell]) return { ok: false, reason: '調べるマスを選んでください' };
        if (v.marks[params.cell] && v.marks[params.cell].r === 'oo') return { ok: false, reason: '◎のマスには使えません' };
        return { ok: true };
      case 'warp': {
        const p = me.pieces.find((x) => x.id === params.pieceId && x.alive);
        if (!p) return { ok: false, reason: '移動する個体を選んでください' };
        const cells = cellsFor(p.shape, params.t, params.r0, params.c0, N);
        if (!cells) return { ok: false, reason: '盤面からはみ出します' };
        const m = maskOf(cells);
        if (m & this.livingMask(pi, p.id)) return { ok: false, reason: 'ほかの個体と重なります' };
        if (m & p.mask) return { ok: false, reason: '移動前の位置とは重ねられません' };
        if (m & this.deadMask(pi)) return { ok: false, reason: '撃破済みの個体があったマスには置けません' };
        return { ok: true, cells, mask: m, piece: p };
      }
      case 'stealth': {
        const p = me.pieces.find((x) => x.id === params.pieceId && x.alive);
        if (!p) return { ok: false, reason: 'ステルスにする自分のキューブを選んでください' };
        if (p.stealth) return { ok: false, reason: 'そのキューブはすでにステルス中です' };
        return { ok: true, piece: p };
      }
    }
    return { ok: false, reason: '不明なアイテムです' };
  };

  Game.prototype.useItem = function (pi, key, params) {
    const st = this.itemStatus(pi, key);
    if (!st.usable) return { ok: false, reason: 'いまはアイテムを使えません' };
    const val = this.validateItem(pi, key, params);
    if (!val.ok) return val;
    const me = this.players[pi], foe = this.foeOf(pi);
    const fromSub = this.sub;
    if (st.rebuyNeeded) {
      me.wallet -= 3; me.score.rebuy += 3; me.rebuys += 1;
    } else {
      me.items[key] -= 1;
    }
    me.used[key] = true;
    this.itemUsed = true;
    const t = this._tick();
    const name = ITEMS[key].name;
    const tag = st.rebuyNeeded ? '（再購入）' : '';
    const N = this.N;
    let result = { ok: true, key };
    const livingFoe = this.living(foe.idx);
    switch (key) {
      case 'cube': {
        const n = livingFoe.filter((p) => (params.kind === 'cat' ? p.cat === params.value : p.size === params.value)).length;
        me.kb.counts.push({ t, turn: this.turn, kind: params.kind, value: params.value, n });
        result.n = n;
        const what = params.kind === 'cat' ? params.value : params.value + 'マス';
        this._log(pi, `${me.name}：${name}${tag}（${what}）→ ${n}個体`, null, 'item', key);
        break;
      }
      case 'line': {
        // その列・行で、生きている個体が占めているマスの数（個体の数ではない）
        const lm = lineMask(params.line, params.index, N);
        let occ = 0;
        for (const p of livingFoe) occ |= p.mask;
        const n = popcount(occ & lm);
        me.kb.counts.push({ t, turn: this.turn, kind: 'line', line: params.line, index: params.index, n });
        result.n = n;
        this._log(pi, `${me.name}：${name}${tag}（${lineLabel(params.line, params.index)}）→ ${n}マス`, null, 'item', key);
        break;
      }
      case 'number': {
        const p = this.pieceAt(foe.idx, params.cell);
        const size = p ? p.size : 0;
        if (size) me.kb.occs.push({ c: params.cell, t, cat: null, size, turn: this.turn, src: 'number' });
        else me.kb.empties.push({ c: params.cell, t, turn: this.turn, src: 'number' });
        result.size = size;
        this._log(pi, `${me.name}：${name}${tag}（${this.coord(params.cell)}）→ ${size ? size + 'マス' : 'NoData'}`, null, 'item', key);
        break;
      }
      case 'shape': {
        const p = this.pieceAt(foe.idx, params.cell);
        const cat = p ? p.cat : null;
        if (cat) me.kb.occs.push({ c: params.cell, t, cat, turn: this.turn, src: 'shape' }); else me.kb.empties.push({ c: params.cell, t, turn: this.turn, src: 'shape' });
        result.cat = cat;
        this._log(pi, `${me.name}：${name}${tag}（${this.coord(params.cell)}）→ ${cat || 'NoData'}`, null, 'item', key);
        break;
      }
      case 'pair': {
        const pa = this.pieceAt(foe.idx, params.a), pb = this.pieceAt(foe.idx, params.b);
        const same = !!pa && pa === pb;
        me.kb.pairs.push({ t, turn: this.turn, a: params.a, b: params.b, same });
        result.same = same;
        this._log(pi, `${me.name}：${name}${tag}（${this.coord(params.a)}と${this.coord(params.b)}）→ ${same ? '同じ個体' : '同じ個体ではない'}`, null, 'item', key);
        break;
      }
      case 'dist': {
        // その個体の◎（今の位置になってから最初のヒット）までのブロック数。空きマス・◎のない個体は NoData
        const p = this.pieceAt(foe.idx, params.cell);
        const first = p && p.hitOrder && p.hitOrder.length ? p.hitOrder[0] : -1;
        const k = first >= 0 ? blockDist(params.cell, first, N) : null;
        me.kb.dists.push({ t, turn: this.turn, c: params.cell, k });
        result.k = k;
        this._log(pi, `${me.name}：${name}${tag}（${this.coord(params.cell)}）→ ${k == null ? 'NoData' : '◎まで' + k + 'ブロック'}`, null, 'item', key);
        break;
      }
      case 'warp': {
        const p = val.piece;
        const oldCells = p.cells.slice(), oldMask = p.mask;
        const fv = foe.view;
        for (let c = 0; c < this.NN; c++) { const m = fv.marks[c]; if (m && m.r === 'x') m.callable = true; }
        for (const c of oldCells) fv.marks[c] = { r: 'x', callable: false, t, warp: true };
        p.t = params.t; p.r0 = params.r0; p.c0 = params.c0;
        p.cells = val.cells; p.mask = val.mask; p.hitMask = 0; p.hitOrder = [];
        const hadT = !!(me.treasure && me.treasure.pieceId === p.id);
        if (hadT) {
          me.treasure.cell = p.cells[me.treasure.idx];
          for (let c = 0; c < this.NN; c++) if (fv.tlog[c]) fv.tlog[c].gray = true;
          foe.kb.grays.push(t);
        }
        foe.kb.warps.push({ t, oldCells, oldMask, key: p.shape, size: p.size, cat: p.cat, treasure: hadT && !fv.treasureFound });
        result.oldCells = oldCells;
        result.treasureMoved = hadT;
        const from = coordList(oldCells, N);
        const to = coordList(p.cells, N);
        const tl = hadT ? '・トレジャーログがリセット' : '';
        this._log(pi, `${me.name}：${name}${tag}（移動前 ${from}）${tl}`, `${me.name}：${name}${tag}（移動前 ${from} → 移動後 ${to}）${tl}`, 'item', key);
        break;
      }
      case 'stealth': {
        // どのキューブにしたかは相手に伏せる（使ったことだけが伝わる）
        const p = val.piece;
        p.stealth = true;
        p.stealthAt = t;
        foe.kb.stealths.push({ t });
        result.cells = p.cells.slice();
        this._log(pi, `${me.name}：${name}${tag}`, `${me.name}：${name}${tag}（${coordList(p.cells, N)} のキューブ）`, 'item', key);
        break;
      }
    }
    const pub = { type: 'item', actor: pi, key, rebuy: st.rebuyNeeded };
    if (key === 'cube' || key === 'line') { pub.n = result.n; }
    if (key === 'cube') { pub.kind = params.kind; pub.value = params.value; }
    if (key === 'line') { pub.line = params.line; pub.index = params.index; }
    if (key === 'number') { pub.cell = params.cell; pub.size = result.size; }
    if (key === 'shape') { pub.cell = params.cell; pub.cat = result.cat; }
    if (key === 'pair') { pub.a = params.a; pub.b = params.b; pub.same = result.same; }
    if (key === 'dist') { pub.cell = params.cell; pub.k = result.k; }
    if (key === 'warp') { pub.oldCells = result.oldCells; pub.treasureMoved = result.treasureMoved; pub.priv = { newCells: val.cells.slice() }; }
    if (key === 'stealth') { pub.priv = { cells: result.cells }; }
    this._emit(pub);
    this.sub = fromSub === 'answer' ? 'answer' : 'call';
    this.lastAction = { kind: 'item', pi, key, result };
    return result;
  };

  // ---------------- バズーカ ----------------
  // 予選8ターン目・決勝12ターン目から、自分の手番のあいだならいつでも使用を宣言できる（アイテムとは別枠）。
  // 宣言は取り消せない。両者の宣言がそろったら、次のターンの始めに発動して、
  // お互いの空きマス（個体のないマス）をすべて×で公開する。発動は1試合に1回だけ。
  // 公開された×も、その後に相手がワープすれば、ふつうの×と同じく再コールできるようになる
  Game.prototype.bazookaStatus = function (pi) {
    const B = this.bazooka || { decl: [null, null], fired: null };
    const on = !!this.bazookaOn;
    const fired = !!B.fired;
    const mine = !!B.decl[pi], theirs = !!B.decl[1 - pi];
    const locked = this.turn < this.rules.bazookaTurn;
    const inPhase = this.phase === 'play' && this.cur === pi && ['item', 'call', 'answer', 'treasure'].indexOf(this.sub) >= 0;
    return { on, fired, mine, theirs, locked, armed: mine && theirs && !fired, from: this.rules.bazookaTurn, can: on && !fired && !mine && !locked && inPhase };
  };
  Game.prototype.declareBazooka = function (pi) {
    const st = this.bazookaStatus(pi);
    if (!st.can) {
      let reason = 'いまはバズーカを宣言できません';
      if (!st.on) reason = 'この試合ではバズーカを使いません';
      else if (st.fired) reason = 'バズーカはもう発動しました（1試合に1回）';
      else if (st.mine) reason = 'バズーカはもう宣言しています';
      else if (st.locked) reason = `バズーカは${this.rules.bazookaTurn}ターン目から宣言できます`;
      return { ok: false, reason };
    }
    const me = this.players[pi];
    this.bazooka.decl[pi] = { turn: this.turn, t: this._tick() };
    const both = !!this.bazooka.decl[1 - pi];
    this._log(pi, `${me.name}：バズーカの使用を宣言${both ? '（両者がそろったので、次のターンの始めに発動）' : ''}`, null, 'bazooka', 'bazooka');
    this._emit({ type: 'bzdecl', actor: pi, both });
    this.lastAction = { kind: 'bazooka', pi, both };
    return { ok: true, both };
  };
  Game.prototype._fireBazooka = function () {
    const B = this.bazooka;
    const t = this._tick();
    B.fired = { turn: this.turn, t };
    const opened = [[], []];   // opened[i]：プレイヤー i の予想盤面（相手フィールド）で新しく×になったマス
    for (const P of this.players) {
      const foe = this.foeOf(P.idx);
      const v = P.view;
      const occ = this.livingMask(foe.idx);
      for (let c = 0; c < this.NN; c++) {
        if (v.dead[c] || (occ & bit(c))) continue;
        const m = v.marks[c];
        if (m && m.r !== 'x') continue;
        if (!m || m.callable) { v.marks[c] = { r: 'x', callable: false, t, bz: true }; opened[P.idx].push(c); }
        P.kb.empties.push({ c, t, turn: this.turn, src: 'bazooka' });
      }
      // 推論用：この時点で個体があったマスは、ちょうど occ（撃破済み以外で×でないマス）
      P.kb.reveal = { t, turn: this.turn, occ };
    }
    this._log(-1, 'バズーカ発動：お互いの空きマスがすべて×で公開された', null, 'bazooka', 'bazooka');
    this._emit({ type: 'bazooka', opened });
  };

  const api = {
    VERSION, COLS, STOCK, CATS, SHAPES, SHAPES_BY_SIZE, ORIENT, ITEM_KEYS, ITEMS,
    bit, popcount, bitsOf, maskOf, cellsFor, placements, identifyShape, coord, coordList, lineMask, lineLabel, blockDist, makeRules, Game,
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.SBEngine = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* サーチバトル — CPU
 * 人間と同じ情報（自分の盤面・攻撃ログ・防御ログ・アイテム状況）だけで推論する。
 *  1. 確定推論：◎ごとに「ありうる配置」を列挙し、すべての事実と矛盾しない組み合わせを全探索。
 *     候補が1つに絞れた個体だけアンサーする（失敗しない）。
 *  2. 確率推論：未発見の個体について、×・ヒット・アイテム結果と矛盾しない配置の密度から
 *     各マスに個体がいる確率を求め、索敵に使う。
 */
(function (root) {
  'use strict';
  const E = (typeof module !== 'undefined' && module.exports) ? require('./engine.js') : root.SBEngine;
  const { SHAPES, SHAPES_BY_SIZE, ITEM_KEYS, ORIENT, CATS, placements, bit, popcount, bitsOf, lineMask, cellsFor, blockDist } = E;
  const CAT_INDEX = {}; CATS.forEach((c, i) => { CAT_INDEX[c] = i; });
  // 実験用：プレイヤーごとの方針の上書き（ふだんは空＝標準の方針）
  const policy = [{}, {}];
  // 未発見の個体数の見積もり方（0＝旧方式、1＝見つかった数を考慮、2＝さらに重ならない分を証拠に数えない）。
  // CPU同士の対戦とキャリブレーションの検証で 2 がいちばん良かった
  const CALIB_DEFAULT = 2;

  // ------------------------------------------------------------------
  // 事実の整理
  // ------------------------------------------------------------------
  function currentCounts(kb, N) {
    const res = { all: null, size: {}, cat: {}, lines: [] };
    const matchDead = (q, d) => q.kind === 'all' || (q.kind === 'size' ? d.size === q.value : d.cat === q.value);
    const matchAdd = (q) => q.kind === 'all' || (q.kind === 'size' ? q.value === 1 : q.value === 'キューブ');
    for (const q of kb.counts) {
      if (q.kind === 'line') {
        if (kb.warps.some((w) => w.t > q.t) || kb.adds.some((a) => a.t > q.t)) continue;
        // サーチライン＝その列・行で埋まっているマスの数。その後に撃破された個体のマスは引く
        const lm = lineMask(q.line, q.index, N);
        let n = q.n;
        for (const d of kb.deads) if (d.t > q.t) n -= popcount(d.mask & lm);
        res.lines.push({ mask: lm, n });
        continue;
      }
      let n = q.n;
      for (const d of kb.deads) if (d.t > q.t && matchDead(q, d)) n--;
      for (const a of kb.adds) if (a.t > q.t && matchAdd(q)) n++;
      if (q.kind === 'all') res.all = n;
      else if (q.kind === 'size') res.size[q.value] = n;
      else res.cat[q.value] = n;
    }
    return res;
  }

  function buildContext(kb, N) {
    const NN = N * N;
    const intervals = [];
    for (const d of kb.deads) intervals.push({ mask: d.mask, end: d.t });
    for (const w of kb.warps) intervals.push({ mask: w.oldMask, end: w.t });
    const explained = (c, t) => { for (const iv of intervals) if ((iv.mask & bit(c)) && t < iv.end) return true; return false; };

    let deadMask = 0; for (const d of kb.deads) deadMask |= d.mask;
    let oldMaskAll = 0; for (const w of kb.warps) oldMaskAll |= w.oldMask;

    const xs = [];
    for (const k of kb.calls) if (k.r === 'x') xs.push({ c: k.c, t: k.t });
    for (const e of kb.empties) xs.push({ c: e.c, t: e.t });
    let xMaskAll = 0; for (const x of xs) xMaskAll |= bit(x.c);
    const xMaskAfter = (t0) => { let m = 0; for (const x of xs) if (x.t > t0) m |= bit(x.c); return m; };
    const xMaskBetween = (t0, t1) => { let m = 0; for (const x of xs) if (x.t > t0 && x.t < t1) m |= bit(x.c); return m; };
    const oldMaskAfter = (t0) => { let m = 0; for (const w of kb.warps) if (w.t > t0) m |= w.oldMask; return m; };
    const oldMaskBefore = (t0) => { let m = 0; for (const w of kb.warps) if (w.t < t0) m |= w.oldMask; return m; };

    const counts = currentCounts(kb, N);
    let lineZeroMask = 0;
    const lineMax = [];
    for (const L of counts.lines) { if (L.n <= 0) lineZeroMask |= L.mask; else lineMax.push(L); }

    // 説明のつかないヒット＝今もそこにいる個体への命中
    const latest = new Map();
    for (const k of kb.calls) if (k.r !== 'x' && !explained(k.c, k.t)) latest.set(k.c, k);
    const U = Array.from(latest.values()).sort((a, b) => a.t - b.t);
    const groups = U.filter((k) => k.r === 'oo').map((k) => ({ num: k.num, c: k.c, t: k.t }));
    const oList = U.filter((k) => k.r === 'o').map((k) => ({ c: k.c, t: k.t }));
    let ooMask = 0; for (const g of groups) ooMask |= bit(g.c);
    let hitMask = 0; for (const u of U) hitMask |= bit(u.c);
    const Ucell = new Map(U.map((u) => [u.c, u]));

    // ペアショット（どの2マスでも）：
    //  同じ個体 → 2マスの持ち主は今も同じ（どちらのマスからも個体が去っていなければ）
    //  同じではない → 今も同じではない（どちらかがその前からのヒット、またはその後ワープがなければ）
    const warpedAfter = (t) => kb.warps.some((w) => w.t > t);
    const hitBefore = (c, t) => { const u = Ucell.get(c); return !!u && u.t < t; };
    const pairs = [];
    const derivedOccs = [];
    for (const p of kb.pairs) {
      if (p.same) {
        if (explained(p.a, p.t) || explained(p.b, p.t)) continue;
        pairs.push(p);
        derivedOccs.push({ c: p.a, t: p.t, cat: null }, { c: p.b, t: p.t, cat: null, dup: true });
      } else if (hitBefore(p.a, p.t) || hitBefore(p.b, p.t) || !warpedAfter(p.t)) pairs.push(p);
    }
    // ディスタンスショット：数値＝その時点で◎のある個体のマス（去っていなければ今も同じ）／NoData＝空きか◎のない個体
    const dists = [];
    for (const d of (kb.dists || [])) {
      if (d.k == null) { dists.push({ c: d.c, t: d.t, k: null }); continue; }
      if (explained(d.c, d.t)) continue;
      dists.push({ c: d.c, t: d.t, k: d.k });
      derivedOccs.push({ c: d.c, t: d.t, cat: null, dup: true });
    }
    const distNums = dists.filter((d) => d.k != null);
    // ステルス：使われた時刻だけが分かる。全マスに当たっても生きている個体は、それより前にステルスになっていたはず
    const stealthTimes = (kb.stealths || []).map((x) => x.t).sort((a, b) => a - b);
    const occs = kb.occs.filter((o) => !explained(o.c, o.t)).concat(derivedOccs);
    const occMaskBefore = (t0) => { let m = 0; for (const o of occs) if (o.t < t0) m |= bit(o.c); return m; };

    const deadSetup = { 2: 0, 3: 0, 4: 0, 5: 0 };
