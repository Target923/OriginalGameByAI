      if (sc < bestS) { bestS = sc; best = k; }
    }
    return best || game.draft.pool[0];
  }

  // ---------------- 大会 ----------------
  // アイテムの使い方（v12.5で購入を廃止し、9種類を2つずつ持って始める）
  //  'pace'（既定、v12.6）：試合ごとにバランスよく使う。1・2試合目は各種類1つ目だけを使い（2つ目は3試合目と決勝のために残す）、
  //    攻撃アイテムは1試合 budget 個まで（1試合目3個・2試合目4個・3試合目5個。ワープ・ステルスは数えない）。決勝は制限なし
  //  'keep'：keepList の種類を keepN 個残す（keepRounds の試合だけ）／'none'：制限なし（CPU-δ アイテム浪費型）
  //  測定（v12.5、温存なし＝1試合に約5個を予選で使い切る方針に対して）：ワープ・サイズ・シェイプ・ノードを1つずつ残すと優勝率 22.8%対27.3%、
  //   ワープ・ステルス・キューブを残すと 22.5%対27.5%。アイテムは予選で使った方が勝ちやすいが、決勝がアイテムの少ない戦いになり、
  //   どのCPUも2試合目までにほとんど使ってしまうので、v12.6でバランスよく使う方針を既定にし、使い切る方針はCPU-δの性格にした

  const PERSONA_ITEMS = { items: { mode: 'none' } };
  function tourItemKeep(T, id, kind, opt) {
    const persona = E.Tour.persona ? E.Tour.persona(T, id) : null;
    const o = Object.assign({}, TOUR_ITEMS, (persona && PERSONA_ITEMS[persona]) || {}, (policy.tourItems && policy.tourItems[id]) || {}, opt || {});

  }
  // 予選1位の選択：'first'（先攻）か 'draft'（ドラフト先行権＝後攻）。CPUどうしの決勝では先攻の勝率が51.5%

  }

  // CPUの1手番をまとめて実行する（シミュレーション用。画面側は段階的に呼ぶ）
  function playTurn(game, pi, onStep) {
    const step = (s) => { if (onStep) onStep(s); };

      const it = chooseItem(game, pi, stage);
      if (!it) return 'none';
      const r = game.useItem(pi, it.key, it.params);

      for (let guard = 0; guard < 12 && game.sub === 'answer'; guard++) {

        const r = game.answer(pi, cells);
        step({ kind: 'answer', cells, r });

        if (game.sub === 'sacrifice') {
          game.sacrifice(pi, chooseSacrifice(game, pi));
          if (game.phase !== 'play') return 'over';

        }

      return 'ok';
    };
    if (game.sub === 'item') {
      const r = useItemNow('pre');
      if (r === 'over') return 'over';
    }
    if ((game.sub === 'item' || game.sub === 'call') && !game.hasCallable(pi)) game.skipCall(pi);

      const r = game.call(pi, c);
      step({ kind: 'call', c, r });

    }
    if (answerLoop() === 'over') return 'over';
    if (game.sub === 'answer' && !game.itemUsed) {

      if (r === 'over') return 'over';
      if (r === 'used' && answerLoop() === 'over') return 'over';
    }
    if (game.sub === 'answer') game.endTurn(pi);
    if (game.sub === 'treasure' && game.cur === pi) {
      const c = chooseTreasure(game, pi);
      const r = game.treasureCall(pi, c);
      step({ kind: 'treasure', c, r });
    }
    return 'done';
  }

  // 画面用：自分が知り得た相手の現在の個体数（サーチオール未使用なら null）
  function knownCounts(kb, N) { return currentCounts(kb, N); }

  const api = { knownCounts, analyze, chooseCall, chooseAnswer, chooseTreasure, chooseItem, chooseSacrifice, setup, setupSizes, draftPick, playTurn, autoMatch, tourItemKeep, tourChooseFirst, tourSetupPlan, SETUP_PROB, SETUP_CAP, drawSizes, setupSpec, exposure, bestWarpTarget, bestAddCell, policy, _cubeOptions: cubeOptions };

<script id="src-sim">
/* サーチバトル — シミュレーター（計算用のエンジン）

 *  ・CPUの置き方・アイテムの使い方・推理は持ち点を見ないので、試合の中身は点数のルールに左右されない。
 *    だから同じ試合結果に、別の点数のルール（はじめの持ち点・宝石・勝利点）を当てはめ直せる。
 *    決勝の顔ぶれ（予選1位・2位）が変わったときだけ、決勝を回し直す（予選の後の大会の状態を記録してある）

(function (root) {

  const PERSONA_KEYS = ['std', 'mass', 'save', 'steady', 'items'];

  // 1試合の記録（小さく）。k＝P（予選）/F（決勝）、r＝何試合目（0〜2、決勝は3）、a・b＝大会の番号、f＝先攻、w＝勝者（引き分けは-1）、
  // at＝撃破したマス数、tf＝相手のトレジャーを見つけたか、t＝ターン数、pl＝置いた個体の数、lo＝失った個体の数、it＝使ったアイテムの数
  function compactMatch(g, kind, round, a, b) {
    const sum = g.summary(), r = g.result || { winner: -1, draw: true };

      k: kind === 'final' ? 'F' : 'P', r: round, a, b, f: g.first === 0 ? a : b, w: r.draw ? -1 : (r.winner === 0 ? a : b),
      at: [sum[0].attack, sum[1].attack], tf: [sum[0].treasureFound ? 1 : 0, sum[1].treasureFound ? 1 : 0], t: g.turn,

  // CPUだけの大会を1つ回す。rules は決勝の顔ぶれを決めるのに使う（予選の試合の中身には関係しない）
  function runTour(seed, rules, withFinal) {

  // ---------------- 点数のルールを当てはめる ----------------

  }

  // スピードペナルティの表記（後ろの0は省く。例：24/21/18/15/12/9/6/3）
  const speedLabel = (rules) => { const a = (rules.speed || []).slice(1); while (a.length && !a[a.length - 1]) a.pop(); return a.length ? a.join('/') : 'なし'; };
  // 1試合の持ち点の増減（m の a・b の順）。宝石は持っていなければ奪えない
  function applyMatch(st, m, rules) {
    const A = st[m.a], B = st[m.b];
    const v = m.k === 'F' ? rules.vic[3] : rules.vic[m.r];
    A.total += m.at[0] - m.at[1]; B.total += m.at[1] - m.at[0];
    A.take += m.at[0]; B.take += m.at[1];
    if (m.w === m.a) { A.total += v; B.total -= v; A.wins++; B.losses++; }
    else if (m.w === m.b) { B.total += v; A.total -= v; B.wins++; A.losses++; }

    if (m.k === 'P' && m.w >= 0) { const sp = rules.speed[m.t] || 0; if (sp) { const L = m.w === m.a ? B : A; L.total -= sp; } }

  // rounds 試合目までの順位（同点は 勝ち数 → 撃破マス数 → 抽選）。low＝途中でいちばん減ったときの持ち点
  function standing(rec, rules, rounds) {
    const st = [0, 1, 2, 3].map((id) => ({ id, total: startTotal(rules), wins: 0, losses: 0, take: 0, gems: rules.gems, lotto: rec.lotto[id], low: startTotal(rules) }));
    for (const m of rec.m) if (m.r < rounds) { applyMatch(st, m, rules); st[m.a].low = Math.min(st[m.a].low, st[m.a].total); st[m.b].low = Math.min(st[m.b].low, st[m.b].total); }
    const order = st.slice().sort((x, y) => y.total - x.total || y.wins - x.wins || y.take - x.take || y.lotto - x.lotto);

  }
  function finalistsOf(rec, rules) { const o = standing(rec, normRules(rules), 3).order; return [o[0].id, o[1].id]; }

  // ---------------- 集計 ----------------
  const pct = (a, b) => (b ? 100 * a / b : null);
  const mean = (xs) => (xs.length ? xs.reduce((s, x) => s + x, 0) / xs.length : null);
  const quant = (xs, q) => { if (!xs.length) return null; const s = xs.slice().sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.floor(q * (s.length - 1) + 0.5))]; };
  function summarize(recs, rulesIn) {
    const rules = normRules(rulesIn);
    const noGem = Object.assign({}, rules, { gemPts: 0 });
    const N = recs.length;
    const P = {}; for (const k of PERSONA_KEYS) P[k] = { n: 0, nf: 0, qual: 0, champ: 0, fin: 0, finWin: 0, pts: [], wins: 0, placed: 0, placedN: 0, items: 0, itemsN: 0 };
    const c = { r3change: 0, last2in: 0, lead1out: 0, w: [[0, 0], [0, 0], [0, 0], [0, 0]], wonR1: [0, 0], lostR1: [0, 0], wonR3: [0, 0],
      tie: 0, tieWins: 0, tieTake: 0, tieLotto: 0, topTie: 0, treChange: 0,
      firstPre: [0, 0], firstFin: [0, 0], turnsPre: [], turnsFin: [], placedPre: [], placedFin: [], itemsPre: [], itemsFin: [], lostPre: [],
      foundPre: [0, 0], foundFin: [0, 0], both: 0, one: 0, none: 0, gemDist: {}, champ: [], runnerAbove: 0, finals: 0, missingFinal: 0,

  // 発振器（f→f2 へ音程を動かせる。uni で少しずらして重ねると厚くなる）
  function tone(G, t, o) {
    const ctx = G.ctx, e = envGain(G, t, o);
    let into = e.g;
    if (o.lp) {
      const f = ctx.createBiquadFilter();
      f.type = o.ft || 'lowpass';
      f.Q.value = o.q == null ? 0.7 : o.q;
      f.frequency.setValueAtTime(o.lp, t);
      if (o.lp2) f.frequency.exponentialRampToValueAtTime(o.lp2, t + (o.lpT || (e.end - t)));
      f.connect(e.g); into = f;
    }
    const n = o.uni || 1;
    for (let i = 0; i < n; i++) {
      const os = ctx.createOscillator();
      os.type = o.type || 'sine';
      os.frequency.setValueAtTime(o.f, t);
      if (o.f2) os.frequency.exponentialRampToValueAtTime(o.f2, t + (o.glide || (e.end - t)));
      if (o.steps) for (const st of o.steps) os.frequency.setValueAtTime(st[1], t + st[0]);
      if (n > 1) os.detune.setValueAtTime((i - (n - 1) / 2) * (o.spread || 10), t);
      os.connect(into);
      os.start(t); os.stop(e.end + 0.05);
    }
    route(G, e.g, o);
    return e.end;
  }
  // 金属的なベル（FM合成）
  function bell(G, t, o) {
    const ctx = G.ctx, e = envGain(G, t, Object.assign({ a: 0.002 }, o));
    const car = ctx.createOscillator(), mod = ctx.createOscillator(), mg = ctx.createGain();
    car.frequency.setValueAtTime(o.f, t);
    mod.frequency.setValueAtTime(o.f * (o.ratio || 3.5), t);
    const depth = Math.max(0.5, o.f * (o.index == null ? 1.5 : o.index));
    mg.gain.setValueAtTime(depth, t);
    mg.gain.exponentialRampToValueAtTime(Math.max(0.5, depth * 0.04), e.end);
    mod.connect(mg); mg.connect(car.frequency); car.connect(e.g);
    route(G, e.g, o);
    car.start(t); mod.start(t); car.stop(e.end + 0.05); mod.stop(e.end + 0.05);
    return e.end;
  }
  // ノイズ（フィルターの帯域を動かして、風切り音・爆発・スキャン音に使う）
  function noise(G, t, o) {
    const ctx = G.ctx, e = envGain(G, t, o);
    const src = ctx.createBufferSource();
    src.buffer = G.noise; src.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = o.ft || 'bandpass';
    f.Q.value = o.q == null ? 1 : o.q;
    f.frequency.setValueAtTime(o.f || 1000, t);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + (o.glide || (e.end - t)));
    src.connect(f); f.connect(e.g);
    route(G, e.g, o);
    src.start(t, Math.random() * 1.5); src.stop(e.end + 0.05);
    return e.end;
  }
  function kick(G, t, v, dest) {
    tone(G, t, { f: 150, f2: 40, glide: 0.14, a: 0.002, d: 0.34, v, dest });
    noise(G, t, { ft: 'lowpass', f: 1800, a: 0.001, d: 0.025, v: v * 0.3, dest });
  }
  function hat(G, t, v, open, dest) { noise(G, t, { ft: 'highpass', f: 7500, q: 0.6, a: 0.001, d: open ? 0.16 : 0.04, v, dest }); }
  function snare(G, t, v, dest) {
    noise(G, t, { ft: 'bandpass', f: 1900, q: 0.8, a: 0.001, d: 0.17, v, dest });
    tone(G, t, { type: 'triangle', f: 210, f2: 150, a: 0.001, d: 0.1, v: v * 0.6, dest });
  }
  function pad(G, t, notes, len, v, cut, dest) {
    const a = Math.min(0.8, len * 0.3);
    for (const m of notes) tone(G, t, { type: 'sawtooth', uni: 2, spread: 12, f: mtof(m), a, hold: Math.max(0.01, len - a), d: 1.2, v, lp: cut, q: 0.5, dest });
  }

  // ================= 効果音 =================
  // どれも (回路, 開始時刻, パラメータ)。p.pan は左右（自分フィールド＝左、相手フィールド＝右）
  const SFX = {
    // ---- 画面の操作 ----
    ui(G, t) { tone(G, t, { type: 'triangle', f: 1320, f2: 1760, glide: 0.03, a: 0.002, d: 0.07, v: 0.16 }); },
    tick(G, t) { tone(G, t, { f: 2200, a: 0.001, d: 0.04, v: 0.13 }); },
    select(G, t) {
      tone(G, t, { type: 'square', f: 880, a: 0.002, d: 0.06, v: 0.05, lp: 3000 });

    cancel(G, t) {
      tone(G, t, { type: 'triangle', f: 1175, a: 0.002, d: 0.06, v: 0.08 });

    deny(G, t) {

    open(G, t) {
      noise(G, t, { f: 900, f2: 3200, q: 1.2, a: 0.03, d: 0.16, v: 0.065 });

    },
    close(G, t) {
      noise(G, t, { f: 3200, f2: 900, q: 1.2, a: 0.02, d: 0.14, v: 0.055 });
      tone(G, t, { f: 990, f2: 660, a: 0.01, d: 0.12, v: 0.08 });
    },
    place(G, t) {
      tone(G, t, { f: 170, f2: 80, a: 0.002, d: 0.14, v: 0.16 });

    remove(G, t) {

    },
    rotate(G, t) { noise(G, t, { f: 1800, f2: 5200, q: 1.5, a: 0.01, d: 0.09, v: 0.25 }); },
    shuffle(G, t) { [0, 7, 4, 12].forEach((d, i) => tone(G, t + i * 0.045, { type: 'square', f: mtof(72 + d), a: 0.002, d: 0.05, v: 0.04, lp: 2800 })); },
    gem(G, t) {
      bell(G, t, { f: 1568, ratio: 2, index: 0.5, d: 0.5, v: 0.07, echo: 0.3 });
      bell(G, t + 0.07, { f: 2093, ratio: 2, index: 0.5, d: 0.6, v: 0.06, echo: 0.3 });
    },
    pick(G, t) {
      tone(G, t, { type: 'triangle', f: 659, a: 0.003, d: 0.2, v: 0.07 });
      tone(G, t, { type: 'triangle', f: 988, a: 0.003, d: 0.2, v: 0.06 });
      bell(G, t + 0.04, { f: 1319, ratio: 2, index: 0.6, d: 0.45, v: 0.05, echo: 0.25 });
    },
    pickFoe(G, t) {
      tone(G, t, { type: 'square', f: 494, a: 0.003, d: 0.16, v: 0.04, lp: 1600, pan: 0.3 });
      tone(G, t + 0.06, { type: 'square', f: 370, a: 0.003, d: 0.2, v: 0.04, lp: 1400, pan: 0.3 });
    },
    confirm(G, t) {
      tone(G, t, { f: 880, a: 0.003, d: 0.09, v: 0.065 });
      tone(G, t + 0.08, { f: 1175, a: 0.003, d: 0.3, v: 0.065, rev: 0.2 });
    },
    sel(G, t, p) { tone(G, t, { type: 'triangle', f: mtof(76 + 2 * Math.min(6, p.n || 0)), a: 0.002, d: 0.07, v: 0.15, pan: p.pan }); },
    desel(G, t, p) { tone(G, t, { type: 'triangle', f: mtof(73 + 2 * Math.min(6, p.n || 0)), f2: mtof(66), a: 0.002, d: 0.08, v: 0.11, pan: p.pan }); },

    // ---- 対戦の出来事 ----
    start(G, t) {
      noise(G, t, { f: 300, f2: 5200, q: 1.4, a: 0.55, d: 0.12, v: 0.11 });
      tone(G, t, { type: 'sawtooth', f: 110, f2: 440, glide: 0.6, a: 0.5, d: 0.15, v: 0.04, lp: 2200 });
      const s = t + 0.62;
      for (const m of [62, 65, 69, 74]) tone(G, s, { type: 'sawtooth', uni: 2, spread: 14, f: mtof(m), a: 0.004, d: 0.7, v: 0.04, lp: 3200, lp2: 500, lpT: 0.5, rev: 0.25 });
      kick(G, s, 0.5);
      bell(G, s + 0.02, { f: 1175, ratio: 2, index: 0.8, d: 1, v: 0.05, rev: 0.3, echo: 0.2 });
    },
    turnMine(G, t, p) {
      const k = p.alt ? 0.891 : 1;
      tone(G, t, { type: 'triangle', f: 659 * k, a: 0.003, d: 0.12, v: 0.09 });
      tone(G, t + 0.09, { type: 'triangle', f: 988 * k, a: 0.003, d: 0.32, v: 0.09, echo: 0.25 });
    },
    turnFoe(G, t) {
      tone(G, t, { type: 'square', f: 494, a: 0.003, d: 0.12, v: 0.045, lp: 1700 });
      tone(G, t + 0.09, { type: 'square', f: 330, a: 0.003, d: 0.32, v: 0.045, lp: 1500, echo: 0.2 });
    },
    tchance(G, t) {
      [784, 988, 1175, 1568].forEach((f, i) => bell(G, t + i * 0.07, { f, ratio: 2, index: 0.6, d: 0.4, v: 0.085, echo: 0.3, rev: 0.15 }));
    },
    tfail(G, t, p) {
      tone(G, t, { f: 620, f2: 280, glide: 0.35, a: 0.004, d: 0.42, v: 0.1, pan: p.pan });
      tone(G, t, { type: 'square', f: 310, f2: 140, glide: 0.35, a: 0.004, d: 0.38, v: 0.04, lp: 900, pan: p.pan });
    },
    shield(G, t, p) {
      bell(G, t, { f: 880, ratio: 3.47, index: 2.2, d: 1.0, v: 0.12, rev: 0.4, pan: p.pan });
      bell(G, t + 0.02, { f: 1320, ratio: 2.76, index: 1.5, d: 0.8, v: 0.07, pan: p.pan });
      noise(G, t, { ft: 'highpass', f: 6000, a: 0.05, d: 0.5, v: 0.04, pan: p.pan });
    },
    miss(G, t, p) {
      tone(G, t, { f: 720, f2: 520, glide: 0.15, a: 0.003, d: 0.24, v: 0.15, rev: 0.25, pan: p.pan });
      noise(G, t, { f: 1300, q: 2, a: 0.001, d: 0.04, v: 0.045, pan: p.pan });
    },
    hit(G, t, p) {
      tone(G, t, { f: 190, f2: 55, glide: 0.16, a: 0.001, d: 0.28, v: 0.5, pan: p.pan });
      tone(G, t, { type: 'triangle', f: 380, f2: 120, glide: 0.12, a: 0.001, d: 0.16, v: 0.16, pan: p.pan });
      noise(G, t, { ft: 'lowpass', f: 2600, f2: 300, a: 0.001, d: 0.22, v: 0.33, pan: p.pan });
      bell(G, t, { f: 1480, ratio: 2.4, index: 1.5, d: 0.26, v: 0.07, pan: p.pan });
    },
    first(G, t, p) {
      tone(G, t, { type: 'square', f: 1760, a: 0.002, d: 0.05, v: 0.05, lp: 4000, pan: p.pan });
      tone(G, t + 0.07, { type: 'square', f: 2349, a: 0.002, d: 0.07, v: 0.05, lp: 4000, pan: p.pan });
      const s = t + 0.1;
      tone(G, s, { f: 200, f2: 50, glide: 0.2, a: 0.001, d: 0.34, v: 0.32, pan: p.pan });
      noise(G, s, { ft: 'lowpass', f: 3200, f2: 300, a: 0.001, d: 0.26, v: 0.22, pan: p.pan });
      tone(G, s, { type: 'sawtooth', f: 400, f2: 1600, glide: 0.3, a: 0.02, d: 0.3, v: 0.03, lp: 3500, pan: p.pan });
      bell(G, s + 0.03, { f: 2093, ratio: 2, index: 0.8, d: 0.55, v: 0.05, rev: 0.3, echo: 0.25, pan: p.pan });
    },
    destroy(G, t, p) {
      const big = !!p.big, pan = p.pan || 0;
      tone(G, t, { f: 150, f2: 30, glide: big ? 0.8 : 0.6, a: 0.002, d: big ? 1.1 : 0.8, v: 0.6, pan });
      tone(G, t, { type: 'triangle', f: 320, f2: 60, glide: 0.35, a: 0.002, d: big ? 0.6 : 0.45, v: big ? 0.55 : 0.45, pan });
      noise(G, t, { ft: 'lowpass', f: 5200, f2: 140, glide: big ? 1 : 0.8, a: 0.002, d: big ? 1.3 : 0.95, v: big ? 0.7 : 0.6, rev: 0.3, pan });
      noise(G, t, { f: 900, f2: 300, q: 0.8, a: 0.002, d: big ? 0.5 : 0.35, v: big ? 0.45 : 0.38, pan });
      for (let i = 0; i < (big ? 12 : 8); i++) noise(G, t + rnd(0.02, 0.5), { ft: 'highpass', f: rnd(1500, 4000), a: 0.001, d: rnd(0.015, 0.04), v: rnd(0.04, 0.1), pan: pan + rnd(-0.3, 0.3) });
      for (let i = 0; i < (big ? 6 : 4); i++) bell(G, t + rnd(0.05, 0.45), { f: rnd(1700, 3600), ratio: rnd(1.6, 2.9), index: 1.2, d: rnd(0.2, 0.45), v: rnd(0.02, 0.04), pan: pan + rnd(-0.4, 0.4) });
      if (p.penalty) tone(G, t + 0.05, { type: 'sawtooth', f: 440, f2: 110, glide: 0.5, a: 0.01, d: 0.55, v: 0.04, lp: 1800 });
    },
    answerOK(G, t, p) {
      const n = Math.max(1, Math.min(5, p.n || 1));
      for (let i = 0; i < n; i++) tone(G, t + i * 0.05, { type: 'triangle', f: mtof(76 + i * 3), a: 0.002, d: 0.08, v: 0.11, echo: 0.2, pan: p.pan });
      bell(G, t + n * 0.05 + 0.02, { f: 1568, ratio: 2, index: 0.8, d: 0.45, v: 0.08, rev: 0.25, pan: p.pan });
    },
    answerNG(G, t, p) {
      const steps = [];
      for (let i = 1; i < 15; i++) steps.push([i * 0.03, rnd(180, 1300)]);
      tone(G, t, { type: 'square', f: rnd(300, 900), steps, a: 0.003, hold: 0.3, d: 0.15, v: 0.05, lp: 2600, pan: p.pan });
      tone(G, t, { type: 'sawtooth', f: 98, a: 0.01, hold: 0.25, d: 0.3, v: 0.08, lp: 700, pan: p.pan });
      noise(G, t, { f: 900, q: 3, a: 0.01, d: 0.35, v: 0.07, pan: p.pan });
    },
    tH(G, t, p) {
      tone(G, t, { type: 'square', f: 988, a: 0.002, d: 0.07, v: 0.1, lp: 4500, pan: p.pan });
      tone(G, t + 0.07, { type: 'square', f: 1319, a: 0.002, d: 0.45, v: 0.1, lp: 4500, pan: p.pan });
      [1047, 1319, 1568, 2093].forEach((f, i) => bell(G, t + 0.2 + i * 0.06, { f, ratio: 2, index: 0.7, d: 0.7, v: 0.08, echo: 0.3, rev: 0.3, pan: p.pan }));
      noise(G, t + 0.15, { ft: 'highpass', f: 8000, a: 0.1, d: 0.9, v: 0.05, pan: p.pan });
    },
    tN(G, t, p) {
      tone(G, t, { f: 1047, a: 0.002, d: 0.3, v: 0.09, echo: 0.35, pan: p.pan });
      tone(G, t + 0.16, { f: 1175, a: 0.002, d: 0.35, v: 0.08, echo: 0.35, pan: p.pan });
    },
    tX(G, t, p) {
      tone(G, t, { f: 220, f2: 110, a: 0.002, d: 0.2, v: 0.13, pan: p.pan });
      noise(G, t, { ft: 'lowpass', f: 700, a: 0.001, d: 0.08, v: 0.06, pan: p.pan });
    },
    victory(G, t) {
      [72, 76, 79, 84].forEach((m, i) => tone(G, t + i * 0.1, { type: 'square', f: mtof(m), a: 0.003, d: 0.16, v: 0.05, lp: 3400 }));

      bell(G, s, { f: mtof(96), ratio: 2, index: 0.6, d: 1.5, v: 0.05, rev: 0.4, echo: 0.3 });

    defeat(G, t) {
      [69, 68, 67, 66].forEach((m, i) => tone(G, t + i * 0.22, { type: 'triangle', f: mtof(m), a: 0.005, d: 0.26, v: 0.09 }));
      const s = t + 0.92;
      for (const m of [50, 53, 57]) tone(G, s, { type: 'sawtooth', uni: 2, spread: 10, f: mtof(m), a: 0.05, hold: 0.5, d: 1.4, v: 0.035, lp: 900, rev: 0.3 });
      tone(G, s, { f: mtof(38), a: 0.05, hold: 0.4, d: 1.4, v: 0.16 });

    draw(G, t) {
      for (const m of [67, 72, 74]) tone(G, t, { type: 'triangle', f: mtof(m), a: 0.01, hold: 0.2, d: 0.4, v: 0.05 });
      for (const m of [69, 74, 76]) tone(G, t + 0.45, { type: 'triangle', f: mtof(m), a: 0.01, hold: 0.3, d: 1.0, v: 0.05, rev: 0.3 });

    // ---- 大会 ----
    tourStart(G, t) {
      noise(G, t, { f: 200, f2: 6000, q: 1.2, a: 0.7, d: 0.15, v: 0.1 });
      [62, 69, 74].forEach((m, i) => kick(G, t + 0.75 + i * 0.16, 0.38));
      const s = t + 1.2;
      for (const m of [62, 66, 69, 74, 78]) tone(G, s, { type: 'sawtooth', uni: 2, spread: 14, f: mtof(m), a: 0.01, hold: 0.25, d: 1.1, v: 0.032, lp: 3600, lp2: 700, lpT: 1.2, rev: 0.3 });
      bell(G, s, { f: mtof(90), ratio: 2, index: 0.7, d: 1.4, v: 0.05, rev: 0.4, echo: 0.3 });
      kick(G, s, 0.5);
    },
    coin(G, t) {
      bell(G, t, { f: 1976, ratio: 1.5, index: 0.4, d: 0.25, v: 0.06 });
      bell(G, t + 0.07, { f: 2637, ratio: 1.5, index: 0.4, d: 0.45, v: 0.06, echo: 0.2 });
    },
    rankUp(G, t) {
      [76, 79, 83, 88].forEach((m, i) => tone(G, t + i * 0.06, { type: 'triangle', f: mtof(m), a: 0.002, d: 0.14, v: 0.07 }));
      bell(G, t + 0.26, { f: mtof(95), ratio: 2, index: 0.5, d: 0.7, v: 0.04, echo: 0.25 });
    },
    qualify(G, t) {
      [72, 76, 79, 84, 88].forEach((m, i) => tone(G, t + i * 0.08, { type: 'square', f: mtof(m), a: 0.003, d: 0.15, v: 0.045, lp: 3600 }));
      const s = t + 0.46;
      for (const m of [72, 76, 79, 84]) tone(G, s, { type: 'sawtooth', uni: 2, spread: 12, f: mtof(m), a: 0.02, hold: 0.45, d: 1.2, v: 0.032, lp: 2800, lp2: 900, lpT: 1.4, rev: 0.3 });
      bell(G, s, { f: mtof(100), ratio: 2, index: 0.6, d: 1.4, v: 0.05, rev: 0.4, echo: 0.3 });
      kick(G, s, 0.5);
    },
    eliminated(G, t) {
      [67, 66, 64, 62].forEach((m, i) => tone(G, t + i * 0.2, { type: 'triangle', f: mtof(m), a: 0.005, d: 0.24, v: 0.08 }));
      const s = t + 0.85;
      for (const m of [50, 55, 58]) tone(G, s, { type: 'sawtooth', uni: 2, spread: 10, f: mtof(m), a: 0.06, hold: 0.4, d: 1.3, v: 0.03, lp: 1000, rev: 0.3 });
    },
    champion(G, t) {
      [67, 72, 76, 79, 84].forEach((m, i) => tone(G, t + i * 0.09, { type: 'square', f: mtof(m), a: 0.003, d: 0.16, v: 0.05, lp: 3800 }));
      const s = t + 0.52;
      for (const m of [60, 67, 72, 76, 79, 84]) tone(G, s, { type: 'sawtooth', uni: 2, spread: 12, f: mtof(m), a: 0.02, hold: 0.7, d: 1.6, v: 0.03, lp: 3000, lp2: 1000, lpT: 1.8, rev: 0.35 });
      [0, 0.18, 0.36].forEach((d, i) => bell(G, s + d, { f: mtof(96 + i * 4), ratio: 2, index: 0.6, d: 1.4, v: 0.05, rev: 0.4, echo: 0.3 }));
      kick(G, s, 0.55); kick(G, s + 0.36, 0.4);

    // ---- アイテム ----
    'i-cube'(G, t, p) {
      [523, 784, 1175].forEach((f, i) => bell(G, t + i * 0.08, { f, ratio: 1, index: 0.3, d: 0.6, v: 0.05, echo: 0.25, pan: p.pan }));
      tone(G, t, { type: 'sawtooth', uni: 2, spread: 8, f: 110, a: 0.25, hold: 0.5, d: 0.4, v: 0.04, lp: 500, pan: p.pan });
      noise(G, t, { f: 500, f2: 3200, q: 2, a: 0.4, d: 0.35, v: 0.04, pan: p.pan });
    },
    'i-line'(G, t, p) {
      noise(G, t, { f: 400, f2: 5000, glide: 0.9, q: 6, a: 0.05, hold: 0.7, d: 0.2, v: 0.11, pan: p.pan });
      tone(G, t, { f: 300, f2: 2400, glide: 0.9, a: 0.05, hold: 0.7, d: 0.2, v: 0.025, pan: p.pan });
      for (let i = 0; i < 8; i++) tone(G, t + 0.05 + i * 0.1, { f: 3000, a: 0.001, d: 0.02, v: 0.03, pan: p.pan });
    },
    'i-target'(G, t, p) {
      [1760, 1976, 2349].forEach((f, i) => tone(G, t + i * 0.07, { f, a: 0.001, d: 0.045, v: 0.12, pan: p.pan }));
      noise(G, t, { f: 1500, f2: 4000, q: 1.5, a: 0.03, d: 0.18, v: 0.05, pan: p.pan });
    },
    'i-pair'(G, t, p) {
      tone(G, t, { f: 1568, a: 0.001, d: 0.05, v: 0.08, pan: p.pan });
      tone(G, t + 0.08, { f: 1760, a: 0.001, d: 0.05, v: 0.08, pan: p.pan });
      tone(G, t + 0.22, { type: 'sawtooth', f: 2400, f2: 300, glide: 0.25, a: 0.002, d: 0.28, v: 0.065, lp: 5000, pan: p.pan });
      tone(G, t + 0.22, { f: 1200, f2: 400, glide: 0.25, a: 0.002, d: 0.25, v: 0.05, pan: p.pan });
    },
    // ノードショット：上下左右へ走査する4つの短い音
    'i-node'(G, t, p) {
      [1047, 1319, 1175, 1568].forEach((f, i) => tone(G, t + i * 0.06, { type: 'triangle', f, a: 0.002, d: 0.09, v: 0.07, echo: 0.2, pan: p.pan }));
      tone(G, t + 0.28, { f: 1760, a: 0.002, d: 0.3, v: 0.05, rev: 0.25, pan: p.pan });
    },
    'i-warp'(G, t, p) {
      noise(G, t, { f: 300, f2: 6000, glide: 0.45, q: 1.6, a: 0.02, hold: 0.2, d: 0.25, v: 0.09, pan: p.pan });
      tone(G, t, { f: 1400, f2: 180, glide: 0.4, a: 0.01, d: 0.45, v: 0.07, pan: p.pan });
      tone(G, t + 0.5, { f: 180, f2: 1600, glide: 0.3, a: 0.01, d: 0.35, v: 0.06, pan: p.pan });
      bell(G, t + 0.6, { f: 2093, ratio: 2, index: 0.5, d: 0.4, v: 0.04, echo: 0.3, pan: p.pan });
      bell(G, t + 0.66, { f: 2637, ratio: 2, index: 0.5, d: 0.4, v: 0.035, echo: 0.3, pan: p.pan });
    },
    'i-stealth'(G, t, p) {
      [1175, 1480, 1760].forEach((f, i) => tone(G, t + i * 0.04, { f, f2: f * 0.7, glide: 0.9, a: 0.01, d: 1.0, v: 0.035, echo: 0.35, pan: p.pan }));
      noise(G, t, { ft: 'highpass', f: 5000, f2: 1500, glide: 0.8, a: 0.02, d: 0.9, v: 0.05, pan: p.pan });
      tone(G, t, { f: 147, a: 0.3, d: 0.7, v: 0.06, pan: p.pan });
    },
    // バズーカ：警報（v10の宣言の音）→ 発射 → 着弾。空きマスなら着弾だけで、分解の音はなし
    'i-bazooka'(G, t, p) {
      const pan = p.pan || 0;
      noise(G, t, { ft: 'lowpass', f: 1600, a: 0.001, d: 0.05, v: 0.22, pan });
      tone(G, t + 0.03, { type: 'square', f: 140, f2: 70, glide: 0.08, a: 0.001, d: 0.09, v: 0.12, lp: 900, pan });
      for (let i = 0; i < 2; i++) {
        const s0 = t + 0.12 + i * 0.22;
        tone(G, s0, { type: 'square', f: 880, a: 0.004, hold: 0.07, d: 0.03, v: 0.045, lp: 2600 });
        tone(G, s0 + 0.11, { type: 'square', f: 659, a: 0.004, hold: 0.07, d: 0.04, v: 0.045, lp: 2400 });
      }
      const s = t + 0.56;
      noise(G, s - 0.3, { f: 260, f2: 4200, glide: 0.3, q: 1.2, a: 0.2, d: 0.1, v: 0.12, pan });
      tone(G, s - 0.3, { type: 'sawtooth', f: 90, f2: 520, glide: 0.3, a: 0.22, d: 0.08, v: 0.04, lp: 1800, pan });
      if (p.hit) {
        SFX.destroy(G, s, { big: true, pan });
        kick(G, s, 0.5);
        const n = Math.max(2, Math.min(8, (p.n || 0) + 3));
        for (let i = 0; i < n; i++) bell(G, s + 0.12 + i * 0.05, { f: rnd(1700, 3200), ratio: 2.2, index: 1, d: 0.25, v: 0.03, pan: pan + rnd(-0.3, 0.3) });
      } else {
        noise(G, s, { ft: 'lowpass', f: 2600, f2: 300, a: 0.001, d: 0.35, v: 0.3, pan });
        tone(G, s, { f: 180, f2: 60, glide: 0.2, a: 0.001, d: 0.3, v: 0.3, pan });
      }
    },
    // 調べた結果：数（個体数・マス数・ブロック数）はその回数だけ「ピッ」と鳴らす
    readout(G, t, p) {
      const n = Math.max(1, Math.min(8, p.n || 1));
      for (let i = 0; i < n; i++) tone(G, t + i * 0.085, { type: 'square', f: 1568, a: 0.002, d: 0.045, v: 0.065, lp: 3200, pan: p.pan });
      tone(G, t + n * 0.085 + 0.03, { f: 2093, a: 0.002, d: 0.22, v: 0.08, rev: 0.2, pan: p.pan });
    },
    none(G, t, p) {
      tone(G, t, { type: 'triangle', f: 330, a: 0.002, d: 0.1, v: 0.09, pan: p.pan });
      tone(G, t + 0.1, { type: 'triangle', f: 247, a: 0.002, d: 0.16, v: 0.09, pan: p.pan });
    },
    found(G, t, p) {
      bell(G, t, { f: 1319, ratio: 2, index: 0.8, d: 0.5, v: 0.08, echo: 0.25, pan: p.pan });
      bell(G, t + 0.05, { f: 1760, ratio: 2, index: 0.8, d: 0.55, v: 0.07, echo: 0.25, pan: p.pan });
    },
    same(G, t, p) {
      tone(G, t, { f: 1047, a: 0.005, d: 0.5, v: 0.07, pan: p.pan });
      tone(G, t, { f: 1319, a: 0.005, d: 0.5, v: 0.06, pan: p.pan });
      bell(G, t + 0.03, { f: 2093, ratio: 2, index: 0.5, d: 0.5, v: 0.04, rev: 0.2, pan: p.pan });
    },
    notsame(G, t, p) {
      tone(G, t, { type: 'square', f: 523, a: 0.003, d: 0.3, v: 0.06, lp: 2000, pan: p.pan });
      tone(G, t, { type: 'square', f: 554, a: 0.003, d: 0.3, v: 0.06, lp: 2000, pan: p.pan });
      noise(G, t, { f: 3000, q: 2, a: 0.002, d: 0.15, v: 0.07, pan: p.pan });
    },
  };

  // ================= BGM =================
  // 待機中（タイトル・配置・ドラフト・結果）：Am9 → Fmaj9 → Dm9 → Esus4 → E の静かなループ
  const CALM = [
    { b: 45, pad: [57, 60, 64, 67, 71], arp: [69, 72, 76, 79, 83, 76] },
    null,
    { b: 41, pad: [53, 57, 60, 64, 67], arp: [65, 69, 72, 76, 79, 72] },
    null,
    { b: 38, pad: [50, 53, 57, 60, 64], arp: [62, 65, 69, 72, 76, 69] },
    null,
    { b: 40, pad: [52, 57, 59, 64], arp: [64, 69, 71, 76, 81, 71] },
    { b: 40, pad: [52, 56, 59, 64], arp: [64, 68, 71, 76, 80, 71] },
  ];
  // 対戦中：Dm の緊張感あるループ（終盤は打ち込みが増える）
  const BATTLE = [
    { b: 38, pad: [62, 65, 69, 72], arp: [74, 77, 81, 84] },
    { b: 38, pad: [62, 65, 69, 72], arp: [74, 77, 81, 86] },
    { b: 34, pad: [58, 62, 65, 69], arp: [70, 74, 77, 81] },
    { b: 36, pad: [60, 64, 67, 72], arp: [72, 76, 79, 84] },
    { b: 38, pad: [62, 65, 69, 72], arp: [74, 77, 81, 84] },
    { b: 38, pad: [62, 65, 69, 74], arp: [74, 77, 81, 86] },
    { b: 43, pad: [55, 58, 62, 65], arp: [67, 70, 74, 79] },
    { b: 45, pad: [57, 61, 64, 69], arp: [69, 73, 76, 81] },
  ];
  const on = (T, k) => !T.only || T.only === k;
  const TRACKS = {
    calm: {
      bpm: 84, fadeIn: 2.5, rev: 0.4,
      play(G, T, step, t, q) {
        const bar = Math.floor(step / 16) % 8, s = step % 16;
        const ch = CALM[bar] || CALM[bar - 1], D = T.out;
        if (s === 0 && CALM[bar] && on(T, 'pad')) pad(G, t, ch.pad, (CALM[bar + 1] === null ? 32 : 16) * q, 0.016, 1100, D);
        if (s === 0 && on(T, 'bass')) tone(G, t, { type: 'triangle', f: mtof(ch.b), a: 0.06, hold: 10 * q, d: 1.0, v: 0.09, dest: D });
        if (s === 8 && bar % 2 === 1 && on(T, 'bass')) tone(G, t, { type: 'triangle', f: mtof(ch.b + 7), a: 0.04, hold: 4 * q, d: 0.6, v: 0.05, dest: D });
        if (s % 2 === 0 && on(T, 'arp')) {
          const i = [0, 2, 4, 1, 3, 5, 2, 4][s / 2];
          tone(G, t, { type: 'triangle', f: mtof(ch.arp[i]), a: 0.004, d: 0.5, v: s % 8 === 0 ? 0.09 : 0.064, dest: D, echo: 0.45, echoTo: T.echo });
        }
        if ((s === 4 || s === 12) && on(T, 'drums')) noise(G, t, { ft: 'highpass', f: 7000, a: 0.002, d: 0.05, v: 0.08, dest: D });
        if (s === 14 && bar % 4 === 3 && on(T, 'bell')) bell(G, t, { f: mtof(ch.arp[4] + 12), ratio: 2, index: 0.4, d: 1.4, v: 0.04, dest: D, echo: 0.6, echoTo: T.echo });
      },
    },
    battle: {
      bpm: 120, fadeIn: 0.5, rev: 0.2,
      play(G, T, step, t, q) {
        const bar = Math.floor(step / 16) % 8, s = step % 16, ch = BATTLE[bar], hot = T.level >= 2, D = T.out;
        if (s === 0 && on(T, 'pad')) pad(G, t, ch.pad, 16 * q, hot ? 0.012 : 0.01, hot ? 1600 : 950, D);
        if ((hot || s % 2 === 0) && on(T, 'bass')) {
          const up = s % 4 === 2 ? 12 : 0;
          tone(G, t, { type: 'sawtooth', f: mtof(ch.b + up), a: 0.003, d: q * 1.7, v: s % 4 === 0 ? 0.2 : 0.15, lp: 1500, lp2: 220, lpT: q * 1.5, q: 5, dest: D });
        }
        if (on(T, 'drums')) {
          if (s === 0 || s === 8 || (hot && (s === 4 || s === 12)) || (!hot && s === 11 && bar % 2 === 1)) kick(G, t, 0.3, D);
          if (hot && (s === 4 || s === 12)) snare(G, t, 0.07, D);
          if (s % 4 === 2) hat(G, t, 0.045, s === 14 && bar % 2 === 1, D);
          else if (hot && s % 2 === 1) hat(G, t, 0.02, false, D);
        }
        if ((bar >= 4 || hot) && s % 2 === 0 && on(T, 'arp')) {
          const i = [0, 1, 2, 3, 2, 1, 0, 2][s / 2];
          tone(G, t, { type: 'square', f: mtof(ch.arp[i]), a: 0.003, d: q * 1.8, v: 0.045, lp: 2600, dest: D, echo: 0.5, echoTo: T.echo });
        }
        if (s === 13 && bar % 2 === 0 && on(T, 'bell')) bell(G, t, { f: mtof(ch.arp[3] + 12), ratio: 3.01, index: 0.7, d: 0.35, v: 0.035, dest: D, echo: 0.6, echoTo: T.echo });
      },
    },
  };
  // 曲ごとの出口（音量フェード用）とこだま
  function makeTrack(G, name, level, delay) {
    const ctx = G.ctx, def = TRACKS[name], now = ctx.currentTime;
    const T = { name, def, level: level || 1, step: 0, next: now + (delay || 0) + 0.06 };
    T.out = ctx.createGain();
    T.out.gain.setValueAtTime(0.0001, now);
    T.out.gain.setValueAtTime(0.0001, T.next);
    T.out.gain.exponentialRampToValueAtTime(1, T.next + def.fadeIn);
    T.out.connect(G.bgm);
    T.out.connect(gainNode(ctx, def.rev, G.rev));
    T.echo = ctx.createDelay(2);
    T.echo.delayTime.value = (60 / def.bpm) * 0.75;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    T.fb = gainNode(ctx, 0.36, T.echo);
    T.echo.connect(lp); lp.connect(T.fb); lp.connect(gainNode(ctx, 0.55, T.out));
    return T;
  }

  // ================= 状態 =================
  let live = null, mode = 'all', unlocked = false;
  let track = null, timer = 0, wantName = null, wantLevel = 1, holdTimer = 0;

  function ensure() {
    if (live || !AC) return live;
    try { live = makeGraph(new AC({ latencyHint: 'interactive' })); }
    catch (e) { try { live = makeGraph(new AC()); } catch (e2) { live = null; } }
    return live;
  }
  // 最初の操作で音を出せるようにする（スマホでは無音を一度鳴らす必要がある）
  function unlock() {
    if (mode === 'off' || !ensure()) return;
    const ctx = live.ctx;
    if (ctx.state === 'suspended' && !document.hidden) ctx.resume().catch(() => {});
    if (!unlocked) {
      unlocked = true;
      try { const b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0); } catch (e) { /* なくても動く */ }
      apply();
    }
  }
  // 少し先までの音符を予約しておく（重い処理で一瞬止まっても途切れにくい）
  function pump() {
    if (!live || !track) return;
    const ctx = live.ctx;
    if (ctx.state !== 'running') return;
    const T = track, q = 60 / T.def.bpm / 4, horizon = ctx.currentTime + 0.5;
    if (T.next < ctx.currentTime - 0.1) {
      const skip = Math.ceil((ctx.currentTime - T.next) / q);
      T.step += skip; T.next += skip * q;
    }
    let guard = 0;
    while (T.next < horizon && guard++ < 64) {
      try { T.def.play(live, T, T.step, T.next, q); } catch (e) { /* 一音失敗しても止めない */ }
      T.step++; T.next += q;
    }
  }
  function stopTrack(fade) {
    if (!track || !live) return;
    const T = track, f = fade || 0.8, now = live.ctx.currentTime, p = T.out.gain;
    track = null;
    if (timer) { clearInterval(timer); timer = 0; }
    try {
      p.cancelScheduledValues(now);
      p.setValueAtTime(Math.max(0.0001, Math.min(1, p.value)), now);
      p.exponentialRampToValueAtTime(0.0001, now + f);
    } catch (e) { /* 止められなくても次の曲は鳴らせる */ }
    setTimeout(() => { try { T.fb.disconnect(); T.out.disconnect(); } catch (e) { /* 片付け */ } }, (f + 3) * 1000);
  }
  function apply() {
    if (holdTimer) return;   // 勝敗のジングルが終わるまで待つ
    if (!live || !unlocked || mode !== 'all' || !wantName) { if (track) stopTrack(0.8); return; }
    if (track && track.name === wantName) { track.level = wantLevel; return; }
    const battle = wantName === 'battle';
    if (track) stopTrack(battle ? 0.5 : 1.2);
    track = makeTrack(live, wantName, wantLevel, battle ? 0.7 : 0.2);
    if (!timer) timer = setInterval(pump, 50);
    pump();
  }

  // ================= 外から使う =================
  function setMode(m, byUser) {
    mode = m === 'sfx' || m === 'off' ? m : 'all';
    if (mode === 'off') { if (track) stopTrack(0.4); if (live) live.ctx.suspend().catch(() => {}); return; }
    if (byUser) unlock();
    apply();
  }
  // 場面：title / result（静かな曲）、battle（対戦曲。level 2 で終盤の激しい版）
  function scene(name, level) {
    wantName = name === 'battle' ? 'battle' : (name === 'title' || name === 'result') ? 'calm' : null;
    wantLevel = level || 1;
    apply();
  }
  function sfx(name, delay, params) {
    if (mode === 'off' || !live || !unlocked || document.hidden) return;
    const f = SFX[name];
    if (!f) return;
    try { f(live, live.ctx.currentTime + 0.01 + (delay || 0), params || {}); } catch (e) { /* 音が出なくてもゲームは続ける */ }
  }
  // 決着：対戦曲を止めてジングル、少しして静かな曲へ
  function result(kind) {
    wantName = 'calm'; wantLevel = 1;
    if (track) stopTrack(0.3);
    sfx(kind === 'win' ? 'victory' : kind === 'lose' ? 'defeat' : 'draw');
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => { holdTimer = 0; apply(); }, 3000);
  }

  for (const t of ['pointerdown', 'keydown', 'touchend', 'click']) document.addEventListener(t, unlock, true);
  document.addEventListener('visibilitychange', () => {
    if (!live) return;
    if (document.hidden) live.ctx.suspend().catch(() => {});
    else if (unlocked && mode !== 'off') live.ctx.resume().catch(() => {});
  });

  // 確認用：音を画面に出さずに合成して、大きさを測る
  async function offline(kind, name, sec, params) {
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const sr = 44100, ctx = new OAC(2, Math.ceil(sr * sec), sr);
    // hp を指定すると、ノートPCのスピーカーのように低音を削ってから測る
    let outNode = null;
    if (params && params.hp) {
      const a = ctx.createBiquadFilter(), b2 = ctx.createBiquadFilter();
      a.type = b2.type = 'highpass'; a.frequency.value = b2.frequency.value = params.hp; a.Q.value = b2.Q.value = 0.7;
      a.connect(b2); b2.connect(ctx.destination); outNode = a;
    }
    const G = makeGraph(ctx, outNode);
    if (kind === 'sfx') SFX[name](G, 0.02, params || {});
    else {
      const T = makeTrack(G, name, (params && params.level) || 1, 0);
      T.only = params && params.only;
      const q = 60 / T.def.bpm / 4;
      for (let st = 0; T.next < sec; st++) { T.def.play(G, T, st, T.next, q); T.next += q; }
    }
    const buf = await ctx.startRendering();
    const L = buf.getChannelData(0), R = buf.getChannelData(1), win = Math.floor(sr * 0.05);
    let peak = 0, peakAt = 0, sum = 0, acc = 0, maxWin = 0, bad = 0, sumL = 0, sumR = 0;
    for (let i = 0; i < L.length; i++) {
      const a = L[i], b = R[i];
      if (!isFinite(a) || !isFinite(b)) { bad++; continue; }
      const m = Math.max(Math.abs(a), Math.abs(b));
      if (m > peak) { peak = m; peakAt = i / sr; }
      const e = (a * a + b * b) / 2;
      sum += e; acc += e; sumL += a * a; sumR += b * b;
      if ((i + 1) % win === 0) { maxWin = Math.max(maxWin, Math.sqrt(acc / win)); acc = 0; }
    }
    // 1サンプルだけ飛び出した点（プチッという雑音）を数える
    let spikes = 0;
    for (const X of [L, R]) {
      for (let i = 16; i < X.length - 16; i++) {
        const a = Math.abs(X[i]);
        if (a < 0.05) continue;
        let nb = 0;
        for (let j = 1; j <= 16; j++) nb = Math.max(nb, Math.abs(X[i - j]), Math.abs(X[i + j]));
        if (a > nb * 2.5) spikes++;
      }
    }
    return { peak, peakAt, rms: Math.sqrt(sum / L.length), loud: maxWin, bad, spikes, balance: sumL + sumR ? (sumR - sumL) / (sumR + sumL) : 0 };
  }

  return {
    setMode, scene, sfx, result,
    current: () => (track ? track.name : null),
    get level() { return track ? track.level : 0; },
    get mode() { return mode; },
    get ready() { return unlocked && !!live; },
    _offline: offline, _names: () => Object.keys(SFX), _dbg: { makeGraph, tone, noise, bell, pad, makeTrack, TRACKS },
  };
})();

(function () {

  const ATK_ITEMS = ['cube', 'line', 'number', 'shape', 'pair', 'node', 'bazooka'];
  const DEF_ITEMS = ['warp', 'stealth'];
  const isDef = (k) => DEF_ITEMS.indexOf(k) >= 0;

  // ---------------- 形の配置補助 ----------------
  function anchorFor(key, t, c, N) {

    let best = o.cells[0], bd = Infinity;
    for (const [rr, cc] of o.cells) { const d = (rr - cy) ** 2 + (cc - cx) ** 2; if (d < bd) { bd = d; best = [rr, cc]; } }
    let r0 = r - best[0], c0 = col - best[1];
    r0 = Math.max(0, Math.min(N - o.h, r0));
    c0 = Math.max(0, Math.min(N - o.w, c0));
    return { r0, c0 };

    const g = G(), N = g.N;

    const warpedAfter = (t) => kb.warps.some((w) => w.t > t);
    const relocatedAfter = (t) => kb.warps.some((w) => w.t > t) || kb.adds.some((a) => a.t > t);
    // 個数の調査（サーチキューブ・サーチライン）は、アイテム欄の下にタグで並べる
    const tags = [];
    const latest = new Map();
    for (const q of kb.counts) latest.set(q.kind === 'line' ? 'line:' + q.line + q.index : q.kind + ':' + q.value, q);
    for (const q of latest.values()) {
      if (q.kind === 'line') {
        // サーチライン＝その列・行にかかっている個体の数と、そのマスの数（v12.12）。撃破されるたびに、その分を減らす。

        const stale = relocatedAfter(q.t);
        const split = (kb.splits || []).some((sp) => sp.t > q.t);
        let n = q.n, k = q.k;
        if (!stale) {
          const lm = E.lineMask(q.line, q.index, N);
          for (const d of kb.deads) {
            if (d.t <= q.t || !(d.mask & lm)) continue;
            n -= E.popcount(d.mask & lm);
            if (k != null && !(split && d.frag)) k--;
          }
        }
        if (k != null) k = Math.max(0, k);
        const label = E.lineLabel(q.line, q.index);
        const kApx = k != null && split && !stale;
        tags.push({ key: 'line', label, pre: '残り', n, unit: 'マス', k, kApx, turn: q.turn, stale,
          tip: `サーチライン（T${pad2(q.turn)}）：${label}にかかっている（撃破されていない）個体の数 / そのマスの数。◎・○のマスも数に入ります。${stale ? 'その後ワープがあったため、今は変わっているかもしれません' : kApx ? '撃破されると自動で減ります。その後バズーカで分解した個体があり、破片は1つずつ数えるため、個体の数は目安です（マスの数は正しい）' : '撃破されると自動で減ります'}` });
        continue;
      }
      if (q.kind !== 'size' && q.kind !== 'cat') continue;
      // 調べた後に撃破された個体（分解の破片を除く）の分だけ減らす。
      // 調べた後にバズーカで分解された個体があると、その個体が数に入っていたかは分からない（分解された個体の形・マス数は伏せられる）ので、目安として薄く出す
      const split = (kb.splits || []).some((sp) => sp.t > q.t);
      let n = q.n;
      // 1マス（バズーカの破片）を調べたときは、破片の撃破で減らす
      for (const d of kb.deads) if (d.t > q.t && (!d.frag || (q.kind === 'size' && q.value === 1)) && !d.isAdd && (q.kind === 'size' ? d.size === q.value : d.cat === q.value)) n--;
      n = Math.max(0, n);
      const label = q.kind === 'size' ? q.value + 'マス' : q.value;
      tags.push({ key: 'cube', label, pre: '残り', n, unit: '体', turn: q.turn, stale: split,
        tip: `サーチキューブ（T${pad2(q.turn)}）：残っている（撃破されていない）個体の数。撃破で自動更新。${split ? 'その後バズーカで分解した個体があり、その個体が数に入っていたかは分からないため、目安です' : ''}` });
    }
    const cells = {};
    const put = (c, k, val) => { if (!view.dead[c]) cells[c] = Object.assign(cells[c] || {}, { [k]: val }); };
    // マスの調査（サーチシェイプ・サーチサイズ）は時刻順に、新しい結果で上書きする。
    // 空きマスだったとき（NoData）は、ディスタンスショットの NoData と同じ表示にする
    const facts = [];
    for (const o of kb.occs) if (o.src === 'shape' || o.src === 'number') facts.push({ c: o.c, t: o.t, turn: o.turn, src: o.src, v: o.src === 'shape' ? o.cat : o.size, stale: warpedAfter(o.t) });
    for (const e of kb.empties) if (e.src === 'shape' || e.src === 'number' || e.src === 'node' || e.src === 'bazooka') facts.push({ c: e.c, t: e.t, turn: e.turn, src: e.src, nd: true, stale: relocatedAfter(e.t) });
    // バズーカで分解した：撃ち込んだマスがヒット済みでなければ、そこには1マスキューブ（C1）が残る
    for (const sp of (kb.splits || [])) {
      if (sp.killed.indexOf(sp.c) >= 0) continue;
      const gone = kb.warps.some((w) => w.t > sp.t && (w.oldMask & bit(sp.c)));
      facts.push({ c: sp.c, t: sp.t, turn: sp.turn, src: 'shape', v: 'キューブ', stale: gone });
      facts.push({ c: sp.c, t: sp.t, turn: sp.turn, src: 'number', v: 1, stale: gone });
    }
    facts.sort((a, b) => a.t - b.t);
    for (const f of facts) {
      if (f.nd) { put(f.c, 'nd', { t: f.t, turn: f.turn, src: f.src, stale: f.stale }); put(f.c, 'shape', null); put(f.c, 'size', null); continue; }
      put(f.c, f.src === 'shape' ? 'shape' : 'size', { v: f.v, stale: f.stale, turn: f.turn });
      put(f.c, 'nd', null);
    }
    // ノードショット：そのマスの最新の答え（つながりの数）。その個体がワープするか、バズーカで分解されると変わりうる（薄く表示）
    const leftAfter = (c, t) => kb.warps.some((w) => w.t > t && (w.oldMask & bit(c)));
    const splitAfter = (t) => (kb.splits || []).some((sp) => sp.t > t);
    for (const D of (kb.nodes || [])) {
      if (D.k == null) continue;
      put(D.c, 'node', { v: D.k, t: D.t, turn: D.turn, left: leftAfter(D.c, D.t), stale: warpedAfter(D.t) || splitAfter(D.t) });
    }
    const pairs = [];
    const pairLatest = new Map();
    for (const p of kb.pairs) pairLatest.set(Math.min(p.a, p.b) + ':' + Math.max(p.a, p.b), p);
    for (const p of pairLatest.values()) {
      if (view.dead[p.a] || view.dead[p.b]) continue;
      pairs.push({ a: p.a, b: p.b, same: p.same, stale: warpedAfter(p.t), turn: p.turn });
    }
    return { tags, cells, pairs, observer, fieldOwner };
  }

  function intelTagsHTML(intel, mine) {
    if (!intel || !intel.tags.length) return '';
    return `<div class="intel ${mine ? 'mine' : 'enemy'}" aria-label="調査の記録">` + intel.tags.map((t) =>
      `<span class="itag${t.stale ? ' stale' : ''}" data-tip="${esc(t.tip)}">${ICON[t.key]}${esc(t.label)}${t.pre ? `<i>${esc(t.pre)}</i>` : ''}${t.k != null ? `<b class="${t.kApx ? 'apx' : ''}">${t.k}</b>個体<em class="sl">/</em>` : ''}<b>${t.n}</b>${t.unit}<small>T${pad2(t.turn)}</small></span>`
    ).join('') + '</div>';
  }
  // マスの左上に「形状＋マス数」（例：L4、C3、#2）。空きマスだったときは、マスの中央に NoData を出す（cellMarkHTML）
  function cellTagHTML(intel, c) {
    if (!intel || !intel.cells[c]) return '';
    const a = intel.cells[c];
    if (!a.shape && !a.size) return '';
    let s = '';
    if (a.shape) s += SHAPE_ABBR[a.shape.v] || a.shape.v;
    if (a.size) s += (a.shape ? '' : '#') + a.size.v;
    const stale = (a.shape && a.shape.stale) || (a.size && a.size.stale);
    const title = [a.shape ? `サーチシェイプ：${a.shape.v}` : '', a.size ? `サーチサイズ：${a.size.v}マス` : ''].filter(Boolean).join(' / ');
    return `<span class="ctag${stale ? ' stale' : ''}" title="${esc(title)}">${esc(s)}</span>`;
  }
  // ノードショット・NoData の表示。NoData（サーチサイズ・サーチシェイプ・ノードショット・バズーカで空きマスだった）は
  // マスの中央に出す。ノードショットの数字は、まだ印のないマスなら中央のひし形、ヒットしたマスなら左下の小さな札
  const NODATA_HTML = (stale) => `<span class="mkw nodata${stale ? ' stale' : ''}"><b>NoData</b></span>`;
  const ND_NAME = { number: 'サーチサイズ', shape: 'サーチシェイプ', node: 'ノードショット', bazooka: 'バズーカ' };
  const ndAt = (intel, c) => (intel && intel.cells[c] && intel.cells[c].nd) || null;
  const nodeAt = (intel, c) => { const a = intel && intel.cells[c]; return a && a.node && !a.node.left ? a.node : null; };
  function cellMarkHTML(m, intel, c) {
    const nd = ndAt(intel, c), nn = nodeAt(intel, c);
    // 新しいほうの調査結果を使う
    const info = nd && (!nn || nd.t > nn.t) ? { nd: true, t: nd.t, stale: nd.stale } : nn ? { v: nn.v, t: nn.t, stale: nn.stale } : null;
    if (!info) return markHTML(m);
    if (m && m.r === 'x' && (!m.callable || m.t > info.t)) return markHTML(m);
    if (info.nd) return m ? markHTML(m) : NODATA_HTML(info.stale);
    if (m && m.r !== 'x') return markHTML(m) + `<span class="nbadge${info.stale ? ' stale' : ''}" aria-hidden="true">${nodeMark(info.v)}</span>`;
    return `<span class="mkw ink-n${info.stale ? ' stale' : ''}">${nodeMark(info.v)}</span>`;
  }
  function probeLabel(intel, c, m) {
    const nd = ndAt(intel, c), nn = nodeAt(intel, c);
    if (nd && (!nn || nd.t > nn.t)) return m && m.r === 'x' ? '' : ` ${ND_NAME[nd.src] || ''} NoData`;
    if (nn) return m && m.r === 'x' && (!m.callable || m.t > nn.t) ? '' : ` つながり${nn.v}`;
    return '';
  }
  function pairsSVG(intel, N) {
    if (!intel || !intel.pairs.length) return '';
    const pt = (c) => [(c % N) + 0.5, Math.floor(c / N) + 0.5];
    const body = intel.pairs.map((p) => {
      const [x1, y1] = pt(p.a), [x2, y2] = pt(p.b);
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      // ＝・≠ は文字ではなく線で描く（文字だとフォントによって円の中心からずれる）
      const f = (n) => +n.toFixed(3);
      const bar = (dy) => `M${f(mx - 0.075)} ${f(my + dy)}H${f(mx + 0.075)}`;
      const sym = bar(-0.036) + bar(0.036) + (p.same ? '' : `M${f(mx + 0.045)} ${f(my - 0.095)}L${f(mx - 0.045)} ${f(my + 0.095)}`);
      return `<g class="${p.same ? 'same' : 'diff'}${p.stale ? ' stale' : ''}"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><circle cx="${mx}" cy="${my}" r="0.17"/><path class="sym" d="${sym}"/></g>`;
    }).join('');
    return `<svg class="pairs" viewBox="0 0 ${N} ${N}" preserveAspectRatio="none" aria-hidden="true">${body}</svg>`;
  }

  // ---------------- 盤面 ----------------
  // 個体の色：配置した個体の並び（id順）で決める。バズーカの破片は元の個体の色のまま
  function colorIndex(P, piece) {
    if (piece.isAdd) return 0;
    const id = piece.frag ? piece.fromId : piece.id;
    const ids = P.pieces.filter((p) => !p.isAdd && !p.frag).map((p) => p.id).concat((P.splitPieces || []).map((p) => p.id)).sort((a, b) => a - b);
    return (Math.max(0, ids.indexOf(id)) % 8) + 1;
  }
  // 個体の柄：色と同じ番号（置いた順）で、色ごとに違う素材の質感（御影石・大理石・木目など）をマスに薄く重ねる。
  //  色の見え方に特性がある人でも、質感でどの個体かを見分けられるようにするため（色だけに頼らない）。
  //  絵は template.html の .pm1〜.pm8（tools/tile_patterns.py で作る）。見分けにくい色どうし（青と紫など）が、違う系統の質感になるように選んである。
  //  c（マスの番号）から、マスごとの向き（v0〜v3）と見える位置（--ox・--oy）を決める。本物のタイルのように1枚ずつ表情を変えるため
  //  （マスの番号だけで決めるので、描き直しても変わらない）。アッド（0番）は1マスなので柄を付けない
  function patHTML(ci, c) {
    if (!ci) return '';
    const h = Math.imul((c | 0) + 1, 0x9E3779B1) >>> 0;   // マスの番号を、ばらけた数に変える
    const v = h >>> 30, ox = ((h >>> 8) & 255) / 256, oy = (h & 255) / 256;
    return `<i class="pm pm${ci} v${v}" style="--ox:${ox.toFixed(3)};--oy:${oy.toFixed(3)}" aria-hidden="true"></i>`;
  }
  function edgeClasses(mask, c, N) {
    const r = Math.floor(c / N), col = c % N;
    let s = '';
    if (r === 0 || !(mask & bit(c - N))) s += ' et';
    if (r === N - 1 || !(mask & bit(c + N))) s += ' eb';
    if (col === 0 || !(mask & bit(c - 1))) s += ' el';
    if (col === N - 1 || !(mask & bit(c + 1))) s += ' er';
    return s;
  }
  // bo: { pickLine, overlay }
  function boardFrame(N, kind, cellsHTML, extraCls, bo) {
    bo = bo || {};
    let cols = '', rows = '';
    for (let i = 0; i < N; i++) {
      if (bo.pickLine) {
        cols += `<span><button type="button" class="axbtn" data-act="pick-line" data-line="col" data-index="${i}" aria-label="${COLS[i]}列を調べる">${COLS[i]}</button></span>`;
        rows += `<span><button type="button" class="axbtn" data-act="pick-line" data-line="row" data-index="${i}" aria-label="${i + 1}行を調べる">${i + 1}</button></span>`;
      } else {
        cols += `<span>${COLS[i]}</span>`;
        rows += `<span>${i + 1}</span>`;
      }
    }
    return `<div class="board ${extraCls || ''}${bo.pickLine ? ' picking' : ''}" style="--n:${N}" data-board="${kind}">
      <div class="ax ax-c">${cols}</div>
      <div class="ax ax-r">${rows}</div>
      <div class="cells" role="grid">${cellsHTML}${bo.overlay || ''}</div>
    </div>`;
  }
  function cellBase(c, N) {
    let cls = 'cell';
    if (c % N === N - 1) cls += ' lc';
    if (Math.floor(c / N) === N - 1) cls += ' lr';
    return cls;
  }
  // ×：再コールできるものは薄く、ワープで空いたマス（移動前の位置）は W を添える
  function markHTML(m) {
    if (!m) return '';
    if (m.r === 'x') {
      if (m.callable) return `<span class="mkw ink-x stale">${MARK.x}</span>`;
      return `<span class="mkw ink-x">${MARK.x}</span>${m.warp ? '<span class="wtag" aria-hidden="true">W</span>' : ''}`;
    }
    let s = `<span class="mkw ink-${m.r}">${MARK[m.r]}</span>`;
    if (m.r === 'oo' && m.num != null) s += `<span class="num">${m.num}</span>`;
    return s;
  }

  // 自分フィールド
  // opts.kind：盤の種類（'own'＝自分フィールド。リプレイの右の盤は 'pred' として描き、演出の位置合わせに使う）、opts.overlay：盤に重ねるもの
  function ownBoard(pi, opts) {
    opts = opts || {};
    const kind = opts.kind || 'own';
    const g = G(), N = g.N, P = g.players[pi], foe = g.players[1 - pi];
    const fv = foe.view;
    const inSetup = g.phase === 'setup';
    const intel = opts.intel;
    let html = '';
    for (let c = 0; c < g.NN; c++) {
      let cls = cellBase(c, N);
      let inner = '', style = '';
      const p = g.pieceAt(pi, c, true);
      const m = inSetup ? null : fv.marks[c];
      if (p) {
        cls += ' pc' + edgeClasses(p.mask, c, N);
        if (p.isAdd) cls += ' addpc';
        if (p.frag) cls += ' frag';
        if (!p.alive) cls += ' dead';
        else if (m && m.r !== 'x') cls += ' hitc';
        const ci = colorIndex(P, p);
        style += `--pcc:var(--pc${ci});`;
        inner += patHTML(ci, c);   // 柄はいちばん下に置く（印やタグがその上に重なる）
        if (opts.pick && p.alive) cls += ' pickable';
        if (opts.selectedPiece === p.id) cls += ' picked';
        if (p.stealth && p.alive) {
          cls += ' stealth';
          // 読み順で最初のマスにだけ印を付ける
          if (c === Math.min.apply(null, p.cells)) inner += `<span class="stl" aria-hidden="true">${ICON.stealth}</span>`;
        }
      }
      inner += cellMarkHTML(m, intel, c);
      if (P.treasure && P.treasure.cell === c) inner += MARK.gem;
      const tl = inSetup ? null : fv.tlog[c];
      if (tl) inner += `<span class="tl tl-${tl.r}${tl.gray ? ' gray' : ''}">${TL[tl.r]}</span>`;
      inner += cellTagHTML(intel, c);
      if (!inSetup && fv.lastCall === c && opts.flash) cls += ' last';
      if (opts.sel && opts.sel.indexOf(c) >= 0) cls += ' sel';
      if (opts.clickable && opts.clickable(c)) cls += ' click';
      const label = coord(c) + (p ? (p.alive ? ` ${p.size}マスのキューブ${p.stealth ? '（ステルス）' : ''}` : ' 撃破済み') : '') + probeLabel(intel, c, m);
      html += `<div class="${cls}" style="${style}" data-act="cell" data-board="${kind}" data-cell="${c}" role="gridcell" aria-label="${esc(label)}">${inner}</div>`;
    }
    return boardFrame(N, kind, html, opts.cls, { overlay: pairsSVG(intel, N) + (opts.overlay || '') });
  }

  // サーチキューブの選択メニュー（相手フィールド上に出す）
  function cubeMenuHTML() {
    const cats = [['キューブ', 'O4'], ['L字', 'L4'], ['T字', 'T4'], ['Z字', 'Z4']];
    return `<div class="cube-menu" role="group" aria-label="サーチキューブの対象">
      <button type="button" class="cm-close" data-act="cancel" aria-label="閉じる" title="キャンセル">✕</button>
      <p>SEARCH CUBE ─ 形状</p>
      <div class="cm-grid shapes">${cats.map(([c, k]) => `<button type="button" class="cm-btn" data-act="cube" data-kind="cat" data-value="${esc(c)}">${shapeMini(k, 0)}<span>${esc(c)}</span></button>`).join('')}</div>
      <p>マス数</p>
      <div class="cm-grid sizes">${[1, 2, 3, 4, 5].map((s) => `<button type="button" class="cm-btn" data-act="cube" data-kind="size" data-value="${s}" aria-label="${s}マス${s === 1 ? '（バズーカの破片）' : ''}"${s === 1 ? ' title="1マスキューブ（バズーカで分解された破片）"' : ''}><b>${s}</b></button>`).join('')}</div>
    </div>`;
  }

  // 相手フィールド（予想盤面）
  function predBoard(pi, opts) {
    opts = opts || {};
    const g = G(), N = g.N, P = g.players[pi], v = P.view, foe = g.players[1 - pi];
    const sel = new Set(opts.sel || []);
    const intel = opts.intel;
    const deadMaskById = {};
    for (let c = 0; c < g.NN; c++) { const d = v.dead[c]; if (d) deadMaskById[d.pieceId] = (deadMaskById[d.pieceId] || 0) | bit(c); }
    const memo = memoOf(pi);
    let html = '';
    for (let c = 0; c < g.NN; c++) {
      let cls = cellBase(c, N);
      let inner = '', style = '';
      const d = v.dead[c];
      if (d) {
        cls += ' pc revealed' + edgeClasses(deadMaskById[d.pieceId], c, N);
        if (d.cause === 'bazooka') cls += ' bz';
      } else if (opts.reveal) {
        const tp = g.pieceAt(foe.idx, c);
        if (tp) { const ci = colorIndex(foe, tp); cls += ' ghost' + edgeClasses(tp.mask, c, N); style += `--pcc:var(--pc${ci});`; inner += patHTML(ci, c); }
      }
      inner += cellMarkHTML(v.marks[c], intel, c);
      if (opts.reveal && foe.treasure && foe.treasure.cell === c) inner += MARK.gem;
      const tl = v.tlog[c];
      if (tl) inner += `<span class="tl tl-${tl.r}${tl.gray ? ' gray' : ''}">${TL[tl.r]}</span>`;
      inner += cellTagHTML(intel, c);
      const mo = memo[c];
      if (mo && !v.marks[c] && !d && !opts.reveal) { inner += MEMO[mo]; cls += ' memo'; }
      if (sel.has(c)) cls += ' sel';
      if (v.lastCall === c && opts.flash) cls += ' last';
      if (opts.clickable && opts.clickable(c)) cls += ' click';
      const m = v.marks[c];
      let label = coord(c);
      if (m) label += m.r === 'x' ? (m.callable ? ' ×（再コールできる）' : m.warp ? ' ×（ワープ前の位置）' : ' ×') : m.r === 'oo' ? ` ◎${m.num}` : ' ○';
      label += probeLabel(intel, c, m);
      if (d) label += ' 撃破済み';
      if (mo && !m && !d) label += `（メモ：${MEMO_NAME[mo]}）`;
      html += `<div class="${cls}" style="${style}" data-act="cell" data-board="pred" data-cell="${c}" role="gridcell" aria-label="${esc(label)}">${inner}</div>`;
    }
    const overlay = pairsSVG(intel, N) + (opts.cubeMenu ? cubeMenuHTML() : '');
    return boardFrame(N, 'pred', html, opts.cls, { pickLine: opts.pickLine, overlay });
  }

  // ---------------- アイテム欄（フィールド上部） ----------------
  function chipHTML(pi, k, interactive) {
    const g = G(), P = g.players[pi];
    const st = g.itemStatus(pi, k);
    const phaseOK = interactive && g.phase === 'play' && g.cur === pi && (g.sub === 'item' || g.sub === 'answer') && !g.itemUsed && !app.busy && !netWaiting();
    let cls = k === 'bazooka' ? 'ichip bz' : 'ichip', bd = '', state;
    if (st.usedUp) { cls += ' spent'; bd = st.have > 0 ? '×' + st.have : ''; state = st.have > 0 ? `この試合では使用済み（次の試合用に残り${st.have}）` : 'この試合では使用済み'; }
    else if (st.have > 0) { bd = st.have > 1 ? '×' + st.have : ''; state = `残り${st.have}`; }
    else if (interactive && P.used[k] && P.wallet >= 3) { cls += ' rebuy'; bd = '3pt'; state = '使用済み・3ptで再購入できる'; }
    else { cls += ' spent'; state = P.used[k] ? (P.wallet >= 3 ? '使用済み（3ptで再購入できる）' : '使用済み') : 'なし'; }
    const usable = phaseOK && st.usable;
    if (usable) cls += ' usable';
    if (interactive && app.ui && app.ui.item === k) cls += ' active';
    const who = !app.replay && oneSide() ? (pi === viewer() ? 'あなた' : P.name) : P.name;
    const active = interactive && app.ui && app.ui.item === k;
    const tip = `${who}の${isDef(k) ? '防御' : '攻撃'}アイテム「${ITEMS[k].name}」：${ITEMS[k].desc}（${active ? '選択中。もう一度押すとやめる' : state}）`;
    const badge = bd ? `<span class="bd">${esc(bd)}</span>` : '';
    if (interactive) return `<button type="button" class="${cls}" data-act="item" data-key="${k}" aria-disabled="${usable ? 'false' : 'true'}" data-tip="${esc(tip)}" aria-label="${esc(tip)}">${ICON[k]}${badge}</button>`;
    return `<span class="${cls}" role="listitem" data-tip="${esc(tip)}" aria-label="${esc(tip)}">${ICON[k]}${badge}</span>`;
  }
  function chipGroup(pi, keys, interactive, side, cap, tone) {
    keys = keys.filter(inPlay);
    if (!keys.length) return '';
    return `<div class="chipgrp ${side}"><span class="cap">${esc(cap)}</span><div class="chips ${tone || (interactive ? 'mine' : 'enemy')}" role="list">${keys.map((k) => chipHTML(pi, k, interactive)).join('')}</div></div>`;
  }
  // 各フィールドには、そのフィールドに作用するアイテムを並べる（左＝攻撃、右＝防御）
  function fieldChips(fieldOwner, v) {
    const foe = 1 - v;
    if (fieldOwner === v) return `<div class="chiprow">${chipGroup(foe, ATK_ITEMS, false, 'atk', '相手の攻撃')}${chipGroup(v, DEF_ITEMS, true, 'def', '自分の防御')}</div>`;
    return `<div class="chiprow">${chipGroup(v, ATK_ITEMS, true, 'atk', '自分の攻撃')}${chipGroup(foe, DEF_ITEMS, false, 'def', '相手の防御')}</div>`;
  }

  // ---------------- ログ ----------------
  const CALL_KINDS = new Set(['call', 'hit', 'kill', 'miss', 'tcall', 'treasure']);
  const stripName = (s) => s.replace(/^[^：]{1,14}：/, '');
  function sideEntries(v) {
    const g = G(), f = 1 - v;
    const used = (e) => e.kind === 'item' && e.key;
    // 自分フィールド：相手の攻撃アイテム＋自分の防御アイテム／相手フィールド：自分の攻撃アイテム＋相手の防御アイテム
    const myFieldItems = g.log.filter((e) => used(e) && ((e.actor === f && !isDef(e.key)) || (e.actor === v && isDef(e.key))));
    const foeFieldItems = g.log.filter((e) => used(e) && ((e.actor === v && !isDef(e.key)) || (e.actor === f && isDef(e.key))));
    const calls = (a, b) => g.log.filter((e) => (e.actor === a && CALL_KINDS.has(e.kind)) || (e.actor === b && e.kind === 'penalty'));
    return { myItems: myFieldItems, foeItems: foeFieldItems, defCalls: calls(f, v), atkCalls: calls(v, f) };
  }
  function itemLogHTML(entries, v, empty) {
    if (!entries.length) return `<ol class="loglist"><li class="none"><span class="t">—</span><span class="x">${esc(empty)}</span></li></ol>`;
    return '<ol class="loglist">' + entries.slice().reverse().map((e) => {
      const txt = e.actor === v && e.priv ? e.priv : e.text;
      const side = e.actor === v ? 'mine' : 'enemy';
      return `<li class="k-item wicon ${side}"><span class="t">T${pad2(e.turn)}</span><span class="li-ic ${side}">${ICON[e.key] || ''}</span><span class="x">${esc(txt)}</span></li>`;
    }).join('') + '</ol>';
  }
  // アンサーのログ：宣言したマス（新しいログは cells、古いログは文字の座標から）
  function answerCells(e, N) {
    if (Array.isArray(e.cells)) return e.cells;
    const m = /アンサー(成功|失敗)（([^）]*)）/.exec(e.text || '');
    if (!m) return null;
    const out = [];
    for (const x of m[2].matchAll(/([A-Z])-(\d+)/g)) { const c = x[1].charCodeAt(0) - 65, r = +x[2] - 1; if (c >= 0 && c < N && r >= 0 && r < N) out.push(r * N + c); }
    return out.length ? out : null;
  }
  // ログの行にマウスを重ねたとき光らせる盤：アンサーした人（actor）の相手の盤。me＝自分の席（自分の相手の盤が pred）
  function hlAttrs(e, me, N) {
    const cells = (e.kind === 'kill' || e.kind === 'miss') && e.actor != null ? answerCells(e, N) : null;
    if (!cells) return '';
    return ` data-hl="${cells.join(',')}" data-hl-to="${e.actor === me ? 'pred' : 'own'}" data-hl-k="${e.kind}"`;
  }
  function callLogHTML(entries, v, empty) {
    if (!entries.length) return `<ol class="loglist"><li class="none"><span class="t">—</span><span class="x">${esc(empty)}</span></li></ol>`;
    const N = G().N;
    return '<ol class="loglist">' + entries.slice().reverse().map((e) => {
      const txt = stripName(e.actor === v && e.priv ? e.priv : e.text);
      return `<li class="k-${esc(e.kind)}"${hlAttrs(e, v, N)}><span class="t">T${pad2(e.turn)}</span><span class="x">${esc(txt)}</span></li>`;
    }).join('') + '</ol>';
  }

  // ログのアンサーにマウスを重ねると、宣言したマスを盤の上で枠で囲んで光らせる（成功＝金、失敗＝赤の点線）
  function hlAnswer(el, on) {
    const scope = el.closest('#replay') ? replayEl : root;
    scope.querySelectorAll('.hl-layer').forEach((x) => x.remove());
    if (!on) return;
    const cellsEl = scope.querySelector(`.board[data-board="${el.dataset.hlTo}"] .cells`);
    if (!cellsEl) return;
    const N = Math.round(Math.sqrt(cellsEl.querySelectorAll('.cell[data-cell]').length));
    const set = new Set((el.dataset.hl || '').split(',').filter((x) => x !== '').map(Number));
    // 盤の上に重ねる（撃破済みのマスは暗くする効果がかかっているので、マスの中に置くと枠まで暗くなる）
    const layer = document.createElement('div');
    layer.className = 'hl-layer' + (el.dataset.hlK === 'miss' ? ' miss' : '');
    let h = '';
    for (const c of set) {
      const t = !set.has(c - N), b = !set.has(c + N), l = c % N === 0 || !set.has(c - 1), r = c % N === N - 1 || !set.has(c + 1);
      h += `<i style="left:${(c % N) / N * 100}%;top:${Math.floor(c / N) / N * 100}%;width:${100 / N}%;height:${100 / N}%;border-width:${t ? 3 : 0}px ${r ? 3 : 0}px ${b ? 3 : 0}px ${l ? 3 : 0}px"></i>`;
    }
    layer.innerHTML = h;
    cellsEl.appendChild(layer);
  }
  document.addEventListener('mouseover', (ev) => { const el = ev.target.closest && ev.target.closest('[data-hl]'); if (el) hlAnswer(el, true); });
  document.addEventListener('mouseout', (ev) => { const el = ev.target.closest && ev.target.closest('[data-hl]'); if (el && !(ev.relatedTarget && el.contains(ev.relatedTarget))) hlAnswer(el, false); });

  // ---------------- 操作ブロック ----------------
  function phaseText(mode) {
    const g = G(), v = viewer();
    const who = oneSide() ? '' : g.players[v].name + '：';
    switch (mode) {
      case 'item': return who + (g.hasCallable(v) ? 'アイテムを使うか、相手フィールドをタップしてコール' : 'コールできるマスがありません。コールを飛ばしてください');
      case 'call': return who + '相手フィールドをタップしてコール';
      case 'answer-phase': return who + (g.itemUsed ? 'アンサーするか、ターンエンドしてください' : 'アンサー・アイテム・ターンエンドから選んでください');
      case 'answer': return who + '相手フィールドで、個体の全マスを選んでください';
      case 'treasure': return who + `トレジャーコール（残り${g.treasureLeft(v)}回）：相手フィールドのマスを1つ選んでください`;
      case 'stealth-pick': return who + 'ステルス：守る自分のキューブを選んでください';
      case 'sacrifice': return who + 'アンサー失敗！手番が終了します。差し出す自分のキューブを選んでください';
      case 'line': return who + 'サーチライン：相手フィールドの列か行のラベルをタップ';
      case 'number': return who + 'サーチサイズ：相手フィールドで調べるマスを選んでください';
      case 'node': return who + 'ノードショット：相手フィールドで調べるマスを選んでください';
      case 'bazooka': return who + 'バズーカ：相手フィールドで撃ち込むマスを選んでください';
      case 'pair': return who + 'ペアショット：相手フィールドでマスを2つ選んでください';
      case 'cube': return who + 'サーチキューブ：相手フィールドのメニューから選んでください';
      case 'wait':
        if (app.net) return netWaiting() ? '送信しています…' : `${g.players[g.cur].name}の番です。相手の操作を待っています…`;
        return isCPUMode() ? `${foeName()}が解析しています…` : '';
      case 'over': return '試合終了';
      default: return who + (ITEMS[app.ui.item] ? ITEMS[app.ui.item].name + 'の対象を選んでください' : '');
    }
  }

  function itemHead(k, extra) {
    const g = G(), v = viewer();
    const rebuy = g.itemStatus(v, k).rebuyNeeded ? `<p class="note warn">手持ちがないため、3ptで再購入して使います（残り ${g.players[v].wallet}pt）。</p>` : '';
    return `<div class="itemhead"><span class="ichip active${k === 'bazooka' ? ' bz' : ''}">${ICON[k]}</span><div><b>${esc(ITEMS[k].name)}</b><p class="note ih-desc">${esc(extra || ITEMS[k].desc)}</p>${rebuy}</div></div>`;
  }

  // 進行表示ブロック：上の段に直前の出来事、下の段に説明（左）とボタン（右）。
  // フィールドの上に置くので、どの状態でも高さがほぼ変わらないように中身を短くそろえる
  function dockHTML(mode) {
    const g = G(), v = viewer(), ui = app.ui;
    const cancel = '<button class="btn ghost" data-act="cancel">やめる</button>';
    let main = '', acts = '';
    switch (mode) {
      case 'item':
        if (g.hasCallable(v)) main = '<p class="note">アイテムはコールの前か後のどちらかで、1ターンに1つまで。選んだアイコンをもう一度押すとやめられます。</p>';
        else {
          main = '<p class="dock-msg">コールできるマスが残っていません。コールを飛ばして、アンサーかターンエンドに進みます。</p>';
          acts = '<button class="btn primary" data-act="skip-call">コールを飛ばす</button>';
        }
        break;
      case 'call':
        main = '<p class="note">相手フィールドのマスをタップしてコールします。</p>';
        break;
      case 'answer-phase':
        main = `<p class="note">${g.itemUsed ? 'アンサーで個体の全マスを宣言するか、ターンエンドします。' : 'このターンはまだアイテムを使えます（フィールド上部のアイコン）。'}</p>`;
        acts = '<button class="btn primary" data-act="answer-start">アンサー</button><button class="btn" data-act="end-turn">ターンエンド</button>';
        break;
      case 'answer': {
        const key = ui.sel.length ? identifyShape(ui.sel, g.N) : null;
        const shapeTxt = !ui.sel.length ? 'マスを選択' : key ? `${SHAPES[key].cat}（${SHAPES[key].size}マス）` : '形になっていません';
        main = '<p class="dock-msg">個体の<b>全マス</b>を選んで宣言します。失敗すると自分のキューブを1つ差し出し、<b>手番が終了</b>します。</p>';
        acts = `<span class="chip ${key ? 'ok' : ''}">${esc(shapeTxt)}</span><button class="btn primary" data-act="answer-submit" ${key ? '' : 'disabled'}>宣言する</button>${cancel}`;
        break;
      }
      case 'cube':
        main = itemHead('cube', '相手フィールドに出たメニューから、調べる形かマス数を選んでください。');
        acts = cancel;
        break;
      case 'line':
        main = itemHead('line', '相手フィールドの列（A〜）か行（1〜）のラベルをタップ。そこにかかっている（撃破されていない）個体の数と、そのマスの数（例：2個体 / 3マス）が分かり、アイテム欄の下に記録されます。');
        acts = cancel;
        break;
      case 'number':
        main = itemHead('number', '調べるマスを選んでください。そこにある個体のマス数が分かります（空きマスなら NoData）。');
        acts = cancel;
        break;
      case 'shape':
        main = itemHead('shape', '調べるマスを選んでください。そこにある個体の形が分かります（空きマスなら NoData）。');
        acts = cancel;
        break;
      case 'pair':
        main = itemHead('pair', `調べるマスを2つ選んでください（${ui.sel.length}/2）。同じ個体かどうかが分かります。撃破済み以外ならどこでも選べます。`);
        acts = cancel;
        break;
      case 'node':
        main = itemHead('node', '調べるマスを選んでください。同じ個体のマスが上下左右にいくつつながっているか（0〜3）が分かります。1＝端、2＝途中か角、3＝T字の分かれ目。空きマスなら NoData。');
        acts = cancel;
        break;
      case 'bazooka':
        main = itemHead('bazooka', '撃ち込むマスを選んでください。そこにある個体を1マスキューブに分解し、ヒット済みのマスはその場で撃破します（ステルスも解除）。空きマスなら NoData。');
        acts = cancel;
        break;
      case 'warp-pick':
        main = itemHead('warp', '自分フィールドで、移動するキューブを選んでください。');
        acts = cancel;
        break;
      case 'warp-place':
        main = itemHead('warp', '移動先をタップ。移動前の位置は相手に公開されます。');
        acts = `<button class="btn" data-act="warp-rotate" title="R キー">↻ 回転</button><button class="btn" data-act="warp-flip" title="F キー">⇋ 反転</button><button class="btn ghost" data-act="warp-repick">選び直す</button>${cancel}`;
        break;
      case 'stealth-pick':
        main = itemHead('stealth', '守る自分のキューブを選んでください。全マスに当たっても撃破されず、アンサーでしか倒せません。どれにしたかは相手に伝わりません。');
        acts = cancel;
        break;
      case 'treasure':
        main = `<p class="dock-msg">トレジャーコール（残り${g.treasureLeft(v)}回／全${g.rules.treasureMax}回）：相手フィールドのマスを1つ。H＝的中、N＝上下左右か同じ個体、X＝外れ。</p>`;
        break;
      case 'sacrifice':
        main = `<p class="dock-msg warn">${esc(phaseText(mode))}</p>`;
        break;
      case 'wait':
        main = `<p class="dock-msg wait"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>${esc(phaseText(mode))}</p>`;
        break;
      case 'over':
        main = '<p class="dock-msg">試合終了</p>';
        acts = app.tour
          ? '<button class="btn primary" data-act="show-result">結果を見る</button><button class="btn" data-act="tour-back">大会の画面へ</button>'
          : '<button class="btn primary" data-act="show-result">結果を見る</button><button class="btn" data-act="restart">もう一度</button><button class="btn ghost" data-act="to-title">設定に戻る</button>';
        break;
    }
    const bn = bannerFor(v);
    const banner = bn ? `<p class="banner k-${esc(bn.kind)}" title="${esc(bn.text)}">${esc(bn.text)}</p>` : '<p class="banner empty" aria-hidden="true">&nbsp;</p>';
    return `<section class="panel dock" aria-live="polite">${banner}<div class="dock-main"><div class="dock-body">${main}</div>${acts ? `<div class="dock-acts">${acts}</div>` : ''}</div></section>`;
  }

  function scoreHTML(v) {
    const g = G();
    const me = g.players[v], foe = g.players[1 - v];
    const myLive = me.pieces.filter((p) => p.alive);
    const myCells = myLive.filter((p) => !p.isAdd).reduce((s, p) => s + p.size, 0);
    const foeLeft = '<span class="unk" title="相手の残り個体数は分かりません">？</span>';
    const T = app.tour;
    const tre = (P) => {
      if (P.view.treasureFound) return T ? '宝石+1' : '発見';
      const left = g.treasureLeft(P.idx);
      return left > 0 ? `<small>あと${left}回</small>` : '<small>失敗</small>';
    };
    // 大会：席→大会の番号。持ち点は、この試合の前の点＋ここまでの撃破とトレジャー（勝利点は試合の終わりに）
    const seatId = (i) => (i === 0 ? 0 : (g.rules.kind === 'final' ? (T.finalists[0] === 0 ? T.finalists[1] : T.finalists[0]) : tourOpponent(T)));
    const live = (P) => {
      const F = g.players[1 - P.idx];
      const d = P.score.attack - F.score.attack + ((P.view.treasureFound ? 1 : 0) - (F.view.treasureFound ? 1 : 0)) * E.Tour.GEM_PTS;
      return `${E.Tour.total(T.players[seatId(P.idx)]) + d}<small>${d > 0 ? '+' + d : d < 0 ? '−' + -d : '±0'}</small>`;
    };
    const hideSplitOf = (P) => P.idx !== v && g.phase !== 'over';
    const row = (P, left) => `<tr><th scope="row">${esc(P.name)}${g.first === P.idx ? '<small>先攻</small>' : ''}</th>
      ${T ? `<td class="live">${live(P)}</td>` : ''}<td>${P.score.attack}<small>マス</small></td><td>${tre(P)}</td><td>${left}</td>${T ? `<td class="held-td">${heldCubes(P, hideSplitOf(P))}</td>` : ''}</tr>
      ${T ? `<tr class="held-row"><td colspan="5"><span class="hr-cap">所持キューブ</span>${heldCubes(P, hideSplitOf(P))}</td></tr>` : ''}`;
    const tourNote = T ? '持ち点は、この試合の前の点に、ここまでの撃破（奪った・奪われたマス数）とトレジャーを足したもの（勝利点は試合の終わりに）。所持キューブは大会の持ち数（◆持っている・◇失った）。相手の個体をバズーカで分解したときは、その個体を失ったかどうかは試合終了まで非公開。' : '';
    return `<section class="panel scorebar${T ? ' tour' : ''}" aria-label="スコア">
      <table>
        <thead><tr><th></th>${T ? '<th>持ち点</th>' : ''}<th>撃破</th><th>トレジャー</th><th>残り個体</th>${T ? '<th>所持キューブ</th>' : ''}</tr></thead>
        <tbody>
          ${row(me, `${myLive.length}<small>体・${myCells}マス</small>`)}
          ${row(foe, foeLeft)}
        </tbody>
      </table>
      <p class="note">相手の残り個体数は分かりません。${tourNote}</p>
    </section>`;
  }

  // サウンドの切り替え（BGMと効果音 → 効果音だけ → 音なし）
  const SND_ORDER = ['all', 'sfx', 'off'];
  const SND_TEXT = { all: ['BGM・SE', 'BGMと効果音'], sfx: ['SEのみ', '効果音だけ'], off: ['OFF', '音なし'] };
  const SPEAKER = '<path class="spk" d="M3.5 9.4h3.6L12 5.5v13l-4.9-3.9H3.5z"/>';
  const SND_ICON = {
    all: `<svg viewBox="0 0 24 24" aria-hidden="true">${SPEAKER}<path d="M15.6 9.3a3.8 3.8 0 0 1 0 5.4M18.4 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>`,
    sfx: `<svg viewBox="0 0 24 24" aria-hidden="true">${SPEAKER}<path d="M15.6 9.3a3.8 3.8 0 0 1 0 5.4"/></svg>`,
    off: `<svg viewBox="0 0 24 24" aria-hidden="true">${SPEAKER}<path d="M16 9.6l4.8 4.8M20.8 9.6 16 14.4"/></svg>`,
  };
  function soundMode() { return SND_ORDER.indexOf(app.settings.sound) >= 0 ? app.settings.sound : 'all'; }
  function soundBtnHTML() {
    const m = soundMode(), t = SND_TEXT[m];
    return `<button class="btn ghost sndbtn ${m}" data-act="sound" aria-label="サウンド：${t[1]}（押すと切り替え）" data-tip="サウンド：${t[1]}。押すたびに BGMと効果音 → 効果音だけ → 音なし と切り替わります">${SND_ICON[m]}<span>${t[0]}</span></button>`;
  }
  function setSound(m) {
    app.settings.sound = m;
    store.set('settings', app.settings);
    SND.setMode(m, true);
    if (m !== 'off') SND.sfx('tick');
    toast(m === 'all' ? 'BGMと効果音をオンにしました' : m === 'sfx' ? 'BGMを止めました（効果音だけ鳴ります）' : '音をすべてオフにしました', 'note');
  }

  function hudHTML(stats, back) {
    return `<header class="hud">
      <div><div class="logo">サーチバトル</div><div class="logo-sub">SEARCH BATTLE</div></div>
      <div class="hud-mid">${stats || ''}</div>
      <div class="row">${soundBtnHTML()}<button class="btn ghost" data-act="rules">ルール</button>${back || '<button class="btn ghost" data-act="to-title">やめる</button>'}</div>
    </header>`;
  }

  // ---------------- 画面：タイトル ----------------
  function demoBoard() {
    const pieces = [{ cells: [1, 2], col: 1 }, { cells: [8, 12, 13], col: 3 }, { cells: [7, 11, 15], col: 4 }];
    const marks = { 2: ['oo', 1], 1: ['o'], 5: ['x'], 10: ['x'], 15: ['o'] };
    let html = '';
    for (let c = 0; c < 16; c++) {
      let cls = cellBase(c, 4), style = '', inner = '';
      const p = pieces.find((x) => x.cells.indexOf(c) >= 0);
      if (p) {
        const mask = p.cells.reduce((m, x) => m | bit(x), 0);
        cls += ' pc' + edgeClasses(mask, c, 4) + (marks[c] && marks[c][0] !== 'x' ? ' hitc' : '');
        style = `--pcc:var(--pc${p.col});`;
        inner += patHTML(p.col, c);
      }
      const m = marks[c];
      if (m) inner += markHTML({ r: m[0], num: m[1] });
      if (c === 13) inner += MARK.gem;
      if (c === 14) inner += '<span class="tl tl-N">N</span>';
      html += `<div class="${cls}" style="${style}">${inner}</div>`;
    }
    let cols = '', rows = '';
    for (let i = 0; i < 4; i++) { cols += `<span>${COLS[i]}</span>`; rows += `<span>${i + 1}</span>`; }
    return `<div class="board" style="--n:4" aria-hidden="true"><div class="ax ax-c">${cols}</div><div class="ax ax-r">${rows}</div><div class="cells">${html}</div></div>`;
  }

  function seg(name, value, options) {
    return `<div class="seg" role="radiogroup" aria-label="${esc(name)}">` + options.map(([val, label, sub], i) => {
      const id = `opt-${name}-${i}`;
      return `<input type="radio" id="${id}" name="${name}" value="${esc(val)}" data-setting="${name}" ${String(val) === String(value) ? 'checked' : ''}><label for="${id}"><span>${esc(label)}</span>${sub ? `<small>${esc(sub)}</small>` : ''}</label>`;
    }).join('') + '</div>';
  }

  // 使えるアイテムの設定（今後アイテムが増えても、この一覧に並ぶ）
  function pickedItems() {
    const list = (app.settings.itemPick || []).filter((k) => ITEM_KEYS.indexOf(k) >= 0);
    return list.length ? list : ITEM_KEYS.slice();
  }
  function itemsForMatch() {
    const mode = app.settings.items;
    if (mode === 'pick') return pickedItems();
    if (mode === 'draft') return ITEM_KEYS.slice();
    const n = app.settings.randomN | 0;
    if (!n || n >= ITEM_KEYS.length) return ITEM_KEYS.slice();
    const pool = ITEM_KEYS.slice();
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
    const chosen = pool.slice(0, n);
    return ITEM_KEYS.filter((k) => chosen.indexOf(k) >= 0);
  }

  // ---------------- キューブの◆◇ ----------------
  // マス数 size のキューブを、大会全体の数（2マス×5・3マス×4・4マス×3・5マス×2）の◆◇で表す
  //  n.on＝持っている（使える）、n.placed＝この試合で置いた、n.gone＝この試合で失った。残りは大会で失った分（◇）
  function cubePips(size, n) {
    const full = E.STOCK[size];
    const on = n.on || 0, placed = n.placed || 0, gone = n.gone || 0;
    let pips = '';
    for (let i = 0; i < full; i++) {
      const k = i < on ? 'on' : i < on + placed ? 'placed' : i < on + placed + gone ? 'gone' : '';
      pips += `<i class="${k}"></i>`;
    }
    const lost = Math.max(0, full - on - placed - gone);
    const tip = `${size}マスのキューブ：${n.label || '残り'}${on}${placed ? `・置いた${placed}` : ''}${gone ? `・この試合で失った${gone}` : ''}${lost ? `・大会で失った${lost}` : ''}（大会の最初は${full}）`;
    return `<span class="cb" data-tip="${esc(tip)}" aria-label="${esc(tip)}"><b>${size}</b>${pips}</span>`;
  }
  // 試合中の「所持キューブ」：大会の持ち数から、この試合で失った分（撃破・差し出し。分解は全部撃破されたとき）を引く
  //  hideSplit：相手の分。バズーカで分解された個体を失ったかどうかは、試合が終わるまで伏せる
  //  （破片は1マスキューブとして撃破を知らせるだけ。元の個体を倒しきったこと・そのマス数は、試合の結果で分かる）
  function heldCubes(P, hideSplit) {
    const lostNow = { 2: 0, 3: 0, 4: 0, 5: 0 };
    for (const p of P.pieces) if (!p.frag && !p.isAdd && !p.alive) lostNow[p.size]++;
    if (!hideSplit) for (const sp of P.splitPieces || []) if (!P.pieces.some((f) => f.frag && f.fromId === sp.id && f.alive)) lostNow[sp.size]++;
    return `<div class="st-cubes held">${[2, 3, 4, 5].map((s) => cubePips(s, { on: Math.max(0, (P.stock[s] || 0) - lostNow[s]), gone: lostNow[s], label: '持っている' })).join('')}</div>`;
  }

  // ---------------- 画面：対戦 ----------------
  function renderBattle() {
    const g = G();
    const v = viewer();
    if (app.ui) app.ui.lastViewer = v;
    const mode = effMode();
    const P = g.players[v];
    const ui = app.ui;
    const N = g.N;

    let predClick = null, ownClick = null, ownPick = false;
    if (mode === 'item' || mode === 'call') predClick = (c) => g.isCallable(v, c);
    else if (mode === 'treasure') predClick = (c) => g.isTreasureCallable(v, c);
    else if (mode === 'answer' || mode === 'shape' || mode === 'number' || mode === 'node' || mode === 'bazooka') predClick = (c) => !P.view.dead[c];
    else if (mode === 'pair') predClick = (c) => !P.view.dead[c];
    if (mode === 'warp-pick' || mode === 'sacrifice') { ownPick = true; ownClick = (c) => !!g.pieceAt(v, c); }
    else if (mode === 'stealth-pick') { ownPick = true; ownClick = (c) => { const p = g.pieceAt(v, c); return !!p && !p.stealth; }; }
    else if (mode === 'warp-place') ownClick = () => true;
    const predActive = !!predClick || mode === 'line' || mode === 'cube';

    const reveal = g.phase === 'over' && ui.reveal;
    const tLeft = g.treasureLeft(v);
    const tStat = P.view.treasureFound ? 'GET' : tLeft > 0 ? `あと${tLeft}回` : '失敗';

    const L = sideEntries(v);

    const foeIntel = intelFor(v, 1 - v);    // 自分が相手フィールドを調べた結果

    root.innerHTML = `

                ${fieldChips(1 - v, v)}
                ${intelTagsHTML(foeIntel, true)}
                ${predBoard(v, { clickable: predClick, sel: ui.sel, flash: true, reveal, intel: foeIntel, pickLine: mode === 'line', cubeMenu: mode === 'cube' })}
