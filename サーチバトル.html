    for (const d of kb.deads) if (!d.isAdd && d.size >= 2) deadSetup[d.size]++;
    const stockBound = {};
    for (const s of [2, 3, 4, 5]) stockBound[s] = kb.stock[s] - deadSetup[s];
    const PL = placements(N);
    const sizeAllowed = (s) => stockBound[s] > 0 && (counts.size[s] == null || counts.size[s] > 0);
    const catAllowed = (cat) => counts.cat[cat] == null || counts.cat[cat] > 0;

    const groupIndexByNum = new Map(groups.map((g, i) => [g.num, i]));

    // ワープ・アッドで動いた個体の追跡（索敵用の近似）
    const wEnt = [];
    const addEnt = kb.adds.map((a) => ({ t: a.t, col: a.col, alive: true }));
    const sortedWarps = kb.warps.slice().sort((a, b) => a.t - b.t);
    for (const w of sortedWarps) {
      if (w.size === 1) {
        const col = bitsOf(w.oldMask)[0] % N;
        const pick = addEnt.filter((a) => a.alive && a.t < w.t && a.col === col).pop()
          || wEnt.filter((e) => e.alive && e.key === 'A1' && e.t < w.t).pop()
          || addEnt.filter((a) => a.alive && a.t < w.t).pop();
        if (pick) pick.alive = false;
      } else {
        const neverMoved = !(w.oldMask & (xMaskBetween(-1, w.t) | oldMaskBefore(w.t)));
        if (!neverMoved) {
          const prev = wEnt.filter((e) => e.alive && e.key === w.key && e.t < w.t && !(w.oldMask & e.oldMask) && !(w.oldMask & xMaskBetween(e.t, w.t))).pop();
          if (prev) prev.alive = false;
        }
      }
      wEnt.push({ t: w.t, key: w.key, size: w.size, cat: w.cat, oldMask: w.oldMask, treasure: !!w.treasure, alive: true });
    }
    for (const d of kb.deads.slice().sort((a, b) => a.t - b.t)) {
      if (d.isAdd) {
        const col = bitsOf(d.mask)[0] % N;
        const pick = addEnt.filter((a) => a.alive && a.t < d.t && a.col === col).pop()
          || wEnt.filter((e) => e.alive && e.key === 'A1' && e.t < d.t).pop()
          || addEnt.filter((a) => a.alive && a.t < d.t).pop();
        if (pick) pick.alive = false;
        continue;
      }
      const cands = wEnt.filter((e) => e.alive && e.key === d.key && e.t < d.t && !(d.mask & e.oldMask) && !(d.mask & xMaskBetween(e.t, d.t)));
      const neverMoved = !(d.mask & (xMaskBetween(-1, d.t) | oldMaskBefore(d.t)));
      if (cands.length && !neverMoved) cands[cands.length - 1].alive = false;
    }

    return {
      N, NN, kb, PL, explained, deadMask, oldMaskAll, xs, xMaskAll, xMaskAfter, xMaskBetween, oldMaskAfter, oldMaskBefore,
      counts, lineZeroMask, lineMax, U, Ucell, groups, oList, ooMask, hitMask, occs, occMaskBefore,
      deadSetup, stockBound, sizeAllowed, catAllowed, groupIndexByNum, pairs, dists, distNums, stealthTimes,
      wEnt: wEnt.filter((e) => e.alive), addEnt: addEnt.filter((a) => a.alive),
    };
  }

  function shapePrior(ctx) {
    const sizes = [2, 3, 4, 5].filter((s) => ctx.sizeAllowed(s));
    const list = [];
    for (const s of sizes) {
      const keys = SHAPES_BY_SIZE[s].filter((k) => ctx.PL[k].length && ctx.catAllowed(SHAPES[k].cat));
      for (const k of keys) list.push({ key: k, size: s, prior: 1 / sizes.length / keys.length });
    }
    return list;
  }

  // ------------------------------------------------------------------
  // ◎ごとの候補配置（健全：本当の配置を必ず含む）
  // ------------------------------------------------------------------
  // サーチシェイプ（形状）・サーチサイズ（マス数）の結果と矛盾しないか
  function factsOK(P, occs, tp) {
    for (const o of occs) {
      if (o.t <= tp || !(P.mask & bit(o.c))) continue;
      if (o.cat && o.cat !== P.cat) return false;
      if (o.size && o.size !== P.size) return false;
    }
    return true;
  }

  function groupCands(g, ctx, priorByKey) {
    const out = new Map();
    const others = ctx.ooMask & ~bit(g.c);
    let early = 0;
    for (const u of ctx.U) if (u.t < g.t) early |= bit(u.c);
    const base = others | early | ctx.deadMask | ctx.lineZeroMask;
    // ディスタンスショット：このマスを含むなら、◎がそれより前にあり、距離が合うこと／NoData なら、それより前の◎の個体は含まない
    const distOK = (P) => {
      for (const d of ctx.dists) {
        if (!(P.mask & bit(d.c))) continue;
        if (d.k == null) { if (g.t < d.t) return false; continue; }
        if (g.t > d.t || blockDist(d.c, g.c, ctx.N) !== d.k) return false;
      }
      return true;
    };
    const add = (P, branch) => {
      const ex = out.get(P.mask);
      if (ex) { if (ex.branches.indexOf(branch) < 0) ex.branches.push(branch); return; }
      // 全マスに当たっているのに生きている＝ステルス。その最後のヒットより前にステルスが使われていなければありえない
      let full = (P.mask & ~ctx.hitMask) === 0, lastHit = -1;
      if (full) {
        for (const c of P.cells) { const u = ctx.Ucell.get(c); lastHit = Math.max(lastHit, u ? u.t : Infinity); }
        if (!ctx.stealthTimes.length || ctx.stealthTimes[0] >= lastHit) return;
      }
      const pr = priorByKey[P.key] || 0.05;
      out.set(P.mask, { mask: P.mask, key: P.key, size: P.size, cat: P.cat, cells: P.cells, branches: [branch], w: pr / ctx.PL[P.key].length, full, lastHit });
    };
    const fa = base | ctx.xMaskAll | ctx.oldMaskAll;
    for (const s of [2, 3, 4, 5]) {
      if (!ctx.sizeAllowed(s)) continue;
      for (const key of SHAPES_BY_SIZE[s]) {
        if (!ctx.catAllowed(SHAPES[key].cat)) continue;
        for (const P of ctx.PL[key]) {
          if (!(P.mask & bit(g.c)) || (P.mask & fa)) continue;
          if (!factsOK(P, ctx.occs, 0) || !distOK(P)) continue;
          add(P, 'a');
        }
      }
    }
    for (const w of ctx.kb.warps) {
      if (w.t >= g.t || w.size < 2) continue;
      if (!ctx.sizeAllowed(w.size) || !ctx.catAllowed(w.cat)) continue;
      const fb = base | ctx.xMaskAfter(w.t) | w.oldMask | ctx.oldMaskAfter(w.t) | ctx.occMaskBefore(w.t);
      for (const P of ctx.PL[w.key]) {
        if (!(P.mask & bit(g.c)) || (P.mask & fb)) continue;
        if (!factsOK(P, ctx.occs, w.t) || !distOK(P)) continue;
        add(P, 'w');
      }
    }
    return Array.from(out.values());
  }

  // ------------------------------------------------------------------
  // ◎個体の組み合わせを全探索（重なり・○の帰属・アイテム結果・在庫を同時に満たすもの）
  // ------------------------------------------------------------------
  function jointEnumerate(ctx, cap, rng) {
    const G = ctx.groups, nG = G.length, NN = ctx.NN;
    const res = { total: 0, count: 0, nodes: 0, aborted: false, inconsistent: false, cellW: new Float64Array(NN), candW: G.map((g) => new Float64Array(g.cands.length)), sameW: null, distW: new Map(),
      qSize: [0, 1, 2, 3, 4, 5].map(() => new Float64Array(nG + 1)), qCat: CATS.map(() => new Float64Array(nG + 1)) };
    if (!nG) return res;
    if (G.some((g) => !g.cands.length)) { res.inconsistent = true; return res; }
    const order = G.map((g, i) => i).sort((a, b) => G[a].cands.length - G[b].cands.length);
    const assign = new Int32Array(nG).fill(-1);
    const owner = new Int32Array(NN).fill(-1);
    const tOf = G.map((g) => g.t);
    const oList = ctx.oList;
    const counts = ctx.counts;
    const sameW = new Float64Array(NN * NN);
    res.sameW = sameW;
    const szCnt = new Int32Array(6), ctCnt = new Int32Array(CATS.length);
    const candOrder = G.map((g) => {
      const idx = g.cands.map((c, i) => i);
      if (rng) for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp; }
      return idx;
    });

    function setOwner(mask, v) { let m = mask; while (m) { const lb = m & -m; owner[31 - Math.clz32(lb)] = v; m ^= lb; } }
    function partialOK(depth, used) {
      for (const o of oList) {
        const ow = owner[o.c];
        if (ow >= 0) { if (tOf[ow] >= o.t) return false; continue; }
        let ok = false;
        for (let d = depth + 1; d < nG && !ok; d++) {
          const gj = order[d];
          if (tOf[gj] >= o.t) continue;
          for (const cd of G[gj].cands) if ((cd.mask & bit(o.c)) && !(cd.mask & used)) { ok = true; break; }
        }
        if (!ok) return false;
      }
      return true;
    }
    function finalOK() {
      if (counts.all != null && nG > counts.all) return false;
      const bySize = {}, byCat = {};
      for (let i = 0; i < nG; i++) {
        const cd = G[i].cands[assign[i]];
        bySize[cd.size] = (bySize[cd.size] || 0) + 1;
        byCat[cd.cat] = (byCat[cd.cat] || 0) + 1;
      }
      for (const s in bySize) {
        if (bySize[s] > ctx.stockBound[s]) return false;
        if (counts.size[s] != null && bySize[s] > counts.size[s]) return false;
      }
      for (const c in byCat) if (counts.cat[c] != null && byCat[c] > counts.cat[c]) return false;
      for (const L of ctx.lineMax) {
        let k = 0;
        for (let i = 0; i < nG; i++) k += popcount(G[i].cands[assign[i]].mask & L.mask);
        if (k > L.n) return false;
      }
      for (const p of ctx.pairs) {
        const oa = owner[p.a], ob = owner[p.b];
        if (p.same) { if (oa !== ob) return false; }
        else if (oa >= 0 && oa === ob) return false;
      }
      for (const d of ctx.distNums) if (owner[d.c] < 0) return false;
      // 全マス命中で生きている個体には、それぞれ別の（より前の）ステルスが要る
      let fulls = null;
      for (let i = 0; i < nG; i++) { const cd = G[i].cands[assign[i]]; if (cd.full) (fulls || (fulls = [])).push(cd.lastHit); }
      if (fulls) {
        if (fulls.length > ctx.stealthTimes.length) return false;
        fulls.sort((a, b) => a - b);
        // 締め切り（最後のヒット）の早い順に、いちばん早いステルスを割り当てる
        let j = 0;
        for (const dl of fulls) { if (j >= ctx.stealthTimes.length || ctx.stealthTimes[j] >= dl) return false; j++; }
      }
      return true;
    }
    // ディスタンスショットを撃ったときの結果の分布（0＝NoData）。◎と撃破済み以外のマス
    const probe = [];
    for (let c = 0; c < NN; c++) if (!(ctx.deadMask & bit(c)) && !(ctx.ooMask & bit(c))) probe.push(c);
    for (const c of probe) res.distW.set(c, new Float64Array(2 * ctx.N + 2));
    function dfs(depth, used, w) {
      if (res.aborted) return;
      if (++res.nodes > cap) { res.aborted = true; return; }
      if (depth === nG) {
        if (!finalOK()) return;
        res.total += w; res.count++;
        for (let i = 0; i < nG; i++) {
          res.candW[i][assign[i]] += w;
          const cells = G[i].cands[assign[i]].cells;
          for (let a = 0; a < cells.length; a++) for (let b = 0; b < cells.length; b++) if (a !== b) sameW[cells[a] * NN + cells[b]] += w;
        }
        let m = used;
        while (m) { const lb = m & -m; res.cellW[31 - Math.clz32(lb)] += w; m ^= lb; }
        for (const c of probe) { const gi = owner[c]; res.distW.get(c)[gi >= 0 ? blockDist(c, G[gi].c, ctx.N) : 0] += w; }
        // サーチキューブを使ったときの結果の分布用：◎個体のうち、各マス数・各形状に当てはまる数
        szCnt.fill(0); ctCnt.fill(0);
        for (let i = 0; i < nG; i++) { const cd = G[i].cands[assign[i]]; szCnt[cd.size]++; ctCnt[CAT_INDEX[cd.cat]]++; }
        for (let sz = 2; sz <= 5; sz++) res.qSize[sz][szCnt[sz]] += w;
        for (let ci = 0; ci < CATS.length; ci++) res.qCat[ci][ctCnt[ci]] += w;
        return;
      }
      const gi = order[depth], g = G[gi];
      for (const k of candOrder[gi]) {
        const cd = g.cands[k];
        if (cd.mask & used) continue;
        assign[gi] = k;
        setOwner(cd.mask, gi);
        if (partialOK(depth, used | cd.mask)) dfs(depth + 1, used | cd.mask, w * cd.w);
        setOwner(cd.mask, -1);
        if (res.aborted) break;
      }
      assign[gi] = -1;
    }
    dfs(0, 0, 1);
    if (res.count === 0 && !res.aborted) res.inconsistent = true;
    return res;
  }

  function solveGroups(ctx, rng) {
    let joint = jointEnumerate(ctx, 120000, null);
    let exact = !joint.aborted;
    if (joint.aborted) {
      // 大きすぎるときは順序を変えた部分探索を重ねて近似する
      const acc = jointEnumerate(ctx, 1, null);
      acc.aborted = false;
      for (let rep = 0; rep < 24; rep++) {
        const part = jointEnumerate(ctx, 6000, rng || Math.random);
        acc.total += part.total; acc.count += part.count;
        for (let c = 0; c < ctx.NN; c++) acc.cellW[c] += part.cellW[c];
        for (let i = 0; i < ctx.groups.length; i++) for (let k = 0; k < acc.candW[i].length; k++) acc.candW[i][k] += part.candW[i][k];
        if (part.sameW) for (let x = 0; x < part.sameW.length; x++) acc.sameW[x] += part.sameW[x];
        for (const [c, arr] of part.distW) { const dst = acc.distW.get(c); if (dst) for (let k = 0; k < arr.length; k++) dst[k] += arr[k]; }
        for (let sz = 0; sz < part.qSize.length; sz++) for (let k = 0; k < part.qSize[sz].length; k++) acc.qSize[sz][k] += part.qSize[sz][k];
        for (let ci = 0; ci < part.qCat.length; ci++) for (let k = 0; k < part.qCat[ci].length; k++) acc.qCat[ci][k] += part.qCat[ci][k];
      }
      acc.inconsistent = acc.count === 0;
      joint = acc;
    }
    joint.exact = exact;
    return joint;
  }

  // ------------------------------------------------------------------
  // バズーカの後：空きマスがすべて公開されたので、そのとき個体があったマスがちょうど分かっている。
  // そこから、その後に撃破された個体とワープで動いた個体のマスを除いた領域 R は、
  // 「それ以来動いていない、生きている個体」でぴったり埋まっている。
  // R を個体で敷き詰める置き方をすべて調べ、どの置き方にも出てくる個体を確定とする（健全：本当の置き方を必ず含む）
  // ------------------------------------------------------------------
  function revealRegion(kb) {
    const rv = kb.reveal;
    if (!rv) return null;
    let R = rv.occ;
    for (const d of kb.deads) if (d.t > rv.t) R &= ~d.mask;
    let warpedAfter = false;
    for (const w of kb.warps) if (w.t > rv.t) { R &= ~w.oldMask; warpedAfter = true; }
    return { R, t: rv.t, warpedAfter };
  }

  function revealSolve(ctx, priorByKey, cap, keep) {
    const rg = revealRegion(ctx.kb);
    if (!rg) return null;
    const { R, t: tb } = rg;
    const N = ctx.N, NN = ctx.NN, PL = ctx.PL, kb = ctx.kb;
    keep = keep || 3000;
    const out = { R, t: tb, warpedAfter: rg.warpedAfter, tilings: [], total: 0, count: 0, nodes: 0, aborted: false, truncated: false, certain: [] };
    // 説明のつかないヒット（今もそこにいる個体への命中）は、公開の後にワープした個体へのものでなければ R の中にあるはず
    if (!rg.warpedAfter) for (const u of ctx.U) if (!(R & bit(u.c))) return out;
    if (!R) { out.count = 1; out.total = 1; out.tilings.push({ w: 1, tiles: [], own: new Int8Array(NN).fill(-1) }); return out; }
    // 失敗したアンサーと同じ置き方は、その後にワープがなければありえない
    const failed = (kb.failedAnswers || []).filter((fa) => !kb.warps.some((w) => w.t > fa.t && w.t < tb));
    // 1個体ごとの条件：ヒットの順（最初が◎、あとは○）、形状・マス数の調査、ディスタンスショット、ステルス
    const tileInfo = (P) => {
      const hs = [];
      for (const c of P.cells) { const u = ctx.Ucell.get(c); if (u) hs.push(u); }
      hs.sort((a, b) => a.t - b.t);
      if (hs.length) {
        if (hs[0].r !== 'oo') return null;
        for (let i = 1; i < hs.length; i++) if (hs[i].r !== 'o') return null;
      }
      if (!factsOK(P, ctx.occs, 0)) return null;
      const g = hs.length ? hs[0] : null;
      for (const d of ctx.dists) {
        if (!(P.mask & bit(d.c))) continue;
        if (d.k == null) { if (g && g.t < d.t) return null; continue; }
        if (!g || g.t > d.t || blockDist(d.c, g.c, N) !== d.k) return null;
      }
      for (const fa of failed) if (fa.mask === P.mask) return null;
      const full = (P.mask & ~ctx.hitMask) === 0;
      const lastHit = full ? hs[hs.length - 1].t : -1;
      if (full && (!ctx.stealthTimes.length || ctx.stealthTimes[0] >= lastHit)) return null;
      return { full, lastHit, oo: g ? g.c : -1, hits: hs.length };
    };
    const cand = [];
    for (let c = 0; c < NN; c++) cand.push([]);
    for (const s of [2, 3, 4, 5]) {
      if (!ctx.sizeAllowed(s)) continue;
      for (const key of SHAPES_BY_SIZE[s]) {
        if (!ctx.catAllowed(SHAPES[key].cat)) continue;
        for (const P of PL[key]) {
          if (P.mask & ~R) continue;
          const info = tileInfo(P);
          if (!info) continue;
          const low = 31 - Math.clz32(P.mask & -P.mask);
          cand[low].push({ mask: P.mask, key: P.key, size: P.size, cat: P.cat, cells: P.cells, info, w: (priorByKey[P.key] || 0.05) / PL[P.key].length });
        }
      }
    }
    const counts = ctx.counts;
    const exact = !rg.warpedAfter;   // ワープで出ていった個体がいなければ、R の個体＝生きている個体のすべて
    const szCnt = new Int32Array(6), ctCnt = {};
    const tiles = [];
    const tileN = new Map();
    const own = new Int8Array(NN).fill(-1);
    const leaf = (w) => {
      if (exact) {
        if (counts.all != null && tiles.length !== counts.all) return;
        for (const sz in counts.size) if ((szCnt[sz] || 0) !== counts.size[sz]) return;
        for (const ct in counts.cat) if ((ctCnt[ct] || 0) !== counts.cat[ct]) return;
      }
      for (const p of ctx.pairs) {
        const oa = own[p.a], ob = own[p.b];
        // 2マスとも R の外なら、公開の後にワープした個体についての結果（ここでは調べない）
        if (p.same) { if (oa < 0 && ob < 0 && rg.warpedAfter) continue; if (oa < 0 || oa !== ob) return; } else if (oa >= 0 && oa === ob) return;
      }
      for (const d of ctx.distNums) if (own[d.c] < 0 && !(rg.warpedAfter && !(R & bit(d.c)))) return;
      // 全マス命中で生きている個体には、それぞれ別の（より前の）ステルスが要る
      const fulls = [];
      for (const T of tiles) if (T.info.full) fulls.push(T.info.lastHit);
      if (fulls.length) {
        if (fulls.length > ctx.stealthTimes.length) return;
        fulls.sort((a, b) => a - b);
        let j = 0;
        for (const dl of fulls) { if (ctx.stealthTimes[j] >= dl) return; j++; }
      }
      out.count++;
      out.total += w;
      for (const T of tiles) tileN.set(T.mask, (tileN.get(T.mask) || 0) + 1);
      if (out.tilings.length < keep) out.tilings.push({ w, tiles: tiles.slice(), own: own.slice() });
      else out.truncated = true;
    };
    const dfs = (rem, w) => {
      if (out.aborted) return;
      if (++out.nodes > cap) { out.aborted = true; return; }
      if (!rem) { leaf(w); return; }
      const low = 31 - Math.clz32(rem & -rem);
      for (const T of cand[low]) {
        if (T.mask & ~rem) continue;
        const s = T.size, ct = T.cat;
        if (szCnt[s] + 1 > ctx.stockBound[s]) continue;
        if (counts.size[s] != null && szCnt[s] + 1 > counts.size[s]) continue;
        if (counts.cat[ct] != null && (ctCnt[ct] || 0) + 1 > counts.cat[ct]) continue;
        if (counts.all != null && tiles.length + 1 > counts.all) continue;
        const idx = tiles.length;
        tiles.push(T); szCnt[s]++; ctCnt[ct] = (ctCnt[ct] || 0) + 1;
        for (const c of T.cells) own[c] = idx;
        dfs(rem & ~T.mask, w * T.w);
        for (const c of T.cells) own[c] = -1;
        tiles.pop(); szCnt[s]--; ctCnt[ct]--;
        if (out.aborted) return;
      }
    };
    dfs(R, 1);
    if (out.count > 0 && !out.aborted) {
      const seen = new Set();
      for (const Tl of out.tilings) for (const T of Tl.tiles) {
        if (seen.has(T.mask) || tileN.get(T.mask) !== out.count) continue;
        seen.add(T.mask);
        out.certain.push({ mask: T.mask, key: T.key, size: T.size, cat: T.cat, cells: T.cells });
      }
    }
    return out;
  }
  // バズーカ後の解析が使える状態か（敷き詰め方を全部数えられた）
  function revealReady(A) { const rv = A && A.reveal; return !!(rv && rv.count > 0 && !rv.aborted && !rv.truncated && rv.tilings.length); }
  // 敷き詰め方ごとの結果の割れ方（情報量）。key(敷き詰め方) が結果を返す
  function revealEntropy(rv, key) {
    const m = new Map();
    let tot = 0;
    for (const Tl of rv.tilings) { const k = key(Tl); m.set(k, (m.get(k) || 0) + Tl.w); tot += Tl.w; }
    if (!(tot > 0)) return 0;
    let h = 0;
    for (const w of m.values()) { const p = w / tot; if (p > 0) h -= p * Math.log2(p); }
    return h;
  }

  // ------------------------------------------------------------------
  // 解析本体
  // ------------------------------------------------------------------
  function analyze(kb, N, rng, opt) {
    const ctx = buildContext(kb, N);
    const prior = shapePrior(ctx);
    const priorByKey = {};
    for (const p of prior) priorByKey[p.key] = p.prior;
    for (const g of ctx.groups) g.cands = groupCands(g, ctx, priorByKey);
    const joint = solveGroups(ctx, rng);
    const NN = ctx.NN;
    const reveal = revealSolve(ctx, priorByKey, (opt && opt.revealCap) || 60000);

    // 確定個体
    const certain = [];
    ctx.groups.forEach((g, i) => {
      if (g.cands.length === 1) { certain.push({ gi: i, cand: g.cands[0] }); return; }
      if (joint.exact && !joint.inconsistent) {
        const live = [];
        for (let k = 0; k < g.cands.length; k++) if (joint.candW[i][k] > 0) live.push(k);
        if (live.length === 1) certain.push({ gi: i, cand: g.cands[live[0]] });
      }
    });
    // バズーカ後の敷き詰めで確定した個体（◎がまだない個体も、ここで確定することがある）
    if (reveal && reveal.count > 0 && !reveal.aborted) {
      for (const T of reveal.certain) {
        if (certain.some((x) => x.cand.mask === T.mask)) continue;
        let gi = -1;
        ctx.groups.forEach((g, i) => { if (T.mask & bit(g.c)) gi = i; });
        certain.push({ gi, cand: T });
      }
    }

    const targetP = new Float64Array(NN);
    let certainCover = 0, anyCover = 0;
    if (joint.total > 0) {
      for (let c = 0; c < NN; c++) {
        const p = joint.cellW[c] / joint.total;
        targetP[c] = p;
        if (p > 0.9999) certainCover |= bit(c);
        if (p > 0) anyCover |= bit(c);
      }
    } else {
      // 矛盾時のフォールバック：各◎の候補の和集合
      for (const g of ctx.groups) {
        const tot = g.cands.reduce((s, cd) => s + cd.w, 0) || 1;
        for (const cd of g.cands) for (const c of cd.cells) targetP[c] = Math.min(1, targetP[c] + cd.w / tot);
      }
      for (let c = 0; c < NN; c++) if (targetP[c] > 0) anyCover |= bit(c);
    }
    for (const u of ctx.U) { certainCover |= bit(u.c); anyCover |= bit(u.c); }

    if (reveal) for (const ce of certain) certainCover |= ce.cand.mask;
    const H = huntModel(ctx, prior, joint, certainCover, anyCover, opt || {}, reveal);
    return { ctx, joint, certain, targetP, certainCover, anyCover, hunt: H, reveal };
  }

  // 未発見の個体がいる確率（索敵用）
  function huntModel(ctx, prior, joint, certainCover, anyCover, opt, reveal) {
    const N = ctx.N, NN = ctx.NN, PL = ctx.PL;
    const forbidA = ctx.xMaskAll | ctx.deadMask | ctx.oldMaskAll | ctx.hitMask | ctx.lineZeroMask | certainCover;

    // 形ごとの「証拠を避けられた割合」と被覆密度
    // calib 2 以上：見つかった個体・撃破済みの個体のマスとは最初から重ならない（個体は重ねて置けない）ので、
    // 「そこを避けた」ことは証拠に数えない。分母を「それらと重ならない置き方の数」にする
    const calibLv = opt.calib != null ? opt.calib : CALIB_DEFAULT;
    const occupied = ctx.hitMask | certainCover | ctx.deadMask | ctx.oldMaskAll;
    const bySize = {};
    const shapeW = {};   // 未発見の個体がその形である重み（サーチキューブの見積もり用）
    const shapeCov = {}; // 形ごとの被覆（形状の個体数が分かったときに使う）
    for (const sh of prior) {
      let T = PL[sh.key].length;
      if (calibLv >= 2) { T = 0; for (const P of PL[sh.key]) if (!(P.mask & occupied)) T++; if (!T) { shapeW[sh.key] = 0; continue; } }
      let V = 0;
      const cov = new Float64Array(NN);
      for (const P of PL[sh.key]) {
        if (P.mask & forbidA) continue;
        V++;
        for (const c of P.cells) cov[c] += 1;
      }
      shapeW[sh.key] = sh.prior * V / T;
      shapeCov[sh.key] = { cov, V, size: sh.size, cat: SHAPES[sh.key].cat };
      const b = bySize[sh.size] || (bySize[sh.size] = { q: 0, dens: new Float64Array(NN), z: 0, pr: 0 });
      b.pr += sh.prior;
      b.q += sh.prior * V / T;
      for (let c = 0; c < NN; c++) b.dens[c] += sh.prior * cov[c] / T;
    }
    const sizes = Object.keys(bySize).map(Number);
    let q = 0;
    for (const s of sizes) q += bySize[s].q;
    if (calibLv >= 2) { let pz = 0; for (const s of sizes) pz += bySize[s].pr; if (pz > 0) q /= pz; }

    // ◎個体のサイズ期待値
    const EgSize = { 2: 0, 3: 0, 4: 0, 5: 0 };
    if (joint.total > 0) {
      ctx.groups.forEach((g, i) => {
        for (let k = 0; k < g.cands.length; k++) EgSize[g.cands[k].size] += joint.candW[i][k] / joint.total;
      });
    }
    // 位置の分かっている未ヒット個体（サーチシェイプ・トレジャー的中）
    const occPseudo = [];
    for (const o of ctx.occs) {
      if (o.dup || (anyCover & bit(o.c))) continue;
      const ex = occPseudo.find((x) => x.c === o.c);
      if (ex) { if (o.cat) ex.cat = o.cat; if (o.size) ex.size = o.size; continue; }
      occPseudo.push({ c: o.c, t: o.t, cat: o.cat || null, size: o.size || 0 });
    }
    const relocAlive = ctx.wEnt.length + ctx.addEnt.length;
    const nG = ctx.groups.length;

    let Etotal;
    let kDist = [1];   // 未発見の個体数の分布（索敵とサーチキューブの見積もり用）
    if (ctx.counts.all != null) {
      Etotal = Math.max(0, ctx.counts.all - nG - relocAlive - occPseudo.length);
      kDist = []; for (let k = 0; k < Math.round(Etotal); k++) kDist.push(0); kDist.push(1);
    } else {
      const known = Object.values(ctx.deadSetup).reduce((a, b) => a + b, 0) + nG + ctx.wEnt.length + occPseudo.length;
      const pri = N === 4 ? [0, 0.10, 0.20, 0.27, 0.22, 0.12, 0.06, 0.03] : [0, 0.05, 0.12, 0.20, 0.22, 0.18, 0.11, 0.07, 0.03, 0.02];
      let Z = 0, S = 0;
      const kd = [];
      // 見つかった個体が known 体あるとき、総数 K の見込みには K!/(K-known)!（どの個体が見つかったかの選び方）が掛かる。
      // これを入れないと「もう残っていない」と思い込みやすい
      for (let K = Math.max(1, known); K < pri.length; K++) {
        const k = K - known;
        let ff = 1;
        if (calibLv >= 1) for (let j = 0; j < known; j++) ff *= (K - j);
        const p = pri[K] * ff * Math.pow(q, k);
        Z += p; S += k * p;
        kd[k] = p;
      }
      Etotal = Z > 0 ? S / Z : 0;
      if (Z > 0) { kDist = []; for (let k = 0; k < kd.length; k++) kDist.push((kd[k] || 0) / Z); }
    }
    // サイズ別の期待個数
    const Es = {};
    let knownSum = 0;
    const free = [];
    for (const s of sizes) {
      if (ctx.counts.size[s] != null) {
        const relocS = ctx.wEnt.filter((e) => e.size === s).length;
        Es[s] = Math.max(0, ctx.counts.size[s] - EgSize[s] - relocS);
        knownSum += Es[s];
      } else free.push(s);
    }
    if (ctx.counts.all == null) Etotal = Math.max(Etotal, knownSum);
    const rest = Math.max(0, Etotal - knownSum);
    let fq = 0;
    for (const s of free) fq += bySize[s].q;
    for (const s of free) Es[s] = fq > 0 ? rest * bySize[s].q / fq : 0;

    // 形ごとの「まだ見つけていない個数」の期待値。サーチキューブで形状の個体数が分かっていれば、それに合わせる
    const Esh = {};
    for (const key in shapeCov) {
      const x = shapeCov[key], b = bySize[x.size];
      Esh[key] = b && b.q > 0 && Es[x.size] ? Es[x.size] * shapeW[key] / b.q : 0;
    }
    for (const cat of CATS) {
      if (ctx.counts.cat[cat] == null) continue;
      let EgCat = 0;
      if (joint.total > 0) ctx.groups.forEach((g, i) => { g.cands.forEach((cd, k) => { if (cd.cat === cat) EgCat += joint.candW[i][k] / joint.total; }); });
      const relocC = ctx.wEnt.filter((e) => SHAPES[e.key] && SHAPES[e.key].cat === cat).length;
      const target = Math.max(0, ctx.counts.cat[cat] - EgCat - relocC);
      let cur = 0, wsum = 0;
      for (const key in Esh) if (shapeCov[key].cat === cat) { cur += Esh[key]; wsum += shapeW[key]; }
      for (const key in Esh) {
        if (shapeCov[key].cat !== cat) continue;
        Esh[key] = cur > 0 ? Esh[key] * target / cur : (wsum > 0 ? target * shapeW[key] / wsum : 0);
      }
    }
    for (const s of sizes) { Es[s] = 0; }
    for (const key in Esh) Es[shapeCov[key].size] = (Es[shapeCov[key].size] || 0) + Esh[key];
    if (Object.keys(ctx.counts.cat).length) { let t = 0; for (const key in Esh) t += Esh[key]; Etotal = t; }
    const occU = new Float64Array(NN);
    for (const key in Esh) {
      const x = shapeCov[key];
      if (!Esh[key] || !x.V) continue;
      for (let c = 0; c < NN; c++) occU[c] += Esh[key] * x.cov[c] / x.V;
    }
    const notOcc = new Float64Array(NN);
    for (let c = 0; c < NN; c++) notOcc[c] = 1 - Math.min(0.98, occU[c]);

    // ワープで動いた個体
    const entP = [];
    for (const e of ctx.wEnt) {
      if (e.size < 2) {
        // ワープしたアッド：1マスの候補
        const forb = ctx.xMaskAfter(e.t) | ctx.deadMask | e.oldMask | ctx.oldMaskAfter(e.t) | ctx.hitMask | certainCover;
        const cells = [];
        for (let c = 0; c < NN; c++) if (!(forb & bit(c))) cells.push(c);
        if (!cells.length) continue;
        const p = new Float64Array(NN);
        for (const c of cells) p[c] = 1 / cells.length;
        entP.push({ p, ent: e });
        continue;
      }
      const forb = ctx.xMaskAfter(e.t) | ctx.deadMask | e.oldMask | ctx.oldMaskAfter(e.t) | ctx.hitMask | ctx.occMaskBefore(e.t) | ctx.lineZeroMask | certainCover | (reveal && e.t > reveal.t ? reveal.R : 0);
      const p = new Float64Array(NN);
      let V = 0;
      for (const P of PL[e.key]) { if (P.mask & forb) continue; V++; for (const c of P.cells) p[c] += 1; }
      if (!V) continue;
      const hitLater = ctx.groups.some((g) => g.t > e.t);
      const scale = (hitLater ? 0.5 : 1) / V;
      for (let c = 0; c < NN; c++) p[c] *= scale;
      entP.push({ p, ent: e });
    }
    // アッド（列だけ分かっている）
    for (const a of ctx.addEnt) {
      const forb = ctx.xMaskAfter(a.t) | ctx.deadMask | ctx.oldMaskAfter(a.t) | ctx.hitMask | certainCover;
      const cells = [];
      for (let r = 0; r < N; r++) { const c = r * N + a.col; if (!(forb & bit(c))) cells.push(c); }
      if (!cells.length) continue;
      const p = new Float64Array(NN);
      for (const c of cells) p[c] = 1 / cells.length;
      entP.push({ p, ent: a, isAdd: true });
    }
    // 位置の分かっている未ヒット個体
    for (const o of occPseudo) {
      const p = new Float64Array(NN);
      if (o.size === 1) { p[o.c] = 1; entP.push({ p, occ: o }); continue; }   // サーチサイズで見つけたアッド
      let Z = 0;
      for (const sh of prior) {
        if (o.cat && SHAPES[sh.key].cat !== o.cat) continue;
        if (o.size && sh.size !== o.size) continue;
        const T = PL[sh.key].length;
        for (const P of PL[sh.key]) {
          if (!(P.mask & bit(o.c)) || (P.mask & (forbidA & ~bit(o.c)))) continue;
          const w = sh.prior / T;
          Z += w;
          for (const c of P.cells) p[c] += w;
        }
      }
      if (Z <= 0) continue;
      for (let c = 0; c < NN; c++) p[c] /= Z;
      entP.push({ p, occ: o });
    }

    const P = new Float64Array(NN);
    for (let c = 0; c < NN; c++) {
      let none = notOcc[c];
      for (const e of entP) none *= 1 - Math.min(0.999, e.p[c]);
      P[c] = 1 - none;
    }
    // サーチラインの結果（その列・行で埋まっているマスの数）に合うように、列・行ごとに見込みを合わせる。
    // 分かっている「埋まっている」マス（ヒット・確定した個体）と「空き」（×・撃破済み）を除いた残りで、
    // ◎個体の候補が埋める見込みを引き、足りない分を見つけていない個体の見込みとして配り直す
    const lines = ctx.counts.lines.filter((L) => L.n > 0);
    if (lines.length) {
      const known1 = ctx.hitMask | certainCover;
      const known0 = lineKnownEmpty(ctx);
      const tP = (c) => (joint.total > 0 ? Math.min(1, joint.cellW[c] / joint.total) : 0);
      for (let it = 0; it < 6; it++) {
        for (const L of lines) {
          let K = 0, T = 0, S = 0, room = 0;
          const freeCells = [];
          for (let c = 0; c < NN; c++) {
            if (!(L.mask & bit(c))) continue;
            if (known1 & bit(c)) { K++; continue; }
            if (known0 & bit(c)) continue;
            const t = tP(c);
            T += t; S += (1 - t) * P[c]; room += 1 - t;
            freeCells.push(c);
          }
          if (!freeCells.length) continue;
          const R = L.n - K - T;
          if (R <= 1e-6) { for (const c of freeCells) P[c] = 0; continue; }
          if (S > 1e-9) { const f = R / S; for (const c of freeCells) P[c] = Math.min(0.995, P[c] * f); }
          else if (room > 0) for (const c of freeCells) P[c] = Math.min(0.995, R / room);
        }
      }
    }
    // バズーカの後：R（動いていない個体のマス）は確実に埋まっていて、それ以外にいるのは公開の後にワープした個体だけ
    if (reveal) {
      for (let c = 0; c < NN; c++) {
        if (reveal.R & bit(c)) { P[c] = 0.995; continue; }
        let none = 1;
        for (const e of entP) if (e.ent && e.ent.t > reveal.t) none *= 1 - Math.min(0.999, e.p[c]);
        P[c] = 1 - none;
      }
    }
    return { P, occU, entP, Etotal, Es, q, occPseudo, kDist, shapeW };
  }

  function lineKnownEmpty(ctx) {
    let lastW = -1;
    for (const w of ctx.kb.warps) if (w.t > lastW) lastW = w.t;
    return ctx.deadMask | ctx.xMaskAfter(lastW) | ctx.lineZeroMask;
  }
  // サーチラインの見積もり：その列・行で埋まっているマスの数の分布（マスごとに独立とみなす）の情報量
  function lineOptions(A) {
    const ctx = A.ctx, N = ctx.N, NN = ctx.NN, P = A.hunt.P;
    const known1 = ctx.hitMask | A.certainCover, known0 = lineKnownEmpty(ctx);
    const done = new Set(ctx.counts.lines.map((L) => L.mask));
    const out = [];
    for (const line of ['row', 'col']) for (let i = 0; i < N; i++) {
      const lm = lineMask(line, i, N);
      if (done.has(lm)) continue;
      let dist = new Float64Array([1]);
      for (let c = 0; c < NN; c++) {
        if (!(lm & bit(c)) || (known1 & bit(c)) || (known0 & bit(c))) continue;
        const t = A.targetP[c];
        const p = Math.min(1, t + (1 - t) * P[c]);
        if (p <= 0 || p >= 1) continue;
        dist = convolve(dist, new Float64Array([1 - p, p]));
      }
      out.push({ params: { line, index: i }, H: entropyOf(dist) });
    }
    return out;
  }

  // ------------------------------------------------------------------
  // サーチキューブの見積もり
  //  結果＝「◎個体のうち当てはまる数」＋「まだ見つけていない個体のうち当てはまる数」。
  //  前者は全探索の分布、後者は索敵モデルの「未発見の個体数の分布」と「形ごとの重み」から求める。
  //  結果の分かれ方（情報量）のうち、◎個体の絞り込みに効く分を infoA として分けて返す
  // ------------------------------------------------------------------
  function entropyOf(arr) {
    let tot = 0, h = 0;
    for (let i = 0; i < arr.length; i++) tot += arr[i];
    if (tot <= 0) return 0;
    for (let i = 0; i < arr.length; i++) if (arr[i] > 0) { const p = arr[i] / tot; h -= p * Math.log2(p); }
    return h;
  }
  function convolve(a, b) {
    const out = new Float64Array(a.length + b.length - 1);
    for (let i = 0; i < a.length; i++) if (a[i]) for (let j = 0; j < b.length; j++) out[i + j] += a[i] * b[j];
    return out;
  }
  function binomDist(k, p) {
    const out = new Float64Array(k + 1);
    let c = 1;
    for (let i = 0; i <= k; i++) { out[i] = c * Math.pow(p, i) * Math.pow(1 - p, k - i); c = c * (k - i) / (i + 1); }
    return out;
  }
  function cubeOptions(A) {
    const ctx = A.ctx, H = A.hunt, J = A.joint;
    if (ctx.groups.length && !(J.total > 0)) return [];
    const queries = [];
    for (const s of [2, 3, 4, 5]) if (ctx.counts.size[s] == null && ctx.stockBound[s] > 0) queries.push({ kind: 'size', value: s, match: (key) => SHAPES[key].size === s });
    for (const c of CATS) if (ctx.counts.cat[c] == null) queries.push({ kind: 'cat', value: c, match: (key) => SHAPES[key].cat === c });
    let totalW = 0;
    for (const key in H.shapeW) totalW += H.shapeW[key];
    const out = [];
    for (const qy of queries) {
      // まだ見つけていない個体：k 個体いるとき、それぞれが当てはまる確率 p
      let pm = 0;
      for (const key in H.shapeW) if (qy.match(key)) pm += H.shapeW[key];
      const p = totalW > 0 ? pm / totalW : 0;
      const U = new Float64Array(H.kDist.length);
      for (let k = 0; k < H.kDist.length; k++) {
        if (!H.kDist[k]) continue;
        const b = binomDist(k, p);
        for (let i = 0; i <= k; i++) U[i] += H.kDist[k] * b[i];
      }
      // 場所の分かっている未ヒット個体（形状・マス数が分かっていれば、それで絞る）
      let R = U;
      for (const o of H.occPseudo) {
        let a = 0, z = 0;
        for (const key in H.shapeW) {
          if (o.cat && SHAPES[key].cat !== o.cat) continue;
          if (o.size && SHAPES[key].size !== o.size) continue;
          z += H.shapeW[key];
          if (qy.match(key)) a += H.shapeW[key];
        }
        const po = z > 0 ? a / z : 0;
        R = convolve(R, new Float64Array([1 - po, po]));
      }
      // ワープで動いた個体（形が分かっている）
      let shift = 0;
      for (const e of ctx.wEnt) if (SHAPES[e.key] && qy.match(e.key)) shift++;
      if (shift) { const t = new Float64Array(R.length + shift); for (let i = 0; i < R.length; i++) t[i + shift] = R[i]; R = t; }
      // ◎個体のうち当てはまる数
      let D = new Float64Array([1]);
      if (ctx.groups.length) {
        const arr = qy.kind === 'size' ? J.qSize[qy.value] : J.qCat[CAT_INDEX[qy.value]];
        D = new Float64Array(arr.length);
        for (let i = 0; i < arr.length; i++) D[i] = arr[i] / J.total;
      }
      const Hn = entropyOf(convolve(D, R)), HR = entropyOf(R), HD = entropyOf(D);
      out.push({ params: { kind: qy.kind, value: qy.value }, Hn, infoA: Math.max(0, Hn - HR), infoR: Math.max(0, Hn - HD) });
    }
    return out;
  }

  // ------------------------------------------------------------------
  // 判断
  // ------------------------------------------------------------------
  function H2(p) { if (p <= 0 || p >= 1) return 0; return -(p * Math.log2(p) + (1 - p) * Math.log2(1 - p)); }
  function pickMax(cells, score, rng) {
    let best = -Infinity, list = [];
    for (const c of cells) {
      const s = score(c);
      if (s > best + 1e-9) { best = s; list = [c]; } else if (Math.abs(s - best) <= 1e-9) list.push(c);
    }
    if (!list.length) return null;
    return list[Math.floor((rng || Math.random)() * list.length)];
  }
  function callableCells(game, pi) {
    const out = [];
    for (let c = 0; c < game.NN; c++) if (game.isCallable(pi, c)) out.push(c);
    return out;
  }

  function chooseCall(game, pi, A) {
    const rng = game.rng;
    const me = game.players[pi];
    A = A || analyze(me.kb, game.N, rng, policy[pi]);
    let cells = callableCells(game, pi);
    let exclude = 0;
    for (const ce of A.certain) exclude |= ce.cand.mask;
    const pool = cells.filter((c) => !(exclude & bit(c)));
    if (pool.length) cells = pool;
    // バズーカの後：R の中のマスは必ず当たる。どの敷き詰め方かがいちばん割れるマス（＋撃破できそうなマス）を選ぶ
    if (revealReady(A)) {
      const rv = A.reveal;
      const inR = cells.filter((c) => rv.R & bit(c));
      if (inR.length) {
        const hitM = A.ctx.hitMask;
        const sc = new Map();
        for (const c of inR) {
          let kill = 0, tot = 0;
          const h = revealEntropy(rv, (Tl) => {
            const T = Tl.tiles[Tl.own[c]];
            if (!T) return '-';
            const rest = T.mask & ~hitM & ~bit(c);
            if (!rest && !T.info.full) { kill += Tl.w; }
            tot += Tl.w;
            return (T.info.hits ? 'o' : 'oo') + (rest ? '' : ':' + T.mask);
          });
          sc.set(c, h + 0.3 * (tot > 0 ? kill / tot : 0));
        }
        return pickMax(inR, (c) => sc.get(c), rng);
      }
    }
    const certainSet = new Set(A.certain.map((x) => x.gi));
    const uncertain = A.ctx.groups.filter((g, i) => !certainSet.has(i));
    const hp = A.hunt.P;
    if (uncertain.length && A.joint.total > 0) {
      const scored = cells.map((c) => ({ c, s: H2(A.targetP[c]) + 0.35 * (1 - A.targetP[c]) * hp[c] }));
      const best = Math.max(...scored.map((x) => x.s));
      if (best > 0.02) return pickMax(cells, (c) => H2(A.targetP[c]) + 0.35 * (1 - A.targetP[c]) * hp[c], rng);
    }
    const best = pickMax(cells, (c) => hp[c] + 0.15 * A.targetP[c] * (1 - A.targetP[c]), rng);
    return best != null ? best : cells[Math.floor(rng() * cells.length)];
  }

  // 確定した個体のアンサー（1件ずつ。成功後は解析し直す）
  function chooseAnswer(game, pi) {
    const me = game.players[pi];
    const A = analyze(me.kb, game.N, game.rng, policy[pi]);
    if (!A.certain.length) return null;
    A.certain.sort((a, b) => b.cand.size - a.cand.size);
    return A.certain[0].cand.cells.slice();
  }

  function chooseTreasure(game, pi, A) {
    const rng = game.rng;
    const me = game.players[pi];
    const kb = me.kb;
    const N = game.N, NN = game.NN;
    A = A || analyze(kb, N, rng, policy[pi]);
    const ctx = A.ctx;
    const lastGray = kb.grays.length ? kb.grays[kb.grays.length - 1] : -1;
    const logs = kb.tlogs.filter((l) => l.t > lastGray);
    const occ = new Float64Array(NN);
    if (lastGray >= 0) {
      // トレジャー入りの個体がワープした後：その個体の候補を優先
      const ent = A.hunt.entP.find((e) => e.ent && e.ent.treasure);
      if (ent) for (let c = 0; c < NN; c++) occ[c] += ent.p[c];
      ctx.groups.forEach((g, i) => {
        if (g.t <= lastGray || !(A.joint.total > 0)) return;
        g.cands.forEach((cd, k) => { const w = A.joint.candW[i][k] / A.joint.total; for (const c of cd.cells) occ[c] += w; });
      });
    }
    let any = false;
    for (let c = 0; c < NN; c++) if (occ[c] > 0) { any = true; break; }
    if (!any) {
      for (const d of kb.deads) if (!d.isAdd) for (const c of d.cells) occ[c] = Math.max(occ[c], 0.8);
      for (let c = 0; c < NN; c++) occ[c] = Math.max(occ[c], A.targetP[c], A.hunt.P[c] * 0.9);
      for (const e of A.hunt.entP) if (e.isAdd) for (let c = 0; c < NN; c++) occ[c] = Math.max(0, occ[c] - e.p[c] * 0.5);
    }
    const sameKnown = (x, y) => {
      for (const d of kb.deads) if ((d.mask & bit(x)) && (d.mask & bit(y))) return 1;
      if (A.joint.sameW && A.joint.total > 0) return Math.min(1, A.joint.sameW[x * NN + y] / A.joint.total);
      return 0;
    };
    const dist = (x, y) => Math.abs(Math.floor(x / N) - Math.floor(y / N)) + Math.abs((x % N) - (y % N));
    const score = (x) => {
      let s = occ[x];
      if (s <= 0) return 0;
      for (const l of logs) {
        if (l.r === 'H') continue;
        const d = dist(x, l.c);
        const same = sameKnown(x, l.c);
        if (l.r === 'N') {
          if (d === 1) continue;
          if (x === l.c) { s *= 0.05; continue; }
          s *= Math.max(same, d <= 4 ? 0.25 : 0.03);
        } else {
          if (x === l.c || d === 1) { s = 0; break; }
          s *= (1 - same) * (d <= 4 ? 0.85 : 1);
        }
      }
      return s;
    };
    const cells = [];
    for (let c = 0; c < NN; c++) if (game.isTreasureCallable(pi, c)) cells.push(c);
    const best = pickMax(cells, score, rng);
    return best != null ? best : cells[Math.floor(rng() * cells.length)];
  }

  // 相手から見た自分の個体の危険度
  function exposure(game, pi) {
    const foe = game.players[1 - pi];
    const me = game.players[pi];
    const B = analyze(foe.kb, game.N, game.rng);
    const out = new Map();
    for (const p of me.pieces) if (p.alive) out.set(p.id, { danger: 0, hitsLeft: p.size - popcount(p.hitMask), cands: Infinity });
    B.ctx.groups.forEach((g, i) => {
      const p = game.pieceAt(pi, g.c);
      if (!p) return;
      let live = 0;
      if (B.joint.exact && B.joint.total > 0) { for (let k = 0; k < g.cands.length; k++) if (B.joint.candW[i][k] > 0) live++; }
      else live = g.cands.length;
      const info = out.get(p.id);
      if (info) { info.cands = live; info.danger = live <= 0 ? 0 : 1 / live; }
    });
    // バズーカの後：相手の敷き詰めで確定している個体は、次の手番でアンサーされる
    if (B.reveal && B.reveal.count > 0) {
      for (const p of me.pieces) {
        if (!p.alive) continue;
        const info = out.get(p.id);
        if (!info) continue;
        if (B.certain.some((ce) => ce.cand.mask === p.mask)) { info.cands = 1; info.danger = 1; info.revealed = true; continue; }
        if (revealReady(B)) {
          // その置き方が出てくる割合
          let w = 0;
          for (const Tl of B.reveal.tilings) if (Tl.tiles.some((T) => T.mask === p.mask)) w += Tl.w;
          const share = B.reveal.total > 0 ? w / B.reveal.total : 0;
          if (share > info.danger) { info.danger = share; info.revealed = true; }
        }
      }
    }
    return out;
  }

  function bestWarpTarget(game, pi, piece) {
    const N = game.N;
    const opts = [];
    for (let t = 0; t < 8; t++) {
      const o = ORIENT[piece.shape][t];
      for (let r0 = 0; r0 + o.h <= N; r0++) for (let c0 = 0; c0 + o.w <= N; c0++) {
        const params = { pieceId: piece.id, t, r0, c0 };
        if (game.validateItem(pi, 'warp', params).ok) opts.push(params);
      }
    }
    if (!opts.length) return null;
    // 相手がすでに×を付けたマスを少し好む（見落とされやすい）
    const foeView = game.players[1 - pi].view;
    const score = (p) => {
      const cells = cellsFor(piece.shape, p.t, p.r0, p.c0, N);
      let s = 0;
      for (const c of cells) if (foeView.marks[c] && foeView.marks[c].r === 'x') s += 1;
      return s + game.rng() * 1.5;
    };
    opts.sort((a, b) => score(b) - score(a));
    return opts[0];
  }

  function bestAddCell(game, pi) {
    const N = game.N;
    let bestCells = [];
    for (let col = 0; col < N; col++) {
      const cells = [];
      for (let r = 0; r < N; r++) { const c = r * N + col; if (game.validateItem(pi, 'add', { cell: c }).ok) cells.push(c); }
      if (cells.length > bestCells.length || (cells.length === bestCells.length && game.rng() < 0.5)) bestCells = cells;
    }
    if (!bestCells.length) return null;
    return bestCells[Math.floor(game.rng() * bestCells.length)];
  }

  // 防御のワープ：見破られかけた（またはバズーカで場所が知られた）個体を逃がす
  function defensiveWarp(game, pi, free) {
    const me = game.players[pi];
    const living = game.living(pi);
    const livingReal = living.filter((p) => !p.isAdd);
    const ex = exposure(game, pi);
    let best = null, bestV = 0;
    for (const p of living) {
      if (p.isAdd) continue;
      const e = ex.get(p.id);
      if (!e) continue;
      const hits = popcount(p.hitMask);
      if (!hits && !e.revealed) continue;
      const danger = Math.max(e.danger, e.hitsLeft <= 1 ? 0.9 : 0);
      const last = livingReal.length === 1 ? 4 : 0;
      const value = (p.size + last + (me.treasure && me.treasure.pieceId === p.id ? 1 : 0)) * danger;
      if (danger >= 0.5 && value > bestV && (p.size >= 3 || last || e.revealed)) { best = p; bestV = value; }
    }
    if (best && (free('warp') || best.size >= 4 || livingReal.length === 1)) {
      const tgt = bestWarpTarget(game, pi, best);
      if (tgt) return { key: 'warp', params: tgt };
    }
    return null;
  }

  // バズーカの後のアイテム。undefined＝ふだんの判断にまかせる
  //  ・相手の個体がすべて確定していれば何も使わない（コールの後のアンサーで全滅させられる）
  //  ・確定していなければ、コールの結果を見てから、敷き詰め方がいちばん割れるアイテムを選ぶ。
  //    それで全部確定しそうにないときは、知られた自分の個体をワープで逃がすほうを優先する
  function revealItemChoice(game, pi, A, stage, free, can) {
    if (!revealReady(A)) return undefined;
    const rv = A.reveal, ctx = A.ctx, N = game.N;
    const certMask = A.certain.reduce((m, ce) => m | ce.cand.mask, 0);
    const open = rv.R & ~certMask;
    if (!open && !rv.warpedAfter) return null;
    if (stage === 'pre') return null;
    let best = null;
    if (open) {
      const cellsR = bitsOf(open);
      const tileAt = (Tl, c) => Tl.tiles[Tl.own[c]] || null;
      // 結果ごとに敷き詰め方を分け、割れ方（情報量）と「1通りに決まる見込み」を測る
      const evalKey = (key, params, fn, k) => {
        const m = new Map();
        let tot = 0;
        for (const Tl of rv.tilings) { const o = fn(Tl); const e = m.get(o) || { w: 0, n: 0 }; e.w += Tl.w; e.n++; m.set(o, e); tot += Tl.w; }
        if (!(tot > 0)) return;
        let h = 0, res = 0;
        for (const e of m.values()) { const p = e.w / tot; if (p > 0) h -= p * Math.log2(p); if (e.n === 1) res += p; }
        h *= k || 1;
        if (h < 0.25) return;
        if (!best || res > best.res + 1e-9 || (Math.abs(res - best.res) <= 1e-9 && h > best.h)) best = { key, params, h, res };
      };
      for (const c of cellsR) {
        if (free('shape')) evalKey('shape', { cell: c }, (Tl) => { const T = tileAt(Tl, c); return T ? T.cat : '-'; });
        if (free('number')) evalKey('number', { cell: c }, (Tl) => { const T = tileAt(Tl, c); return T ? T.size : 0; });
        if (free('dist') && !(ctx.ooMask & bit(c))) evalKey('dist', { cell: c }, (Tl) => { const T = tileAt(Tl, c); return T && T.info.oo >= 0 ? blockDist(c, T.info.oo, N) : 'nd'; });
      }
      if (free('pair')) {
        for (let i = 0; i < cellsR.length; i++) for (let j = i + 1; j < cellsR.length; j++) {
          const a = cellsR[i], b = cellsR[j];
          evalKey('pair', { a, b }, (Tl) => (Tl.own[a] >= 0 && Tl.own[a] === Tl.own[b] ? 1 : 0), 0.95);
        }
      }
      if (free('cube')) {
        for (const sz of [2, 3, 4, 5]) if (ctx.counts.size[sz] == null) evalKey('cube', { kind: 'size', value: sz }, (Tl) => Tl.tiles.filter((T) => T.size === sz).length);
        for (const ct of CATS) if (ctx.counts.cat[ct] == null) evalKey('cube', { kind: 'cat', value: ct }, (Tl) => Tl.tiles.filter((T) => T.cat === ct).length);
      }
    }
    if (best && best.res >= 0.5) return { key: best.key, params: best.params };
    const w = can('warp') ? defensiveWarp(game, pi, free) : null;
    if (w) return w;
    if (best) return { key: best.key, params: best.params };
    return rv.warpedAfter ? undefined : null;
  }

  // stage: 'pre'＝コール前、'post'＝コール後（どちらかで1手番1つまで）
  function chooseItem(game, pi, stage) {
    stage = stage || 'pre';
    const pol = policy[pi] || {};
    const cubeMode = pol.cube || 'eig';
    const me = game.players[pi];
    const N = game.N, NN = game.NN;
    const rng = game.rng;
    const can = (k) => game.itemStatus(pi, k).usable;
    const free = (k) => game.itemStatus(pi, k).usable && game.players[pi].items[k] > 0;
    const living = game.living(pi);
    const livingReal = living.filter((p) => !p.isAdd);

    // 0) バズーカの後：相手の個体のマスが全部分かっている
    if (me.kb.reveal) {
      const r = revealItemChoice(game, pi, analyze(me.kb, N, rng, pol), stage, free, can);
      if (r !== undefined) return r;
    }

    // 1) 防御：見破られかけた個体をワープで逃がす
    if (can('warp')) {
      const w = defensiveWarp(game, pi, free);
      if (w) return w;
    }

    const A = analyze(me.kb, N, rng, pol);
    const ctx = A.ctx;

    // 2) ステルス：あと1マスで撃破されるキューブ、または最後の1個体を、アンサーでしか倒せないようにする
    if (free('stealth')) {
      let best = null, bestV = 0;
      for (const p of living) {
        if (p.stealth) continue;
        const hitsLeft = p.size - popcount(p.hitMask);
        const v = (hitsLeft <= 1 ? 2 : 0) + (livingReal.length === 1 ? 1.5 : 0) + p.size * 0.1;
        if (v >= 1.5 && v > bestV) { bestV = v; best = p; }
      }
      if (best) return { key: 'stealth', params: { pieceId: best.id } };
    }

    // 4) 攻撃用アイテム
    const certainSet = new Set(A.certain.map((x) => x.gi));
    const uncertain = ctx.groups.map((g, i) => i).filter((i) => !certainSet.has(i));
    if (uncertain.length && A.joint.total > 0) {
      // 絞り込み系はコールの結果を見てから使う
      if (stage === 'pre') return null;
      const entropy = (wmap) => { let tot = 0, h = 0; for (const k in wmap) tot += wmap[k]; for (const k in wmap) { const p = wmap[k] / tot; if (p > 0) h -= p * Math.log2(p); } return h; };
      // 候補の割れ方（情報量）がいちばん大きいアイテムを使う
      let best = null, bestH = 0.6;
      const consider = (key, params, h) => { if (h > bestH) { bestH = h; best = { key, params }; } };
      // サーチシェイプ（形状）・サーチサイズ（マス数）：候補が割れている◎
      for (const i of uncertain) {
        const g = ctx.groups[i];
        const catW = {}, sizeW = {};
        g.cands.forEach((cd, k) => { const w = A.joint.candW[i][k]; catW[cd.cat] = (catW[cd.cat] || 0) + w; sizeW[cd.size] = (sizeW[cd.size] || 0) + w; });
        if (free('shape')) consider('shape', { cell: g.c }, entropy(catW));
        if (free('number')) consider('number', { cell: g.c }, entropy(sizeW));
      }
      // ペアショット：ヒットのマスと、同じ個体か分からないマスの組
      if (free('pair') && A.joint.sameW) {
        const hits = ctx.U.filter((u) => me.view.marks[u.c] && !me.view.dead[u.c]).map((u) => u.c);
        for (const a of hits) for (let b = 0; b < NN; b++) {
          if (b === a || me.view.dead[b]) continue;
          const p = A.joint.sameW[a * NN + b] / A.joint.total;
          consider('pair', { a, b }, H2(Math.min(1, p)) * 0.95);
        }
      }
      // ディスタンスショット：◎までのブロック数（NoData を含む）が割れているマス
      if (free('dist') && A.joint.distW) {
        for (const [c, arr] of A.joint.distW) {
          if (me.view.dead[c] || (me.view.marks[c] && me.view.marks[c].r === 'oo')) continue;
          const wmap = {};
          for (let k = 0; k < arr.length; k++) if (arr[k] > 0) wmap[k] = arr[k];
          consider('dist', { cell: c }, entropy(wmap));
        }
      }
      // サーチライン：その列・行で埋まっているマスの数の割れ方（◎の候補と、見つけていない個体の両方に効く）
      if (free('line')) {
        const lp = pol.linePost != null ? pol.linePost : 0.5;
        for (const o of lineOptions(A)) consider('line', o.params, lp * o.H);
      }
      // サーチキューブ：◎個体の絞り込みに効く分＋まだ見つけていない個体の情報（少し割り引く）
      if (cubeMode === 'eig' && free('cube')) {
        const beta = pol.beta != null ? pol.beta : 0.3;
        for (const o of cubeOptions(A)) consider('cube', o.params, (1 - beta) * o.infoA + beta * o.Hn);
      }
      if (best) return best;
    }
    if (!ctx.groups.length || !uncertain.length) {
      // 索敵中
      const hp = A.hunt.P;
      const cells = callableCells(game, pi).filter((c) => hp[c] > 0.05);
      // サーチライン：埋まっているマスの数の割れ方がいちばん大きい列・行
      let lineBest = null, lineS = pol.lineMin != null ? pol.lineMin : 0.6;
      if (free('line') && cells.length >= 3) {
        const lk = pol.lineK != null ? pol.lineK : 1.0;
        for (const o of lineOptions(A)) { const v = lk * o.H; if (v > lineS) { lineS = v; lineBest = o.params; } }
      }
      // サーチキューブ：見つけていない個体の数とマス数・形状の割れ方が大きければ、サーチラインより優先
      if (cubeMode === 'eig' && free('cube') && game.turn >= (pol.minTurn || 1)) {
        const bh = pol.huntBeta != null ? pol.huntBeta : 1.0;
        let cb = null;
        for (const o of cubeOptions(A)) { const v = bh * o.Hn; if (!cb || v > cb.v) cb = { v, params: o.params }; }
        if (cb && cb.v >= (pol.huntMin != null ? pol.huntMin : 0.3) && cb.v > (lineBest ? lineS : 0)) return { key: 'cube', params: cb.params };
      }
      if (lineBest) return { key: 'line', params: lineBest };
      // 当たりそうなマスを、コールせずに中身ごと調べる（マス数か形状）
      const probeKey = free('number') ? 'number' : free('shape') ? 'shape' : null;
      if (probeKey && cells.length >= 3) {
        const sorted = cells.slice().sort((a, b) => hp[b] - hp[a]);
        const probe = sorted[1];
        if (probe != null && hp[probe] > 0.2 && hp[probe] < 0.95) return { key: probeKey, params: { cell: probe } };
      }
      if (cubeMode === 'old' && free('cube') && game.turn >= 4 && ctx.counts.size[5] == null && ctx.sizeAllowed(5) && A.hunt.Es[5] > 0.3) {
        return { key: 'cube', params: { kind: 'size', value: 5 } };
      }
    }
    return null;
  }

  function chooseSacrifice(game, pi) {
    const living = game.living(pi);
    const add = living.find((p) => p.isAdd);
    if (add) return add.id;
    let ex = null;
    try { ex = exposure(game, pi); } catch (e) { ex = null; }
    living.sort((a, b) => {
      if (a.size !== b.size) return a.size - b.size;
      const da = ex && ex.get(a.id) ? ex.get(a.id).danger : 0;
      const db = ex && ex.get(b.id) ? ex.get(b.id).danger : 0;
      return db - da;
    });
    return living[0].id;
  }

  // 配置：個体数とサイズを散らし、隣接を避けた配置を選ぶ
  function setup(game, pi) {
    const N = game.N, rng = game.rng;
    const templates = N === 4

  const on = (T, k) => !T.only || T.only === k;
  const TRACKS = {
    calm: {
      bpm: 84, fadeIn: 2.5, rev: 0.4,
      play(G, T, step, t, q) {
        const bar = Math.floor(step / 16) % 8, s = step % 16;
        const ch = CALM[bar] || CALM[bar - 1], D = T.out;
        if (s === 0 && CALM[bar] && on(T, 'pad')) pad(G, t, ch.pad, (CALM[bar + 1] === null ? 32 : 16) * q, 0.016, 1100, D);
        if (s === 0 && on(T, 'bass')) tone(G, t, { type: 'triangle', f: mtof(ch.b), a: 0.06, hold: 10 * q, d: 1.0, v: 0.09, dest: D });
        if (s === 8 && bar % 2 === 1 && on(T, 'bass')) tone(G, t, { type: 'triangle', f: mtof(ch.b + 7), a: 0.04, hold: 4 * q, d: 0.6, v: 0.05, dest: D });
        if (s % 2 === 0 && on(T, 'arp')) {

        if (s === 14 && bar % 4 === 3 && on(T, 'bell')) bell(G, t, { f: mtof(ch.arp[4] + 12), ratio: 2, index: 0.4, d: 1.4, v: 0.04, dest: D, echo: 0.6, echoTo: T.echo });

      bpm: 120, fadeIn: 0.5, rev: 0.2,

        if (s === 0 && on(T, 'pad')) pad(G, t, ch.pad, 16 * q, hot ? 0.012 : 0.01, hot ? 1600 : 950, D);
        if ((hot || s % 2 === 0) && on(T, 'bass')) {

        }

          if (s === 0 || s === 8 || (hot && (s === 4 || s === 12)) || (!hot && s === 11 && bar % 2 === 1)) kick(G, t, 0.3, D);

        }
        if ((bar >= 4 || hot) && s % 2 === 0 && on(T, 'arp')) {
          const i = [0, 1, 2, 3, 2, 1, 0, 2][s / 2];
          tone(G, t, { type: 'square', f: mtof(ch.arp[i]), a: 0.003, d: q * 1.8, v: 0.045, lp: 2600, dest: D, echo: 0.5, echoTo: T.echo });
        }
        if (s === 13 && bar % 2 === 0 && on(T, 'bell')) bell(G, t, { f: mtof(ch.arp[3] + 12), ratio: 3.01, index: 0.7, d: 0.35, v: 0.035, dest: D, echo: 0.6, echoTo: T.echo });
      },
    },
  };
  // 曲ごとの出口（音量フェード用）とこだま
  function makeTrack(G, name, level, delay) {
    const ctx = G.ctx, def = TRACKS[name], now = ctx.currentTime;
    const T = { name, def, level: level || 1, step: 0, next: now + (delay || 0) + 0.06 };
    T.out = ctx.createGain();
    T.out.gain.setValueAtTime(0.0001, now);
    T.out.gain.setValueAtTime(0.0001, T.next);
    T.out.gain.exponentialRampToValueAtTime(1, T.next + def.fadeIn);
    T.out.connect(G.bgm);
    T.out.connect(gainNode(ctx, def.rev, G.rev));
    T.echo = ctx.createDelay(2);
    T.echo.delayTime.value = (60 / def.bpm) * 0.75;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    T.fb = gainNode(ctx, 0.36, T.echo);
    T.echo.connect(lp); lp.connect(T.fb); lp.connect(gainNode(ctx, 0.55, T.out));
    return T;
  }

    facts.sort((a, b) => a.t - b.t);
    for (const f of facts) {
      if (f.nd) { put(f.c, 'nd', { t: f.t, turn: f.turn, src: f.src, stale: f.stale }); put(f.c, 'shape', null); put(f.c, 'size', null); continue; }
      put(f.c, f.src === 'shape' ? 'shape' : 'size', { v: f.v, stale: f.stale, turn: f.turn });
      put(f.c, 'nd', null);
    }
    // ディスタンスショット：そのマスの最新の結果（数字か NoData）
    //  数字：その個体がそのマスから動くまで有効（動けば W付きの×になる）
    //  NoData：その後のワープ・新しい◎で変わりうる（薄く表示）
    const leftAfter = (c, t) => kb.warps.some((w) => w.t > t && (w.oldMask & bit(c)));
    const newFirstHitAfter = (t) => kb.calls.some((k) => k.r === 'oo' && k.t > t);
    for (const D of (kb.dists || [])) {
      put(D.c, 'dist', { v: D.k, t: D.t, turn: D.turn, left: D.k != null && leftAfter(D.c, D.t),
        stale: D.k == null && (relocatedAfter(D.t) || newFirstHitAfter(D.t)) });
    }
    const pairs = [];
    const pairLatest = new Map();
    for (const p of kb.pairs) pairLatest.set(Math.min(p.a, p.b) + ':' + Math.max(p.a, p.b), p);
    for (const p of pairLatest.values()) {
      if (view.dead[p.a] || view.dead[p.b]) continue;
      pairs.push({ a: p.a, b: p.b, same: p.same, stale: warpedAfter(p.t), turn: p.turn });
    }
    return { tags, cells, pairs, observer, fieldOwner };
  }

  function intelTagsHTML(intel, mine) {
    if (!intel || !intel.tags.length) return '';
    return `<div class="intel ${mine ? 'mine' : 'enemy'}" aria-label="調査の記録">` + intel.tags.map((t) =>
      `<span class="itag${t.stale ? ' stale' : ''}" data-tip="${esc(t.tip)}">${ICON[t.key]}${esc(t.label)}<b>${t.n}</b>${t.unit}<small>T${pad2(t.turn)}</small></span>`
    ).join('') + '</div>';
  }
  // マスの左上に「形状＋マス数」（例：L4、C3、#2）。空きマスだったときは、マスの中央に NoData を出す（cellMarkHTML）
  function cellTagHTML(intel, c) {
    if (!intel || !intel.cells[c]) return '';
    const a = intel.cells[c];
    if (!a.shape && !a.size) return '';
    let s = '';
    if (a.shape) s += SHAPE_ABBR[a.shape.v] || a.shape.v;
    if (a.size) s += (a.shape ? '' : '#') + a.size.v;
    const stale = (a.shape && a.shape.stale) || (a.size && a.size.stale);
    const title = [a.shape ? `サーチシェイプ：${a.shape.v}` : '', a.size ? `サーチサイズ：${a.size.v}マス` : ''].filter(Boolean).join(' / ');
    return `<span class="ctag${stale ? ' stale' : ''}" title="${esc(title)}">${esc(s)}</span>`;
  }
  // ディスタンスショットの結果を、その後に付いた印と見比べて出し分ける。
  // サーチサイズ・サーチシェイプで空きマスだったとき（NoData）も、ディスタンスの NoData と同じように出す
  const NODATA_HTML = (stale) => `<span class="mkw nodata${stale ? ' stale' : ''}"><b>NoData</b></span>`;
  const ndAt = (intel, c) => (intel && intel.cells[c] && intel.cells[c].nd) || null;
  function distAt(intel, c) {
    const a = intel && intel.cells[c];
    if (!a) return null;
    const d = a.dist || null, nd = a.nd || null;
    // 新しいほうの結果を使う（サーチサイズ・シェイプの NoData は、ディスタンスの NoData と同じ形にそろえる）
    if (nd && (!d || nd.t > d.t)) return { v: null, t: nd.t, turn: nd.turn, stale: nd.stale, src: nd.src };
    return d;
  }
  function cellMarkHTML(m, intel, c) {
    const d = distAt(intel, c);
    if (!d || (d.v != null && d.left)) return markHTML(m);
    if (m && m.t > d.t) {
      // 撃った後にコールして○になった：同じ個体のままなので数字を残す
      if (m.r === 'o' && d.v != null) return `<span class="mkw ink-o num-hit">${numMark(d.v, false)}</span>`;
      return markHTML(m);
    }
    if (m && m.r === 'x' && !m.callable) return markHTML(m);
    if (d.v == null) return NODATA_HTML(d.stale);
    if (m && m.r === 'o') return `<span class="mkw ink-o num-hit">${numMark(d.v, false)}</span>`;
    return `<span class="mkw ink-d">${numMark(d.v, true)}</span>`;
  }
  function distLabel(intel, c, m) {
    const d = distAt(intel, c);
    if (!d || (d.v != null && d.left)) return '';
    if (m && m.t > d.t && !(m.r === 'o' && d.v != null)) return '';
    if (m && m.t <= d.t && m.r === 'x' && !m.callable) return '';
    const who = d.src === 'number' ? 'サーチサイズ' : d.src === 'shape' ? 'サーチシェイプ' : 'ディスタンス';
    return d.v == null ? ` ${who} NoData` : ` ◎まで${d.v}ブロック`;
  }
  function pairsSVG(intel, N) {
    if (!intel || !intel.pairs.length) return '';
    const pt = (c) => [(c % N) + 0.5, Math.floor(c / N) + 0.5];
    const body = intel.pairs.map((p) => {
      const [x1, y1] = pt(p.a), [x2, y2] = pt(p.b);
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      // ＝・≠ は文字ではなく線で描く（文字だとフォントによって円の中心からずれる）
      const f = (n) => +n.toFixed(3);
      const bar = (dy) => `M${f(mx - 0.075)} ${f(my + dy)}H${f(mx + 0.075)}`;
      const sym = bar(-0.036) + bar(0.036) + (p.same ? '' : `M${f(mx + 0.045)} ${f(my - 0.095)}L${f(mx - 0.045)} ${f(my + 0.095)}`);
      return `<g class="${p.same ? 'same' : 'diff'}${p.stale ? ' stale' : ''}"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><circle cx="${mx}" cy="${my}" r="0.17"/><path class="sym" d="${sym}"/></g>`;
    }).join('');
    return `<svg class="pairs" viewBox="0 0 ${N} ${N}" preserveAspectRatio="none" aria-hidden="true">${body}</svg>`;
  }

  // ---------------- 盤面 ----------------
  function colorIndex(P, piece) {
    if (piece.isAdd) return 0;
    const list = P.pieces.filter((p) => !p.isAdd);
    return (list.indexOf(piece) % 8) + 1;
  }
  function edgeClasses(mask, c, N) {
    const r = Math.floor(c / N), col = c % N;
    let s = '';
    if (r === 0 || !(mask & bit(c - N))) s += ' et';
    if (r === N - 1 || !(mask & bit(c + N))) s += ' eb';
    if (col === 0 || !(mask & bit(c - 1))) s += ' el';
    if (col === N - 1 || !(mask & bit(c + 1))) s += ' er';
    return s;
  }
  // bo: { pickLine, overlay }
  function boardFrame(N, kind, cellsHTML, extraCls, bo) {
    bo = bo || {};
    let cols = '', rows = '';
    for (let i = 0; i < N; i++) {
      if (bo.pickLine) {
        cols += `<span><button type="button" class="axbtn" data-act="pick-line" data-line="col" data-index="${i}" aria-label="${COLS[i]}列を調べる">${COLS[i]}</button></span>`;
        rows += `<span><button type="button" class="axbtn" data-act="pick-line" data-line="row" data-index="${i}" aria-label="${i + 1}行を調べる">${i + 1}</button></span>`;
      } else {
        cols += `<span>${COLS[i]}</span>`;
        rows += `<span>${i + 1}</span>`;
      }
    }
    return `<div class="board ${extraCls || ''}${bo.pickLine ? ' picking' : ''}" style="--n:${N}" data-board="${kind}">
      <div class="ax ax-c">${cols}</div>
      <div class="ax ax-r">${rows}</div>
      <div class="cells" role="grid">${cellsHTML}${bo.overlay || ''}</div>
    </div>`;
  }
  function cellBase(c, N) {
    let cls = 'cell';
    if (c % N === N - 1) cls += ' lc';
    if (Math.floor(c / N) === N - 1) cls += ' lr';
    return cls;
  }
  // ×：再コールできるものは薄く、ワープで空いたマス（移動前の位置）は W を添える
  function markHTML(m) {
    if (!m) return '';
    if (m.r === 'x') {
      if (m.callable) return `<span class="mkw ink-x stale">${MARK.x}</span>`;
      return `<span class="mkw ink-x${m.bz ? ' bzx' : ''}">${MARK.x}</span>${m.warp ? '<span class="wtag" aria-hidden="true">W</span>' : ''}`;
    }
    let s = `<span class="mkw ink-${m.r}">${MARK[m.r]}</span>`;
    if (m.r === 'oo' && m.num != null) s += `<span class="num">${m.num}</span>`;
    return s;
  }

  // 自分フィールド
  function ownBoard(pi, opts) {
    opts = opts || {};
    const g = G(), N = g.N, P = g.players[pi], foe = g.players[1 - pi];
    const fv = foe.view;
    const inSetup = g.phase === 'setup';
    const intel = opts.intel;
    let html = '';
    for (let c = 0; c < g.NN; c++) {
      let cls = cellBase(c, N);
      let inner = '', style = '';
      const p = g.pieceAt(pi, c, true);
      const m = inSetup ? null : fv.marks[c];
      if (p) {
        cls += ' pc' + edgeClasses(p.mask, c, N);
        if (p.isAdd) cls += ' addpc';
        if (!p.alive) cls += ' dead';
        else if (m && m.r !== 'x') cls += ' hitc';
        style += `--pcc:var(--pc${colorIndex(P, p)});`;
        if (opts.pick && p.alive) cls += ' pickable';
        if (opts.selectedPiece === p.id) cls += ' picked';
        if (p.stealth && p.alive) {
          cls += ' stealth';
          // 読み順で最初のマスにだけ印を付ける
          if (c === Math.min.apply(null, p.cells)) inner += `<span class="stl" aria-hidden="true">${ICON.stealth}</span>`;
        }
      }
      inner += cellMarkHTML(m, intel, c);
      if (P.treasure && P.treasure.cell === c) inner += MARK.gem;
      const tl = inSetup ? null : fv.tlog[c];
      if (tl) inner += `<span class="tl tl-${tl.r}${tl.gray ? ' gray' : ''}">${TL[tl.r]}</span>`;
      inner += cellTagHTML(intel, c);
      if (!inSetup && fv.lastCall === c && opts.flash) cls += ' last';
      if (opts.clickable && opts.clickable(c)) cls += ' click';
      const label = coord(c) + (p ? (p.alive ? ` ${p.size}マスのキューブ${p.stealth ? '（ステルス）' : ''}` : ' 撃破済み') : '') + distLabel(intel, c, m);
      html += `<div class="${cls}" style="${style}" data-act="cell" data-board="own" data-cell="${c}" role="gridcell" aria-label="${esc(label)}">${inner}</div>`;
    }
    return boardFrame(N, 'own', html, opts.cls, { overlay: pairsSVG(intel, N) });
  }

  // サーチキューブの選択メニュー（相手フィールド上に出す）
  function cubeMenuHTML() {
    const cats = [['キューブ', 'O4'], ['L字', 'L4'], ['T字', 'T4']];
    return `<div class="cube-menu" role="group" aria-label="サーチキューブの対象">
      <p>SEARCH CUBE ─ 形状</p>
      <div class="cm-grid">${cats.map(([c, k]) => `<button type="button" class="cm-btn" data-act="cube" data-kind="cat" data-value="${esc(c)}">${shapeMini(k, 0)}<span>${esc(c)}</span></button>`).join('')}</div>
      <p>マス数</p>
      <div class="cm-grid sizes">${[2, 3, 4, 5].map((s) => `<button type="button" class="cm-btn" data-act="cube" data-kind="size" data-value="${s}" aria-label="${s}マス"><b>${s}</b></button>`).join('')}</div>
    </div>`;
  }

  // 相手フィールド（予想盤面）
  function predBoard(pi, opts) {
    opts = opts || {};
    const g = G(), N = g.N, P = g.players[pi], v = P.view, foe = g.players[1 - pi];
    const sel = new Set(opts.sel || []);
    const intel = opts.intel;
    const deadMaskById = {};
    for (let c = 0; c < g.NN; c++) { const d = v.dead[c]; if (d) deadMaskById[d.pieceId] = (deadMaskById[d.pieceId] || 0) | bit(c); }
    let html = '';
    for (let c = 0; c < g.NN; c++) {
      let cls = cellBase(c, N);
      let inner = '', style = '';
      const d = v.dead[c];
      if (d) {
        cls += ' pc revealed' + edgeClasses(deadMaskById[d.pieceId], c, N);
      } else if (opts.reveal) {
        const tp = g.pieceAt(foe.idx, c);
        if (tp) { cls += ' ghost' + edgeClasses(tp.mask, c, N); style += `--pcc:var(--pc${colorIndex(foe, tp)});`; }
      }
      inner += cellMarkHTML(v.marks[c], intel, c);
      if (opts.reveal && foe.treasure && foe.treasure.cell === c) inner += MARK.gem;
      const tl = v.tlog[c];
      if (tl) inner += `<span class="tl tl-${tl.r}${tl.gray ? ' gray' : ''}">${TL[tl.r]}</span>`;
      inner += cellTagHTML(intel, c);
      if (sel.has(c)) cls += ' sel';
      if (v.lastCall === c && opts.flash) cls += ' last';
      if (opts.clickable && opts.clickable(c)) cls += ' click';
      const m = v.marks[c];
      let label = coord(c);
      if (m) label += m.r === 'x' ? (m.callable ? ' ×（再コールできる）' : m.warp ? ' ×（ワープ前の位置）' : m.bz ? ' ×（バズーカで公開）' : ' ×') : m.r === 'oo' ? ` ◎${m.num}` : ' ○';
      label += distLabel(intel, c, m);
      if (d) label += ' 撃破済み';
      html += `<div class="${cls}" style="${style}" data-act="cell" data-board="pred" data-cell="${c}" role="gridcell" aria-label="${esc(label)}">${inner}</div>`;
    }
    const overlay = pairsSVG(intel, N) + (opts.cubeMenu ? cubeMenuHTML() : '');
    return boardFrame(N, 'pred', html, opts.cls, { pickLine: opts.pickLine, overlay });
  }

  // ---------------- アイテム欄（フィールド上部） ----------------
  function chipHTML(pi, k, interactive) {
    const g = G(), P = g.players[pi];
    const st = g.itemStatus(pi, k);
    const phaseOK = interactive && g.phase === 'play' && g.cur === pi && (g.sub === 'item' || g.sub === 'answer') && !g.itemUsed && !app.busy;
    let cls = 'ichip', bd = '', state;
    if (st.have > 0) { bd = st.have > 1 ? '×' + st.have : ''; state = `残り${st.have}`; }
    else if (interactive && P.used[k] && P.wallet >= 3) { cls += ' rebuy'; bd = '3pt'; state = '使用済み・3ptで再購入できる'; }
    else { cls += ' spent'; state = P.used[k] ? (P.wallet >= 3 ? '使用済み（3ptで再購入できる）' : '使用済み') : 'なし'; }
    const usable = phaseOK && st.usable;
    if (usable) cls += ' usable';
    if (interactive && app.ui && app.ui.item === k) cls += ' active';
    const who = isCPUMode() ? (pi === 0 ? 'あなた' : 'CPU') : P.name;
    const active = interactive && app.ui && app.ui.item === k;
    const tip = `${who}の${isDef(k) ? '防御' : '攻撃'}アイテム「${ITEMS[k].name}」：${ITEMS[k].desc}（${active ? '選択中。もう一度押すとやめる' : state}）`;
    const badge = bd ? `<span class="bd">${esc(bd)}</span>` : '';
    if (interactive) return `<button type="button" class="${cls}" data-act="item" data-key="${k}" aria-disabled="${usable ? 'false' : 'true'}" data-tip="${esc(tip)}" aria-label="${esc(tip)}">${ICON[k]}${badge}</button>`;
    return `<span class="${cls}" role="listitem" data-tip="${esc(tip)}" aria-label="${esc(tip)}">${ICON[k]}${badge}</span>`;
  }
  function chipGroup(pi, keys, interactive, side, cap) {
    keys = keys.filter(inPlay);
    if (!keys.length) return '';
    return `<div class="chipgrp ${side}"><span class="cap">${esc(cap)}</span><div class="chips ${interactive ? 'mine' : 'enemy'}" role="list">${keys.map((k) => chipHTML(pi, k, interactive)).join('')}</div></div>`;
  }
  // 各フィールドには、そのフィールドに作用するアイテムを並べる（左＝攻撃、右＝防御）
  function fieldChips(fieldOwner, v) {
    const foe = 1 - v;
    if (fieldOwner === v) return `<div class="chiprow">${chipGroup(foe, ATK_ITEMS, false, 'atk', '相手の攻撃')}${chipGroup(v, DEF_ITEMS, true, 'def', '自分の防御')}</div>`;
    return `<div class="chiprow">${chipGroup(v, ATK_ITEMS, true, 'atk', '自分の攻撃')}${chipGroup(foe, DEF_ITEMS, false, 'def', '相手の防御')}</div>`;
  }

  // ---------------- ログ ----------------
  const CALL_KINDS = new Set(['call', 'hit', 'kill', 'miss', 'tcall', 'treasure']);
  const stripName = (s) => s.replace(/^[^：]{1,14}：/, '');
  function sideEntries(v) {
    const g = G(), f = 1 - v;
    const used = (e) => e.kind === 'item' && e.key;
    const bz = (e) => e.kind === 'bazooka';
    // 自分フィールド：相手の攻撃アイテム＋自分の防御アイテム／相手フィールド：自分の攻撃アイテム＋相手の防御アイテム。
    // バズーカ（宣言・発動）は両方のフィールドに関わるので、どちらにも載せる
    const myFieldItems = g.log.filter((e) => bz(e) || (used(e) && ((e.actor === f && !isDef(e.key)) || (e.actor === v && isDef(e.key)))));
    const foeFieldItems = g.log.filter((e) => bz(e) || (used(e) && ((e.actor === v && !isDef(e.key)) || (e.actor === f && isDef(e.key)))));
    const calls = (a, b) => g.log.filter((e) => (e.actor === a && CALL_KINDS.has(e.kind)) || (e.actor === b && e.kind === 'penalty'));
    return { myItems: myFieldItems, foeItems: foeFieldItems, defCalls: calls(f, v), atkCalls: calls(v, f) };
  }
  function itemLogHTML(entries, v, empty) {
    if (!entries.length) return `<ol class="loglist"><li class="none"><span class="t">—</span><span class="x">${esc(empty)}</span></li></ol>`;
    return '<ol class="loglist">' + entries.slice().reverse().map((e) => {
      const txt = e.actor === v && e.priv ? e.priv : e.text;
      const side = e.actor === v ? 'mine' : e.actor < 0 ? 'sys' : 'enemy';
      return `<li class="k-${e.kind === 'bazooka' ? 'bazooka' : 'item'} wicon ${side}"><span class="t">T${pad2(e.turn)}</span><span class="li-ic ${side}">${ICON[e.key] || ''}</span><span class="x">${esc(txt)}</span></li>`;
    }).join('') + '</ol>';
  }
  function callLogHTML(entries, v, empty) {
    if (!entries.length) return `<ol class="loglist"><li class="none"><span class="t">—</span><span class="x">${esc(empty)}</span></li></ol>`;
    return '<ol class="loglist">' + entries.slice().reverse().map((e) => {
      const txt = stripName(e.actor === v && e.priv ? e.priv : e.text);
      return `<li class="k-${esc(e.kind)}"><span class="t">T${pad2(e.turn)}</span><span class="x">${esc(txt)}</span></li>`;
    }).join('') + '</ol>';
  }

  // ---------------- 操作ブロック ----------------
  function phaseText(mode) {
    const g = G(), v = viewer();
    const who = isCPUMode() ? '' : g.players[v].name + '：';
    switch (mode) {
      case 'item': return who + (g.hasCallable(v) ? 'アイテムを使うか、相手フィールドをタップしてコール' : 'コールできるマスがありません。コールを飛ばしてください');
      case 'call': return who + '相手フィールドをタップしてコール';
      case 'answer-phase': return who + (g.itemUsed ? 'アンサーするか、ターンエンドしてください' : 'アンサー・アイテム・ターンエンドから選んでください');
      case 'answer': return who + '相手フィールドで、個体の全マスを選んでください';
      case 'treasure': return who + `トレジャーコール（残り${g.treasureLeft(v)}回）：相手フィールドのマスを1つ選んでください`;
      case 'stealth-pick': return who + 'ステルス：守る自分のキューブを選んでください';
      case 'sacrifice': return who + 'アンサー失敗。差し出す自分のキューブを選んでください';
      case 'bazooka-confirm': return who + 'バズーカの使用を宣言しますか？（取り消せません）';
      case 'line': return who + 'サーチライン：相手フィールドの列か行のラベルをタップ';
      case 'number': return who + 'サーチサイズ：相手フィールドで調べるマスを選んでください';
      case 'dist': return who + 'ディスタンスショット：相手フィールドで◎以外のマスを選んでください';
      case 'pair': return who + 'ペアショット：相手フィールドでマスを2つ選んでください';
      case 'cube': return who + 'サーチキューブ：相手フィールドのメニューから選んでください';
      case 'wait': return isCPUMode() ? 'CPUが解析しています…' : '';
      case 'over': return '試合終了';
      default: return who + (ITEMS[app.ui.item] ? ITEMS[app.ui.item].name + 'の対象を選んでください' : '');
    }
  }

  function itemHead(k, extra) {
    const g = G(), v = viewer();
    const rebuy = g.itemStatus(v, k).rebuyNeeded ? `<p class="note warn">手持ちがないため、3ptで再購入して使います（残り ${g.players[v].wallet}pt）。</p>` : '';
    return `<div class="itemhead"><span class="ichip active">${ICON[k]}</span><div><b>${esc(ITEMS[k].name)}</b><p class="note ih-desc">${esc(extra || ITEMS[k].desc)}</p>${rebuy}</div></div>`;
  }

  // 進行表示ブロック：上の段に直前の出来事、下の段に説明（左）とボタン（右）。
  // フィールドの上に置くので、どの状態でも高さがほぼ変わらないように中身を短くそろえる
  // バズーカの宣言ボタン（自分の手番で、宣言できるときだけ）。アイテムとは別枠
  function bzButtonHTML(v) {
    const g = G();
    const st = g.bazookaStatus(v);
    if (!st.can || app.busy) return '';
    const label = st.theirs ? 'バズーカに同意' : 'バズーカ宣言';
    const tip = st.theirs
      ? '相手はバズーカを宣言済み。あなたも宣言すると、次のターンの始めに、お互いの空きマスがすべて×で公開されます'
      : '宣言しておくと、相手も宣言した次のターンの始めに、お互いの空きマスがすべて×で公開されます（アイテムとは別枠・取り消し不可）';

  function dockHTML(mode) {
    const g = G(), v = viewer(), ui = app.ui;
    const cancel = '<button class="btn ghost" data-act="cancel">やめる</button>';
    let main = '', acts = '';
    switch (mode) {
      case 'item':
        if (g.hasCallable(v)) main = '<p class="note">アイテムはコールの前か後のどちらかで、1ターンに1つまで。選んだアイコンをもう一度押すとやめられます。</p>';
        else {
          main = '<p class="dock-msg">コールできるマスが残っていません。コールを飛ばして、アンサーかターンエンドに進みます。</p>';
          acts = '<button class="btn primary" data-act="skip-call">コールを飛ばす</button>';
        }
        acts += bzButtonHTML(v);
        break;
      case 'call':
        main = '<p class="note">相手フィールドのマスをタップしてコールします。</p>';
        acts = bzButtonHTML(v);
        break;
      case 'answer-phase':
        main = `<p class="note">${g.itemUsed ? 'アンサーで個体の全マスを宣言するか、ターンエンドします。' : 'このターンはまだアイテムを使えます（フィールド上部のアイコン）。'}</p>`;
        acts = '<button class="btn primary" data-act="answer-start">アンサー</button><button class="btn" data-act="end-turn">ターンエンド</button>' + bzButtonHTML(v);
        break;
      case 'answer': {
        const key = ui.sel.length ? identifyShape(ui.sel, g.N) : null;
        const shapeTxt = !ui.sel.length ? 'マスを選択' : key ? `${SHAPES[key].cat}（${SHAPES[key].size}マス）` : '形になっていません';

      case 'bazooka-confirm': {

        main = `<div class="itemhead"><span class="ichip active bz">${ICON.bazooka}</span><div><b>バズーカ</b><p class="note ih-desc">${st.theirs

      case 'line':
        main = itemHead('line', '相手フィールドの列（A〜）か行（1〜）のラベルをタップ。そこで埋まっているマスの数が分かり、アイテム欄の下に残ります。');
        acts = cancel;
        break;
      case 'number':
        main = itemHead('number', '調べるマスを選んでください。そこにある個体のマス数が分かります（空きマスなら NoData）。');
        acts = cancel;
        break;
      case 'shape':

        break;

        main = itemHead('stealth', '守る自分のキューブを選んでください。全マスに当たっても撃破されず、アンサーでしか倒せません。どれにしたかは相手に伝わりません。');

    const bn = bannerFor(v);

  function scoreHTML(v) {
    const g = G();
    const me = g.players[v], foe = g.players[1 - v];
    const myLive = me.pieces.filter((p) => p.alive);
    const myCells = myLive.filter((p) => !p.isAdd).reduce((s, p) => s + p.size, 0);
    const foeLeft = '<span class="unk" title="相手の残り個体数は分かりません">？</span>';
    const tre = (P) => {
      if (P.view.treasureFound) return `${P.score.treasure}`;
      const left = g.treasureLeft(P.idx);
      return `${P.score.treasure}<small>${left > 0 ? `あと${left}回` : '失敗'}</small>`;
    };
    const row = (P, left) => `<tr><th scope="row">${esc(P.name)}${g.first === P.idx ? '<small>先攻</small>' : ''}</th>
      <td>${P.score.attack}</td><td>${tre(P)}</td><td>${left}</td><td>${P.wallet}</td></tr>`;
    return `<section class="panel scorebar" aria-label="スコア">
      <table>
        <thead><tr><th></th><th>撃破</th><th>トレジャー</th><th>残り個体</th><th>手持ち</th></tr></thead>
        <tbody>
          ${row(me, `${myLive.length}<small>体・${myCells}マス</small>`)}
          ${row(foe, foeLeft)}
        </tbody>
      </table>
      <p class="note">ポイント（1pt＝1万円）。相手の残り個体数は分かりません。</p>
