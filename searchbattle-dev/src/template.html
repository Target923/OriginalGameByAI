<title>サーチバトル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="サイバー空間で敵の構造を透視する位置あてバトル。1vs1と最強CPU戦。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Dela+Gothic+One&family=M+PLUS+1:wght@400;500;700;800&family=Share+Tech+Mono&display=swap">
<style>
:root {
  /* Layout: サイバー空間の司令室。中央に自陣と敵陣のフィールドを横並びにし、
     左右の縦長パネルに防御・攻撃の記録を流す。単一のダークテーマ。 */
  color-scheme: dark;
  --void: #03050B;
  --panel: rgba(9, 15, 31, .8);
  --panel-hi: rgba(18, 30, 58, .85);
  --edge: rgba(96, 196, 255, .2);
  --edge-2: rgba(96, 196, 255, .46);
  --text: #DDE7F6;
  --muted: #8592AB;
  --dim: #4B566E;
  --cyan: #4FE3FF;
  --cyan-2: #18A6D6;
  --magenta: #FF3F8F;
  --hit: #FF7A3D;
  --amber: #FFC14A;
  --orange: #FF9A3C;
  --violet: #B49CFF;
  --good: #59F2A6;
  --bad: #FF5468;
  --ink-on-cyan: #021018;
  --steel-1: #F3F7FC; --steel-2: #A3AEC0; --steel-3: #586377; --steel-4: #232A38;
  --pc0: #C8D2E2; --pc1: #4E9BFF; --pc2: #39E0B4; --pc3: #FFA544; --pc4: #B484FF;
  --pc5: #4FE3FF; --pc6: #FF6FB4; --pc7: #CBE65A; --pc8: #FF7B5C;
  --f-logo: "Dela Gothic One", "M PLUS 1", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
  --f-tech: "Chakra Petch", "M PLUS 1", system-ui, sans-serif;
  --f-body: "M PLUS 1", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
  --f-mono: "Share Tech Mono", "M PLUS 1", ui-monospace, monospace;
}

* { box-sizing: border-box; }
body { background: var(--void); color: var(--text); font-family: var(--f-body); font-size: 14.5px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--void); }
button { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ===== 宇宙空間 ===== */
.space { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
  background:
    radial-gradient(1100px 620px at 50% -12%, rgba(38, 92, 210, .34), transparent 62%),
    radial-gradient(820px 560px at 104% 104%, rgba(255, 63, 143, .13), transparent 60%),
    radial-gradient(700px 520px at -6% 78%, rgba(79, 227, 255, .10), transparent 60%),
    var(--void); }
.space .stars { position: absolute; inset: 0; opacity: .7;
  background-image:
    radial-gradient(1px 1px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 27% 64%, #bfe9ff, transparent),
    radial-gradient(1.5px 1.5px at 44% 12%, #fff, transparent), radial-gradient(1px 1px at 63% 38%, #ffd1e6, transparent),
    radial-gradient(1px 1px at 78% 22%, #fff, transparent), radial-gradient(1.5px 1.5px at 88% 58%, #bfe9ff, transparent),
    radial-gradient(1px 1px at 8% 84%, #fff, transparent), radial-gradient(1px 1px at 52% 88%, #bfe9ff, transparent),
    radial-gradient(1px 1px at 35% 40%, #fff, transparent), radial-gradient(1px 1px at 70% 76%, #fff, transparent);
  animation: twinkle 7s ease-in-out infinite alternate; }
.space .floor { position: absolute; left: -40%; right: -40%; bottom: -8%; height: 46%; transform: perspective(620px) rotateX(74deg); transform-origin: 50% 100%;
  background-image: linear-gradient(rgba(79, 227, 255, .2) 1px, transparent 1px), linear-gradient(90deg, rgba(79, 227, 255, .2) 1px, transparent 1px);
  background-size: 56px 56px; -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 92%); mask-image: linear-gradient(to top, #000 10%, transparent 92%);
  animation: floor 5s linear infinite; opacity: .55; }
@keyframes floor { to { background-position: 0 56px, 0 0; } }
@keyframes twinkle { to { opacity: .35; } }

/* ===== 共通部品 ===== */
.wrap { max-width: 1420px; margin: 0 auto; padding-block: 8px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.note { color: var(--muted); font-size: .82rem; margin: 0; }
.note.warn { color: var(--amber); }
.eyebrow { font-family: var(--f-tech); letter-spacing: .32em; font-size: .72rem; color: var(--cyan); margin: 0; text-transform: uppercase; }
.panel { position: relative; background: var(--panel); border: 1px solid var(--edge); border-radius: 6px; padding: 12px; min-width: 0;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 22px 44px -30px rgba(0, 0, 0, .95); }
.panel::before, .panel::after { content: ""; position: absolute; width: 14px; height: 14px; pointer-events: none; opacity: .85; }
.panel::before { top: -1px; left: -1px; border-top: 2px solid var(--pcorner, var(--cyan)); border-left: 2px solid var(--pcorner, var(--cyan)); border-top-left-radius: 6px; }
.panel::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--pcorner, var(--cyan)); border-right: 2px solid var(--pcorner, var(--cyan)); border-bottom-right-radius: 6px; }
.panel.enemy { --pcorner: var(--magenta); }
.panel.own.active { border-color: rgba(79, 227, 255, .7); box-shadow: 0 0 0 1px rgba(79, 227, 255, .3), 0 0 32px -6px rgba(79, 227, 255, .5); }
.panel.enemy.active { border-color: rgba(255, 63, 143, .7); box-shadow: 0 0 0 1px rgba(255, 63, 143, .3), 0 0 32px -6px rgba(255, 63, 143, .5); }
.ptitle { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 8px; font-size: .86rem; font-weight: 700; }
.ptitle small { font-family: var(--f-tech); font-size: .64rem; letter-spacing: .24em; color: var(--muted); font-weight: 500; }
.logcol .ptitle { flex-direction: column; align-items: flex-start; gap: 2px; }
.logcol .ptitle small { order: -1; font-size: .58rem; }

.btn { appearance: none; position: relative; border: 1px solid var(--edge-2); background: rgba(79, 227, 255, .07); color: var(--text); font: 700 .86rem/1.2 var(--f-body);
  padding: .6em 1.1em; cursor: pointer; touch-action: manipulation; transition: background .15s, box-shadow .15s, transform .08s;
  clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px); }
.btn:hover { background: rgba(79, 227, 255, .17); box-shadow: inset 0 0 14px rgba(79, 227, 255, .28); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(180deg, #7BEDFF, #17A4D4); color: var(--ink-on-cyan); border-color: transparent; }
.btn.primary:hover { background: linear-gradient(180deg, #A5F4FF, #2BB9E6); box-shadow: 0 0 18px rgba(79, 227, 255, .55); }
.btn.fire { background: linear-gradient(180deg, #FF77AE, #D81F69); color: #fff; border-color: transparent; }
/* バズーカの宣言ボタン（アイテムとは別枠） */
.btn.big { font-size: 1.02rem; padding: .78em 1.7em; letter-spacing: .04em; }
.btn.ghost { background: transparent; border-color: var(--edge); font-weight: 500; }
.btn:disabled { opacity: .38; cursor: not-allowed; box-shadow: none; }
.btn:focus-visible, .ichip:focus-visible, .shape-btn:focus-visible, .item-card:focus-visible, .seg input:focus-visible + label { outline: none; box-shadow: inset 0 0 0 2px var(--amber), 0 0 0 2px var(--amber); }

/* ロゴ */
.logo { font-family: var(--f-logo); line-height: 1; letter-spacing: .02em;
  background: linear-gradient(180deg, #FFFFFF 0%, #DCE6F3 40%, #7C8AA2 52%, #EAF2FC 70%, #A9B6CA 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 14px rgba(79, 227, 255, .35)); }
.logo-sub { font-family: var(--f-tech); letter-spacing: .5em; color: var(--cyan); font-size: .7rem; margin-top: 4px; }

/* ===== HUD ===== */
.hud { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; padding-block: 8px 10px; }
.hud .logo { font-size: 1.32rem; }
.hud-mid { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
/* サウンド切り替え */
.sndbtn { display: inline-flex; align-items: center; gap: 6px; }
.sndbtn svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.sndbtn svg .spk { fill: currentColor; fill-opacity: .18; }
.sndbtn span { font: 700 .72rem/1 var(--f-tech); letter-spacing: .08em; }
.sndbtn.all { color: var(--cyan); }
.sndbtn.off { color: var(--muted); }
@media (max-width: 560px) { .sndbtn span { display: none; } }
.stat { font: 600 .7rem/1.25 var(--f-tech); letter-spacing: .14em; color: var(--muted); padding: .38em .75em; border: 1px solid var(--edge); background: rgba(79, 227, 255, .05); white-space: nowrap; }
.stat b { color: var(--cyan); font-size: .92rem; letter-spacing: .04em; margin-left: .3em; }
.stat.hot { border-color: rgba(255, 63, 143, .6); color: var(--magenta); }
.stat.hot b { color: var(--magenta); }
.stat.me b { color: var(--good); }
.phase { margin: 0 0 12px; display: flex; align-items: center; gap: 10px; font-size: 1.02rem; font-weight: 700; }
.phase::before { content: ""; width: 8px; height: 8px; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); transform: rotate(45deg); flex: none; }
.phase.wait::before { background: var(--magenta); box-shadow: 0 0 10px var(--magenta); animation: blink 1s infinite; }
/* スマホでは「いまやること」が1行・2行と変わっても盤面が動かないよう、2行ぶん確保する */
@media (max-width: 719px) { .phase { min-height: 3.1em; } }
@keyframes blink { 50% { opacity: .25; } }

/* ===== 対戦レイアウト ===== */
.arena { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.center { display: grid; gap: 12px; min-width: 0; }
.logs { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 680px) { .logs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.logcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.itemlog .loglist { max-height: 170px; }
.calllog .loglist { max-height: 300px; }
@media (min-width: 1180px) {
  .arena { grid-template-columns: 250px minmax(0, 1fr) 250px; }
  .logs { display: contents; }
  .col-def { grid-column: 1; grid-row: 1; }
  .center { grid-column: 2; grid-row: 1; }
  .col-atk { grid-column: 3; grid-row: 1; }
  .logcol { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px); height: calc(100vh - 24px - env(safe-area-inset-top, 0px)); max-height: 880px; }
  .itemlog { flex: 0 0 auto; }
  .itemlog .loglist { max-height: 26vh; }
  .calllog { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .calllog .loglist { max-height: none; flex: 1 1 auto; min-height: 0; }
}
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 460px) { .fields { gap: 8px; } .fields .panel { padding: 8px 6px; } }
.fhead { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; margin-bottom: 8px; }
.fhead b { font-size: .86rem; }
.fhead small { font-family: var(--f-tech); letter-spacing: .22em; font-size: .62rem; color: var(--cyan); }
.panel.enemy .fhead small { color: var(--magenta); }
.fname { color: var(--muted); font-size: .76rem; }
@media (max-width: 520px) { .fhead small { display: none; } }

/* ===== アイテムチップ（フィールド上部：左＝攻撃、右＝防御） ===== */
.chiprow { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px 12px; margin-bottom: 10px; }
.chipgrp { display: grid; gap: 4px; min-width: 0; }
.chipgrp.atk { flex: 1 1 auto; justify-items: start; }
.chipgrp.def { flex: none; justify-items: end; }
.chipgrp .cap { font: 600 .6rem/1 var(--f-tech); letter-spacing: .12em; color: var(--muted); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 7px 5px; }
.chipgrp.def .chips { justify-content: flex-end; }
.ichip { --ic: var(--cyan); position: relative; flex: none; width: 31px; height: 31px; display: grid; place-items: center; padding: 0; color: var(--ic); cursor: default;
  border: 1px solid color-mix(in srgb, var(--ic) 48%, transparent); border-radius: 6px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--ic) 16%, transparent), color-mix(in srgb, var(--ic) 4%, transparent)); transition: transform .12s, box-shadow .12s, background .12s; }
.chips.enemy .ichip { --ic: var(--magenta); }
.ichip svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ichip svg .f { fill: currentColor; stroke: none; }
.ichip .bd { position: absolute; right: -5px; bottom: -6px; min-width: 15px; font: 700 .56rem/1.35 var(--f-tech); text-align: center; color: var(--ic);
  background: var(--void); border: 1px solid color-mix(in srgb, var(--ic) 60%, transparent); border-radius: 4px; padding: 0 3px; }
.ichip.usable { cursor: pointer; box-shadow: 0 0 10px color-mix(in srgb, var(--ic) 40%, transparent); }
.ichip.usable:hover { transform: translateY(-2px); box-shadow: 0 0 16px color-mix(in srgb, var(--ic) 75%, transparent); }
.ichip.active { background: var(--ic); color: var(--ink-on-cyan); box-shadow: 0 0 16px var(--ic); }
/* 使用済み：自分・相手どちらのアイテムもグレーにする */
.ichip.spent, .chips.enemy .ichip.spent { --ic: var(--dim); background: none; box-shadow: none; }
.ichip.spent svg { opacity: .8; }
.ichip.spent::after { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; height: 1.5px; background: var(--dim); transform: rotate(-35deg); }
.ichip.rebuy, .chips.enemy .ichip.rebuy { --ic: var(--amber); }
.itemhead .ichip { width: 36px; height: 36px; }
@media (max-width: 520px) { .ichip { width: 27px; height: 27px; } .ichip svg { width: 16px; height: 16px; } .chips { gap: 6px 4px; } .chiprow { gap: 6px; } }
/* ツールチップ（本文の外、最前面） */
.tipbox { position: fixed; left: 0; top: 0; z-index: 95; max-width: 250px; padding: 7px 9px; font: 500 .76rem/1.5 var(--f-body); color: var(--text);
  background: #0B1328; border: 1px solid var(--edge-2); border-radius: 4px; box-shadow: 0 12px 26px -10px rgba(0, 0, 0, .95), 0 0 14px rgba(79, 227, 255, .18);
  pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; }
.tipbox.show { opacity: 1; transform: none; }
/* フィールド上の調査記録 */
.intel { display: flex; flex-wrap: wrap; gap: 5px; margin: -2px 0 8px; }
.itag { --tc: var(--cyan); display: inline-flex; align-items: center; gap: 4px; font: 600 .7rem/1 var(--f-tech); padding: 4px 7px 4px 5px; color: var(--tc);
  border: 1px solid color-mix(in srgb, var(--tc) 50%, transparent); background: color-mix(in srgb, var(--tc) 9%, transparent); border-radius: 3px; white-space: nowrap; }
.intel.enemy .itag { --tc: var(--magenta); }
.itag svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.itag svg .f { fill: currentColor; stroke: none; }
.itag b { color: var(--text); font-size: .8rem; margin-left: 2px; }
.itag small { color: var(--muted); font-size: .58rem; margin-left: 3px; }
.itag.stale { opacity: .45; }
.itag em.sl { font-style: normal; color: var(--muted); margin: 0 1px 0 3px; font-size: .72rem; }
.itag b.apx { opacity: .5; }
/* スマホ幅では、タグの「残り」と調べたターンを省く（ツールチップには出る）。サーチラインの「2個体 / 3マス」が盤の幅に収まるように */
@media (max-width: 560px) { .itag i, .itag small { display: none; } .itag { gap: 3px; padding: 3px 6px 3px 4px; } .itag em.sl { margin: 0 1px; } .intel .itag { max-width: 100%; } }
/* ===== フィールド ===== */
.board { --fc: var(--cyan); display: grid; grid-template-columns: 1.15em minmax(0, 1fr); grid-template-rows: 1.35em auto; max-width: 470px; margin-inline: auto; }
.board[data-board="pred"], .board.enemy { --fc: var(--magenta); }
.board.large { max-width: 520px; }
.ax { font-family: var(--f-mono); font-size: .76rem; color: color-mix(in srgb, var(--fc) 70%, var(--muted)); display: grid; }
.ax span { display: flex; align-items: center; justify-content: center; gap: 3px; min-width: 0; }
.ax-r span { flex-direction: column; gap: 2px; }
.axbtn { appearance: none; display: grid; place-items: center; width: 100%; height: 100%; min-height: 1.2em; padding: 0; cursor: pointer; color: var(--cyan); font: 700 .8rem/1 var(--f-mono);
  background: rgba(79, 227, 255, .1); border: 1px solid rgba(79, 227, 255, .55); border-radius: 3px; box-shadow: 0 0 10px rgba(79, 227, 255, .35); animation: blink 1.4s infinite; }
.axbtn:hover, .axbtn:focus-visible { background: var(--cyan); color: var(--ink-on-cyan); animation: none; outline: none; }
.board.picking .ax-c { gap: 3px; padding-inline: 2px; }
.board.picking .ax-r { gap: 3px; padding-block: 2px; }
.cell.line-hl { background-color: rgba(79, 227, 255, .24) !important; box-shadow: inset 0 0 0 1px var(--cyan), inset 0 0 14px rgba(79, 227, 255, .45); }
.ax-c { grid-column: 2; grid-row: 1; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
.ax-r { grid-column: 1; grid-row: 2; grid-template-rows: repeat(var(--n), minmax(0, 1fr)); }
.cells { position: relative; grid-column: 2; grid-row: 2; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); grid-template-rows: repeat(var(--n), minmax(0, 1fr));
  aspect-ratio: 1; max-width: 100%; border: 1px solid color-mix(in srgb, var(--fc) 60%, transparent); border-radius: 3px;
  background:
    radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--fc) 11%, transparent), transparent 72%),
    linear-gradient(180deg, #071226, #04080F);
  box-shadow: 0 0 26px color-mix(in srgb, var(--fc) 20%, transparent), inset 0 0 26px color-mix(in srgb, var(--fc) 9%, transparent); }
.cells::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
  background: repeating-linear-gradient(180deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 3px); }
.cell { position: relative; min-width: 0; border-right: 1px solid color-mix(in srgb, var(--fc) 17%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--fc) 17%, transparent); container-type: size; }
.cell.lc { border-right: 0; }
.cell.lr { border-bottom: 0; }
.cell.click { cursor: pointer; }
.cell.click:hover { background-color: color-mix(in srgb, var(--fc) 22%, transparent); box-shadow: inset 0 0 0 1px var(--fc), inset 0 0 14px color-mix(in srgb, var(--fc) 40%, transparent); }
.cell.sel { background-color: color-mix(in srgb, var(--amber) 30%, transparent); box-shadow: inset 0 0 0 2px var(--amber); }

/* メタリックなキューブ */
.cell.pc { background:
    linear-gradient(115deg, transparent 38%, rgba(255, 255, 255, .34) 48%, transparent 58%) 0 0 / 300% 300%,
    linear-gradient(145deg, rgba(255, 255, 255, .62) 0%, rgba(255, 255, 255, .08) 32%, rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, .3) 100%),
    linear-gradient(160deg, color-mix(in srgb, var(--pcc) 40%, var(--steel-1)) 0%, color-mix(in srgb, var(--pcc) 58%, var(--steel-3)) 68%, color-mix(in srgb, var(--pcc) 38%, var(--steel-4)) 100%);
  box-shadow: inset 2px 2px 0 rgba(255, 255, 255, .55), inset -2px -2px 0 rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(0, 0, 0, .35);
  animation: sheen 7s linear infinite; }
@keyframes sheen { 0% { background-position: 120% 0, 0 0, 0 0; } 60%, 100% { background-position: -40% 0, 0 0, 0 0; } }
.cell.pc::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1; border: 0 solid var(--pcc); filter: drop-shadow(0 0 4px var(--pcc)); }
.cell.pc.et::before { border-top-width: 2px; }
.cell.pc.eb::before { border-bottom-width: 2px; }
.cell.pc.el::before { border-left-width: 2px; }
.cell.pc.er::before { border-right-width: 2px; }
.cell.pc.addpc::before { border-style: dashed; }
/* バズーカで分解された1マスキューブ：元の個体の色のまま、ひびを入れる */
.cell.pc.frag { background-image: linear-gradient(118deg, transparent 46%, rgba(10, 14, 24, .55) 47%, transparent 49%), linear-gradient(28deg, transparent 60%, rgba(10, 14, 24, .45) 61%, transparent 63%),
    linear-gradient(160deg, color-mix(in srgb, var(--pcc) 40%, var(--steel-1)) 0%, color-mix(in srgb, var(--pcc) 58%, var(--steel-3)) 68%, color-mix(in srgb, var(--pcc) 38%, var(--steel-4)) 100%); }
.cell.pc.frag::before { border-style: dashed; }
.cell.pc.hitc { box-shadow: inset 2px 2px 0 rgba(255, 255, 255, .4), inset -2px -2px 0 rgba(0, 0, 0, .5), inset 0 0 18px rgba(255, 63, 143, .55); }
.cell.pc.dead { animation: none; filter: saturate(.25) brightness(.55);
  background:
    linear-gradient(32deg, transparent 47%, rgba(255, 84, 104, .9) 48%, transparent 50%),
    linear-gradient(-58deg, transparent 58%, rgba(255, 84, 104, .7) 59%, transparent 61%),
    linear-gradient(160deg, var(--steel-3), var(--steel-4)); }
.cell.pc.dead::before { border-color: var(--bad); filter: none; }
.cell.pc.revealed { --pcc: var(--magenta); animation: none;
  background: repeating-linear-gradient(135deg, rgba(255, 63, 143, .28) 0 1px, transparent 1px 6px), linear-gradient(160deg, rgba(255, 63, 143, .16), rgba(20, 6, 18, .7)); box-shadow: inset 0 0 14px rgba(255, 63, 143, .35); }
/* バズーカで砕いたマス */
.cell.pc.revealed.bz { --pcc: var(--amber); background: repeating-linear-gradient(45deg, rgba(255, 193, 74, .32) 0 1px, transparent 1px 6px), linear-gradient(160deg, rgba(255, 193, 74, .14), rgba(20, 14, 6, .7)); box-shadow: inset 0 0 14px rgba(255, 193, 74, .3); }
.cell.ghost { background: color-mix(in srgb, var(--pcc) 16%, transparent); }
.cell.ghost::before { content: ""; position: absolute; inset: 0; border: 0 dashed var(--pcc); }
.cell.ghost.et::before { border-top-width: 2px; } .cell.ghost.eb::before { border-bottom-width: 2px; }
.cell.ghost.el::before { border-left-width: 2px; } .cell.ghost.er::before { border-right-width: 2px; }
.cell.pickable { cursor: pointer; }
.cell.pickable:hover { filter: brightness(1.2); box-shadow: inset 0 0 0 3px var(--amber), 0 0 14px var(--amber); z-index: 2; }
.cell.picked { box-shadow: inset 0 0 0 3px var(--amber); }
.cell.pv-ok { background: color-mix(in srgb, var(--cyan) 30%, transparent) !important; box-shadow: inset 0 0 0 2px var(--cyan), inset 0 0 16px var(--cyan) !important; }
.cell.pv-bad { background: color-mix(in srgb, var(--bad) 26%, transparent) !important; box-shadow: inset 0 0 0 2px var(--bad) !important; }

/* 調査の記録（セル） */
.ctag { --tc: var(--cyan); position: absolute; left: 5%; top: 5%; z-index: 3; font: 700 clamp(.46rem, 21cqw, .68rem)/1 var(--f-tech); color: var(--tc);
  background: rgba(3, 5, 11, .78); border: 1px solid color-mix(in srgb, var(--tc) 55%, transparent); padding: 2px 3px; border-radius: 3px; white-space: nowrap; max-width: 90%; overflow: hidden; }
.board[data-board="own"] .ctag { --tc: var(--magenta); }
.ctag.stale { opacity: .45; }
.pairs { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; overflow: visible; }
.pairs g { --pl: var(--cyan); }
.board[data-board="own"] .pairs g { --pl: var(--magenta); }
.pairs line { stroke: var(--pl); stroke-width: .05; stroke-linecap: round; filter: drop-shadow(0 0 2px var(--pl)); }
.pairs .diff line { stroke-dasharray: .12 .1; }
.pairs circle { fill: #04070F; stroke: var(--pl); stroke-width: .035; }
.pairs .sym { fill: none; stroke: var(--pl); stroke-width: .03; stroke-linecap: round; }
.pairs .stale { opacity: .4; }
.cube-menu { position: absolute; inset: 7%; z-index: 7; display: grid; align-content: center; gap: 6px; padding: 8px; background: rgba(4, 10, 22, .9);
  border: 1px solid var(--cyan); border-radius: 4px; box-shadow: 0 0 26px rgba(79, 227, 255, .4), inset 0 0 18px rgba(79, 227, 255, .2); animation: menuIn .25s ease-out; }
@keyframes menuIn { from { opacity: 0; transform: scale(.94); } }
.cube-menu p { margin: 0; font: 600 .6rem/1.2 var(--f-tech); letter-spacing: .12em; color: var(--cyan); text-align: center; }
.cm-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
.cm-grid.sizes { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.cm-btn { appearance: none; display: grid; place-items: center; gap: 3px; min-width: 0; padding: 6px 2px; cursor: pointer; color: var(--text); font: 700 clamp(.56rem, 1.6vw, .74rem)/1.1 var(--f-body);
  background: rgba(79, 227, 255, .08); border: 1px solid var(--edge-2); border-radius: 3px; }
.cm-btn b { font: 700 clamp(.8rem, 2.4vw, 1.1rem)/1 var(--f-tech); color: var(--cyan); }
.cm-btn span { white-space: nowrap; }
.cm-btn:hover, .cm-btn:focus-visible { background: rgba(79, 227, 255, .24); box-shadow: 0 0 12px rgba(79, 227, 255, .5); outline: none; }
.cm-btn .mini { max-width: 30px; height: auto; }
.cm-btn .mini rect { fill: url(#g-metal); stroke: rgba(0, 0, 0, .5); stroke-width: .6; }

/* 記号 */
.mkw { position: absolute; inset: 9%; display: grid; place-items: center; pointer-events: none; z-index: 2; }
.mk { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; overflow: visible; }
.ink-oo { color: var(--magenta); filter: drop-shadow(0 0 4px var(--magenta)); }
.ink-o { color: var(--hit); filter: drop-shadow(0 0 4px var(--hit)); }
.ink-o .dot { fill: currentColor; stroke: none; }
.ink-x { color: var(--steel-2); opacity: .82; }
.ink-x .mk { stroke-width: 2.4; }
/* 再コールできる×は、線はそのままで薄く */
.ink-x.stale { opacity: .3; }
/* バズーカで公開された×（色だけ少し変える） */
/* ワープで空いたマス（移動前の位置） */
.wtag { position: absolute; right: 6%; bottom: 4%; z-index: 2; font: 700 clamp(.46rem, 20cqw, .66rem)/1 var(--f-tech); color: var(--violet); text-shadow: 0 0 6px var(--violet); }
/* ディスタンスショットの結果：○の上は丸、まだヒットしていないマスは角丸の枠、NoData は文字 */
.mk .ordn { fill: currentColor; stroke: none; font: 700 17px var(--f-tech); text-anchor: middle; dominant-baseline: central; }
/* ノードショットの答え：ひし形の数字。ヒットしたマスでは左下の小さな札 */
.ink-n { color: var(--cyan); filter: drop-shadow(0 0 4px var(--cyan)); }
.board[data-board="own"] .ink-n { color: var(--magenta); filter: drop-shadow(0 0 4px var(--magenta)); }
.ink-n .mk path { stroke-width: 2.2; }
.nbadge { --tc: var(--cyan); position: absolute; left: 5%; bottom: 5%; z-index: 3; min-width: 1.3em; padding: 0 .25em; text-align: center; font: 700 clamp(.46rem, 20cqw, .66rem)/1.35 var(--f-tech);
  color: var(--tc); border: 1px solid color-mix(in srgb, var(--tc) 60%, transparent); border-radius: 3px; transform: rotate(0deg); background: rgba(4, 7, 15, .75); }
.board[data-board="own"] .nbadge { --tc: var(--magenta); }
.nbadge.stale { opacity: .45; }
.nodata { color: var(--steel-2); }
.nodata b { font: 700 clamp(.4rem, 17cqw, .66rem)/1 var(--f-tech); letter-spacing: .02em; white-space: nowrap; }
.mkw.ink-n.stale, .mkw.nodata.stale { opacity: .45; }
/* ステルス中の自分のキューブ（相手のフィールドには出ない） */
.cell.pc.stealth { filter: saturate(.55) brightness(1.08); box-shadow: inset 0 0 0 1px rgba(79, 227, 255, .45), inset 0 0 18px rgba(79, 227, 255, .45); }
.stl { position: absolute; right: 5%; bottom: 5%; z-index: 3; width: 32%; height: 32%; color: var(--cyan); filter: drop-shadow(0 0 4px var(--cyan)); pointer-events: none; }
.stl svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fxo.cloak { background: repeating-linear-gradient(180deg, transparent 0 3px, rgba(79, 227, 255, .55) 3px 4px); animation: cloak 1.1s steps(8) forwards; }
@keyframes cloak { 0% { opacity: 0; transform: translateY(-30%); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(30%); } }
.fxb.cloakfield { background: repeating-linear-gradient(90deg, transparent 0 6px, rgba(255, 63, 143, .2) 6px 7px); animation: flash 1.2s ease-out forwards; }
.stat.treasure b { color: var(--orange); }
.mk-add { color: var(--ink-on-cyan); stroke-width: 3.4; }
.gem { position: absolute; left: 5%; bottom: 6%; width: 34%; height: 34%; z-index: 2; fill: var(--amber); stroke: #FFF1CF; stroke-width: 1.4; filter: drop-shadow(0 0 5px var(--amber)); animation: gem 2.6s ease-in-out infinite; }
.gem .facet { fill: none; stroke: rgba(120, 70, 0, .55); stroke-width: 1.2; }
@keyframes gem { 50% { filter: drop-shadow(0 0 10px var(--amber)); transform: translateY(-1px); } }
.num { position: absolute; left: 6%; bottom: 3%; z-index: 2; font: 700 clamp(.55rem, 24cqw, .8rem)/1 var(--f-mono); color: var(--magenta); text-shadow: 0 0 6px rgba(255, 63, 143, .8); }
.tl { position: absolute; top: 3%; right: 4%; z-index: 2; padding: 1px 3px; border-radius: 3px; background: rgba(4, 8, 18, .55); font: 700 clamp(.66rem, 34cqw, 1.05rem)/1 var(--f-tech); }
.tl-H { color: var(--amber); text-shadow: 0 0 6px var(--amber); }
.tl-N { color: var(--cyan); text-shadow: 0 0 6px var(--cyan); }
.tl-X { color: #C6CFDC; }
.tl.gray { opacity: .3; text-decoration: line-through; text-shadow: none; }
.cell.last::after { content: ""; position: absolute; inset: 3px; z-index: 2; pointer-events: none;
  background:
    linear-gradient(var(--amber), var(--amber)) top left / 8px 2px no-repeat, linear-gradient(var(--amber), var(--amber)) top left / 2px 8px no-repeat,
    linear-gradient(var(--amber), var(--amber)) top right / 8px 2px no-repeat, linear-gradient(var(--amber), var(--amber)) top right / 2px 8px no-repeat,
    linear-gradient(var(--amber), var(--amber)) bottom left / 8px 2px no-repeat, linear-gradient(var(--amber), var(--amber)) bottom left / 2px 8px no-repeat,
    linear-gradient(var(--amber), var(--amber)) bottom right / 8px 2px no-repeat, linear-gradient(var(--amber), var(--amber)) bottom right / 2px 8px no-repeat; }

/* ===== 操作ブロックとスコア ===== */
.dock { display: grid; gap: 10px; align-content: start; }
/* フィールドの上に置くので、中身が変わっても盤面が上下しないよう高さをそろえる */
.dock-main { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
.dock-body { flex: 1 1 320px; min-width: 0; }
.dock-body .note, .dock-body .dock-msg { margin: 0; }
.dock-acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; margin-left: auto; }
.banner.empty { visibility: hidden; }
@media (min-width: 720px) {
  .dock { min-height: 140px; } .dock-body { flex-basis: 200px; } .dock-acts { flex-wrap: nowrap; }
  .dock .banner { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}
.dock-acts .chip { min-width: 8.6em; text-align: center; }
@media (max-width: 719px) {

  .dock-body { flex-basis: 100%; }
  .dock-acts { flex-basis: 100%; justify-content: flex-start; margin-left: 0; }

  .dock { min-height: 186px; }
  .dock .banner { display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
}
.dock-msg { margin: 0; }
.dock-msg.warn { color: var(--amber); font-weight: 700; }
.dock-msg.wait { display: flex; gap: 10px; align-items: center; color: var(--muted); }
.banner { margin: 0; font-family: var(--f-body); font-weight: 500; padding: 7px 12px; border-left: 3px solid var(--cyan); background: rgba(79, 227, 255, .07); overflow-wrap: anywhere; }
.banner.k-hit, .banner.k-kill { border-left-color: var(--magenta); background: rgba(255, 63, 143, .08); }
.banner.k-treasure { border-left-color: var(--amber); background: rgba(255, 193, 74, .08); }
.banner.k-penalty, .banner.k-miss { border-left-color: var(--bad); background: rgba(255, 84, 104, .08); }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 6px; height: 6px; background: var(--magenta); box-shadow: 0 0 6px var(--magenta); animation: blink 1s infinite; transform: rotate(45deg); }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
.chip { font: 600 .74rem/1.2 var(--f-tech); padding: .38em .8em; border: 1px solid var(--edge); background: rgba(79, 227, 255, .05); white-space: nowrap; }
.chip.ok { border-color: var(--good); color: var(--good); }
.itemhead { display: flex; gap: 10px; align-items: center; }
.itemhead .ichip { flex: none; cursor: default; }

.scorebar table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.scorebar th, .scorebar td { padding: .42em .5em; text-align: right; border-bottom: 1px solid rgba(96, 196, 255, .1); font-size: .86rem; }
.scorebar thead th { font: 600 .64rem var(--f-tech); letter-spacing: .16em; color: var(--muted); }
.scorebar tbody th { text-align: left; font-weight: 700; }
.scorebar td { font-family: var(--f-tech); font-size: .98rem; }
.scorebar small { color: var(--muted); font-size: .7rem; margin-left: 3px; font-family: var(--f-body); }
.scorebar .unk { color: var(--magenta); font-weight: 700; }
.scorebar .known { color: var(--cyan); }
.scorebar .tag { display: inline-block; font: 600 .6rem var(--f-tech); letter-spacing: .1em; border: 1px solid var(--edge); padding: 0 4px; margin-left: 4px; color: var(--muted); vertical-align: 1px; }

/* ===== ログ ===== */
.loglist { list-style: none; margin: 0; padding: 0; overflow: auto; font-size: .8rem; scrollbar-width: thin; scrollbar-color: var(--edge-2) transparent; }
.loglist li { display: grid; grid-template-columns: 2.5em minmax(0, 1fr); gap: 6px; padding: .36em 0; border-bottom: 1px dashed rgba(96, 196, 255, .12); overflow-wrap: anywhere; }
.loglist li.wicon { grid-template-columns: 2.5em 20px minmax(0, 1fr); align-items: start; }
.loglist .t { font: .72rem var(--f-mono); color: var(--muted); padding-top: 1px; }
.loglist .li-ic svg { width: 18px; height: 18px; fill: none; stroke: var(--cyan); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.loglist .li-ic svg .f { fill: var(--cyan); stroke: none; }
.loglist .li-ic.enemy svg { stroke: var(--magenta); }

.loglist li.enemy .x { color: color-mix(in srgb, var(--magenta) 35%, var(--text)); }
.loglist li.k-hit .x { color: var(--hit); }
.loglist li.k-kill .x { color: var(--magenta); font-weight: 700; }

.loglist li.k-penalty .x, .loglist li.k-miss .x { color: var(--bad); }
.loglist li.none { color: var(--muted); }
.logcol .panel { display: flex; flex-direction: column; }

/* ===== タイトル ===== */
.hero { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); align-items: center; padding-block: 18px 22px; }
@media (min-width: 900px) { .hero { grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 36px; padding-block: 34px 34px; } }
.hero .logo { font-size: clamp(3rem, 9vw, 5.4rem); }
.hero .logo-sub { font-size: clamp(.7rem, 1.6vw, .95rem); margin-top: 10px; }
.tagline { font-size: clamp(1rem, 2.2vw, 1.22rem); font-weight: 700; margin: 22px 0 10px; max-width: 30em; line-height: 1.7; }
.lede { color: var(--muted); max-width: 36em; margin: 0 0 16px; }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: .84rem; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 6px; }
.lg { width: 1.7em; height: 1.7em; display: inline-grid; place-items: center; }
.lg .mk { width: 100%; height: 100%; }
.tlg { color: var(--cyan); font: 700 .78rem var(--f-tech); border: 1px solid var(--edge-2); padding: 0 .35em; }
.visual { position: relative; display: grid; place-items: center; min-height: 300px; perspective: 900px; overflow: hidden; overflow: clip; }
.visual .board { width: min(320px, 78vw); transform: rotateX(48deg) rotateZ(-30deg); transform-style: preserve-3d; margin-top: 70px; }
.cube3d { position: absolute; top: 10px; left: 50%; width: 76px; height: 76px; margin-left: -38px; transform-style: preserve-3d; animation: spin3d 12s linear infinite; z-index: 2; }
.cube3d i { position: absolute; inset: 0; border: 1px solid rgba(255, 255, 255, .55);
  background: linear-gradient(135deg, rgba(255, 255, 255, .85), #9FB0C8 40%, #4C5870 60%, #D7E1EE); box-shadow: inset 0 0 18px rgba(79, 227, 255, .45); }
.cube3d i:nth-child(1) { transform: translateZ(38px); } .cube3d i:nth-child(2) { transform: rotateY(180deg) translateZ(38px); }
.cube3d i:nth-child(3) { transform: rotateY(90deg) translateZ(38px); } .cube3d i:nth-child(4) { transform: rotateY(-90deg) translateZ(38px); }
.cube3d i:nth-child(5) { transform: rotateX(90deg) translateZ(38px); } .cube3d i:nth-child(6) { transform: rotateX(-90deg) translateZ(38px); }
@keyframes spin3d { from { transform: translateY(0) rotateX(-22deg) rotateY(0deg); } 50% { transform: translateY(-10px) rotateX(-22deg) rotateY(180deg); } to { transform: translateY(0) rotateX(-22deg) rotateY(360deg); } }
.beamv { position: absolute; top: 92px; left: 50%; width: 2px; height: 110px; margin-left: -1px; z-index: 1; background: linear-gradient(180deg, rgba(79, 227, 255, .9), rgba(79, 227, 255, .45)); box-shadow: 0 0 12px var(--cyan); }
.beamv::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px 3px rgba(79, 227, 255, .8); animation: blink 1.6s ease-in-out infinite; }
.settings { display: grid; gap: 14px; padding: 18px; }
.set-row { display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); align-items: center; }
@media (min-width: 720px) { .set-row { grid-template-columns: 11em minmax(0, 1fr); } }
.set-row h2 { font-size: .84rem; margin: 0; color: var(--muted); font-weight: 500; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { display: grid; gap: 0; padding: .5em 1em; border: 1px solid var(--edge); cursor: pointer; min-width: 7.6em; background: rgba(79, 227, 255, .04);
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
.seg label span { font-weight: 700; }
.seg label small { color: var(--muted); font-size: .72rem; }
.item-pick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.item-pick input { position: absolute; opacity: 0; pointer-events: none; }
.item-pick label { display: inline-flex; align-items: center; gap: 6px; padding: .4em .75em .4em .5em; border: 1px solid var(--edge); border-radius: 4px; background: rgba(79, 227, 255, .03); cursor: pointer; font-size: .78rem; color: var(--muted); }
.item-pick label svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.item-pick label svg .f { fill: currentColor; stroke: none; }
.item-pick input:checked + label { color: var(--text); border-color: var(--cyan); background: rgba(79, 227, 255, .14); }

.item-pick .note { flex-basis: 100%; }
.match-items { display: grid; gap: 6px; border-top: 1px solid rgba(96, 196, 255, .14); padding-top: 10px; }
.match-items .cap { font: 600 .66rem/1 var(--f-tech); letter-spacing: .12em; color: var(--muted); }
.mi-list { display: flex; flex-wrap: wrap; gap: 6px; }
.mi { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; padding: 3px 8px 3px 5px; border: 1px solid var(--edge); border-radius: 4px; }
.mi svg { width: 16px; height: 16px; fill: none; stroke: var(--cyan); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.mi svg .f { fill: var(--cyan); stroke: none; }
.mi b { font-weight: 500; }
.seg input:checked + label { border-color: var(--cyan); background: rgba(79, 227, 255, .18); box-shadow: inset 0 0 14px rgba(79, 227, 255, .3); }
.seg input:checked + label small { color: var(--text); }
.start-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }

/* ===== 配置 ===== */
.setup { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 920px) { .setup { grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); } }
.hint { font-size: .84rem; color: var(--muted); margin: 10px 0 0; text-align: center; }
.setup-panel { display: grid; gap: 12px; }
.palette { display: grid; gap: 10px; }
.pal-row { display: grid; gap: 6px; }
.pal-h { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); border-bottom: 1px solid rgba(96, 196, 255, .14); padding-bottom: 3px; }
.pal-h b { color: var(--text); font-family: var(--f-tech); letter-spacing: .06em; }

.fx-text.near { color: var(--cyan); }
.fx-text.count { color: var(--cyan); font-size: clamp(1.2rem, 3.6vw, 1.9rem); animation-duration: 1.6s; }
.fx-text.item { color: var(--cyan); font-size: .9rem; animation-name: fxpop; }
.fx-text.item.enemy, .fx-text.count.enemy { color: var(--magenta); }
.fx-text.bad { color: var(--bad); }
.fx-text.sub { font-family: var(--f-body); font-size: .86rem; letter-spacing: .04em; }
@keyframes fxrise { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 70% { opacity: 1; transform: translate(-50%, -80%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -120%) scale(1); } }
@keyframes fxpop { 0% { opacity: 0; transform: translate(-50%, -50%) scaleX(.2); } 15% { opacity: 1; transform: translate(-50%, -50%) scaleX(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%); } }
.fx-banner { position: fixed; left: 0; right: 0; top: 38%; display: grid; place-items: center; gap: 4px; padding: 16px 0; transform: translateY(-50%);
  background: linear-gradient(90deg, transparent, rgba(6, 14, 30, .92) 18%, rgba(6, 14, 30, .92) 82%, transparent); border-block: 1px solid var(--edge-2);
  animation: bannerIn 1.1s cubic-bezier(.2, .8, .2, 1) forwards; }
.fx-banner b { font: 700 clamp(1.6rem, 5vw, 2.8rem)/1 var(--f-tech); letter-spacing: .3em; color: var(--cyan); text-shadow: 0 0 18px var(--cyan); padding-left: .3em; }
.fx-banner span { font-size: .9rem; color: var(--text); }
.fx-banner.enemy { border-color: rgba(255, 63, 143, .5); }
.fx-banner.enemy b { color: var(--magenta); text-shadow: 0 0 18px var(--magenta); }
.fx-banner.treasure { border-color: rgba(255, 154, 60, .6); }
.fx-banner.treasure b { color: var(--orange); text-shadow: 0 0 18px var(--orange); }
@keyframes bannerIn { 0% { opacity: 0; clip-path: inset(48% 0 48% 0); } 18% { opacity: 1; clip-path: inset(0 0 0 0); } 78% { opacity: 1; clip-path: inset(0 0 0 0); } 100% { opacity: 0; clip-path: inset(48% 0 48% 0); } }
.fxo { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.fxo.lock svg { position: absolute; inset: -30%; width: 160%; height: 160%; fill: none; stroke: var(--magenta); stroke-width: 2.4; filter: drop-shadow(0 0 6px var(--magenta)); animation: lockon .8s cubic-bezier(.2, .8, .2, 1) forwards; }
@keyframes lockon { 0% { opacity: 0; transform: scale(2.2) rotate(-90deg); } 45% { opacity: 1; transform: scale(.9) rotate(0); } 70% { transform: scale(1.05); } 100% { opacity: 0; transform: scale(1); } }
.fxo.reticle svg { position: absolute; inset: -20%; width: 140%; height: 140%; fill: none; stroke: var(--cyan); stroke-width: 2.4; filter: drop-shadow(0 0 6px var(--cyan)); animation: lockon .9s cubic-bezier(.2, .8, .2, 1) forwards; }
.fxo.reticle.enemy svg { stroke: var(--magenta); filter: drop-shadow(0 0 6px var(--magenta)); }
.fxo.impact { background: radial-gradient(circle, #fff 0%, rgba(255, 122, 61, .9) 30%, transparent 70%); animation: impact .45s ease-out forwards; }
@keyframes impact { 0% { opacity: 1; transform: scale(.4); } 100% { opacity: 0; transform: scale(1.6); } }
.fxo.ripple { border: 2px solid var(--steel-2); border-radius: 50%; animation: ripple .7s ease-out forwards; }
@keyframes ripple { 0% { opacity: .9; transform: scale(.2); } 100% { opacity: 0; transform: scale(1.5); } }
.fxo.flash { background: #fff; animation: flash .5s ease-out forwards; }
@keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
.fxo.glitch { background: repeating-linear-gradient(0deg, rgba(255, 84, 104, .65) 0 3px, transparent 3px 7px); animation: glitchCell .9s steps(6) forwards; }
@keyframes glitchCell { 0% { transform: translateX(-4px); opacity: 1; } 30% { transform: translateX(5px); } 60% { transform: translateX(-2px); opacity: .8; } 100% { transform: none; opacity: 0; } }
.fxo.dissolve { background: linear-gradient(160deg, var(--steel-1), var(--steel-3)); box-shadow: inset 0 0 12px var(--cyan); animation: dissolve .9s steps(9) forwards; }
@keyframes dissolve { 0% { opacity: 1; clip-path: inset(0 0 0 0); } 100% { opacity: 0; clip-path: inset(0 0 100% 0); filter: blur(2px) brightness(2); } }
.cell.materialize { animation: materialize .9s cubic-bezier(.2, .8, .2, 1) both; z-index: 2; }
@keyframes materialize { 0% { opacity: 0; transform: scale(.3); filter: brightness(3); } 55% { opacity: 1; transform: scale(1.1); } 100% { transform: scale(1); filter: none; } }
.fxb { position: absolute; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
.fxb.sweep i { position: absolute; inset: -45%; border-radius: 50%; background: conic-gradient(from 0deg, rgba(79, 227, 255, .6), rgba(79, 227, 255, 0) 22%, transparent); animation: sweep 1.3s linear forwards; }
.fxb.sweep.enemy i { background: conic-gradient(from 0deg, rgba(255, 63, 143, .6), rgba(255, 63, 143, 0) 22%, transparent); }
@keyframes sweep { 0% { transform: rotate(0); opacity: 0; } 10% { opacity: 1; } 85% { opacity: 1; } 100% { transform: rotate(540deg); opacity: 0; } }
.fxb.rings { background: repeating-radial-gradient(circle, transparent 0 18px, rgba(79, 227, 255, .25) 18px 19px); animation: flash 1.3s ease-out forwards; }
.fxb.scan .bar { position: absolute; background: linear-gradient(90deg, transparent, rgba(79, 227, 255, .75), transparent); box-shadow: 0 0 18px var(--cyan); }
.fxb.scan.row .bar { left: 0; right: 0; top: calc(100% * var(--i) / var(--n)); height: calc(100% / var(--n)); background-size: 50% 100%; background-repeat: no-repeat; animation: scanx 1.1s ease-in-out forwards; }
.fxb.scan.col .bar { top: 0; bottom: 0; left: calc(100% * var(--i) / var(--n)); width: calc(100% / var(--n)); background: linear-gradient(180deg, transparent, rgba(79, 227, 255, .75), transparent); background-size: 100% 50%; background-repeat: no-repeat; animation: scany 1.1s ease-in-out forwards; }
.fxb.scan.enemy .bar { box-shadow: 0 0 18px var(--magenta); }
.fxb.scan.row.enemy .bar { background-image: linear-gradient(90deg, transparent, rgba(255, 63, 143, .75), transparent); }
.fxb.scan.col.enemy .bar { background-image: linear-gradient(180deg, transparent, rgba(255, 63, 143, .75), transparent); }
@keyframes scanx { 0% { background-position: -100% 0; opacity: 0; } 15% { opacity: 1; } 100% { background-position: 200% 0; opacity: .2; } }
@keyframes scany { 0% { background-position: 0 -100%; opacity: 0; } 15% { opacity: 1; } 100% { background-position: 0 200%; opacity: .2; } }
.fxb.column .bar { position: absolute; top: 0; bottom: 0; left: calc(100% * var(--i) / var(--n)); width: calc(100% / var(--n)); transform-origin: top;
  background: linear-gradient(180deg, rgba(255, 255, 255, .95), rgba(79, 227, 255, .55) 35%, rgba(79, 227, 255, .08)); box-shadow: 0 0 22px var(--cyan); animation: drop 1s cubic-bezier(.2, .8, .2, 1) forwards; }
.fxb.column.enemy .bar { background: linear-gradient(180deg, rgba(255, 255, 255, .95), rgba(255, 63, 143, .55) 35%, rgba(255, 63, 143, .08)); box-shadow: 0 0 22px var(--magenta); }
@keyframes drop { 0% { transform: scaleY(0); opacity: 1; } 40% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }
.fxb.shock { background: radial-gradient(circle, rgba(255, 255, 255, .9), rgba(255, 63, 143, .5) 30%, transparent 62%); animation: impact .8s ease-out forwards; }
/* バズーカで空きマスが開く */
/* バズーカで分解されたマス（持ち主にだけ見せる）：ひびが走る */
.fxo.crack { background: linear-gradient(118deg, transparent 44%, rgba(255, 244, 214, .95) 47%, transparent 50%), linear-gradient(28deg, transparent 58%, rgba(255, 193, 74, .9) 61%, transparent 64%); animation: crack .9s ease-out forwards; }
@keyframes crack { 0% { opacity: 0; clip-path: inset(0 100% 0 0); } 40% { opacity: 1; clip-path: inset(0 0 0 0); } 100% { opacity: 0; } }
.fxb.holo { display: grid; place-items: center; perspective: 500px; background: radial-gradient(circle, rgba(79, 227, 255, .2), transparent 60%); animation: flash 1.5s ease-in forwards; }
.fxb.holo.enemy { background: radial-gradient(circle, rgba(255, 63, 143, .2), transparent 60%); }
.holo-cube { position: relative; width: 34%; aspect-ratio: 1; transform-style: preserve-3d; animation: holospin 1.5s cubic-bezier(.2, .8, .2, 1) forwards; }
.holo-cube i { position: absolute; inset: 0; border: 2px solid var(--cyan); background: rgba(79, 227, 255, .12); box-shadow: 0 0 14px rgba(79, 227, 255, .6), inset 0 0 14px rgba(79, 227, 255, .5); }
.fxb.holo.enemy .holo-cube i { border-color: var(--magenta); background: rgba(255, 63, 143, .12); box-shadow: 0 0 14px rgba(255, 63, 143, .6), inset 0 0 14px rgba(255, 63, 143, .5); }
.holo-cube i:nth-child(1) { transform: translateZ(var(--hz)); } .holo-cube i:nth-child(2) { transform: rotateY(180deg) translateZ(var(--hz)); }
.holo-cube i:nth-child(3) { transform: rotateY(90deg) translateZ(var(--hz)); } .holo-cube i:nth-child(4) { transform: rotateY(-90deg) translateZ(var(--hz)); }
.holo-cube i:nth-child(5) { transform: rotateX(90deg) translateZ(var(--hz)); } .holo-cube i:nth-child(6) { transform: rotateX(-90deg) translateZ(var(--hz)); }
@keyframes holospin { 0% { transform: scale(0) rotateX(-30deg) rotateY(0); } 30% { transform: scale(1) rotateX(-30deg) rotateY(160deg); } 100% { transform: scale(1) rotateX(-30deg) rotateY(540deg); } }
#app.shake-1 { animation: shake1 .38s linear; }
#app.shake-2 { animation: shake2 .6s linear; }
@keyframes shake1 { 20% { transform: translate(-3px, 2px); } 40% { transform: translate(3px, -2px); } 60% { transform: translate(-2px, 1px); } 80% { transform: translate(2px, 0); } }
@keyframes shake2 { 10% { transform: translate(-7px, 4px); } 25% { transform: translate(7px, -5px); } 40% { transform: translate(-5px, 3px); } 55% { transform: translate(5px, -2px); } 70% { transform: translate(-3px, 2px); } 85% { transform: translate(2px, -1px); } }

/* ===== 設定：固定の説明・個数の指定 ===== */
.set-fixed { margin: 0; font-size: .86rem; color: var(--muted); padding: .55em .9em; border: 1px dashed var(--edge-2); }
.set-fixed b { color: var(--text); }
.stepper { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.btn.sq { width: 2.4em; height: 2.4em; padding: 0; display: grid; place-items: center; font-size: 1.1rem; }
.stepper output { min-width: 3.2em; text-align: center; font: 700 1.3rem/1 var(--f-tech); color: var(--cyan); }
.stepper output small { font: 500 .74rem var(--f-body); color: var(--muted); margin-left: 2px; }
.warn-t { display: block; margin-top: 6px; color: var(--amber); font-weight: 500; }

/* ===== 大会 ===== */
.tour-screen { display: grid; gap: 14px; }
.tour-hero { padding: 18px 18px 14px; display: grid; gap: 10px; overflow: hidden; }
.tour-hero::selection { background: none; }
.tour-title { margin: 0; font: 800 clamp(1.5rem, 4.6vw, 2.4rem)/1.15 var(--f-body); letter-spacing: .02em; display: flex; flex-wrap: wrap; align-items: center; gap: .3em; }
.tour-title .av { font-size: .5em; }
.tour-lede { margin: 0; color: var(--muted); max-width: 52em; }
.tour-lede b { color: var(--text); }
.tour-lede .rk { color: var(--cyan); font: 700 1.15em var(--f-tech); }
.glitch-in { animation: glitch 1.4s steps(1) 1; }
.tour-steps { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tour-steps li { position: relative; display: grid; gap: 2px; padding: 7px 10px; border: 1px solid var(--edge); background: rgba(79, 227, 255, .03); color: var(--muted); font-size: .72rem; }
.tour-steps li b { font: 700 .86rem var(--f-tech); letter-spacing: .1em; color: var(--dim); }
.tour-steps li.done { border-color: rgba(89, 242, 166, .45); }
.tour-steps li.done b { color: var(--good); }
.tour-steps li.done::after { content: "✓"; position: absolute; right: 8px; top: 6px; color: var(--good); font-weight: 700; }
.tour-steps li.cur { border-color: var(--cyan); background: rgba(79, 227, 255, .14); color: var(--text); box-shadow: 0 0 18px -4px rgba(79, 227, 255, .6); }
.tour-steps li.cur b { color: var(--cyan); }
.tour-steps li.fin b { color: var(--amber); }
.tour-steps li.fin.cur { border-color: var(--amber); background: rgba(255, 193, 74, .12); box-shadow: 0 0 18px -4px rgba(255, 193, 74, .6); }
@media (max-width: 520px) { .tour-steps li span { display: none; } .tour-steps li { padding: 6px 8px; } }

/* アバター（名前の頭の記号） */
.av { flex: none; display: inline-grid; place-items: center; width: 2.3em; height: auto; aspect-ratio: 2 / 1.7320508; font: 700 .74rem/1 var(--f-tech); color: var(--ink-on-cyan);
  clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); background: var(--cyan); }
.av i { font-style: normal; }
.av-alpha { background: var(--magenta); color: #fff; } .av-beta { background: var(--violet); } .av-gamma { background: var(--pc2); } .av-delta { background: #FF9A4D; }
.av0 { background: linear-gradient(180deg, #7BEDFF, #17A4D4); }
.av0 i { font-size: .62em; letter-spacing: -.03em; }

/* 出場者・日程 */
.entrants { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 620px) { .entrants { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ent { display: grid; justify-items: center; gap: 4px; padding: 12px 6px; border: 1px solid var(--edge); background: rgba(79, 227, 255, .04); text-align: center;
  opacity: 0; animation: entIn .5s cubic-bezier(.2, .8, .2, 1) forwards; animation-delay: calc(var(--i) * 140ms + 200ms); }
.ent .av { font-size: 1.1rem; }
.ent b { font-size: .96rem; }
.ent small { color: var(--muted); font-size: .7rem; line-height: 1.4; }
.ent .persona { font: 700 .74rem var(--f-body); font-style: normal; color: var(--amber); letter-spacing: .08em; }
@keyframes entIn { from { opacity: 0; transform: translateY(14px) scale(.96); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
.schedule { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .82rem; }
.schedule li { display: flex; flex-wrap: wrap; gap: 4px 12px; border-bottom: 1px solid rgba(96, 196, 255, .12); padding: 4px 0; }
.schedule b { font-family: var(--f-tech); color: var(--cyan); min-width: 5em; }

/* 試合のカード */
.mcards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.mcards.one { grid-template-columns: minmax(0, 640px); }
.mcard { position: relative; overflow: hidden; display: grid; gap: 6px; padding: 12px 14px; border: 1px solid var(--edge); background: var(--panel); border-radius: 6px; }
.mcard.mine { border-color: rgba(79, 227, 255, .5); }
.mc-h { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font: 600 .72rem var(--f-tech); letter-spacing: .12em; color: var(--muted); }
.mc-tag { font: 500 .66rem var(--f-body); letter-spacing: 0; color: var(--violet); border: 1px solid rgba(180, 156, 255, .5); padding: 1px 6px; }
.mc-vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; }
.mc-vs .vs { font: 700 .8rem var(--f-tech); color: var(--dim); letter-spacing: .1em; }
.mc-p { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 8px; align-items: center; min-width: 0; }
.mc-p:last-child { grid-template-columns: minmax(0, 1fr) auto; text-align: right; }
.mc-p:last-child .av { grid-column: 2; grid-row: 1 / span 2; }
.mc-p .av { grid-row: 1 / span 2; }
.mc-p b { font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mc-pt { font: 700 1rem var(--f-tech); color: var(--muted); }
.mc-pt small { font-size: .66rem; margin-left: 1px; }
.mc-p em { grid-column: 1 / -1; font: 700 .66rem var(--f-tech); letter-spacing: .2em; color: var(--good); font-style: normal; }
.mc-p:not(:last-child) em { grid-column: 2; }
.mc-p:last-child em { grid-column: 1; grid-row: 3; }
.mc-p.win .mc-pt { color: var(--good); }
.mc-pt.minus { color: var(--magenta); }
.scorebar td.live { color: var(--cyan); }
.mc-sub { margin: 0; font-size: .8rem; color: var(--text); }
.mc-lost { margin: 0; font-size: .72rem; color: var(--muted); }
/* CPUどうしの試合：はじめは「走らせている」幕を見せ、終わったら結果を出す */
.mc-scan { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5, 9, 20, .92); transition: opacity .35s .1s; }
.mc-scan .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 34%; background: linear-gradient(90deg, transparent, rgba(180, 156, 255, .35), transparent); animation: scanX 1s linear infinite; }
.mc-scan .tt { position: relative; font: 700 .9rem var(--f-tech); letter-spacing: .3em; color: var(--violet); }
.mc-scan .tt b { color: #fff; letter-spacing: .1em; margin-left: .4em; }
@keyframes scanX { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
.mcard.sim.done .mc-scan, .tour-screen:not(.fx) .mc-scan { opacity: 0; pointer-events: none; }
.mcard.sim.done { animation: cardFlash .6s ease-out; }
@keyframes cardFlash { from { box-shadow: 0 0 0 1px rgba(180, 156, 255, .9), 0 0 30px rgba(180, 156, 255, .6); } to { box-shadow: none; } }

/* 順位表と横の列 */
.tour-grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1240px) { .tour-grid:not(.solo) { grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); } }
.tour-side { display: grid; gap: 10px; }
.standings { display: grid; gap: 6px; }
.st-head, .st-row { display: grid; grid-template-columns: 3.4em minmax(8.5em, 1.2fr) 6.6em minmax(0, 1.3fr) minmax(0, 1.4fr); gap: 8px; align-items: center; }
.st-head { font: 600 .62rem var(--f-tech); letter-spacing: .14em; color: var(--muted); padding: 0 10px; }
.st-body { display: grid; gap: 6px; }
.st-row { position: relative; padding: 9px 10px; border: 1px solid var(--edge); background: rgba(79, 227, 255, .035); }
.st-row.me { border-color: rgba(79, 227, 255, .65); background: rgba(79, 227, 255, .1); box-shadow: inset 3px 0 0 var(--cyan); }
.st-row.fin { box-shadow: inset 3px 0 0 var(--amber); }
.st-row.me.fin { box-shadow: inset 3px 0 0 var(--amber), 0 0 0 1px rgba(79, 227, 255, .35); }
.st-row.champ { border-color: rgba(255, 193, 74, .8); background: linear-gradient(90deg, rgba(255, 193, 74, .16), rgba(255, 193, 74, .03)); }
.fx .st-row { animation: rowIn .5s cubic-bezier(.2, .8, .2, 1) both, rowShift .9s cubic-bezier(.3, .9, .2, 1) both; animation-delay: calc(var(--i) * 90ms), 0s; }
@keyframes rowIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes rowShift { from { transform: translateY(calc(var(--shift) * (100% + 6px))); } to { transform: none; } }
.st-rank { display: grid; justify-items: start; gap: 1px; }
.st-rank b { font: 700 1.5rem/1 var(--f-tech); color: var(--text); }
.st-row.fin .st-rank b { color: var(--amber); }
.chg { font: 700 .62rem var(--f-tech); font-style: normal; }
.chg.up { color: var(--good); } .chg.down { color: var(--bad); }
.fx .chg { opacity: 0; transition: opacity .3s; } .fx.counted .chg { opacity: 1; }
.st-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
.st-name > div { display: grid; min-width: 0; }
.st-name b { font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-name small { color: var(--muted); font-size: .7rem; }
.st-name .gold { color: var(--amber); font-weight: 700; }
.st-pts { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 3px; }
.st-pts b { font: 700 1.45rem/1 var(--f-tech); color: var(--cyan); font-variant-numeric: tabular-nums; }
.st-pts small { color: var(--muted); font-size: .7rem; }
.gain { font: 700 .74rem var(--f-tech); margin-left: 4px; }
.gain.up { color: var(--good); } .gain.down { color: var(--bad); }
.fx .gain { opacity: 0; transition: opacity .3s .6s; } .fx.counted .gain { opacity: 1; }
.st-pts .tie { align-self: center; margin-left: 5px; padding: 0 4px; font: 700 .6rem var(--f-tech); letter-spacing: .06em; color: var(--amber); border: 1px solid rgba(255, 193, 74, .55); border-radius: 2px; }
.st-gems { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 1px; margin-top: 5px; min-height: 13px; }
.st-gems em { font: 600 .62rem var(--f-tech); font-style: normal; color: var(--muted); letter-spacing: .06em; }
.gm { width: 13px; height: 13px; flex: none; }
.gm path { fill: rgba(255, 63, 143, .78); stroke: #FFB3D1; stroke-width: 1.6; stroke-linejoin: round; }
.gm path.facet { fill: none; stroke: rgba(255, 255, 255, .55); stroke-width: 1.2; }
.score td.gems { white-space: nowrap; }
.score .gx { display: inline-flex; align-items: center; gap: 1px; font-weight: 700; }
.score .gx + .gx { margin-left: 5px; }
.score .gx.up { color: var(--good); } .score .gx.down { color: var(--bad); }
.score .gx .gm { width: 12px; height: 12px; }
.gm.new { filter: drop-shadow(0 0 4px rgba(255, 63, 143, .95)); }
.fx .gm.new { animation: gemIn .9s .5s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes gemIn { 0% { opacity: 0; transform: translateY(-6px) scale(.4); } 60% { opacity: 1; transform: translateY(0) scale(1.25); } 100% { transform: none; } }
.gm.lost path { fill: none; stroke: rgba(255, 179, 209, .72); stroke-dasharray: 2.5 2; }
.gm.lost path.facet { display: none; }
.fx .gm.lost { animation: gemOut .9s .5s ease-out both; }
@keyframes gemOut { 0% { opacity: 1; transform: none; } 100% { opacity: .75; transform: translateY(2px); } }
.st-cubes { display: flex; flex-wrap: wrap; gap: 3px 9px; }

.st-items { display: flex; flex-wrap: wrap; gap: 3px; }
.si { position: relative; display: grid; place-items: center; width: 21px; height: 21px; border: 1px solid rgba(79, 227, 255, .35); color: var(--cyan); background: rgba(79, 227, 255, .06); }
.si svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.si svg .f { fill: currentColor; stroke: none; }
.si.bz { color: var(--amber); border-color: rgba(255, 193, 74, .45); }

.si em { position: absolute; right: -5px; bottom: -6px; font: 700 .55rem/1.3 var(--f-tech); font-style: normal; color: var(--text); background: var(--void); border: 1px solid var(--edge-2); padding: 0 2px; border-radius: 3px; }

@media (max-width: 860px) {
  .st-head { display: none; }
  .st-row { grid-template-columns: 2.6em minmax(0, 1fr) auto; grid-template-areas: "rank name pts" "rank cubes cubes" "rank items items"; row-gap: 6px; }
  .st-rank { grid-area: rank; align-self: start; }

  .st-pts { grid-area: pts; justify-content: flex-end; }
  .st-gems { justify-content: flex-end; }

}

/* ショップ */
.btn.sq-sm { padding: .42em .7em; font-size: .74rem; display: grid; justify-items: center; line-height: 1.1; }

/* 決勝の先攻・後攻 */
.choice-btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-width: 640px; }
.choice { display: grid; gap: 3px; text-align: left; padding: 12px 14px; border: 1px solid var(--edge-2); background: rgba(79, 227, 255, .05); color: var(--text); cursor: pointer;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }

/* 通過・敗退・優勝の幕 */
.big-banner { position: relative; font: 800 clamp(2.2rem, 8.5vw, 4.4rem)/1.05 var(--f-logo); letter-spacing: .04em; overflow: hidden; padding: .08em 0; }
.big-banner.win { color: var(--cyan); text-shadow: 0 0 26px rgba(79, 227, 255, .75); }
.big-banner.lose { color: var(--magenta); text-shadow: 0 0 22px rgba(255, 63, 143, .6); }

.big-banner.silver { color: var(--steel-1); text-shadow: 0 0 22px rgba(200, 210, 226, .6); }
.fx .big-banner { animation: bannerIn .9s cubic-bezier(.2, .9, .2, 1) both; animation-delay: var(--bd, 0s); }
.fx .big-banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .55) 48%, transparent 64%); transform: translateX(-120%); animation: sweep 1.4s .7s ease-out; pointer-events: none; mix-blend-mode: overlay; }
.fx .big-banner.lose { animation: bannerIn .9s cubic-bezier(.2, .9, .2, 1) both, glitch 1.6s 1s steps(1) 1; }
@keyframes bannerIn { from { opacity: 0; transform: scale(1.35); letter-spacing: .3em; filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes sweep { to { transform: translateX(120%); } }
.prize { margin: 0; font-size: 1.1rem; color: var(--muted); }

.fx .reveal-late { animation: rowIn .6s 2s both; }
.tour-next { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding-top: 4px; }

/* 試合の前の VS の幕 */
.vs-splash { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; pointer-events: none; animation: vsOut 2.1s ease-in forwards; }
.vs-band { width: 100%; display: grid; justify-items: center; gap: 8px; padding: 22px 16px; background: linear-gradient(90deg, rgba(3, 5, 11, 0), rgba(3, 5, 11, .92) 18%, rgba(3, 5, 11, .92) 82%, rgba(3, 5, 11, 0));
  border-block: 1px solid rgba(79, 227, 255, .45); box-shadow: 0 0 40px rgba(79, 227, 255, .25); animation: bandIn .35s cubic-bezier(.2, .9, .2, 1) both; }
.vs-row { display: flex; align-items: center; justify-content: center; gap: clamp(10px, 4vw, 34px); width: 100%; }
.vs-p { display: flex; align-items: center; gap: 10px; font: 800 clamp(1.2rem, 4.6vw, 2.2rem)/1 var(--f-body); min-width: 0; }
.vs-p b { white-space: nowrap; }
.vs-p .av { font-size: clamp(.7rem, 2.4vw, 1rem); }
.vs-p.l { animation: vsL .5s .1s cubic-bezier(.2, .9, .2, 1) both; }
.vs-p.r { animation: vsR .5s .1s cubic-bezier(.2, .9, .2, 1) both; }
.vs-x { font: 700 clamp(1.4rem, 5vw, 2.6rem)/1 var(--f-tech); color: var(--magenta); text-shadow: 0 0 22px rgba(255, 63, 143, .8); animation: vsX .5s .45s both; }
@keyframes bandIn { from { transform: scaleY(0); } to { transform: none; } }
@keyframes vsL { from { opacity: 0; transform: translateX(-40vw); } to { opacity: 1; transform: none; } }

@keyframes vsX { from { opacity: 0; transform: scale(2.6); } to { opacity: 1; transform: none; } }
@keyframes vsOut { 0%, 78% { opacity: 1; } 100% { opacity: 0; } }
